<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa Junina | Checkout Pix</title>
    
    <!-- Ícones e Fontes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           RESET & ESTRUTURA GLOBAL (TEMA FESTA JUNINA REFINADO)
           ========================================================================== */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            min-height: 100dvh;
            color: #4a3b32; 
            /* Fundo Xadrez Junino Original */
            background-color: #e65100; 
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%), 
                              linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%); 
            background-size: 40px 40px; 
            background-position: 0 0, 20px 20px; 
        }

        /* Envoltório responsivo */
        .wrapper { 
            display: flex; 
            width: 100%; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: center; 
            padding: 40px 20px; 
        }

        /* O Cartão de Checkout (Card Creme com Sombra Profunda) */
        .card { 
            width: 100%; 
            max-width: 440px; 
            position: relative; 
            background-color: #fffdf7; 
            padding: 35px 25px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35); 
            text-align: center; 
            border: 3px dashed #d84315; 
        }

        /* Tipografia */
        h2 { 
            font-family: 'Amatic SC', cursive; 
            font-size: 48px; 
            color: #bf360c; 
            margin-top: 10px;
            line-height: 1.1;
        }

        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            text-align: left; 
            font-size: 14px; 
            color: #4a3b32;
        }

        /* Grupos de Formulário e Ícones */
        .form-group { 
            margin-bottom: 0px; 
            position: relative; 
        }
        
        .input-icon { 
            position: absolute; 
            left: 14px; 
            top: 45px; 
            color: #bcaaa4; 
            font-size: 16px; 
            z-index: 2;
        }
        
        .has-icon input, .has-icon select { 
            padding-left: 42px !important; 
        }

        /* Inputs e Selects com Borda Tracejada */
        input, select { 
            width: 100%; 
            padding: 11px 12px; 
            border-radius: 8px; 
            border: 2px dashed #bcaaa4; 
            font-size: 14px; 
            box-sizing: border-box; 
            background-color: #fff;
            outline: none;
            margin-top: 5px;
            font-family: 'Inter', sans-serif;
            color: #4a3b32;
        }

        /* Foco Laranja nos Inputs */
        input:focus, select:focus {
            border-color: #e65100 !important;
            box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.15);
        }

        /* Botão Principal 3D Laranja */
        .btn-principal { 
            margin-top: 25px; 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700; 
            background-color: #e65100; 
            color: white; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 6px 0 #b33600; 
            font-family: 'Inter', sans-serif;
            display: inline-block;
        }
        
        .btn-principal:active:not(:disabled) { 
            box-shadow: 0 2px 0 #b33600; 
            transform: translateY(4px); 
        }
        
        .btn-principal:disabled { 
            background-color: #bcaaa4 !important; 
            box-shadow: 0 6px 0 #8d6e63 !important; 
            cursor: not-allowed; 
        }

        /* Estado de Carregamento Texto */
        .loading { 
            font-weight: 600; 
            display: none; 
            margin-top: 20px; 
            text-align: center; 
            color: #d84315;
            font-size: 14px;
        }

        /* Container do QR Code Oculto Inicialmente */
        #qrcode-container { 
            display: none; 
            margin-top: 20px; 
            padding: 20px; 
            border: 2px dashed #d84315; 
            border-radius: 10px; 
            background-color: #fff; 
        }
        
        #qrcode-container h3 {
            color: #bf360c;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        #qrcode img { 
            display: block; 
            margin: 0 auto; 
            max-width: 180px; 
            height: auto; 
        }

        /* Caixa de Texto do Copia e Cola */
        .pix-copia-cola { 
            width: 100%; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 11px; 
            word-break: break-all; 
            resize: none; 
            outline: none; 
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bcaaa4;
            background: #fffdf7;
            color: #4a3b32;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <h2>Festa Junina</h2>
            <p style="font-size: 14px; margin-top: 5px; margin-bottom: 20px; color: #6d5c52;">O valor será calculado automaticamente com base no seu lote e categoria.</p>
            
            <form id="payment-form">
                <div class="form-group has-icon">
                    <label for="cpf">Digite seu CPF:</label>
                    <i class="fa-solid fa-id-card input-icon"></i>
                    <input type="text" id="cpf" placeholder="Apenas números" required maxlength="11">
                </div>

                <div class="form-group has-icon">
                    <label for="quantidade">Quantidade de pessoas:</label>
                    <i class="fa-solid fa-users input-icon"></i>
                    <select id="quantidade">
                        <option value="1">1 pessoa</option>
                        <option value="2">2 pessoas</option>
                        <option value="3">3 pessoas</option>
                    </select>
                </div>

                <button type="submit" id="btn-gerar" class="btn-principal">
                    <i class="fa-solid fa-qrcode"></i> Gerar QR Code Pix
                </button>
            </form>

            <p class="loading" id="txt-loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Processando...
            </p>

            <div id="qrcode-container">
                <h3><i class="fa-solid fa-circle-check" style="color:#2e7d32;"></i> Escaneie para Pagar</h3>
                
                <div id="qrcode" style="margin-top: 15px;"></div>
                
                <p style="font-size: 13px; margin-top: 15px; font-weight: bold; text-align: left; color: #4a3b32;">
                    <i class="fa-solid fa-copy"></i> Código Pix Copia e Cola:
                </p>
                <textarea class="pix-copia-cola" id="txt-copiacola" rows="3" readonly onclick="this.select()"></textarea>
            </div>
        </div>
    </div>

    <!-- Lógica de Funcionamento e Integração do Power Automate -->
    <script>
        const URL_POWER_AUTOMATE = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/ce9fc436c70f4504bc7b2409b89e175b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Me9iIsBqKQu0gvrEf8oIrTICXZuIiQNTFMN3iehNQ_c";

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const cpf = document.getElementById('cpf').value.replace(/\D/g, ''); 
            const quantidade = document.getElementById('quantidade').value;
            const btnGerar = document.getElementById('btn-gerar');
            const txtLoading = document.getElementById('txt-loading');
            const qrcodeContainer = document.getElementById('qrcode-container');
            const qrcodeDiv = document.getElementById('qrcode');
            const txtCopiaCola = document.getElementById('txt-copiacola');

            // Reseta estados visuais antigos
            qrcodeDiv.innerHTML = "";
            txtCopiaCola.value = "";
            qrcodeContainer.style.display = "none";
            txtLoading.style.display = "block";
            btnGerar.disabled = true;

            try {
                const response = await fetch(URL_POWER_AUTOMATE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        cpf_usuario: cpf, 
                        qtd_ingressos: quantidade 
                    })
                });

                if (!response.ok) throw new Error("Falha ao se comunicar com o servidor.");

                const dados = await response.json();

                if (!dados.pix_code || !dados.pix_image) {
                    throw new Error("Resposta inválida recebida do fluxo.");
                }

                const imagemPronta = dados.pix_image.trim();

                // Insere os dados processados no layout temático
                qrcodeDiv.innerHTML = `<img src="${imagemPronta}" alt="QR Code Pix Mercado Pago" />`;
                txtCopiaCola.value = dados.pix_code;
                qrcodeContainer.style.display = "block";

            } catch (error) {
                alert("Erro ao processar o pagamento. Verifique o fluxo no Power Automate e tente novamente.");
                console.error(error);
            } finally {
                txtLoading.style.display = "none";
                btnGerar.disabled = false;
            }
        });
    </script>

</body>
</html>
