<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venda de Ingressos - Pix</title>
    <style>
        /* Estilos básicos, limpos e responsivos (fáceis de mudar depois) */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; padding: 12px; background-color: #009ee3; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #007ebb; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .loading { display: none; margin: 15px 0; color: #666; font-style: italic; }
        .pix-area { display: none; margin-top: 20px; padding: 15px; border: 2px dashed #009ee3; border-radius: 8px; background: #f9f9f9; }
        .qrcode-img { width: 200px; height: 200px; margin: 15px auto; display: block; }
        .sucesso { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Garanta seu Ingresso</h2>
    
    <div id="form-compra">
        <input type="text" id="cpf" placeholder="Digite seu CPF (apenas números)" maxlength="11" oninput="validarCPF(this)">
        <button id="btn-gerar" onclick="iniciarFluxoVenda()" disabled>Gerar QR Code Pix</button>
        <div id="loader" class="loading">Processando dados e gerando Pix...</div>
    </div>

    <div id="area-pix" class="pix-area">
        <h3>Pague com o Pix</h3>
        <p>Aproxime o celular ou copie o código abaixo:</p>
        <img id="qrcode-preview" class="qrcode-img" src="" alt="QR Code Pix">
        <input type="text" id="copia-cola" readonly onclick="this.select()">
        <button onclick="copiarTexto()">Copiar Código Pix</button>
    </div>

    <div id="msg-sucesso" class="sucesso">
        ✓ PAGAMENTO CONFIRMADO!<br>
        Seu CPF já está na lista da portaria.
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO DA URL ÚNICA (FÁCIL AJUSTE)
    // ==========================================
    // Aqui você vai colar o link gerado pelo seu Power Automate posteriormente
    const URL_FLUXO_UNICO = "https://SEU_LINK_DO_POWER_AUTOMATE_AQUI";

    // Libera o botão apenas se o CPF tiver 11 dígitos
    function validarCPF(input) {
        input.value = input.value.replace(/\D/g, ''); // Remove letras
        document.getElementById('btn-gerar').disabled = (input.value.length !== 11);
    }

    // 1. O GATILHO: Dispara a requisição instantânea para o sistema
    async function iniciarFluxoVenda() {
        const cpfUsuario = document.getElementById('cpf').value;
        const btnGerar = document.getElementById('btn-gerar');
        const loader = document.getElementById('loader');
        const areaPix = document.getElementById('area-pix');
        const qrCodeImg = document.getElementById('qrcode-preview');
        const copiaColaInput = document.getElementById('copia-cola');

        // Contagem de tempo para análise de performance
        console.time("Tempo de Resposta do Pix");

        // Interface visual de carregamento
        btnGerar.disabled = true;
        loader.style.display = "block";
        areaPix.style.display = "none";

        try {
            // Envia o CPF para o seu fluxo único (Power Automate)
            const resposta = await fetch(URL_FLUXO_UNICO, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cpf: cpfUsuario })
            });

            if (!resposta.ok) throw new Error("Erro na requisição");

            const dadosPix = await JSON.parse(await resposta.text()); // Converte a resposta do fluxo

            // Finaliza a contagem do tempo no console do navegador para análise
            console.timeEnd("Tempo de Resposta do Pix");

            // Insere os dados recebidos do Mercado Pago na tela do usuário
            qrCodeImg.src = `data:image/jpeg;base64,${dadosPix.qr_code_base64}`;
            copiaColaInput.value = dadosPix.qr_code;

            // Mostra os elementos do Pix na tela
            loader.style.display = "none";
            areaPix.style.display = "block";

            // Inicia a verificação de segundo plano para ver se foi pago
            verificarPagamento(cpfUsuario);

        } catch (erro) {
            console.error(erro);
            alert("Ocorreu um erro ao gerar o Pix. Tente novamente.");
            btnGerar.disabled = false;
            loader.style.display = "none";
        }
    }

    // Função auxiliar para o botão de copiar o código Pix
    function copiarTexto() {
        const copiaColaInput = document.getElementById('copia-cola');
        copiaColaInput.select();
        document.execCommand("copy");
        alert("Código Pix copiado para a área de transferência!");
    }

    // 2. O MONITORAMENTO (Checagem em segundo plano)
    function verificarPagamento(cpf) {
        // Fica perguntando para o seu fluxo a cada 4 segundos se o CPF já está pago
        const intervalo = setInterval(async () => {
            try {
                const resposta = await fetch(`${URL_FLUXO_UNICO}?checar_cpf=${cpf}`);
                const status = await resposta.text();

                if (status === "approved" || status === "Pago") {
                    clearInterval(intervalo); // Para de perguntar
                    document.getElementById('area-pix').style.display = "none";
                    document.getElementById('form-compra').style.display = "none";
                    document.getElementById('msg-sucesso').style.display = "block"; // Mostra sucesso
                }
            } catch (e) {
                console.log("Aguardando confirmação de pagamento...");
            }
        }, 4000); // 4 segundos
    }
</script>

</body>
</html>
