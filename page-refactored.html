<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           RESET & ESTRUTURA GLOBAL (TEMA FESTA JUNINA REFINADO)
           ========================================================================== */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease; 
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            min-height: 100dvh;
            color: #4a3b32; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            /* Fundo Xadrez Junino */
            background-color: #e65100; 
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%), 
                              linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%); 
            background-size: 40px 40px; 
            background-position: 0 0, 20px 20px; 
        }

        /* Container do Checkout (Card Creme com Sombra Profunda) */
        .container { 
            width: 100%; 
            max-width: 420px; 
            position: relative; 
            background-color: #fffdf7; 
            padding: 35px 25px; 
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35); 
            text-align: center; 
            border: 3px dashed #d84315; 
            margin: auto 0;
        }

        /* Tipografia */
        h1 { 
            font-family: 'Amatic SC', cursive; 
            font-size: 48px; 
            color: #bf360c; 
            margin-top: 10px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        label { 
            font-weight: 600; 
            margin-top: 15px; 
            display: block; 
            text-align: left; 
            font-size: 14px; 
            color: #4a3b32;
        }

        /* Grupos de Formulário e Ícones */
        .form-group { 
            position: relative; 
        }
        
        .input-icon { 
            position: absolute; 
            left: 14px; 
            top: 40px; 
            color: #bcaaa4; 
            font-size: 16px; 
            z-index: 2;
        }
        
        .has-icon input, .has-icon select { 
            padding-left: 42px !important; 
        }

        /* Inputs e Selects com Borda Tracejada */
        input, select { 
            width: 100%; 
            padding: 11px 12px; 
            border-radius: 8px; 
            border: 2px dashed #bcaaa4; 
            font-size: 14px; 
            box-sizing: border-box; 
            background-color: #fff;
            outline: none;
            margin-top: 5px;
            font-family: 'Inter', sans-serif;
            color: #4a3b32;
        }

        /* Foco Laranja nos Inputs */
        input:focus, select:focus {
            border-color: #e65100 !important;
            box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.15);
        }

        /* Validações Visuais de Erro e Sucesso */
        .input-erro { border: 2px solid #ff1744 !important; background-color: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background-color: #f1f8e9; }
        .msg-erro-cpf { color: #ff1744; font-size: 11px; display: block; text-align: left; margin-top: 2px; font-weight: 400; }

        /* Blocos de Ingressos Extras de Convidados */
        .ingresso-extra { 
            background: #fdf2e9; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 15px; 
            border: 1px solid #ebba95; 
            text-align: left;
        }
        .ingresso-extra label { margin-top: 10px; }
        .ingresso-extra label:first-child { margin-top: 0; }

        /* Botões Estilo 3D Fofos/Juninos */
        .btn-principal { 
            margin-top: 25px; 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700; 
            background-color: #e65100; 
            color: white; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 6px 0 #b33600; 
            font-family: 'Inter', sans-serif;
        }
        
        .btn-principal:active:not(:disabled) { 
            box-shadow: 0 2px 0 #b33600; 
            transform: translateY(4px); 
        }
        
        .btn-principal:disabled { 
            background-color: #bcaaa4 !important; 
            box-shadow: 0 6px 0 #8d6e63 !important; 
            cursor: not-allowed; 
        }

        /* Botão Verificar Pagamento (Mantido Azul Original) */
        .btn-validar { 
            position: relative; 
            background-color: #1565c0 !important; 
            box-shadow: 0 6px 0 #0d47a1 !important; 
            margin-top: 15px; 
            z-index: 1; 
        }
        .btn-validar:active:not(:disabled) { 
            box-shadow: 0 2px 0 #0d47a1 !important; 
            transform: translateY(4px);
        }

        .btn-copiar { 
            margin-top: 8px; 
            width: 100%; 
            padding: 10px; 
            font-size: 13px; 
            font-weight: 600;
            background-color: #616161; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
        }

        /* Container do QR Code Pix e Elementos de Retorno */
        .qr-container { 
            display: none; 
            margin-top: 10px; 
            padding: 20px; 
            border: 2px dashed #d84315; 
            border-radius: 10px; 
            background-color: #fff; 
        }
        .qr-container img { width: 100%; max-width: 180px; display: inline-block; }
        
        .valor { font-weight: bold; color: #bf360c; margin-top: 12px; font-size: 1.3em; }
        
        .pix-box { 
            margin-top: 15px; 
            padding: 12px; 
            background: #f9f9f9; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
        }
        .pix-codigo-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; 
            width: 100%; 
            text-align: center; 
            border: 1px solid #ccc; 
            background: #fff;
            padding: 8px;
            border-radius: 4px;
            color: #4a3b32;
        }

        /* Mensagens de Feedback Visual */
        .status-msg { margin-top: 15px; font-size: 15px; font-weight: bold; color: #bf360c; line-height: 1.4; }
        .texto-expiracao { display: none; color: #ff1744; font-size: 13px; font-weight: 600; margin-bottom: 5px; margin-top: 15px; }
        
        .msg-confirmacao { font-family: 'Amatic SC', cursive; color: #2e7d32; line-height: 1.1; }
        .msg-confirmacao h2 { font-size: 45px; margin: 10px 0; font-weight: 700; color: #2e7d32; }
        .msg-confirmacao p { font-size: 34px; margin: 5px 0; font-weight: 700; }
        .icon-grande { font-size: 80px; display: block; margin-bottom: 10px; color: #2e7d32; }

        /* Overlays e Popups */
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-conteudo { position: relative; max-width: 75vw; max-height: 75vh; }
        .popup-imagem { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .btn-fechar-popup { display: none; position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background-color: #616161; color: #ffffff; border: none; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-x-popup { display: none; position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background-color: #ff1744; color: #ffffff; border: 2px solid #ffffff; border-radius: 50%; font-size: 15px; font-weight: bold; cursor: pointer; line-height: 26px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 10000; }
        
        .pagamento-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 5000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .pagamento-overlay-texto { color: #ffffff; font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; text-align: center; max-width: 340px; line-height: 1.5; }
        .sessao-bloqueada { opacity: 0.35 !important; filter: grayscale(100%); pointer-events: none !important; }
    </style>
</head>
<body>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>

    <div class="pagamento-overlay" id="pagamentoOverlay">
        <div class="pagamento-overlay-texto" id="txtOverlay"></div>
    </div>

    <div class="container">
        <h1>Festa Junina</h1>
        
        <form id="sessao-formulario" onsubmit="processarEnvioFormulario(event)">
            <div class="form-group has-icon">
                <label>Nome do Comprador</label>
                <i class="fa-solid fa-user input-icon"></i>
                <input id="comprador" required placeholder="Escreva seu nome aqui...">
            </div>
            
            <div class="form-group has-icon">
                <label>CPF do Comprador</label>
                <i class="fa-solid fa-id-card input-icon"></i>
                <input id="cpf-comprador" required class="cpf-validar" placeholder="000.000.000-00">
            </div>
            
            <div class="form-group has-icon">
                <label>Telefone</label>
                <i class="fa-solid fa-phone input-icon"></i>
                <input id="telefone" required placeholder="(00) 00000-0000">
            </div>

            <div class="form-group has-icon">
                <label>Quantidade de ingressos</label>
                <i class="fa-solid fa-users input-icon"></i>
                <select id="quantidade">
                    <option value="1">1 ingresso</option>
                    <option value="2">2 ingressos</option>
                    <option value="3">3 ingressos</option>
                </select>
            </div>

            <div id="campos-extras"></div>
            
            <button type="submit" id="btn-gerar" class="btn-principal">
                <i class="fa-solid fa-qrcode"></i> Gerar QR Code
            </button>
        </form>

        <div class="texto-expiracao" id="timer-expiracao">O código a seguir expira em 10:00.</div>

        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr" class="status-msg">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Processando...
            </div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total">Total: Calculando...</div>
            
            <div class="pix-box">
                <input id="pix-codigo" class="pix-codigo-input" readonly onclick="this.select()">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()">
                    <i class="fa-solid fa-copy"></i> Copiar Código Pix
                </button>
            </div>

            <button id="btn-validar" class="btn-principal btn-validar">
                <i class="fa-solid fa-circle-check"></i> Verificar Pagamento
            </button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>

    <script>
        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2ad0529973d74605bffbb1f1dd89c063/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=9cFG_dFkGjSMngbCZU7Rj7MW02aldXs66m7z14mS89c";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d03cad4eca5840989b744d1e6b4c867c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UzdbeuNVzZn3kPiJkW7jr0Ebmm6Z-pyafYYUFlKuLOc";

        const TEMPO_CHECK_PIX = 6000;
        const LIMITE_EXPIRACAO_PIX = 600000;

        const MSGS = {
            dados_invalidos: "Preencha os dados corretamente",
            cpf_comprador_duplicado: "Atenção: O CPF do Comprador só pode constar em 1 campo dos ingressos",
            cpf_convidado_duplicado: "Atenção: CPF duplicados na lista de convidados",
            overlay_texto: "Não se esqueça de clicar no botão abaixo ao finalizar o seu pagamento.",
            copiado: "Copiado!",
            timeout: "Tempo Limite"
        };

        let idPagamentoAtual = null;
        let intervaloPix = null;
        let loopEmExecucao = false;
        let cronometroRegressivo = null;
        
        const selectQtde = document.getElementById("quantidade");
        const camposExtras = document.getElementById("campos-extras");

        setTimeout(() => {
            document.getElementById('btnFecharPopup').style.display = 'block';
            document.getElementById('btnXPopup').style.display = 'block';
        }, 3000);

        function fecharPopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }

        function iniciarCronometro() {
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            let tempoRestante = Math.floor(LIMITE_EXPIRACAO_PIX / 1000);
            const elementoTimer = document.getElementById('timer-expiracao');

            cronometroRegressivo = setInterval(() => {
                let minutes = Math.floor(tempoRestante / 60);
                let segundos = tempoRestante % 60;

                minutes = minutes < 10 ? '0' + minutes : minutes;
                segundos = segundos < 10 ? '0' + segundos : segundos;

                elementoTimer.innerText = `O código a seguir expira em ${minutes}:${segundos}.`;

                if (tempoRestante <= 0) {
                    clearInterval(cronometroRegressivo);
                    executarFluxoTimeoutEstrito();
                }

                tempoRestante--;
            }, 1000);
        }

        function ejecutarFluxoTimeoutEstrito() {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            
            const elementoTimer = document.getElementById('timer-expiracao');
            const sessaoQr = document.getElementById('sessao-qr');
            const overlayPagamento = document.getElementById("pagamentoOverlay");
            const txtOverlay = document.getElementById("txtOverlay");
            
            elementoTimer.innerText = MSGS.timeout;
            document.getElementById('status-verificacao').innerHTML = ""; 
            
            sessaoQr.classList.add("sessao-bloqueada");
            document.getElementById('btn-copiar').disabled = true;
            document.getElementById('btn-validar').disabled = true;

            let contagemRedirect = 9;
            txtOverlay.innerHTML = `Tempo Limite Excedido!<br><span style='font-size: 15px; font-weight: 400; opacity: 0.8;'>Redirecionando em ${contagemRedirect}s...</span>`;
            
            overlayPagamento.style.display = "flex";

            const loopRedirect = setInterval(() => {
                contagemRedirect--;
                txtOverlay.innerHTML = `Tempo Limite Excedido!<br><span style='font-size: 15px; font-weight: 400; opacity: 0.8;'>Redirecionando em ${contagemRedirect}s...</span>`;
                
                if (contagemRedirect <= 0) {
                    clearInterval(loopRedirect);
                    overlayPagamento.style.display = "none";
                    resetSistemicoTotal();
                }
            }, 1000);
        }

        function resetSistemicoTotal() {
            if (intervaloPix) clearInterval(intervaloPix);
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            intervaloPix = cronometroRegressivo = idPagamentoAtual = null;
            loopEmExecucao = false;

            const sessaoQr = document.getElementById('sessao-qr');
            sessaoQr.classList.remove("sessao-bloqueada");
            sessaoQr.style.display = "none";
            document.getElementById('status-verificacao').innerHTML = "";
            document.getElementById('img-qr').style.display = 'none';
            document.getElementById('img-qr').src = "";
            document.getElementById('timer-expiracao').style.display = "none";
            document.getElementById('btn-copiar').disabled = false;
            document.getElementById('btn-validar').disabled = false;

            const btnGerar = document.getElementById("btn-gerar");
            btnGerar.disabled = false; 
            btnGerar.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`;

            const formulario = document.getElementById("sessao-formulario");
            formulario.reset();
            document.getElementById("comprador").className = document.getElementById("cpf-comprador").className = document.getElementById("telefone").className = "";
            document.querySelectorAll('.msg-erro-cpf').forEach(el => el.remove());
            document.getElementById("quantidade").value = "1";
            document.getElementById("campos-extras").innerHTML = "";
            document.getElementById("quantidade").dispatchEvent(new Event('change'));
            formulario.style.display = "block";
        }

        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix);
            loopEmExecucao = false;

            intervaloPix = setInterval(async () => {
                if (loopEmExecucao) return;

                loopEmExecucao = true;
                const confirmado = await efetuarChamadaValidacaoAPI();
                
                if (confirmado) {
                    clearInterval(intervaloPix);
                    intervaloPix = null;
                    aplicarLayoutSucessoDefinitivo();
                }
                
                loopEmExecucao = false;
            }, TEMPO_CHECK_PIX);
        }

        async function efetuarChamadaValidacaoAPI() {
            try {
                const idParaValidar = idPagamentoAtual ? String(idPagamentoAtual).trim() : "";
                const response = await fetch(URL_VALIDAR_PAGAMENTO, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "id": idParaValidar })
                });
                if (!response.ok) return false;
                const resultado = await response.text();
                return resultado.includes("Sucesso");
            } catch (e) {
                return false;
            }
        }

        function aplicarLayoutSucessoDefinitivo() {
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            if (intervaloPix) clearInterval(intervaloPix);
            document.getElementById("timer-expiracao").style.display = "none";
            document.getElementById("sessao-qr").innerHTML = `
                <div class="msg-confirmacao">
                    <span class="icon-grande">✅</span>
                    <h2>PAGAMENTO CONFIRMADO!</h2>
                    <p>ETA TREM BÃO!</p>
                    <p>NOS ENCONTRAMOS NA FESTA!</p>
                </div>
            `;
        }

        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf == '' || cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let add = 0;
            for (let i = 0; i < 9; i++) add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11);
            if (rev == 10 || rev == 11) rev = 0;
            if (rev != parseInt(cpf.charAt(9))) return false;
            add = 0;
            for (let i = 0; i < 10; i++) add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev == 10 || rev == 11) rev = 0;
            if (rev != parseInt(cpf.charAt(10))) return false;
            return true;
        }

        function formatarNomeProprio(nome) {
            const preposicoes = ["da", "das", "de", "do", "dos"];
            return nome.toLowerCase().split(' ').map(palavra => {
                if (preposicoes.includes(palavra)) return palavra;
                if (palavra === "") return "";
                return palavra.charAt(0).toUpperCase() + palavra.slice(1);
            }).join(' ');
        }

        document.getElementById('comprador').addEventListener('blur', function (e) {
            if (e.target.value.trim() !== "") {
                e.target.value = formatarNomeProprio(e.target.value);
            }
        });

        selectQtde.addEventListener("change", () => {
            const qtde = parseInt(selectQtde.value);
            camposExtras.innerHTML = "";
            for(let i = 1; i <= qtde; i++) {
                const div = document.createElement("div");
                div.className = "ingresso-extra";
                div.innerHTML = `
                    <div style="font-weight: 700; color: #bf360c; margin-bottom: 5px; font-size: 13px; text-transform: uppercase;">
                        <i class="fa-solid fa-ticket"></i> Ingresso ${i}
                    </div>
                    <label>Nome no Ingresso</label>
                    <input class="nome-ing" required placeholder="Nome do convidado">
                    <label>CPF Convidado</label>
                    <input class="cpf-ing cpf-validar" required placeholder="000.000.000-00">
                `;
                camposExtras.appendChild(div);
            }
            aplicarMascaras();
            
            document.querySelectorAll(".nome-ing").forEach(el => {
                el.addEventListener('blur', function(e) {
                    if (e.target.value.trim() !== "") {
                        e.target.value = formatarNomeProprio(e.target.value);
                    }
                });
            });
        });
        selectQtde.dispatchEvent(new Event('change'));

        async function processarEnvioFormulario(e) {
            e.preventDefault(); 

            const btn = document.getElementById("btn-gerar");
            const comprador = document.getElementById("comprador").value.trim();
            const cpfComprador = document.getElementById("cpf-comprador").value.trim();
            const telefone = document.getElementById("telefone").value.trim();
            
            if (!comprador || !validarCPF(cpfComprador) || telefone.length < 14) { 
                alert(MSGS.dados_invalidos); 
                document.getElementById("cpf-comprador").classList.add("input-erro");
                return; 
            }

            const inputsNomes = document.querySelectorAll(".nome-ing");
            const inputsCpfs = document.querySelectorAll(".cpf-ing");
            let listaIngressos = [];
            let cpfsConvidados = [];
            let contadorCpfComprador = 0;
            let erroValidacao = false;

            inputsCpfs.forEach((input, i) => {
                const cpfVal = input.value.trim();
                const nomeVal = inputsNomes[i].value.trim();

                if (!nomeVal || !validarCPF(cpfVal)) {
                    erroValidacao = true;
                    input.classList.add("input-erro");
                } else {
                    input.classList.remove("input-erro");
                }
                
                if (cpfVal === cpfComprador) {
                    contadorCpfComprador++;
                } else {
                    cpfsConvidados.push(cpfVal);
                }
                
                listaIngressos.push({ "NOME_INGRESSO": nomeVal, "CPF_INGRESSO": cpfVal });
            });

            if (erroValidacao) {
                alert(MSGS.dados_invalidos);
                return;
            }

            if (contadorCpfComprador > 1) {
                alert(MSGS.cpf_comprador_duplicado);
                return;
            }

            const convidadosUnicos = new Set(cpfsConvidados);
            if (convidadosUnicos.size !== cpfsConvidados.length) {
                alert(MSGS.cpf_convidado_duplicado);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...`;

            const payload = {
                "COMPRADOR": comprador,
                "CPF_COMPRADOR": cpfComprador,
                "TELEFONE": telefone,
                "QUANTIDADE": selectQtde.value,
                "INGRESSOS": listaIngressos
            };

            try {
                const response = await fetch(URL_GERAR_PIX, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.status === "bloqueado") {
                        alert("⚠️ BLOQUEIO: " + data.mensagem);
                        btn.disabled = false;
                        btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`;
                        return;
                    }
                    
                    if ((data.status === "pending" || data.status === "pendente") && data.mensagem === "recuperar") {
                        idPagamentoAtual = data.pagamento_id || data.id || data.id_pagamento || "";
                        document.getElementById("sessao-formulario").style.display = "none";
                        document.getElementById("sessao-qr").style.display = "block";
                        
                        document.getElementById("img-qr").src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                        document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                        document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(data.variavel).toFixed(2).replace('.', ',')}`;
                        
                        document.getElementById("carregando-qr").style.display = "none";
                        document.getElementById("img-qr").style.display = "inline-block";
                        document.getElementById("timer-expiracao").style.display = "block";
                        
                        iniciarCronometro();
                        iniciarMonitoramentoPixAutomatico();
                        return;
                    }

                    idPagamentoAtual = data.pagamento_id || data.id || data.id_pagamento || ""; 
                    document.getElementById("img-qr").src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(data.variavel).toFixed(2).replace('.', ',')}`;

                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    document.getElementById("img-qr").style.display = "inline-block";

                    const overlayPagamento = document.getElementById("pagamentoOverlay");
                    const btnValidar = document.getElementById("btn-validar");
                    
                    document.getElementById("txtOverlay").innerText = MSGS.overlay_texto;
                    overlayPagamento.style.display = "flex";
                    btnValidar.style.zIndex = "6000";

                    setTimeout(() => {
                        overlayPagamento.style.display = "none";
                        btnValidar.style.zIndex = "1"; 
                    }, 5000);

                    iniciarCronometro();
                    iniciarMonitoramentoPixAutomatico();
                } else {
                    alert("Erro ao processar. Tente novamente.");
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`;
                }
            } catch (e) {
                alert("Erro de conexão com o servidor.");
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`;
            }
        }

        document.getElementById("btn-validar").addEventListener("click", async () => {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            
            const btn = document.getElementById("btn-validar");
            const msg = document.getElementById("status-verificacao");

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...`;

            const verificado = await efetuarChamadaValidacaoAPI();

            if (verificado) {
                aplicarLayoutSucessoDefinitivo();
            } else {
                msg.innerHTML = `
                    <span class="icon-grande" style="font-size: 50px; color: #bf360c; margin-bottom: 5px;">❌</span>
                    <br>Ainda não encontramos o seu Pix.<br>Espera um tiquinho e tenta de novo!
                `;
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Verificar Pagamento`;
                iniciarMonitoramentoPixAutomatico();
            }
        });

        function copiarPix() {
            const pix = document.getElementById("pix-codigo");
            pix.select();
            navigator.clipboard.writeText(pix.value);
            document.getElementById("btn-copiar").innerText = MSGS.copiado;
            setTimeout(() => { document.getElementById("btn-copiar").innerHTML = `<i class="fa-solid fa-copy"></i> Copiar Código Pix`; }, 2000);
        }

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-validar").forEach(el => {
                el.removeEventListener("input", maskCPF);
                el.addEventListener("input", maskCPF);
                el.removeEventListener("blur", validateCPFBlur);
                el.addEventListener("blur", validateCPFBlur);
            });

            const telInput = document.getElementById("telefone");
            if(telInput) {
                telInput.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
                    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
                    else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
                    else if (v.length > 0) v = v.replace(/^(\d{0,2})/, "($1");
                    e.target.value = v;
                });
            }
        }

        function maskCPF(e) {
            let v = e.target.value.replace(/\D/g, "").slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
            e.target.value = v;
        }

        function validateCPFBlur(e) {
            const val = e.target.value;
            const erroExistente = e.target.nextElementSibling;
            if (erroExistente && erroExistente.classList.contains('msg-erro-cpf')) {
                erroExistente.remove();
            }

            if (val.length > 0) {
                if (validarCPF(val)) {
                    e.target.classList.remove("input-erro");
                    e.target.classList.add("input-sucesso");
                } else {
                    e.target.classList.remove("input-sucesso");
                    e.target.classList.add("input-erro");
                    const span = document.createElement("span");
                    span.className = "msg-erro-cpf";
                    span.innerText = "CPF Inválido";
                    e.target.after(span);
                }
            } else {
                e.target.classList.remove("input-erro", "input-sucesso");
            }
        }

        aplicarMascaras();
    </script>
</body>
</html>
