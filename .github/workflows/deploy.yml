name: Deploy Festa Junina

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar o código
        uses: actions/checkout@v4

      - name: Injetar as URLs Secretas no HTML
        run: |
          sed -i 's|URL_MAE:.*|URL_MAE: "${{ secrets.URL_MAE }}",|g' junina/index.html
          sed -i 's|URL_LEITURA:.*|URL_LEITURA: "${{ secrets.URL_LEITURA }}",|g' junina/index.html

      - name: Publicar no GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
