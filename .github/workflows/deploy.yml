name: Deploy Festa Junina

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar o código
        uses: actions/checkout@v4

      - name: Injetar as URLs Secretas no HTML via Node
        run: |
          node -e '
            const fs = require("fs");
            const caminho = "junina/index.html";
            let html = fs.readFileSync(caminho, "utf8");
            html = html.replace("placeholder_url_mae", "${{ secrets.URL_MAE }}");
            html = html.replace("placeholder_url_leitura", "${{ secrets.URL_LEITURA }}");
            fs.writeFileSync(caminho, html, "utf8");
          '

      - name: Publicar no GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
