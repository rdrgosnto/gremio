<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 font-sans min-h-screen flex flex-col">

    <!-- Cabeçalho Laranja Festa Junina -->
    <header class="bg-orange-600 text-white text-center py-4 shadow-md border-b-4 border-yellow-400">
        <h1 class="text-3xl font-bold tracking-wide">Arraiá do Grêmio - Sistema de Caixa</h1>
        <p class="text-sm opacity-90 mt-1">Controle de Vendas e Auditoria de Estoque</p>
    </header>

    <!-- Corpo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Lado Esquerdo: Menu em Lista Alinhada (Ocupa 2 colunas no desktop) -->
        <section class="lg:col-span-2 space-y-4">
            <h2 class="text-xl font-bold text-amber-900 border-b-2 border-orange-200 pb-2">Menu de Produtos (A-Z)</h2>
            
            <!-- Container em formato de lista vertical -->
            <div id="grid-produtos" class="flex flex-col gap-2">
                <!-- Os produtos serão injetados dinamicamente via JavaScript aqui embaixo -->
            </div>
        </section>

        <!-- Lado Direito: Carrinho e Fechamento -->
        <section class="bg-white rounded-2xl shadow-xl border border-amber-100 p-6 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-4">
            <div>
                <h2 class="text-xl font-bold text-amber-950 border-b pb-3 mb-4 flex justify-between items-center">
                    <span>Pedido Atual</span>
                    <span id="contador-itens" class="text-xs bg-orange-100 text-orange-700 px-2.5 py-1 rounded-full font-semibold">0 itens</span>
                </h2>

                <!-- Lista de itens no carrinho -->
                <div id="lista-carrinho" class="space-y-3 overflow-y-auto max-h-[35vh] pr-1">
                    <p class="text-gray-400 text-center py-8 text-sm italic">Nenhum produto selecionado...</p>
                </div>
            </div>

            <!-- Resumo, Forma de Pagamento e Botão Enviar -->
            <div class="border-t pt-4 mt-4 space-y-4">
                <!-- Totalizador -->
                <div class="flex justify-between items-center text-amber-950">
                    <span class="text-lg font-medium">Valor Total:</span>
                    <span id="valor-total" class="text-3xl font-black text-orange-600">R$ 0,00</span>
                </div>

                <!-- Método de Pagamento -->
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-gray-600 block">Forma de Pagamento:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50">
                            <span class="text-lg font-bold">PIX</span>
                        </button>
                        <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50">
                            <span class="text-lg font-bold">DINHEIRO</span>
                        </button>
                    </div>
                </div>

                <!-- Botão Concluir -->
                <button onclick="finalizarVenda()" id="btn-finalizar" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl text-center text-lg shadow transition-all cursor-not-allowed">
                    Selecione o Pagamento
                </button>
            </div>
        </section>
    </main>

    <script>
        // Itens da festa (Organizados automaticamente em ordem alfabética)
        const produtos = [
            { id: 1, nome: "Cachorro Quente", preco: 12.00, estoque: 50, critico: 5 },
            { id: 2, nome: "Pipoca Doce/Salgada", preco: 6.00, estoque: 4, critico: 5 },
            { id: 3, nome: "Refrigerante (Lata)", preco: 6.00, estoque: 80, critico: 10 },
            { id: 4, nome: "Água Mineral", preco: 4.00, estoque: 30, critico: 5 },
            { id: 5, nome: "Quentão", preco: 10.00, estoque: 30, critico: 5 },
            { id: 6, nome: "Canjica", preco: 8.00, estoque: 25, critico: 5 },
            { id: 7, nome: "Espetinho de Carne", preco: 14.00, estoque: 40, critico: 8 },
            { id: 8, nome: "Milho Cozido", preco: 7.00, estoque: 20, critico: 5 },
            { id: 9, nome: "Bolo de Fubá", preco: 5.00, estoque: 15, critico: 3 },
            { id: 10, nome: "Pastel", preco: 9.00, estoque: 60, critico: 10 }
        ];

        let carrinho = {};
        let formaPagamento = null;

        // Renderiza as linhas de produtos alinhando perfeitamente os blocos de texto
        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos");
            grid.innerHTML = "";

            // Força a ordenação alfabética (A-Z) antes de desenhar na tela
            produtos.sort((a, b) => a.nome.localeCompare(b.nome));

            produtos.forEach(p => {
                const qtdNoCarrinho = carrinho[p.id] || 0;
                let statusEstoqueHtml = `<span class="text-green-600 font-bold">${p.estoque}</span>`;
                let cardBg = "bg-white border-amber-100";
                let disabledBtn = "";

                if (p.estoque === 0) {
                    statusEstoqueHtml = `<span class="text-red-600 font-bold bg-red-50 px-2 py-0.5 rounded">ESGOTADO</span>`;
                    cardBg = "bg-gray-100 border-gray-200 opacity-60";
                    disabledBtn = "disabled";
                } else if (p.estoque <= p.critico) {
                    statusEstoqueHtml = `<span class="text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded">${p.estoque} (Baixo)</span>`;
                }

                // A mágica do alinhamento está no grid interno (grid-cols-3) com text-left, text-center e text-right
                grid.innerHTML += `
                    <div class="border rounded-xl p-3 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 transition-all ${cardBg}">
                        
                        <!-- ÁREA DE DADOS ALINHADOS (Nome, Preço e Estoque fixos nas suas colunas) -->
                        <div class="flex-1 grid grid-cols-3 items-center gap-2 min-w-0">
                            <!-- Coluna 1: Nome do produto alinhado à esquerda -->
                            <h3 class="font-bold text-amber-950 text-sm sm:text-base truncate">${p.nome}</h3>
                            
                            <!-- Coluna 2: Preço centralizado na linha -->
                            <span class="text-orange-600 font-black text-sm sm:text-base text-center">R$ ${p.preco.toFixed(2)}</span>
                            
                            <!-- Coluna 3: Palavra Estoque e o número cravados à direita -->
                            <div class="text-xs text-gray-400 text-right pr-2 whitespace-nowrap">
                                <span class="opacity-70">Estoque</span> ${statusEstoqueHtml}
                            </div>
                        </div>
                        
                        <!-- CONTROLES DE QUANTIDADE -->
                        <div class="flex items-center justify-end gap-3">
                            <span class="text-xs font-semibold text-gray-500">Qtd: <b class="text-gray-800 text-sm">${qtdNoCarrinho}</b></span>
                            <div class="flex items-center gap-1 bg-gray-100 rounded-lg p-0.5 border">
                                <button onclick="alterarQuantidade(${p.id}, -1)" class="w-8 h-8 rounded bg-white font-bold text-gray-600 hover:bg-orange-50 hover:text-orange-600 transition-all">-</button>
                                <button onclick="alterarQuantidade(${p.id}, 1)" ${disabledBtn} class="w-8 h-8 rounded bg-white font-bold text-gray-600 hover:bg-orange-50 hover:text-orange-600 transition-all ${p.estoque === 0 ? 'opacity-40 cursor-not-allowed':''}">+</button>
                            </div>
                        </div>

                    </div>
                `;
            });
        }

        // Altera quantidades limitando ao teto do estoque
        function alterarQuantidade(id, delta) {
            const produto = produtos.find(p => p.id === id);
            const qtdAtual = carrinho[id] || 0;
            const novaQtd = qtdAtual + delta;

            if (novaQtd < 0) return;
            if (novaQtd > produto.estoque) {
                alert(`Ops! Só temos ${produto.estoque} unidades de ${produto.nome} no estoque.`);
                return;
            }

            if (novaQtd === 0) {
                delete carrinho[id];
            } else {
                carrinho[id] = novaQtd;
            }

            renderizarProdutos();
            atualizarCarrinho();
        }

        // Atualiza a barra lateral do pedido
        function atualizarCarrinho() {
            const lista = document.getElementById("lista-carrinho");
            const contador = document.getElementById("contador-itens");
            const totalTxt = document.getElementById("valor-total");
            
            let total = 0;
            let totalItens = 0;
            lista.innerHTML = "";

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                const qtd = carrinho[id];
                const subtotal = p.preco * qtd;
                total += subtotal;
                totalItens += qtd;

                lista.innerHTML += `
                    <div class="flex justify-between items-center text-sm bg-amber-50/50 p-2.5 rounded-xl border border-amber-100/60">
                        <div class="max-w-[65%]">
                            <p class="font-semibold text-amber-950">${p.nome}</p>
                            <p class="text-xs text-gray-400">${qtd}x R$ ${p.preco.toFixed(2)}</p>
                        </div>
                        <span class="font-bold text-amber-950">R$ ${subtotal.toFixed(2)}</span>
                    </div>
                `;
            });

            if (totalItens === 0) {
                lista.innerHTML = `<p class="text-gray-400 text-center py-8 text-sm italic">Nenhum produto selecionado...</p>`;
            }

            contador.innerText = `${totalItens} ${totalItens === 1 ? 'item' : 'itens'}`;
            totalTxt.innerText = `R$ ${total.toFixed(2)}`;
            verificarStatusBotao();
        }

        // Altera o visual dos botões de pagamento
        function selecionarPagamento(tipo) {
            formaPagamento = tipo;
            const btnPix = document.getElementById("btn-pix");
            const btnDinheiro = document.getElementById("btn-dinheiro");

            if (tipo === 'PIX') {
                btnPix.className = "py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-emerald-500 bg-emerald-50 text-emerald-700 shadow-sm shadow-emerald-100";
                btnDinheiro.className = "py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50";
            } else {
                btnDinheiro.className = "py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-emerald-500 bg-emerald-50 text-emerald-700 shadow-sm shadow-emerald-100";
                btnPix.className = "py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50";
            }
            verificarStatusBotao();
        }

        // Valida liberação do botão de conclusão
        function verificarStatusBotao() {
            const btn = document.getElementById("btn-finalizar");
            const temItens = Object.keys(carrinho).length > 0;

            if (temItens && formaPagamento) {
                btn.disabled = false;
                btn.className = "w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-xl text-center text-lg shadow-lg shadow-orange-200 transition-all transform active:scale-[0.98]";
                btn.innerText = `Finalizar em ${formaPagamento}`;
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl text-center text-lg shadow transition-all cursor-not-allowed";
                btn.innerText = temItens ? "Selecione o Pagamento" : "Adicione Itens ao Pedido";
            }
        }

        // Simulação do envio de fechamento do lote
        function finalizarVenda() {
            const dadosVenda = {
                data: new Date().toLocaleString('pt-BR'),
                origem: formaPagamento,
                itens: Object.keys(carrinho).map(id => {
                    const p = produtos.find(item => item.id == id);
                    return { nome: p.nome, quantidade: carrinho[id], subtotal: p.preco * carrinho[id] };
                })
            };

            console.log("Payload enviado para auditoria posterior:", dadosVenda);
            alert(`🎉 Venda Registrada!\nForma de Pagamento: ${formaPagamento}\n\nEntregue as fichas correspondentes ao cliente.`);
            
            // Abate estoque local
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                p.estoque -= carrinho[id];
            });

            // Reseta tela
            carrinho = {};
            formaPagamento = null;
            document.getElementById("btn-pix").className = "py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50";
            document.getElementById("btn-dinheiro").className = "py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50";
            
            renderizarProdutos();
            atualizarCarrinho();
        }

        // Carga Inicial
        renderizarProdutos();
    </script>
</body>
</html>
