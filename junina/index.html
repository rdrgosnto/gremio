<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grêmio | Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-sistema { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        html, body { visibility: hidden; opacity: 0; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 font-sistema min-h-screen flex flex-col antialiased text-slate-800 select-none">

    <header id="barra-superior" class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2></div>
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div>
        </section>

        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full">
            <div class="bg-white w-full max-w-lg rounded-md shadow-2xl p-5 flex flex-col h-[85vh] lg:h-[calc(100vh-65px)]">
                <h3 id="titulo-checkout" class="text-base font-semibold text-slate-700 text-center uppercase border-b pb-2">PAGAMENTO</h3>
                <div class="flex-1 flex flex-col min-h-0">
                    <div class="flex justify-between items-center py-2">
                        <span class="text-xs font-bold text-slate-400 uppercase">Resumo:</span>
                        <button onclick="limparCarrinhoCompleto()" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase">Limpar</button>
                    </div>
                    <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1"></div>
                </div>
                <div id="bloco-inferior-pagamento" class="space-y-3 pt-3 border-t">
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2 rounded-md border border-slate-300 font-bold text-sm bg-white">DINHEIRO</button>
                        <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-2 rounded-md border border-slate-300 font-bold text-sm bg-white">PIX</button>
                    </div>
                    <button onclick="processarCliqueFinalizar()" id="btn-finalizar" disabled class="w-full bg-slate-200 py-3.5 rounded-md text-slate-400 font-bold">Finalizar</button>
                </div>
            </div>
        </section>
    </main>

    <div id="container-botao-flutuante" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 whitespace-nowrap touch-none">
        <div id="caixa-flutuante-base" onclick="abrirOverlayCelular()" class="bg-orange-500 text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center justify-center min-w-[240px] cursor-pointer select-none text-sm">
            <div id="conteudo-flutuante-unico">Pedido R$ 0,00 - Revisar e Pagar</div>
        </div>
    </div>

    <script>
        // ... (Mantenha aqui as variáveis, constantes e funções existentes de lógica de dados) ...
        // [Inserir aqui seu código de lógica de API e carrinho original]

        // --- MÓDULO DE LAYOUT E INTERAÇÃO ATUALIZADO ---

        function atualizarCarrinhoDOM() {
            if (modoResgateManual) return;
            const lista = document.getElementById("lista-carrinho");
            lista.innerHTML = Object.keys(carrinho).length === 0 ? `<p class="text-slate-400 text-center py-4 text-xs italic">Vazio...</p>` : "";
            
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(i => i.id == id), qtd = carrinho[id], sub = p.preco * qtd;
                lista.innerHTML += `
                    <div class="flex items-center bg-slate-50 p-2 rounded border border-slate-100">
                        <div class="flex-1 min-w-0 pr-2">
                            <div class="flex items-center gap-2">
                                <p class="font-bold text-slate-700 truncate text-[13px]">${p.nome}</p>
                                <button onclick="removerItemDoCarrinhoCompleto(${id})" class="text-[10px] text-slate-400 underline">Remover</button>
                            </div>
                            <p class="text-[11px] text-slate-400">${qtd}x R$ ${formatarMoeda(p.preco)}</p>
                        </div>
                        <div class="font-bold text-slate-800 text-[14px]">R$ ${formatarMoeda(sub)}</div>
                    </div>`;
            });
            // ... (Resto da lógica de botões original) ...
        }

        function configurarBotaoArrastavel() {
            const el = document.getElementById("container-botao-flutuante");
            const header = document.getElementById("barra-superior");
            let iniciado = false, xIni = 0, yIni = 0;

            const onStart = (e) => {
                if (e.target.id === "input-id-busca") return;
                iniciado = true;
                const touch = e.type === "touchstart" ? e.touches[0] : e;
                if (!el.style.left || el.style.left.includes("%")) {
                    const r = el.getBoundingClientRect();
                    el.style.left = r.left + "px"; el.style.top = r.top + "px";
                    el.classList.remove("left-1/2", "-translate-x-1/2");
                }
                xIni = touch.clientX - el.offsetLeft; yIni = touch.clientY - el.offsetTop;
            };

            const onMove = (e) => {
                if (!iniciado) return;
                e.preventDefault(); // Trava a rolagem da página
                const touch = e.type === "touchmove" ? e.touches[0] : e;
                let x = touch.clientX - xIni, y = touch.clientY - yIni;
                const hLim = header ? header.offsetHeight : 48;
                
                if (x < -el.offsetWidth + 24) x = -el.offsetWidth + 24;
                if (x > window.innerWidth - 24) x = window.innerWidth - 24;
                if (y < hLim) y = hLim;
                if (y > window.innerHeight - el.offsetHeight) y = window.innerHeight - el.offsetHeight;

                el.style.left = x + "px"; el.style.top = y + "px";
            };

            el.addEventListener("mousedown", onStart); window.addEventListener("mousemove", onMove); window.addEventListener("mouseup", () => iniciado = false);
            el.addEventListener("touchstart", onStart, { passive: false }); window.addEventListener("touchmove", onMove, { passive: false }); window.addEventListener("touchend", () => iniciado = false);
        }
        
        // ... (Restante do script) ...
    </script>
</body>
</html>
