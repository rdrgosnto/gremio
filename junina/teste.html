<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste PIX via Power Automate</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-lg shadow-xl max-w-md w-full text-center space-y-6 border border-slate-700">
        <h1 class="text-xl font-bold text-orange-500 uppercase tracking-wider">Laboratório PIX R$ 0,01</h1>
        <p class="text-xs text-slate-400">Geração via Power Automate / Checagem Direta no MP</p>

        <button onclick="gerarPix()" id="btn-gerar" class="w-full bg-orange-500 hover:bg-orange-600 py-3 rounded font-bold transition-all">
            Gerar PIX de R$ 0,01
        </button>

        <div id="area-qrcode" class="hidden flex flex-col items-center space-y-4">
            <div id="box-status" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1 rounded shadow animate-pulse">
                AGUARDANDO PAGAMENTO...
            </div>
            <div class="bg-white p-3 rounded">
                <img id="img-qrcode" src="" class="w-48 h-48">
            </div>
            <p class="text-xs text-slate-400">ID no Mercado Pago: <span id="txt-id" class="font-mono text-white"></span></p>
        </div>
    </div>

    <script>
        const TOKEN_MERCADO_PAGO = "APP_USR-8730603782812226-051221-bb8bc8394547cbf915d358d537067a9f-2391822607";
        const URL_MÃE = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9c2bdc7f501e47cc8950268b3d407c63/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qQc7Fuby3E3ZcjTqvBUYLN-ODz2_oVST7-49B6G_qB4";
        
        let idPagamento = "";
        let intervaloCheck = null;

        async function gerarPix() {
            const btn = document.getElementById("btn-gerar");
            btn.innerText = "Chamando Power Automate...";
            btn.disabled = true;

            try {
                // Chama o Power Automate para criar o PIX com segurança no servidor
                const r = await fetch(URL_MÃE, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({})
                });

                if (!r.ok) throw new Error("Erro ao chamar o Power Automate");
                const dados = await r.json();

                idPagamento = String(dados.id_mercado_pago).trim();
                const qrCodeBase64 = dados.qrcode_imagem;

                document.getElementById("img-qrcode").src = `data:image/jpeg;base64,${qrCodeBase64}`;
                document.getElementById("txt-id").innerText = idPagamento;
                btn.classList.add("hidden");
                document.getElementById("area-qrcode").classList.remove("hidden");

                // Inicia o monitoramento de 5 em 5 segundos DIRETO no Mercado Pago
                iniciarMonitoramento();

            } catch (e) {
                alert("Erro no processo. Veja o console.");
                console.error(e);
                btn.innerText = "Gerar PIX de R$ 0,01";
                btn.disabled = false;
            }
        }

        function iniciarMonitoramento() {
            intervaloCheck = setInterval(async () => {
                try {
                    // O GET de consulta geralmente não barra CORS no Mercado Pago
                    const r = await fetch(`https://api.mercadopago.com/v1/payments/${idPagamento}`, {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${TOKEN_MERCADO_PAGO}`
                        }
                    });

                    if (r.ok) {
                        const dados = await r.json();
                        if (dados.status === "approved") {
                            clearInterval(intervaloCheck);
                            sucessoPagamento();
                        }
                    }
                } catch (erro) {
                    console.error("Erro na checagem:", erro);
                }
            }, 5000);
        }

        function sucessoPagamento() {
            const statusBox = document.getElementById("box-status");
            statusBox.className = "bg-emerald-500 text-white text-xs font-bold px-3 py-1 rounded shadow";
            statusBox.innerText = "PAGAMENTO CONFIRMADO!";
            alert("Mágica realizada! O Mercado Pago avisou o HTML e o pagamento foi compensado automaticamente na tela.");
        }
    </script>
</body>
</html>
