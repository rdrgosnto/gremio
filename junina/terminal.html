<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grêmio | Festa Junina</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-sistema { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        html, body { visibility: hidden; opacity: 0; background-color: #f8fafc; }
        .scroll-celular-perfeito { touch-action: pan-y !important; }
        
        /* Emulador Visual de Cliques do Bot */
        .bot-clique-ativo { 
            animation: flash-clique 0.25s ease-in-out;
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.4) !important;
        }
        .bot-remover-ativo {
            color: #ef4444 !important;
            font-weight: 500 !important;
            transition: color 0.15s ease;
        }
        @keyframes flash-clique {
            0% { transform: scale(0.96); opacity: 0.85; }
            50% { border-color: #f97316; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Handle de redimensionamento do Terminal */
        .terminal-resize-handle {
            position: absolute; right: 0; bottom: 0; width: 12px; height: 12px;
            cursor: se-resize; background: linear-gradient(135deg, transparent 30%, #475569 30%, #475569 50%, transparent 50%, transparent 70%, #475569 70%);
        }
    </style>
</head>
<body class="bg-slate-50 font-sistema min-h-screen flex flex-col antialiased text-slate-800 select-none pb-24 lg:pb-0">

    <header id="barra-superior" class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2></div>
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div>
        </section>

        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:fixed lg:top-14 lg:right-[calc((100vw-1600px)/2+12px)] lg:left-auto lg:w-[calc((100%-(100vw-1600px))/4-12px)] xl:w-[385px] bg-black/75 lg:bg-transparent z-50 lg:z-10 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full lg:h-[calc(100vh-65px)]">
            <div id="card-checkout" class="bg-white w-full max-w-lg lg:max-w-none rounded-md shadow-2xl lg:shadow-md border border-slate-300 p-5 flex flex-col justify-between h-[85vh] lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <h3 id="titulo-checkout" class="text-base font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2 transition-colors duration-200">PAGAMENTO</h3>
                    <div class="flex-1 flex flex-col min-h-0">
                        <div class="flex justify-between items-center mb-1.5 w-full px-0.5 h-4">
                            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resumo:</h4>
                            <button id="btn-limpar-carrinho" onclick="limparCarrinhoCompleto()" class="text-xs font-semibold text-slate-400 uppercase tracking-wider pr-1 hover:text-slate-600 transition-colors">Limpar</button>
                            <span id="id-pedido-cabecalho" class="text-xs font-medium text-slate-400 tracking-wide ml-auto hidden"></span>
                        </div>
                        <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1 relative scroll-celular-perfeito">
                            <p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>
                        </div>
                    </div>

                    <div id="bloco-inferior-pagamento" class="space-y-4 pt-1 border-t opacity-40 pointer-events-none transition-opacity duration-200">
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-slate-400 block uppercase tracking-wider text-center">Forma de Pagamento:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-slate-100 text-slate-700 opacity-40 transition-all disabled:cursor-not-allowed">DINHEIRO</button>
                                <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 transition-all disabled:cursor-not-allowed">PIX</button>
                            </div>
                        </div>

                        <div class="w-full overflow-hidden border-t border-dashed pt-3 h-[130px] pb-1 relative">
                            <div id="carrossel-pagamento" class="w-[200%] h-full flex transition-transform duration-300 transform translate-x-0">
                                <div id="secao-valores-dinheiro" class="w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200">
                                    <div class="flex justify-between items-center text-base"><span class="text-slate-500 font-medium">Pedido</span><span id="valor-pedido-txt" class="font-bold text-slate-700">R$ 0,00</span></div>
                                    <div class="flex justify-between items-center text-base"><span class="text-slate-500 font-medium">Recebido</span><div class="relative w-36"><span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">R$</span><input type="text" id="input-recebido" placeholder="0,00" disabled oninput="tratarMascaraDinheiro(this)" class="w-full pl-7 pr-2.5 py-0.5 border border-slate-300 rounded-md text-right font-bold text-slate-800 focus:outline-none focus:border-orange-500 text-base disabled:bg-slate-50 select-text"></div></div>
                                    <div class="flex justify-between items-center text-base border-t border-slate-100 pt-1.5"><span class="text-slate-500 font-medium">Troco</span><span id="valor-troco-txt" class="font-bold text-orange-600">R$ 0,00</span></div>
                                </div>
                                <div id="secao-valores-pix" class="w-1/2 h-full flex items-center justify-center">
                                    <div id="box-qrcode" onclick="requisitarQrCodeReal()" class="w-28 h-28 bg-slate-100 border border-slate-300 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 active:scale-95 transition-none select-none text-center p-2">
                                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider leading-tight">Gerar<br>QR Code</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-1.5 mt-2 pt-2 border-t w-full">
                    <button onclick="processarCliqueFinalizar()" id="btn-finalizar" disabled class="w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed transition-all">Finalizar</button>
                    <button id="btn-voltar-pedido" onclick="fecharOverlay()" class="text-xs text-slate-400 hover:text-slate-600 underline font-medium py-1">Voltar ao pedido</button>
                </div>
            </div>
        </section>
    </main>

    <div id="container-botao-flutuante" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 flex justify-center pointer-events-none touch-none whitespace-nowrap">
        <div id="caixa-flutuante-base" onclick="abrirOverlayCelular()" class="pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-6 rounded-full shadow-lg transition-shadow duration-300 flex items-center justify-center min-w-[240px] max-w-xs cursor-pointer select-none text-sm">
            <div id="conteudo-flutuante-unico" class="text-base tracking-wide text-center py-1">Pedido R$ 0,00 - Revisar e Pagar</div>
        </div>
    </div>

    <div id="custom-modal-container" class="fixed inset-0 bg-black/60 z-[99999] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-800 w-full max-w-sm rounded-lg shadow-2xl border border-slate-700 p-5 font-sistema text-white">
            <p id="custom-modal-text" class="text-sm font-normal text-slate-200 text-left leading-relaxed whitespace-pre-wrap"></p>
            <div class="flex items-center justify-end gap-3 mt-6">
                <button id="custom-modal-btn-cancel" class="px-3 py-2 text-xs font-semibold text-orange-400 uppercase tracking-wider rounded hover:bg-white/5 active:bg-white/10 transition-colors hidden">Cancelar</button>
                <button id="custom-modal-btn-ok" class="px-4 py-2 text-xs font-semibold text-white bg-orange-500 uppercase tracking-wider rounded shadow hover:bg-orange-600 active:scale-95 transition-all">OK</button>
            </div>
        </div>
    </div>

    <div id="terminal-teste" class="fixed z-[9999] bg-slate-900/95 text-slate-200 border border-slate-700 rounded-lg shadow-2xl flex flex-col overflow-hidden backdrop-blur-md" style="width: 380px; height: 200px; bottom: 70px; left: calc(50% - 190px);">
        <div id="terminal-header" class="bg-slate-800/90 border-b border-slate-700 px-3 py-2 flex items-center justify-between cursor-move select-none flex-shrink-0">
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-orange-500 uppercase tracking-wider">TERMINAL</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="minimizarTerminal()" class="text-slate-400 hover:text-white font-medium text-xs px-1 select-none" title="Minimizar">─</button>
                <button onclick="maximizarTerminal()" class="text-slate-400 hover:text-white font-medium text-xs px-1 select-none" title="Maximizar">⬜</button>
            </div>
        </div>
        <div id="terminal-controls" class="bg-slate-950/40 p-2 border-b border-slate-800 flex items-center gap-1.5 flex-shrink-0 text-[11px] overflow-x-auto no-scrollbar">
            <button id="btn-bot-start" onclick="iniciarBateriaTestes()" class="w-14 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1 rounded shadow transition-all uppercase tracking-wider text-[10px] text-center">Start</button>
            <button id="btn-bot-stop" onclick="pararBateriaTestes()" disabled class="w-14 bg-rose-600 text-white font-medium py-1 rounded shadow transition-all uppercase tracking-wider text-[10px] text-center">Stop</button>
            
            <div class="h-4 w-px bg-slate-700 mx-0.5"></div>
            
            <span class="text-slate-400 whitespace-nowrap">Cenário:</span>
            <select id="select-bot-cenario" class="bg-slate-800 border border-slate-700 rounded px-1 py-0.5 text-white focus:outline-none max-w-[95px] text-[10px]">
                <option value="TODOS">Todos (Loop)</option>
                <option value="1">1. Dinheiro Perfeito</option>
                <option value="2">2. Dinheiro Offline</option>
                <option value="3">3. Dinheiro Corrige</option>
                <option value="4">4. PIX Aprovado MP</option>
                <option value="5">5. PIX Desistência</option>
                <option value="6">6. PIX Rede Lenta</option>
                <option value="7">7. Busca ON Pront</option>
                <option value="8">8. Busca ON Retir</option>
                <option value="9">9. Busca ON Offlin</option>
                <option value="10">10. Trava Esgotado</option>
                <option value="11">11. Lote Estresse</option>
            </select>

            <span class="text-slate-400 whitespace-nowrap">Vel:</span>
            <select id="select-bot-speed" onchange="atualizarVelocidadeBot(this.value)" class="bg-slate-800 border border-slate-700 rounded px-1 py-0.5 font-semibold text-orange-400 focus:outline-none text-[10px]">
                <option value="1">1x</option>
                <option value="2">2x</option>
                <option value="5">5x</option>
                <option value="0">Instant</option>
            </select>
        </div>
        <div id="terminal-console" class="flex-1 p-2 overflow-y-auto font-mono text-[11px] leading-relaxed space-y-0.5 no-scrollbar bg-black/40">
            <div class="text-slate-500 italic">// Terminal pronto para simulação de PDV. Escolha o cenário e clique em Start.</div>
        </div>
        <div class="terminal-resize-handle" id="terminal-handle"></div>
    </div>

    <script>
        const URL_LEITURA = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/161fb6d3f71245f187e74df0ae0616b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dxOAva-wcRMsB3WRw8zfGu6XMtuQsOZGgRGdQ5Waxh4";
        const URL_MÃE = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/98221223b0c5414085d99db3124350bb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sXkYuHLSdt1s6aiLFFkMc0fJKd27HDthp4nNRM2Qz20";
        
        const CSS_BTN_ATIVO = "py-2.5 rounded-md border border-orange-500 bg-orange-50 text-orange-700 font-bold text-sm text-center shadow-sm transition-all", CSS_BTN_INATIVO = "py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 shadow-sm transition-all", CSS_FINALIZAR_HABILITADO = "w-full bg-orange-500 hover:bg-orange-600 text-white font-normal py-3.5 rounded-md text-center text-base shadow cursor-pointer transition-all transform active:scale-95", CSS_FINALIZAR_DESABILITADO = "w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed", CSS_BASE_FLUTUANTE = "pointer-events-auto text-white font-semibold h-10 px-6 rounded-full shadow-lg transition-shadow duration-300 flex items-center justify-between min-w-[240px] max-w-xs text-sm";

        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, pixChaveIdentificadora = "", stringQrCodeBase64Salva = "", modoBuscaAtivo = false, modoResgateManual = false, cachePedidoOnlineOriginal = [], intervaloPix = null, loopEmExecucao = false, timestampCriacaoPix = 0, carrinhoBloqueado = false;

        // Controle Geral do Motor Automático
        let botExecutando = false, botVelocidadeFator = 1, internetFicticiaStatus = true, forcarPixSucessoFake = false, modalResolverPendente = null;
        let fecharAlertaPromessaResolver = null; // Gancho para travar as rotinas de rede
        const RESERVADOS = Array.from({length: 9}, (_, i) => String(999000000001 + i));

        const formatarMoeda = (v) => v.toFixed(2).replace('.', ',');
        const exibirFalhaProcessamento = () => { window.alert("Falha no processamento"); reabrirVisualBotaoFinalizar(); };
        const liberarExibicaoSegura = () => { document.documentElement.style.visibility = document.body.style.visibility = "visible"; document.documentElement.style.opacity = document.body.style.opacity = "1"; };
        const renderBotaoFlutuante = (estilo, html, limpar = false) => { const bf = document.getElementById("caixa-flutuante-base"); bf.className = estilo; bf.innerHTML = html; bf.onclick = limpar ? null : abrirOverlayCelular; };

        // MODAL COM TRAVA RETORNANDO PROMISE (OBRIGA O BOT A ESPERAR O FECHAMENTO)
        window.alert = function(mensagem) {
            logTerminal(mensagem, "white");
            return new Promise((resolve) => {
                document.getElementById("custom-modal-text").innerText = mensagem;
                document.getElementById("custom-modal-btn-cancel").classList.add("hidden");
                const container = document.getElementById("custom-modal-container");
                container.classList.remove("hidden");
                
                const btnOk = document.getElementById("custom-modal-btn-ok");
                btnOk.onclick = function() {
                    container.classList.add("hidden");
                    resolve();
                    if(fecharAlertaPromessaResolver) { fecharAlertaPromessaResolver(); fecharAlertaPromessaResolver = null; }
                };
                modalResolverPendente = btnOk.onclick;
            });
        };

        window.confirm = function(mensagem) {
            logTerminal("[CONFIRMADO] " + mensagem, "orange");
            return new Promise((resolve) => {
                document.getElementById("custom-modal-text").innerText = mensagem;
                const btnCancel = document.getElementById("custom-modal-btn-cancel");
                btnCancel.classList.remove("hidden");
                const container = document.getElementById("custom-modal-container");
                container.classList.remove("hidden");

                const btnOk = document.getElementById("custom-modal-btn-ok");
                btnOk.onclick = function() {
                    container.classList.add("hidden");
                    resolve(true);
                };
                btnCancel.onclick = function() {
                    container.classList.add("hidden");
                    resolve(false);
                    if(fecharAlertaPromessaResolver) { fecharAlertaPromessaResolver(); fecharAlertaPromessaResolver = null; }
                };
                modalResolverPendente = btnOk.onclick;
            });
        };

        window.addEventListener('DOMContentLoaded', () => {
            const cache = localStorage.getItem("festa_junina_cardapio");
            if (cache) { produtos = JSON.parse(cache); renderizarProdutos(); }
            carregarEstoqueReal(); iniciarMotorSincronizacaoOculto();
            configurarBotaoArrastavel();
            configurarTerminalArrastavelEResizable();
        });

        async function diagnosticarInternetEstavel() {
            if (!internetFicticiaStatus) return false;
            if (!navigator.onLine) return false;
            try {
                const c = new AbortController(); setTimeout(() => c.abort(), 2500);
                await fetch("https://www.google.com", { mode: "no-cors", signal: c.signal }); return true;
            } catch (e) { return false; }
        }

        async function carregarEstoqueReal(id = "") {
            try {
                if (id !== "" && RESERVADOS.includes(String(id).trim())) {
                    logTerminal(`[MOCK API] Lendo ID reservada em ambiente isolado: ${id}`, "orange");
                    let mockPedido = [];
                    if (id === "999000000008") {
                        mockPedido = [{ ID_PAGAMENTO: id, SIGLA: "REF", PRODUTO: "Refrigerante Mock", PRECO: 6.00, QUANTIDADE: 2, TOTAL: 12.00, RETIRADA: "retirado" }];
                    } else {
                        mockPedido = [{ ID_PAGAMENTO: id, SIGLA: "PIP", PRODUTO: "Pipoca Mock", PRECO: 5.00, QUANTIDADE: 3, TOTAL: 15.00, RETIRADA: "pendente" }];
                    }
                    setTimeout(() => processarResultadoBuscaPedido(mockPedido, id), 400);
                    return;
                }

                const r = await fetch(URL_LEITURA, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(id).trim() }) });
                const combo = await r.json();
                if (combo && combo.produto) { 
                    produtos = combo.produto.map(l => ({ id: parseInt(l.ID || l.id), sigla: l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : (l.sigla ? String(l.sigla).trim().toUpperCase() : "??"), nome: l.PRODUTO || l.produto, preco: parseFloat(l.PRECO || l.preco), estoque: parseInt(l.ATUAL || l.estoque_atual) }));
                    localStorage.setItem("festa_junina_cardapio", JSON.stringify(produtos)); renderizarProdutos();
                }
                if (id !== "" && combo && combo.pedido) processarResultadoBuscaPedido(combo.pedido, id);
            } catch (e) { console.error(e); if (id !== "") forçarFechamentoSistemico(); } finally { liberarExibicaoSegura(); }
        }

        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos"); grid.innerHTML = "";
            produtos.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(p => {
                const qtd = carrinho[p.id] || 0, esg = p.estoque === 0;
                let cardBordaEstilo = (qtd > 0 && !esg) ? "border-orange-400/70 shadow-md" : "border-slate-300 shadow-sm";
                let cEstilo = (esg || carrinhoBloqueado) ? "bg-slate-100 text-slate-400 select-none pointer-events-none opacity-60" : `bg-white hover:border-slate-400 cursor-pointer ${cardBordaEstilo}`;
                let boxEstilo = (qtd > 0 && !esg) ? "bg-orange-50 border border-orange-200 text-orange-700" : "bg-slate-200 text-slate-600";
                if (modoBuscaAtivo || modoResgateManual) cEstilo = "bg-slate-50 border-slate-300 text-slate-300 select-none pointer-events-none opacity-40";

                grid.innerHTML += `
                    <div id="product-card-${p.id}" onclick="emularCliqueVisual('product-card-${p.id}'); alterarQuantidade(${p.id}, 1)" class="border rounded-lg p-2 flex flex-col justify-between transition-all min-w-0 ${cEstilo}">
                        <div class="w-full aspect-square rounded-lg flex flex-col justify-between p-1 relative mb-2 ${boxEstilo}">
                            <div class="text-center font-bold text-[13px] sm:text-[15px] md:text-base lg:text-lg xl:text-xl mt-1 px-1 flex items-center justify-center flex-1 select-none whitespace-normal break-normal leading-none w-full">${p.sigla}</div>
                            <div class="flex items-center justify-between w-full mt-auto">
                                <button id="btn-minus-${p.id}" onclick="event.stopPropagation(); emularCliqueVisual('btn-minus-${p.id}'); alterarQuantidade(${p.id}, -1)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm active:scale-95 active:bg-black/15 ${qtd === 0 || carrinhoBloqueado ? 'opacity-20 pointer-events-none' : ''}">-</button>
                                <span class="text-xs font-bold text-center flex-1">${qtd > 0 ? `<span class="text-orange-600 text-base font-semibold">${qtd}</span>` : '-'}</span>
                                <button id="btn-plus-${p.id}" onclick="event.stopPropagation(); emularCliqueVisual('btn-plus-${p.id}'); alterarQuantidade(${p.id}, 1)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm active:scale-95 active:bg-black/15 ${esg || carrinhoBloqueado ? 'opacity-20 pointer-events-none' : ''}">+</button>
                            </div>
                        </div>
                        <div class="min-w-0 flex flex-col justify-between flex-1">
                            <h3 class="font-semibold text-slate-700 text-[14px] truncate leading-tight mb-0.5 text-left">${p.nome}</h3>
                            <div class="flex items-center justify-between text-[13px] font-medium w-full"><span class="text-orange-600 font-semibold">R$ ${formatarMoeda(p.preco)}</span><div>E: <span class="${esg || p.estoque <= 10 ? 'text-rose-500 font-semibold' : 'text-orange-600 font-semibold'}">${p.estoque}</span></div></div>
                        </div>
                    </div>`;
            });
            let pre = modoBuscaAtivo || modoResgateManual;
            grid.innerHTML += `
                <div class="border rounded-lg p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 bg-white border-slate-300">
                    <div class="w-full aspect-square rounded-lg flex flex-col justify-between p-1 relative mb-2 ${pre ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-600'}">
                        <div class="text-center font-bold text-[13px] sm:text-[15px] md:text-base lg:text-lg xl:text-xl mt-1 px-1 flex items-center justify-center flex-1 select-none whitespace-normal break-normal leading-none w-full">ON</div>
                        <div class="flex items-center justify-between w-full mt-auto">

        function configurarBotaoArrastavel() {
            const el = document.getElementById("container-botao-flutuante");
            const header = document.getElementById("barra-superior");
            let iniciado = false, xAt = 0, yAt = 0, xIni = 0, yIni = 0;
            const onStart = (e) => {
                if (e.target.id === "input-id-busca") return;
                iniciado = true;
                const touch = e.type === "touchstart" ? e.touches[0] : e;
                if (!el.style.left || el.style.left.includes("%")) {
                    const r = el.getBoundingClientRect();
                    el.style.left = r.left + "px"; el.style.bottom = "auto"; el.style.top = r.top + "px";
                    el.classList.remove("left-1/2", "-translate-x-1/2");
                }
                xIni = touch.clientX - el.offsetLeft; yIni = touch.clientY - el.offsetTop;
            };
            const onMove = (e) => {
                if (!iniciado) return;
                e.preventDefault();
                const touch = e.type === "touchmove" ? e.touches[0] : e;
                xAt = touch.clientX - xIni; yAt = touch.clientY - yIni;
                const lMax = window.innerWidth - 24, aMax = window.innerHeight - el.offsetHeight;
                const hLim = header ? header.offsetHeight : 48;
                if (xAt < -el.offsetWidth + 24) xAt = -el.offsetWidth + 24; if (xAt > lMax) xAt = lMax;
                if (yAt < hLim) yAt = hLim; if (yAt > aMax) yAt = aMax;
                el.style.left = xAt + "px"; el.style.top = yAt + "px";
            };
            const onEnd = () => iniciado = false;
            el.addEventListener("mousedown", onStart); window.addEventListener("mousemove", onMove); window.addEventListener("mouseup", onEnd);
            el.addEventListener("touchstart", onStart, { passive: false }); window.addEventListener("touchmove", onMove, { passive: false }); window.addEventListener("touchend", onEnd);
        }

        function configurarTerminalArrastavelEResizable() {
            const term = document.getElementById("terminal-teste");
            const header = document.getElementById("terminal-header");
            const handle = document.getElementById("terminal-handle");
            let dragIniX = 0, dragIniY = 0, isDragging = false;
            let resIniX = 0, resIniY = 0, resIniW = 0, resIniH = 0, isResizing = false;

            header.onmousedown = (e) => {
                isDragging = true; term.style.bottom = "auto";
                dragIniX = e.clientX - term.offsetLeft; dragIniY = e.clientY - term.offsetTop;
            };
            handle.onmousedown = (e) => {
                e.preventDefault(); isResizing = true;
                resIniX = e.clientX; resIniY = e.clientY;
                resIniW = term.offsetWidth; resIniH = term.offsetHeight;
            };
            window.onmousemove = (e) => {
                if (isDragging) {
                    term.style.left = (e.clientX - dragIniX) + "px"; term.style.top = (e.clientY - dragIniY) + "px";
                }
                if (isResizing) {
                    term.style.width = Math.max(340, resIniW + (e.clientX - resIniX)) + "px";
                    term.style.height = Math.max(120, resIniH + (e.clientY - resIniY)) + "px";
                }
            };
            window.onmouseup = () => { isDragging = isResizing = false; };
            
            header.ontouchstart = (e) => {
                isDragging = true; term.style.bottom = "auto";
                dragIniX = e.touches[0].clientX - term.offsetLeft; dragIniY = e.touches[0].clientY - term.offsetTop;
            };
            header.ontouchmove = (e) => {
                if(!isDragging) return;
                term.style.left = (e.touches[0].clientX - dragIniX) + "px"; term.style.top = (e.touches[0].clientY - dragIniY) + "px";
            };
            header.ontouchend = () => isDragging = false;
        }

        // SORTEADOR EXPANDIDO (DE 1 A 20 PRODUTOS COM 1 A 10 QUANTIDADES)
        function sortearProdutosAleatoriosMega() {
            let disponiveis = produtos.filter(p => p.estoque > 1);
            if (disponiveis.length === 0) return [];
            
            let sorteados = [];
            // Sorteia de 1 a 20 produtos diferentes baseados no tamanho real do cardápio
            let limiteDiferentes = Math.min(disponiveis.length, Math.floor(Math.random() * 20) + 1);
            
            // Embaralha para pegar itens aleatórios
            let embaralhado = [...disponiveis].sort(() => 0.5 - Math.random());
            
            for(let i=0; i<limiteDiferentes; i++) {
                let p = embaralhado[i];
                // Sorteia de 1 a 10 quantidades para o mesmo item (travando no estoque)
                let qtdDesejada = Math.floor(Math.random() * 10) + 1;
                let qtdFinal = Math.min(qtdDesejada, p.estoque);
                
                if (qtdFinal > 0) {
                    sorteados.push({ produto: p, quantidade: qtdFinal });
                }
            }
            return sorteados;
        }

                    logTerminal("Desconectando rede para reter transações em lote local.", "rose");
                    internetFicticiaStatus = false;

                    for(let k = 1; k <= 3; k++) {
                        let itemBatch = cestaMega[k % cestaMega.length].produto;
                        logTerminal(`[Lote Local] Registrando pedido #${k} contendo ${itemBatch.nome}`, "white");
                        carrinho[itemBatch.id] = 1; totalAtual = itemBatch.preco;
                        let idBatch = `STRESS-PDV-${k}-${Date.now().toString().slice(-4)}`;
                        salvarNoCacheContingencia(idBatch, "DINHEIRO", "CAIXA", extrairItensParaEnvio());
                        await delay(1500);
                    }
                    
                    logTerminal("Restaurando conexão! Canal liberado.", "green");
                    internetFicticiaStatus = true;
                    logTerminal("Monitore o console. O loop de background enviará o lote.", "orange");
                    break;
            }
            logTerminal(`Fluxo do Cenário ${c} finalizado com sucesso estrutural.`, "green");
        }
    </script>
</body>
