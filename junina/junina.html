<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-sistema { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body class="bg-slate-50 font-sistema min-h-screen flex flex-col antialiased text-slate-800">

    <header class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-orange-500 uppercase tracking-wider">Produtos A - Z</h2></div>
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div>
        </section>

        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full">
            <div id="card-checkout" class="bg-white w-full max-w-lg lg:max-w-none rounded-md shadow-2xl lg:shadow-md border border-slate-300 p-5 flex flex-col justify-between h-[85vh] lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <h3 id="titulo-checkout" class="text-base font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2 transition-colors duration-200">PAGAMENTO</h3>
                    <div class="flex-1 flex flex-col min-h-0">
                        <div class="flex justify-between items-center mb-1.5 w-full px-0.5">
                            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resumo:</h4>
                            <span id="id-pedido-cabecalho" class="text-xs font-medium text-slate-400 tracking-wide ml-auto"></span>
                        </div>
                        <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1">
                            <p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>
                        </div>
                    </div>

                    <div id="bloco-inferior-pagamento" class="space-y-4 pt-1 border-t transition-opacity duration-200 opacity-40 pointer-events-none">
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-slate-400 block uppercase tracking-wider text-center">Forma de Pagamento:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" disabled class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 transition-all">DINHEIRO</button>
                                <button onclick="selecionarPagamento('PIX')" id="btn-pix" disabled class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 transition-all">PIX</button>
                            </div>
                        </div>

                        <div class="w-full overflow-hidden border-t border-dashed pt-3 h-[130px] pb-1 relative">
                            <div id="carrossel-pagamento" class="w-[200%] h-full flex transition-transform duration-300 transform translate-x-0">
                                <div id="secao-valores-dinheiro" class="w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200">
                                    <div class="flex justify-between items-center text-base"><span class="text-slate-500 font-medium">Pedido</span><span id="valor-pedido-txt" class="font-bold text-slate-700">R$ 0,00</span></div>
                                    <div class="flex justify-between items-center text-base"><span class="text-slate-500 font-medium">Recebido</span><div class="relative w-36"><span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">R$</span><input type="text" id="input-recebido" placeholder="0,00" disabled oninput="tratarMascaraDinheiro(this)" class="w-full pl-7 pr-2.5 py-0.5 border border-slate-300 rounded-md text-right font-bold text-slate-800 focus:outline-none focus:border-orange-500 text-base disabled:bg-slate-50"></div></div>
                                    <div class="flex justify-between items-center text-base border-t border-slate-100 pt-1.5"><span class="text-slate-500 font-medium">Troco</span><span id="valor-troco-txt" class="font-bold text-orange-500">R$ 0,00</span></div>
                                </div>
                                <div id="secao-valores-pix" class="w-1/2 h-full flex items-center justify-center">
                                    <div id="box-qrcode" onclick="requisitarQrCodeReal()" class="w-28 h-28 bg-slate-100 border border-slate-300 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 active:scale-95 transition-none select-none text-center p-2 opacity-40 pointer-events-none">
                                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider leading-tight">Gerar<br>QR Code</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-1.5 mt-2 pt-2 border-t w-full">
                    <button onclick="processarCliqueFinalizar()" id="btn-finalizar" disabled class="w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed transition-all">Finalizar</button>
                    <button onclick="fecharOverlay()" class="lg:hidden text-xs text-slate-400 hover:text-slate-600 underline font-medium py-1">Voltar ao pedido</button>
                </div>
            </div>
        </section>
    </main>

    <div id="container-botao-flutuante" class="fixed bottom-4 left-0 right-0 px-4 z-40 flex justify-center pointer-events-none">
        <div id="caixa-flutuante-base" onclick="abrirOverlayCelular()" class="pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-center min-w-[240px] max-w-xs w-full cursor-pointer select-none text-sm">
            <div id="conteudo-flutuante-unico" class="text-sm tracking-wide text-center">Pedido R$ 0,00 - Revisar e Pagar</div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ CONFIGURAÇÕES DO SISTEMA
        // ==========================================
        const URL_LEITURA = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/161fb6d3f71245f187e74df0ae0616b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dxOAva-wcRMsB3WRw8zfGu6XMtuQsOZGgRGdQ5Waxh4";
        const URL_MÃE = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/06f981a846ca45bc8bfe51c97c480d96/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=n-3ys5toEStLZNzQS6q0bETlCP8-NuAjwWn-fAOqjOs";
        const TOKEN_MERCADO_PAGO = "APP_USR-8730603782812226-051221-bb8bc8394547cbf915d3587537067a9f-2391822607";
        const TEMPO_CHECK_PIX = 12000, LIMITE_EXPIRACAO_PIX = 600000;

        const CLASSE_ATIVO_PAG = "border-orange-500 bg-orange-50 text-orange-600 font-bold shadow-sm";
        const CLASSE_INATIVO_PAG = "border-slate-300 bg-white text-slate-700 font-semibold";
        const CSS_FINALIZAR_HABILITADO = "w-full bg-orange-500 hover:bg-orange-600 text-white font-normal py-3.5 rounded-md text-center text-base shadow cursor-pointer transition-all transform active:scale-95";
        const CSS_FINALIZAR_DESABILITADO = "w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed";
        const CSS_BASE_FLUTUANTE = "pointer-events-auto text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-between min-w-[240px] max-w-xs w-full text-sm";
        const CSS_BTN_MAIS_MENOS = "w-8 h-8 rounded-md font-black text-base shadow-sm transition-all flex items-center justify-center focus:outline-none";

        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, pixChaveIdentificadora = "", stringQrCodeBase64Salva = "", modoBuscaAtivo = false, modoResgateManual = false, cachePedidoOnlineOriginal = [], intervaloPix = null, loopEmExecucao = false, timestampCriacaoPix = 0;

        const formatarMoeda = (v) => v.toFixed(2).replace('.', ',');

        // Otimização: Renderiza o cache da tela primeiro para carregar instantaneamente
        window.addEventListener('DOMContentLoaded', () => {
            const cache = localStorage.getItem("festa_junina_cardapio");
            if (cache) { produtos = JSON.parse(cache); renderizarProdutos(); }
            carregarEstoqueReal();
        });

        async function carregarEstoqueReal(idParaBuscar = "") {
            try {
                const r = await fetch(URL_LEITURA, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(idParaBuscar).trim() }) });
                const combo = await r.json();
                if (combo && combo.estoque) {
                    produtos = combo.estoque.map(l => ({ id: parseInt(l.ID), sigla: l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : "??", nome: l.PRODUTO, preco: parseFloat(l.PRECO), estoque: parseInt(l.ATUAL) }));
                    localStorage.setItem("festa_junina_cardapio", JSON.stringify(produtos)); renderizarProdutos();
                }
                if (idParaBuscar !== "" && combo && combo.pedido) processarResultadoBuscaPedido(combo.pedido, idParaBuscar);
            } catch (e) { console.error(e); if (idParaBuscar !== "") forçarFechamentoSistemico(); }
        }

        function gerenciarCliqueCard(id, estoqueEsgotado) {
            if (estoqueEsgotado || modoBuscaAtivo || modoResgateManual) return;
            if ((carrinho[id] || 0) === 0) alterarQuantidade(id, 1);
        }

        function ligarModoOnline(e) { if(e) { e.preventDefault(); e.stopPropagation(); } activarModoBuscaPre(); }
        // Otimização: Passando false para o reset ficar instantâneo sem forçar HTTP
        function desligarModoOnline(e) { if(e) { e.preventDefault(); e.stopPropagation(); } if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } pixChaveIdentificadora = ""; document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full"; document.getElementById("painel-fechamento").classList.add("hidden"); resetSistemicoTotal(false); }

        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos"); grid.innerHTML = "";
            produtos.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(p => {
                const qtd = carrinho[p.id] || 0; let esg = p.estoque === 0;
                
                let cEstilo = "bg-white border-slate-300 hover:border-slate-400 text-slate-700 cursor-pointer"; 
                let boxEstilo = "bg-slate-100 text-slate-600 border border-transparent"; 
                let precoColor = "text-orange-600", statusColor = esg || p.estoque <= 5 ? 'text-rose-500' : 'text-emerald-600';
                let btnEstilo = "bg-black/5 hover:bg-black/10 text-slate-800";
                
                if (esg) cEstilo = "bg-slate-100 text-slate-400 select-none pointer-events-none opacity-60";
                
                if (qtd > 0 && !esg) {
                    cEstilo = "bg-orange-500 border-orange-500 text-white cursor-pointer";
                    boxEstilo = "bg-orange-500 border border-white text-white";
                    precoColor = statusColor = "text-white";
                    btnEstilo = "bg-white text-orange-500 hover:bg-white/90";
                }
                
                if (modoBuscaAtivo || modoResgateManual) { cEstilo = "bg-slate-50 border-slate-300 text-slate-300 select-none pointer-events-none opacity-40"; }

                grid.innerHTML += `
                    <div onclick="gerenciarCliqueCard(${p.id}, ${esg})" class="border rounded-md p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 ${cEstilo}">
                        <div class="w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 ${boxEstilo}">
                            <div class="text-center font-bold text-xl mt-2 flex items-center justify-center flex-1 select-none">${p.sigla}</div>
                            <div class="flex items-center justify-between w-full mt-auto" onclick="event.stopPropagation()">
                                <button type="button" onclick="alterarQuantidade(${p.id}, -1)" class="${CSS_BTN_MAIS_MENOS} ${btnEstilo} ${qtd === 0 ? 'opacity-20 pointer-events-none' : ''}">-</button>
                                <span class="text-xs font-bold text-center flex-1 select-none">${qtd > 0 ? `<span class="text-white text-base font-semibold">${qtd}</span>` : '-'}</span>
                                <button type="button" onclick="alterarQuantidade(${p.id}, 1)" class="${CSS_BTN_MAIS_MENOS} ${btnEstilo} ${esg ? 'opacity-20 pointer-events-none' : ''}">+</button>
                            </div>
                        </div>
                        <div class="min-w-0 flex flex-col justify-between flex-1 select-none">
                            <h3 class="font-semibold text-[14px] truncate leading-tight mb-0.5">${p.nome}</h3>
                            <div class="flex items-center justify-between text-[13px] font-medium w-full">
                                <span class="${precoColor} font-bold">R$ ${formatarMoeda(p.preco)}</span>
                                <div class="font-semibold">E: <span class="${statusColor}">${p.estoque}</span></div>
                            </div>
                        </div>
                    </div>`;
            });
            
            let preActive = modoBuscaAtivo || modoResgateManual;
            grid.innerHTML += `
                <div class="border rounded-md p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 bg-white border-slate-300">
                    <div class="w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 ${preActive ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'}">
                        <div class="text-center font-bold text-xl mt-2 flex items-center justify-center flex-1 select-none">ON</div>
                        <div class="flex items-center justify-between w-full mt-auto">
                            <button type="button" onclick="desligarModoOnline(event)" class="${CSS_BTN_MAIS_MENOS} bg-black/5 hover:bg-black/20 text-current ${!preActive ? 'opacity-20 pointer-events-none' : ''}">-</button>
                            <span class="text-[13px] font-semibold text-center flex-1 select-none">${preActive ? 'ativo' : '-'}</span>
                            <button type="button" onclick="ligarModoOnline(event)" class="${CSS_BTN_MAIS_MENOS} bg-black/5 hover:bg-black/20 text-current ${preActive ? 'opacity-20 pointer-events-none' : ''}">+</button>
                        </div>
                    </div>
                    <div class="min-w-0 flex flex-col justify-between flex-1 select-none"><h3 class="font-semibold text-slate-700 text-[14px] truncate leading-tight mb-0.5">Online</h3><div class="text-[13px] font-semibold text-orange-600">R$ 0,00</div></div>
                </div>`;
        }

        function alterarQuantidade(id, d) {
            const nQtd = (carrinho[id] || 0) + d;
            if (nQtd <= 0) delete carrinho[id]; else carrinho[id] = nQtd;
            renderizarProdutos(); atualizarCarrinhoDOM();
        }

        function atualizarCarrinhoDOM() {
            if (modoResgateManual) return;
            const lista = document.getElementById("lista-carrinho"); totalAtual = 0; let tItens = 0; lista.innerHTML = "";
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id); const qtd = carrinho[id]; const sub = p.preco * qtd; totalAtual += sub; tItens += qtd;
                lista.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-[6px] rounded-md border border-slate-100"><div class="max-w-[75%] min-w-0"><p class="font-semibold text-slate-700 truncate text-[14px]">${p.nome}</p><p class="text-[12px] text-slate-400 mt-0.5">${qtd}x R$ ${formatarMoeda(p.preco)}</p></div><span class="font-semibold text-slate-700 text-[16px] flex-shrink-0 pl-2">R$ ${formatarMoeda(sub)}</span></div>`;
            });
            
            const blocoPagamento = document.getElementById("bloco-inferior-pagamento"), btnDinheiro = document.getElementById("btn-dinheiro"), btnPix = document.getElementById("btn-pix"), boxQrCode = document.getElementById("box-qrcode");

            if (tItens === 0) {
                lista.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>`;
                blocoPagamento.classList.add("opacity-40", "pointer-events-none");
                btnDinheiro.disabled = btnPix.disabled = true;
                boxQrCode.classList.add("opacity-40", "pointer-events-none");
                resetarEstadoPagamento();
            } else {
                blocoPagamento.classList.remove("opacity-40", "pointer-events-none");
                btnDinheiro.disabled = btnPix.disabled = false;
                if (!formaPagamento || formaPagamento !== 'PIX') boxQrCode.classList.remove("opacity-40", "pointer-events-none");
            }
            if (!modoBuscaAtivo) document.getElementById("conteudo-flutuante-unico").innerText = `Pedido R$ ${formatarMoeda(totalAtual)} - Revisar e Pagar`;
            document.getElementById("valor-pedido-txt").innerText = `R$ ${formatarMoeda(totalAtual)}`; validarEstadoFinalizar();
        }

        const processarCliqueFinalizar = () => {
            if (modoResgateManual) return executingBaixaPedidoEntregue();
            return formaPagamento === 'DINHEIRO' ? executarGravacaoDinheiroDirecto() : executarCliqueContingenciaManualPix();
        };

        function selecionarPagamento(tipo) {
            formaPagamento = tipo; const btnPix = document.getElementById("btn-pix"), btnDin = document.getElementById("btn-dinheiro"), secaoDin = document.getElementById("secao-valores-dinheiro"), carr = document.getElementById("carrossel-pagamento"), inp = document.getElementById("input-recebido");
            btnDin.className = `py-2.5 rounded-md text-sm text-center transition-all ${tipo === 'DINHEIRO' ? CLASSE_ATIVO_PAG : CLASSE_INATIVO_PAG}`;
            btnPix.className = `py-2.5 rounded-md text-sm text-center transition-all ${tipo === 'PIX' ? CLASSE_ATIVO_PAG : CLASSE_INATIVO_PAG}`;

            if (tipo === 'DINHEIRO') { 
                if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
                carr.className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0"; secaoDin.className = "w-1/2 h-full space-y-3.5 opacity-100 pointer-events-auto transition-all duration-200"; inp.disabled = false; inp.value = ""; inp.focus(); 
            } else { carr.className = "w-[200%] h-full flex transition-transform duration-300 transform -translate-x-1/2"; secaoDin.className = "w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200"; inp.disabled = true; }
            validarEstadoFinalizar();
        }

        function validarEstadoFinalizar() {
            if (modoResgateManual) return;
            const btn = document.getElementById("btn-finalizar"), rec = parseFloat(document.getElementById("input-recebido").value.replace(/\D/g, "")) / 100 || 0;
            btn.disabled = formaPagamento === 'PIX' ? !(btn.getAttribute("data-trava-tempo") !== "true" && pixChaveIdentificadora !== "" && !pixChaveIdentificadora.startsWith("mp_")) : !(Object.keys(carrinho).length > 0 && formaPagamento === 'DINHEIRO' && rec >= totalAtual);
            btn.className = btn.disabled ? CSS_FINALIZAR_DESABILITADO : CSS_FINALIZAR_HABILITADO;
        }

        const gerarPayloadVenda = (idF, forma) => JSON.stringify({ 
            id_pagamento: String(idF).trim(), pagamento: forma, tipo_venda: "CAIXA", status_retirada: "retirado", total_pedido_consolidado: parseFloat(totalAtual), transaction_amount: parseFloat(totalAtual), 
            itens: Object.keys(carrinho).map(id => { const p = produtos.find(i => i.id == id); return { sigla: p.sigla, produto: p.nome, grandmother_id: p.id, quantidade: parseInt(carrinho[id]), preco: parseFloat(p.preco), total: parseFloat(p.preco * carrinho[id]) }; }) 
        });

        function tratarMascaraDinheiro(inp) {
            let val = inp.value.replace(/\D/g, ""); if (val === "") return;
            let num = parseFloat(val) / 100; inp.value = num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const txtT = document.getElementById("valor-troco-txt");
            if (num < totalAtual) { txtT.innerText = "Dinheiro Insuficiente"; txtT.className = "font-bold text-rose-500 text-xs"; } 
            else { txtT.innerText = `R$ ${formatarMoeda(num - totalAtual)}`; txtT.className = "font-bold text-orange-500 text-base"; }
            validarEstadoFinalizar();
        }

        async function executarGravacaoDinheiroDirecto() {
            const btn = document.getElementById("btn-finalizar"); btn.innerText = "Processando..."; btn.disabled = true;
            try {
                await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(`DINHEIRO-${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}`, "DINHEIRO") });
                alert("Venda Finalizada!"); forçarFechamentoSistemico();
            } catch (e) { alert("Erro"); btn.innerText = "Finalizar"; btn.disabled = false; btn.className = CSS_FINALIZAR_HABILITADO; }
        }

        async function requisitarQrCodeReal() {
            if (Object.keys(carrinho).length === 0 || !formaPagamento || formaPagamento !== 'PIX') return;
            const box = document.getElementById("box-qrcode"); box.className = "w-28 h-28 bg-white border border-slate-300 text-[10px] font-bold text-slate-400 uppercase text-center flex flex-col items-center justify-center p-2 pointer-events-none"; box.innerHTML = `<span>Carregando...</span>`; 
            pixChaveIdentificadora = "mp_" + Date.now(); timestampCriacaoPix = Date.now();
            const btn = document.getElementById("btn-finalizar"); btn.disabled = true; btn.className = CSS_FINALIZAR_DESABILITADO; btn.setAttribute("data-trava-tempo", "true");
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(pixChaveIdentificadora, 'PIX') }); const d = await r.json();
                if (d.id_mercado_pago) { 
                    pixChaveIdentificadora = String(d.id_mercado_pago).trim(); stringQrCodeBase64Salva = d.qrcode_imagem;
                    box.className = "w-28 h-28 bg-white flex items-center justify-center p-0 pointer-events-none border border-slate-300"; box.innerHTML = `<img src="data:image/jpeg;base64,${stringQrCodeBase64Salva}" class="w-full h-full object-contain">`; 
                    setTimeout(() => { btn.removeAttribute("data-trava-tempo"); if (formaPagamento === 'PIX' && pixChaveIdentificadora !== "" && !pixChaveIdentificadora.startsWith("mp_") && !box.className.includes("bg-emerald-700")) { btn.disabled = false; btn.className = CSS_FINALIZAR_HABILITADO; } }, 12000);
                    iniciarMonitoramentoPixAutomatico();
                } else throw new Error();
            } catch (e) { alert("Falha ao gerar QR Code."); resetarEstadoPagamento(); }
        }

        function aplicarLayoutSucessoPix() {
            const box = document.getElementById("box-qrcode"); box.className = "w-28 h-28 bg-white border border-slate-300 flex items-center justify-center p-1 pointer-events-none";
            box.innerHTML = `<div class="w-full h-full bg-emerald-700 text-white font-medium text-[11px] text-center flex items-center justify-center tracking-wider uppercase">Pagamento<br>Confirmado</div>`;
            const btn = document.getElementById("btn-finalizar"); btn.disabled = true; btn.className = CSS_FINALIZAR_DESABILITADO;
        }

        function aplicarLayoutFalhaPix() {
            const box = document.getElementById("box-qrcode"); box.className = "w-28 h-28 bg-white border border-slate-300 flex items-center justify-center p-1 pointer-events-none animate-shake";
            box.innerHTML = `<div class="w-full h-full bg-rose-700 text-white font-medium text-[11px] text-center flex items-center justify-center tracking-wider uppercase">Pagamento<br>Pendente</div>`;
            setTimeout(() => { if (formaPagamento === 'PIX' && pixChaveIdentificadora && !pixChaveIdentificadora.startsWith("mp_") && stringQrCodeBase64Salva !== "") { if (box.innerHTML.includes("Pendente")) { box.className = "w-28 h-28 bg-white flex items-center justify-center p-0 pointer-events-none border border-slate-300"; box.innerHTML = `<img src="data:image/jpeg;base64,${stringQrCodeBase64Salva}" class="w-full h-full object-contain">`; } } }, 3000);
        }

        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix);
            loopEmExecucao = false;
            intervaloPix = setInterval(async () => {
                if (loopEmExecucao || !pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) return;
                if (Date.now() - timestampCriacaoPix > LIMITE_EXPIRACAO_PIX) { clearInterval(intervaloPix); intervaloPix = null; alert("Tempo limite esgotado"); forçarFechamentoSistemico(); return; }
                loopEmExecucao = true; const pago = await consultarStatusMercadoPagoDireto();
                if (pago) { clearInterval(intervaloPix); intervaloPix = null; aplicarLayoutSucessoPix(); await executarGravacaoPixAprovadoNasNuvens(); }
                loopEmExecucao = false;
            }, TEMPO_CHECK_PIX);
        }

        async function consultarStatusMercadoPagoDireto() {
            if (!pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) return false;
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(pixChaveIdentificadora).trim(), pagamento: "PIX", tipo_venda: "CAIXA", total_pedido_consolidado: parseFloat(totalAtual) }) });
                return r.ok && (await r.json()).pago === true;
            } catch (erro) { return false; }
        }

        async function executarGravacaoPixAprovadoNasNuvens() {
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(pixChaveIdentificadora, 'PIX') }); 
                if ((await r.json()).pago === true) { alert("Venda Finalizada!"); forçarFechamentoSistemico(); } else { alert("Erro no registro do Excel."); }
            } catch (e) { alert("Erro"); }
        }

        async function executarCliqueContingenciaManualPix() {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } 
            const btn = document.getElementById("btn-finalizar"); btn.innerText = "Processando..."; btn.disabled = true;
            const pago = await consultarStatusMercadoPagoDireto();
            if (pago) { btn.innerText = "Finalizar"; aplicarLayoutSucessoPix(); await executarGravacaoPixAprovadoNasNuvens(); } 
            else { alert("Pagamento Pendente"); btn.innerText = "Finalizar"; btn.disabled = false; btn.className = CSS_FINALIZAR_HABILITADO; aplicarLayoutFalhaPix(); iniciarMonitoramentoPixAutomatico(); }
        }

        function abrirOverlayCelular() { if (window.innerWidth >= 1024 && !modoResgateManual) return; document.getElementById("painel-fechamento").className = "fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm"; if (!modoResgateManual) resetarEstadoPagamento(); }
        function fecharOverlay() { if (modoResgateManual) forçarFechamentoSistemico(); else { document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full"; resetarEstadoPagamento(); } }

        function forçarFechamentoSistemico(e) {
            if(e) { e.stopPropagation(); e.preventDefault(); }
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } 
            pixChaveIdentificadora = ""; document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full";
            document.getElementById("painel-fechamento").classList.add("hidden"); resetSistemicoTotal(true);
        }

        function resetSistemicoTotal(forçarAtualizacaoHttp = true) {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            modoResgateManual = modoBuscaAtivo = false; carrinho = {}; totalAtual = 0; formaPagamento = null; pixChaveIdentificadora = ""; stringQrCodeBase64Salva = ""; cachePedidoOnlineOriginal = [];
            document.getElementById("id-pedido-cabecalho").innerText = ""; document.getElementById("bloco-inferior-pagamento").className = "space-y-4 pt-1 border-t";
            const bf = document.getElementById("caixa-flutuante-base"); bf.onclick = abrirOverlayCelular;
            bf.className = "pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-center min-w-[240px] max-w-xs w-full cursor-pointer select-none text-sm";
            bf.innerHTML = `<div id="conteudo-flutuante-unico" class="text-sm tracking-wide text-center">Pedido R$ 0,00 - Revisar e Pagar</div>`;
            resetarEstadoPagamento(); atualizarCarrinhoDOM(); document.getElementById("painel-fechamento").classList.add("hidden"); 
            if (forçarAtualizacaoHttp) carregarEstoqueReal(); else renderizarProdutos();
        }

        function resetarEstadoPagamento() {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            formaPagamento = null; pixChaveIdentificadora = ""; stringQrCodeBase64Salva = "";
            const btn = document.getElementById("btn-finalizar"); btn.removeAttribute("data-trava-tempo"); btn.innerText = "Finalizar"; btn.disabled = true; btn.className = CSS_FINALIZAR_DESABILITADO;
            document.getElementById("btn-pix").className = document.getElementById("btn-dinheiro").className = `py-2.5 rounded-md text-sm text-center transition-all ${CLASSE_INATIVO_PAG}`;
            document.getElementById("carrossel-pagamento").className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0";
            document.getElementById("secao-valores-dinheiro").className = "w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200";
            document.getElementById("input-recebido").disabled = true; document.getElementById("input-recebido").value = ""; document.getElementById("valor-troco-txt").innerText = "R$ 0,00";
            const box = document.getElementById("box-qrcode"); box.className = "w-28 h-28 bg-slate-100 border border-slate-300 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 active:scale-95 transition-none select-none text-center p-2";
            box.innerHTML = `<span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider leading-tight">Gerar<br>QR Code</span>`;
            validarEstadoFinalizar();
        }

        function activarModoBuscaPre() {
            modoBuscaAtivo = true; carrinho = {}; atualizarCarrinhoDOM(); renderizarProdutos();
            const bf = document.getElementById("caixa-flutuante-base"); bf.onclick = null;
            bf.className = "bg-slate-800 " + CSS_BASE_FLUTUANTE + " cursor-default";
            bf.innerHTML = `
                <div class="text-left font-medium text-sm select-none whitespace-nowrap">ID do Pagamento:</div>
                <input type="text" id="input-id-busca" placeholder="000000000000" class="bg-transparent text-white font-medium text-sm focus:outline-none flex-1 h-full px-2 text-center placeholder-white/30 min-w-0" maxlength="12" oninput="tratarDigitacaoIdBusca(this)">
                <div onclick="desligarModoOnline(event)" class="text-sm font-medium text-white/60 hover:text-white cursor-pointer select-none whitespace-nowrap transition-colors text-right">Sair</div>`;
            setTimeout(() => { const ib = document.getElementById("input-id-busca"); if(ib) ib.focus(); }, 100);
        }

        function tratarDigitacaoIdBusca(input) { input.value = input.value.replace(/\D/g, ""); if (input.value.length === 12) { input.disabled = true; carregarEstoqueReal(input.value); } }

        function processarResultadoBuscaPedido(linhasExcel, idDigitado) {
            const bf = document.getElementById("caixa-flutuante-base"), lines = linhasExcel.filter(l => String(l.ID_PAGAMENTO).trim() === String(idDigitado).trim());
            if (lines.length === 0) { bf.className = "pointer-events-auto bg-rose-600 text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-center min-w-[240px] max-w-xs w-full animate-shake text-sm"; bf.innerHTML = `<span>Não encontrado</span>`; setTimeout(() => { forçarFechamentoSistemico(); }, 2000); return; }
            modoResgateManual = true; modoBuscaAtivo = false; pixChaveIdentificadora = String(idDigitado).trim(); cachePedidoOnlineOriginal = [...lines]; renderizarProdutos();
            document.getElementById("titulo-checkout").innerText = "Resumo do Pedido"; document.getElementById("bloco-inferior-pagamento").className = "hidden pointer-events-none"; document.getElementById("id-pedido-cabecalho").innerText = `ID: ${idDigitado}`;
            const btnFinalizar = document.getElementById("btn-finalizar"); btnFinalizar.disabled = false; btnFinalizar.innerText = "Finalizar"; btnFinalizar.className = CSS_FINALIZAR_HABILITADO;
            const lista = document.getElementById("lista-carrinho"); lista.innerHTML = ""; let valorConsolidated = 0;

            lines.forEach(linha => {
                const totalLinha = parseFloat(linha.TOTAL) || 0; valorConsolidated += totalLinha; 
                let entregue = (linha.RETIRADA ? String(linha.RETIRADA).trim().toLowerCase() : "pendente") === "retirado";
                if (entregue) { btnFinalizar.disabled = true; btnFinalizar.innerText = "Pedido Já Entregue Anteriormente"; btnFinalizar.className = "w-full bg-slate-300 text-slate-500 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed"; }
                lista.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-[6px] rounded-md border border-slate-200 shadow-sm font-sistema">
                        <div class="max-w-[70%] min-w-0"><p class="font-semibold text-slate-700 truncate text-[14px]">${linha.PRODUTO}</p><p class="text-[12px] text-slate-400 mt-0.5">${parseInt(linha.QUANTIDADE) || 1}x R$ ${formatarMoeda(parseFloat(linha.PRECO) || 0)}</p></div>
                        <div class="text-right flex-shrink-0 pl-2"><p class="font-semibold text-slate-700 text-[16px]">R$ ${formatarMoeda(totalLinha)}</p>${entregue ? '<span class="text-rose-500 font-bold text-[12px] block mt-0.5">[ENTREGUE]</span>' : '<span class="text-amber-600 font-bold text-[12px] block mt-0.5">[PENDENTE]</span>'}</div>
                    </div>`;
            });
            document.getElementById("valor-pedido-txt").innerText = `R$ ${formatarMoeda(valorConsolidated)}`;
            if (window.innerWidth >= 1024) { bf.className = "bg-slate-800 " + CSS_BASE_FLUTUANTE + " cursor-default"; bf.innerHTML = `<div class="text-left font-medium text-sm select-none whitespace-nowrap">ID do Pagamento:</div><div class="font-medium text-sm select-none truncate px-2 text-center flex-1">${idDigitado}</div><div onclick="desligarModoOnline(event)" class="text-sm font-medium text-white/60 hover:text-white cursor-pointer select-none whitespace-nowrap transition-colors text-right">Sair</div>`; } else { abrirOverlayCelular(); }
        }

        async function executingBaixaPedidoEntregue() {
            const btn = document.getElementById("btn-finalizar"); btn.innerText = "Processando..."; btn.disabled = true;
            try {
                const valorConsolidado = parseFloat(document.getElementById("valor-pedido-txt").innerText.replace("R$", "").replace(".", "").replace(",", ".").trim()) || 0;
                const resposta = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(pixChaveIdentificadora).trim(), pagamento: "PIX", tipo_venda: "ONLINE", status_retirada: "retirado", total_pedido_consolidado: valorConsolidado, transaction_amount: valorConsolidado, itens: cachePedidoOnlineOriginal.map(l => ({ "ID_PAGAMENTO": String(pixChaveIdentificadora).trim(), "SIGLA": l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : "PRE", "PRODUTO": String(l.PRODUTO).trim(), "QUANTIDADE": String(l.QUANTIDADE).trim(), "PRECO": String(l.PRECO).trim(), "TOTAL": String(l.TOTAL).trim() })) }) });
                if (!resposta.ok) throw new Error();
                alert("Pedido Entregue"); forçarFechamentoSistemico();
            } catch (e) { alert("Erro"); btn.innerText = "Finalizar"; btn.disabled = false; btn.className = CSS_FINALIZAR_HABILITADO; }
        }
    </script>
</body>
</html>
