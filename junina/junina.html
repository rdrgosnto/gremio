<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Transição suave ao mudar de layout */
        .transicao-layout { transition: all 0.3s ease; }
    </style>
</head>
<body id="corpo-pagina" class="bg-amber-50 text-gray-800 font-sans min-h-screen flex flex-col transicao-layout">

    <!-- Cabeçalho com Seletor de Layout integrado -->
    <header id="cabecalho" class="bg-orange-600 text-white py-4 px-6 shadow-md border-b-4 border-yellow-400 flex flex-col sm:flex-row justify-between items-center gap-4 transicao-layout">
        <div class="text-center sm:text-left">
            <h1 class="text-2xl font-bold tracking-wide">Arraiá do Grêmio - Sistema de Caixa</h1>
            <p class="text-xs opacity-90 mt-0.5">Controle de Vendas e Auditoria de Estoque</p>
        </div>
        
        <!-- Botão Seletor de Layout -->
        <div class="flex items-center gap-2 bg-orange-700/50 p-1.5 rounded-xl border border-orange-400/30">
            <span class="text-xs font-semibold px-2 uppercase tracking-wider opacity-90">Visual:</span>
            <button onclick="mudarLayout('grade')" id="seletor-grade" class="bg-white text-orange-700 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition-all">
                Grade
            </button>
            <button onclick="mudarLayout('lista')" id="seletor-lista" class="text-white hover:bg-orange-500/40 text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
                Lista
            </button>
            <button onclick="mudarLayout('escuro')" id="seletor-escuro" class="text-white hover:bg-orange-500/40 text-xs font-bold px-3 py-1.5 rounded-lg transition-all">
                Contraste
            </button>
        </div>
    </header>

    <!-- Corpo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Lado Esquerdo: Área de Produtos -->
        <section class="lg:col-span-2 space-y-4">
            <h2 id="titulo-menu" class="text-xl font-bold text-amber-900 border-b-2 border-orange-200 pb-2 transicao-layout">Menu de Produtos</h2>
            
            <!-- Este container muda de formato dinamicamente via JS -->
            <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Injeção dos produtos -->
            </div>
        </section>

        <!-- Lado Direito: Painel do Carrinho e Fechamento -->
        <section id="painel-carrinho" class="bg-white rounded-2xl shadow-xl border border-amber-100 p-6 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-4 transicao-layout">
            <div>
                <h2 id="titulo-pedido" class="text-xl font-bold text-amber-950 border-b pb-3 mb-4 flex justify-between items-center transicao-layout">
                    <span>Pedido Atual</span>
                    <span id="contador-itens" class="text-xs bg-orange-100 text-orange-700 px-2.5 py-1 rounded-full font-semibold">0 itens</span>
                </h2>

                <!-- Lista de itens no carrinho -->
                <div id="lista-carrinho" class="space-y-3 overflow-y-auto max-h-[35vh] pr-1">
                    <p class="text-gray-400 text-center py-8 text-sm italic">Nenhum produto selecionado...</p>
                </div>
            </div>

            <!-- Resumo, Forma de Pagamento e Botão Enviar -->
            <div class="border-t pt-4 mt-4 space-y-4 border-gray-100">
                <!-- Totalizador -->
                <div class="flex justify-between items-center">
                    <span id="txt-total" class="text-lg font-medium text-amber-950">Valor Total:</span>
                    <span id="valor-total" class="text-3xl font-black text-orange-600">R$ 0,00</span>
                </div>

                <!-- Método de Pagamento -->
                <div class="space-y-2">
                    <label id="txt-pagamento" class="text-sm font-semibold text-gray-600 block">Forma de Pagamento:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50">
                            <span class="text-lg font-bold">PIX</span>
                        </button>
                        <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center border-gray-200 text-gray-700 hover:bg-gray-50">
                            <span class="text-lg font-bold">DINHEIRO</span>
                        </button>
                    </div>
                </div>

                <!-- Botão Concluir -->
                <button onclick="finalizarVenda()" id="btn-finalizar" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl text-center text-lg shadow transition-all cursor-not-allowed">
                    Selecione o Pagamento
                </button>
            </div>
        </section>
    </main>

    <script>
        // Configuração dos itens (Ordenação Alfabética Automática Ativa)
        const produtos = [
            { id: 1, nome: "Cachorro Quente", preco: 12.00, estoque: 50, critico: 5 },
            { id: 2, nome: "Pipoca Doce/Salgada", preco: 6.00, estoque: 4, critico: 5 },
            { id: 3, nome: "Refrigerante (Lata)", preco: 6.00, estoque: 80, critico: 10 },
            { id: 4, nome: "Água Mineral", preco: 4.00, estoque: 30, critico: 5 },
            { id: 5, nome: "Quentão", preco: 10.00, estoque: 30, critico: 5 },
            { id: 6, nome: "Canjica", preco: 8.00, estoque: 25, critico: 5 },
            { id: 7, lineage: "Carne", nome: "Espetinho de Carne", preco: 14.00, estoque: 40, critico: 8 },
            { id: 8, nome: "Milho Cozido", preco: 7.00, estoque: 20, critico: 5 },
            { id: 9, nome: "Bolo de Fubá", preco: 5.00, estoque: 15, critico: 3 },
            { id: 10, nome: "Pastel", preco: 9.00, estoque: 60, critico: 10 }
        ];

        let carrinho = {};
        let formaPagamento = null;
        let layoutAtual = 'grade'; // Modos: 'grade', 'lista', 'escuro'

        // Renderiza a lista obedecendo o layout escolhido e a ordem alfabética
        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos");
            grid.innerHTML = "";

            // Força a ordenação alfabética (A-Z)
            produtos.sort((a, b) => a.nome.localeCompare(b.nome));

            // Ajusta as classes do container com base no layout selecionado
            if (layoutAtual === 'lista') {
                grid.className = "flex flex-col gap-2"; // Formato de linhas empilhadas
            } else {
                grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-4"; // Formato de blocos lado a lado
            }

            produtos.forEach(p => {
                const qtdNoCarrinho = carrinho[p.id] || 0;
                let disabledBtn = p.estoque === 0 ? "disabled" : "";
                
                // Definição de cores de acordo com o estoque e layout
                let statusEstoqueHtml = `<span class="text-xs text-green-600 font-medium">Estoque: ${p.estoque}</span>`;
                let cardBg = layoutAtual === 'escuro' ? "bg-slate-800 border-slate-700 text-white" : "bg-white border-amber-100";
                let btnActionBg = layoutAtual === 'escuro' ? "bg-slate-700 text-white" : "bg-gray-100 text-gray-600";

                if (p.estoque === 0) {
                    statusEstoqueHtml = `<span class="text-xs text-red-500 font-bold bg-red-500/10 px-2 py-0.5 rounded">ESGOTADO</span>`;
                    cardBg = layoutAtual === 'escuro' ? "bg-slate-900 border-slate-800 opacity-40 text-gray-500" : "bg-gray-100 border-gray-200 opacity-60";
                } else if (p.estoque <= p.critico) {
                    statusEstoqueHtml = `<span class="text-xs text-amber-500 font-bold bg-amber-500/10 px-2 py-0.5 rounded">CRÍTICO: ${p.estoque}</span>`;
                    if (layoutAtual !== 'escuro') cardBg = "bg-amber-50/60 border-amber-200";
                }

                // Injeta HTML Diferenciado se for Modo Lista Compacta vs Modo Grade/Escuro
                if (layoutAtual === 'lista') {
                    grid.innerHTML += `
                        <div class="border rounded-xl p-3 shadow-sm flex items-center justify-between gap-4 transition-all ${cardBg}">
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-base truncate">${p.nome}</h3>
                                <div class="flex items-center gap-3 mt-0.5">
                                    <span class="text-orange-500 font-extrabold text-sm">R$ ${p.preco.toFixed(2)}</span>
                                    ${statusEstoqueHtml}
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-sm font-bold">Qtd: ${qtdNoCarrinho}</span>
                                <div class="flex items-center gap-1 ${btnActionBg} rounded-lg p-0.5">
                                    <button onclick="alterarQuantidade(${p.id}, -1)" class="w-8 h-8 rounded bg-white text-gray-800 font-bold shadow-sm flex items-center justify-center hover:bg-orange-50">-</button>
                                    <button onclick="alterarQuantidade(${p.id}, 1)" ${disabledBtn} class="w-8 h-8 rounded bg-white text-gray-800 font-bold shadow-sm flex items-center justify-center hover:bg-orange-50 ${p.estoque === 0 ? 'opacity-30 cursor-not-allowed':''}">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // Layout de Grade Clássico ou Escuro
                    grid.innerHTML += `
                        <div class="border rounded-2xl p-4 shadow-sm flex flex-col justify-between transition-all ${cardBg}">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <h3 class="font-bold text-lg leading-tight">${p.nome}</h3>
                                    <span class="text-orange-500 font-black whitespace-nowrap">R$ ${p.preco.toFixed(2)}</span>
                                </div>
                                <div class="mt-1">${statusEstoqueHtml}</div>
                            </div>
                            <div class="flex items-center justify-between mt-4 border-t pt-3 border-dashed ${layoutAtual === 'escuro'?'border-slate-700':'border-gray-100'}">
                                <span class="text-sm font-medium opacity-70">Qtd: <b class="text-base font-bold">${qtdNoCarrinho}</b></span>
                                <div class="flex items-center gap-1 ${btnActionBg} rounded-xl p-1">
                                    <button onclick="alterarQuantidade(${p.id}, -1)" class="w-10 h-10 rounded-lg bg-white text-gray-800 shadow-sm flex items-center justify-center font-bold hover:bg-orange-50">-</button>
                                    <button onclick="alterarQuantidade(${p.id}, 1)" ${disabledBtn} class="w-10 h-10 rounded-lg bg-white text-gray-800 shadow-sm flex items-center justify-center font-bold hover:bg-orange-50 ${p.estoque === 0 ? 'opacity-30 cursor-not-allowed':''}">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        // Alternador dinâmico de layout e regras visuais do Tailwind
        function mudarLayout(tipo) {
            layoutAtual = tipo;
            
            // Elementos estruturais da página
            const corpo = document.getElementById("corpo-pagina");
            const cabecalho = document.getElementById("cabecalho");
            const carrinhoPainel = document.getElementById("painel-carrinho");
            const tituloMenu = document.getElementById("titulo-menu");
            const tituloPedido = document.getElementById("titulo-pedido");
            const txtTotal = document.getElementById("txt-total");
            const txtPagamento = document.getElementById("txt-pagamento");

            // Reseta destaques dos seletores
            document.getElementById("seletor-grade").className = "text-white hover:bg-orange-500/40 text-xs font-bold px-3 py-1.5 rounded-lg transition-all";
            document.getElementById("seletor-lista").className = "text-white hover:bg-orange-500/40 text-xs font-bold px-3 py-1.5 rounded-lg transition-all";
            document.getElementById("seletor-escuro").className = "text-white hover:bg-orange-500/40 text-xs font-bold px-3 py-1.5 rounded-lg transition-all";

            // Aplica os temas globais de cores
            if (tipo === 'escuro') {
                document.getElementById("seletor-escuro").className = "bg-slate-800 text-emerald-400 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm border border-slate-600 transition-all";
                corpo.className = "bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col transicao-layout";
                cabecalho.className = "bg-slate-950 text-white py-4 px-6 shadow-md border-b-4 border-emerald-500 flex flex-col sm:flex-row justify-between items-center gap-4 transicao-layout";
                carrinhoPainel.className = "bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-4 transicao-layout text-white";
                tituloMenu.className = "text-xl font-bold text-slate-200 border-b-2 border-slate-700 pb-2 transicao-layout";
                tituloPedido.className = "text-xl font-bold text-slate-200 border-b pb-3 mb-4 flex justify-between items-center border-slate-700 transicao-layout";
                txtTotal.className = "text-lg font-medium text-slate-300";
                txtPagamento.className = "text-sm font-semibold text-slate-400 block";
            } else {
                // Modos claros (Grade ou Lista)
                const idSeletor = tipo === 'grade' ? "seletor-grade" : "seletor-lista";
                document.getElementById(idSeletor).className = "bg-white text-orange-700 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition-all";
                
                corpo.className = "bg-amber-50 text-gray-800 font-sans min-h-screen flex flex-col transicao-layout";
                cabecalho.className = "bg-orange-600 text-white py-4 px-6 shadow-md border-b-4 border-yellow-400 flex flex-col sm:flex-row justify-between items-center gap-4 transicao-layout";
                carrinhoPainel.className = "bg-white rounded-2xl shadow-xl border border-amber-100 p-6 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-4 transicao-layout";
                tituloMenu.className = "text-xl font-bold text-amber-900 border-b-2 border-orange-200 pb-2 transicao-layout";
                tituloPedido.className = "text-xl font-bold text-amber-950 border-b pb-3 mb-4 flex justify-between items-center border-gray-100 transicao-layout";
                txtTotal.className = "text-lg font-medium text-amber-950";
                txtPagamento.className = "text-sm font-semibold text-gray-600 block";
            }

            renderizarProdutos();
            atualizarCarrinho();
        }

        // Altera quantidades salvando o limite do estoque
        function alterarQuantidade(id, delta) {
            const produto = produtos.find(p => p.id === id);
            const qtdAtual = carrinho[id] || 0;
            const novaQtd = qtdAtual + delta;

            if (novaQtd < 0) return;
            if (novaQtd > produto.estoque) {
                alert(`Ops! Só temos ${produto.estoque} unidades de ${produto.nome} no estoque.`);
                return;
            }

            if (novaQtd === 0) {
                delete carrinho[id];
            } else {
                carrinho[id] = novaQtd;
            }

            renderizarProdutos();
            atualizarCarrinho();
        }

        // Atualiza o painel lateral do carrinho
        function atualizarCarrinho() {
            const lista = document.getElementById("lista-carrinho");
            const contador = document.getElementById("contador-itens");
            const totalTxt = document.getElementById("valor-total");
            
            let total = 0;
            let totalItens = 0;
            lista.innerHTML = "";

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                const qtd = carrinho[id];
                const subtotal = p.preco * qtd;
                total += subtotal;
                totalItens += qtd;

                let itemBg = layoutAtual === 'escuro' ? "bg-slate-900/50 border-slate-700" : "bg-amber-50/50 border-amber-100/60";

                lista.innerHTML += `
                    <div class="flex justify-between items-center text-sm p-2.5 rounded-xl border ${itemBg}">
                        <div class="max-w-[65%]">
                            <p class="font-semibold">${p.nome}</p>
                            <p class="text-xs opacity-60">${qtd}x R$ ${p.preco.toFixed(2)}</p>
                        </div>
                        <span class="font-bold">R$ ${subtotal.toFixed(2)}</span>
                    </div>
                `;
            });

            if (totalItens === 0) {
                lista.innerHTML = `<p class="text-gray-400 text-center py-8 text-sm italic">Nenhum produto selecionado...</p>`;
            }

            contador.innerText = `${totalItens} ${totalItens === 1 ? 'item' : 'itens'}`;
            totalTxt.innerText = `R$ ${total.toFixed(2)}`;
            verificarStatusBotao();
        }

        // Controla seleção de pagamentos
        function selecionarPagamento(tipo) {
            formaPagamento = tipo;
            const btnPix = document.getElementById("btn-pix");
            const btnDinheiro = document.getElementById("btn-dinheiro");

            // Define classes de destaque baseado no layout (neon para escuro, esmeralda para claro)
            let classeAtivo = "border-emerald-500 bg-emerald-50 text-emerald-700 shadow-sm shadow-emerald-100";
            let classeInativo = "border-gray-200 text-gray-700 hover:bg-gray-50";

            if (layoutAtual === 'escuro') {
                classeAtivo = "border-emerald-400 bg-emerald-950/40 text-emerald-400 shadow-md";
                classeInativo = "border-slate-700 text-slate-300 hover:bg-slate-700/50";
            }

            if (tipo === 'PIX') {
                btnPix.className = `py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center ${classeAtivo}`;
                btnDinheiro.className = `py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center ${classeInativo}`;
            } else {
                btnDinheiro.className = `py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center ${classeAtivo}`;
                btnPix.className = `py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center ${classeInativo}`;
            }
            verificarStatusBotao();
        }

        // Valida liberação do botão de envio
        function verificarStatusBotao() {
            const btn = document.getElementById("btn-finalizar");
            const temItens = Object.keys(carrinho).length > 0;

            if (temItens && formaPagamento) {
                btn.disabled = false;
                let corBotao = layoutAtual === 'escuro' ? "bg-emerald-500 hover:bg-emerald-600 text-slate-950" : "bg-orange-600 hover:bg-orange-700 text-white";
                btn.className = `w-full ${corBotao} font-bold py-4 rounded-xl text-center text-lg shadow-lg transition-all transform active:scale-[0.98]`;
                btn.innerText = `Finalizar em ${formaPagamento}`;
            } else {
                btn.disabled = true;
                let classeDesativado = layoutAtual === 'escuro' ? "bg-slate-700 text-slate-500" : "bg-gray-300 text-gray-500";
                btn.className = `w-full ${classeDesativado} font-bold py-4 rounded-xl text-center text-lg shadow transition-all cursor-not-allowed`;
                btn.innerText = temItens ? "Selecione o Pagamento" : "Adicione Itens ao Pedido";
            }
        }

        // Finalização estruturada
        function finalizarVenda() {
            const dadosVenda = {
                data: new Date().toLocaleString('pt-BR'),
                origem: formaPagamento,
                itens: Object.keys(carrinho).map(id => {
                    const p = produtos.find(item => item.id == id);
                    return { nome: p.nome, quantidade: carrinho[id], subtotal: p.preco * carrinho[id] };
                })
            };

            console.log("Pronto para Auditoria no Power Automate:", dadosVenda);
            alert(`Venda Registrada com Sucesso!\nForma de Pagamento: ${formaPagamento}`);
            
            // Abate estoque local
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                p.estoque -= carrinho[id];
            });

            // Reseta estados de venda
            carrinho = {};
            formaPagamento = null;
            
            // Reseta botões de pagamento de acordo com o tema
            const resetClasse = layoutAtual === 'escuro' ? "border-slate-700 text-slate-300 hover:bg-slate-700/50" : "border-gray-200 text-gray-700 hover:bg-gray-50";
            document.getElementById("btn-pix").className = `py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center ${resetClasse}`;
            document.getElementById("btn-dinheiro").className = `py-3 rounded-xl border-2 font-bold text-center transition-all flex flex-col items-center justify-center ${resetClasse}`;
            
            renderizarProdutos();
            atualizarCarrinho();
        }

        // Carga inicial
        renderizarProdutos();
    </script>
</body>
</html>
