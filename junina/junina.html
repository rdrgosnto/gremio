<!DOCTYPE html>
<html lang="pt-BR" class="bg-slate-50">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grêmio | Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>html{visibility:visible!important}body{visibility:visible!important;opacity:1!important} .no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body class="font-sans min-h-screen flex flex-col text-slate-800 select-none">
    <header id="h" class="bg-orange-500 text-white text-center py-2 sticky top-0 z-50 shadow-sm"><h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1></header>
    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid lg:grid-cols-4 gap-4">
        <section class="lg:col-span-3 space-y-2"><div class="border-b pb-1 text-xs font-bold text-slate-600 uppercase">Produtos A - Z</div><div id="grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div></section>
        <section id="p" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 backdrop-blur-sm lg:backdrop-blur-none"><div id="c" class="bg-white w-full max-w-lg rounded-md shadow-2xl p-5 flex flex-col h-[85vh] lg:h-[calc(100vh-65px)]"><h3 id="t" class="text-base font-semibold text-center uppercase border-b pb-2">PAGAMENTO</h3><div class="flex-1 flex flex-col min-h-0 py-2"><div class="flex justify-between text-xs font-bold text-slate-400 uppercase"><span>Resumo:</span><button onclick="L()">Limpar</button></div><div id="lc" class="space-y-1.5 overflow-y-auto flex-1 no-scrollbar"></div></div><div id="bl" class="space-y-3 pt-3 border-t"><div class="grid grid-cols-2 gap-2"><button id="bd" onclick="SP('DINHEIRO')" class="py-2 border font-bold text-sm bg-white">DINHEIRO</button><button id="bp" onclick="SP('PIX')" class="py-2 border font-bold text-sm bg-white">PIX</button></div><button id="bf" disabled class="w-full bg-slate-200 py-3.5 rounded-md text-slate-400 font-bold">Finalizar</button></div></div></section>
    </main>
    <div id="bt" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 whitespace-nowrap touch-none">
        <div id="b" onclick="toggleOverlay(1)" class="bg-orange-500 text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center min-w-[240px] cursor-pointer text-sm">Pedido R$ 0,00 - Revisar e Pagar</div>
    </div>
    <script>
        let P=[],C={},FP=null,TA=0,ID="",TB=0,MB=0,RM=0,CB=0; const $=id=>document.getElementById(id);
        const FM=v=>v.toFixed(2).replace('.',','), toggleOverlay=(s)=>$("p").className=s?"fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm":"hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none";
        window.onload=()=>{const c=localStorage.getItem("festa_junina_cardapio"); if(c){P=JSON.parse(c); R()}; carregar(); drag()};
        function R(){ let h=""; P.sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(p=>{const q=C[p.id]||0, e=p.estoque===0; h+=`<div onclick="AQ(${p.id},1)" class="border rounded-lg p-2 flex flex-col bg-white ${e?'opacity-50':''}"><div class="aspect-square rounded flex flex-col justify-center items-center mb-2 ${q>0?'bg-orange-50 text-orange-700':'bg-slate-200'}"><div class="font-bold text-xl">${p.sigla}</div><div class="flex gap-2 mt-2"><button onclick="event.stopPropagation();AQ(${p.id},-1)">-</button><span>${q||'-'}</span><button onclick="event.stopPropagation();AQ(${p.id},1)">+</button></div></div><h3 class="text-xs truncate">${p.nome}</h3><span class="text-orange-600 font-bold text-xs">R$ ${FM(p.preco)}</span></div>`}); $("grid").innerHTML=h+`<div class="border rounded-lg p-2 bg-white"><div class="aspect-square rounded flex flex-col justify-center items-center mb-2 bg-slate-800 text-white"><div class="font-bold text-xl">ON</div><button onclick="event.stopPropagation();AB(event)">+</button></div><h3 class="text-xs">Online</h3></div>` }
        function AQ(id,d){if(CB)return; const p=P.find(i=>i.id==id); const n=(C[id]||0)+d; if(n<=0)delete C[id]; else if(n<=p.estoque)C[id]=n; R(); AC() }
        function L(){if(MB||RM){forçarF();return} C={}; CB=0; R(); resetP(); AC() }
        function AC(){let h="",t=0; TA=0; Object.keys(C).forEach(id=>{const p=P.find(i=>i.id==id),s=p.preco*C[id]; TA+=s; t+=C[id]; h+=`<div class="flex items-center justify-between p-2 bg-slate-50 border rounded"><div class="w-[70%]"><p class="font-bold text-xs">${p.nome}</p><p class="text-[10px]">${C[id]}x R$ ${FM(p.preco)}</p></div><div class="font-bold text-sm">R$ ${FM(s)}</div></div>`}); $("lc").innerHTML=t?h:`<p class="text-center text-xs">Vazio</p>`; $("bf").disabled=!t; $("bf").className=$("bf").disabled?"w-full bg-slate-200 py-3.5 rounded-md text-slate-400 font-bold":"w-full bg-orange-500 py-3.5 rounded-md text-white font-bold"; $("b").innerText=t?`Pedido R$ ${FM(TA)} - Revisar e Pagar`:`Pedido R$ 0,00 - Revisar e Pagar` }
        function forçarF(){ toggleOverlay(0); resetP(); }
        function resetP(){ FP=null; ID=""; $("bf").innerText="Finalizar"; $("btn-dinheiro").className=$("btn-pix").className=CSS_BTN_INATIVO }
        function drag(){ const el=$("container-botao-flutuante"), h=$("barra-superior"); let i=0,xi=0,yi=0; const s=(e)=>{i=1; const t=e.touches?e.touches[0]:e; const r=el.getBoundingClientRect(); Object.assign(el.style,{left:r.left+"px",top:r.top+"px",bottom:"auto",right:"auto"}); el.classList.remove("left-1/2","-translate-x-1/2"); xi=t.clientX-el.offsetLeft; yi=t.clientY-el.offsetTop }; const m=(e)=>{if(!i)return; e.preventDefault(); const t=e.touches?e.touches[0]:e; let x=t.clientX-xi, y=t.clientY-yi; const lM=window.innerWidth-48, aM=window.innerHeight-el.offsetHeight-16, hL=h?h.offsetHeight:48; el.style.left=Math.max(-el.offsetWidth+48,Math.min(x,lM))+"px"; el.style.top=Math.max(hL,Math.min(y,aM))+"px" }; const e=()=>{if(!i)return; i=0; const r=el.getBoundingClientRect(); Object.assign(el.style,{top:"auto",bottom:(window.innerHeight-r.bottom)+"px",left:"auto",right:(window.innerWidth-r.right)+"px"}) }; el.addEventListener("mousedown",s); window.addEventListener("mousemove",m); window.addEventListener("mouseup",e); el.addEventListener("touchstart",s,{passive:!1}); window.addEventListener("touchmove",m,{passive:!1}); window.addEventListener("touchend",e) }
        async function carregar(){ const r=await fetch(URL_LEITURA,{method:"POST",headers:{"Content-Type":"application/json"}}); const d=await r.json(); if(d.produto){P=d.produto.map(l=>({id:l.ID,sigla:l.SIGLA,nome:l.PRODUTO,preco:l.PRECO,estoque:l.ATUAL})); localStorage.setItem("festa_junina_cardapio",JSON.stringify(P)); R()} }
    </script>
</body>
</html>
