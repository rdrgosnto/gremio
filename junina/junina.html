<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.cdnfonts.com/css/aptos');
        
        .font-aptos {
            font-family: 'Aptos', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .smooth-scroll { scroll-behavior: smooth; }
        
        /* Oculta a barra de rolagem padrão */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 font-aptos min-h-screen flex flex-col smooth-scroll antialiased text-slate-800">

    <!-- Cabeçalho Mais Fino, Compacto e Elegante -->
    <header class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <!-- Corpo Principal -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <!-- Lado Esquerdo: Grid Ultra Compacto de Produtos -->
        <section class="lg:col-span-3 space-y-2">
            <div class="flex justify-between items-center border-b border-slate-200 pb-1">
                <h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2>
                <span class="text-xs text-slate-400">Layout Otimizado</span>
            </div>
            
            <!-- Grid responsivo: 3 colunas no celular, 4 em tablets, 6 no computador -->
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 xl:grid-cols-6 gap-2">
                <!-- Os produtos serão injetados dinamicamente via JavaScript aqui -->
            </div>
        </section>

        <!-- Lado Direito: Carrinho e Fechamento -->
        <section class="bg-white rounded-xl shadow-md border border-slate-200 p-4 flex flex-col justify-between lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
            <div>
                <h2 class="text-sm font-bold text-slate-700 border-b pb-2 mb-2 flex justify-between items-center">
                    <span>Pedido Atual</span>
                    <span id="contador-itens" class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-semibold">0 itens</span>
                </h2>

                <!-- Lista de itens no carrinho -->
                <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto max-h-[25vh] lg:max-h-[50vh] pr-1">
                    <p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>
                </div>
            </div>

            <!-- Área de Fechamento -->
            <div id="bloco-fechamento-original" class="border-t border-slate-100 pt-3 mt-3 space-y-3">
                <div class="flex justify-between items-center text-slate-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Total:</span>
                    <span id="valor-total" class="text-2xl font-bold text-orange-600 tracking-tight">R$ 0,00</span>
                </div>

                <!-- Método de Pagamento -->
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-slate-400 block uppercase tracking-wider">Forma de Pagamento:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2 rounded-lg border border-slate-200 font-semibold text-sm text-center transition-all bg-white hover:bg-slate-50 text-slate-700">
                            DINHEIRO
                        </button>
                        <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-2 rounded-lg border border-slate-200 font-semibold text-sm text-center transition-all bg-white hover:bg-slate-50 text-slate-700">
                            PIX
                        </button>
                    </div>
                </div>

                <!-- Botão Concluir Grande -->
                <button onclick="finalizarVenda()" id="btn-finalizar" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3 rounded-lg text-center text-sm transition-all cursor-not-allowed">
                    Selecione o Pagamento
                </button>
            </div>
        </section>
    </main>

    <!-- Botão Laranja Flutuante - Texto Padronizado e Uniforme -->
    <div id="container-botao-flutuante" class="fixed bottom-4 left-0 right-0 px-4 z-40 hidden flex justify-center pointer-events-none">
        <button onclick="irParaFechamento()" class="pointer-events-auto bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 px-8 rounded-full shadow-lg flex items-center justify-center transform active:scale-95 transition-all text-sm tracking-wide">
            <span>Pedido: <span id="valor-total-flutuante">R$ 0,00</span> (fechar)</span>
        </button>
    </div>

    <script>
        // Banco de dados simulando os cenários reais
        const produtos = [
            { id: 1, nome: "Cachorro Quente", preco: 12.00, estoque: 50, critico: 5 },
            { id: 2, nome: "Pipoca Doce/Salgada", preco: 6.00, estoque: 4, critico: 5 }, 
            { id: 3, nome: "Refrigerante (Lata)", preco: 6.00, estoque: 80, critico: 10 },
            { id: 4, nome: "Água Mineral", preco: 4.00, estoque: 0, critico: 5 },        
            { id: 5, nome: "Quentão", preco: 10.00, estoque: 30, critico: 5 },
            { id: 6, nome: "Canjica", preco: 8.00, estoque: 25, critico: 5 },
            { id: 7, nome: "Espetinho de Carne", preco: 14.00, estoque: 40, critico: 8 },
            { id: 8, nome: "Milho Cozido", preco: 7.00, estoque: 20, critico: 5 },
            { id: 9, nome: "Bolo de Fubá", preco: 5.00, estoque: 15, critico: 3 },
            { id: 10, nome: "Pastel", preco: 9.00, estoque: 60, critico: 10 }
        ];

        let carrinho = {};
        let formaPagamento = null;
        let totalAtual = 0;

        function formatarMoeda(valor) {
            return valor.toFixed(2).replace('.', ',');
        }

        // Função auxiliar para gerar a sigla automaticamente de forma inteligente
        function gerarSigla(nome) {
            const nomeLimpo = nome.replace(/\(.*?\)/g, '').replace(/[^a-zA-ZáéíóúÁÉÍÓÚâêîôûÂÊÎÔÛãõÃÕçÇ\s]/g, '');
            const palavras = nomeLimpo.trim().split(/\s+/).filter(p => p.toLowerCase() !== 'de' && p.toLowerCase() !== 'da' && p.toLowerCase() !== 'do');
            
            if (palavras.length === 1) {
                return palavras[0].substring(0, 2).toUpperCase();
            }
            
            return (palavras[0][0] + palavras[1][0]).toUpperCase();
        }

        // Renderiza os blocos no formato de grid compacto com os controles embutidos na caixa quadrada
        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos");
            grid.innerHTML = "";

            // Ordem alfabética (A-Z)
            produtos.sort((a, b) => a.nome.localeCompare(b.nome));

            produtos.forEach(p => {
                const qtdNoCarrinho = carrinho[p.id] || 0;
                const sigla = gerarSigla(p.nome);
                
                let statusEstoqueHtml = `<span class="text-emerald-600 font-semibold">${p.estoque}</span>`;
                let cardEstilo = "bg-white border-slate-200 hover:border-slate-300";
                let caixaQuadradaEstilo = "bg-slate-100 text-slate-600";
                let botoesBloqueados = "";
                let itemEsgotado = false;

                if (p.estoque === 0) {
                    statusEstoqueHtml = `<span class="text-rose-500 font-semibold text-[11px]">0</span>`;
                    cardEstilo = "bg-slate-100 border-slate-200 text-slate-400 select-none pointer-events-none opacity-60";
                    caixaQuadradaEstilo = "bg-slate-200 text-slate-400";
                    botoesBloqueados = "disabled";
                    itemEsgotado = true;
                } 
                else if (p.estoque <= p.critico) {
                    statusEstoqueHtml = `<span class="text-rose-500 font-bold">${p.estoque}</span>`;
                }

                if (qtdNoCarrinho > 0 && !itemEsgotado) {
                    caixaQuadradaEstilo = "bg-orange-50 border border-orange-200 text-orange-700";
                }

                grid.innerHTML += `
                    <div class="border rounded-xl p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 ${cardEstilo}">
                        
                        <!-- CAIXA QUADRADA CENTRALIZADA (Sigla maior ao centro + Controles robustos na base) -->
                        <div class="w-full aspect-square rounded-lg flex flex-col justify-between p-1 relative mb-2 ${caixaQuadradaEstilo}">
                            
                            <!-- Sigla aumentada e posicionada perto do centro vertical (ajuste fino com mt-2) -->
                            <div class="text-center font-bold text-xl tracking-wide mt-2.5 leading-none select-none flex-1 flex items-center justify-center w-full">
                                ${sigla}
                            </div>
                            
                            <!-- Base da caixa quadrada: Botões maiores e alinhados perfeitamente nos cantos inferiores -->
                            <div class="flex items-center justify-between w-full mt-auto">
                                <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, -1)" ${botoesBloqueados} 
                                    class="w-7 h-7 rounded bg-black/5 hover:bg-black/10 active:scale-90 font-bold text-sm flex items-center justify-center transition-all ${qtdNoCarrinho === 0 ? 'opacity-20 pointer-events-none' : ''}">
                                    -
                                </button>
                                
                                <span class="text-xs font-bold select-none text-center flex-1">
                                    ${qtdNoCarrinho > 0 ? `<span class="text-orange-600 font-bold text-base">${qtdNoCarrinho}</span>` : '<span class="text-slate-300 font-normal">-</span>'}
                                </span>
                                
                                <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, 1)" ${botoesBloqueados} 
                                    class="w-7 h-7 rounded bg-black/5 hover:bg-black/10 active:scale-90 font-bold text-sm flex items-center justify-center transition-all ${itemEsgotado ? 'opacity-20' : ''}">
                                    +
                                </button>
                            </div>
                        </div>
                        
                        <!-- TEXTOS DO PRODUTO (Nome um pouco maior, Preço e Estoque "E:" otimizados) -->
                        <div class="min-w-0 flex-1 flex flex-col justify-between">
                            <h3 class="font-semibold text-slate-700 text-[13px] truncate text-left leading-tight tracking-tight mb-0.5" title="${p.nome}">
                                ${p.nome}
                            </h3>
                            
                            <div class="flex items-center justify-between text-[12px] font-medium w-full">
                                <span class="text-orange-600 font-bold whitespace-nowrap">R$ ${formatarMoeda(p.preco)}</span>
                                <div class="text-slate-500 whitespace-nowrap text-right font-semibold">
                                    <span class="text-slate-300 font-normal">E:</span> ${statusEstoqueHtml}
                                </div>
                            </div>
                        </div>
                        
                    </div>
                `;
            });
        }

        function alterarQuantidade(id, delta) {
            const produto = produtos.find(p => p.id === id);
            const qtdAtual = carrinho[id] || 0;
            const novaQtd = qtdAtual + delta;

            if (novaQtd < 0) return;
            if (novaQtd > produto.estoque) {
                alert(`Ops! Só temos ${produto.estoque} unidades de ${produto.nome} no estoque.`);
                return;
            }

            if (novaQtd === 0) delete carrinho[id];
            else carrinho[id] = novaQtd;

            renderizarProdutos();
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            const lista = document.getElementById("lista-carrinho");
            const contador = document.getElementById("contador-itens");
            const totalTxt = document.getElementById("valor-total");
            const totalFlutuanteTxt = document.getElementById("valor-total-flutuante");
            
            totalAtual = 0;
            let totalItens = 0;
            lista.innerHTML = "";

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                const qtd = carrinho[id];
                const subtotal = p.preco * qtd;
                totalAtual += subtotal;
                totalItens += qtd;

                lista.innerHTML += `
                    <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <div class="max-w-[70%]">
                            <p class="font-semibold text-slate-700 truncate">${p.nome}</p>
                            <p class="text-[10px] text-slate-400">${qtd}x R$ ${formatarMoeda(p.preco)}</p>
                        </div>
                        <span class="font-bold text-slate-700">R$ ${formatarMoeda(subtotal)}</span>
                    </div>
                `;
            });

            if (totalItens === 0) {
                lista.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>`;
            }

            contador.innerText = `${totalItens} ${totalItens === 1 ? 'item' : 'itens'}`;
            totalTxt.innerText = `R$ ${formatarMoeda(totalAtual)}`;
            totalFlutuanteTxt.innerText = `R$ ${formatarMoeda(totalAtual)}`;
            verificarStatusBotao();
        }

        function irParaFechamento() {
            const blocoOriginal = document.getElementById("bloco-fechamento-original");
            blocoOriginal.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        const observer = new IntersectionObserver((entries) => {
            const containerFlutuante = document.getElementById("container-botao-flutuante");
            entries.forEach(entry => {
                if (!entry.isIntersecting) {
                    containerFlutuante.classList.remove("hidden");
                } else {
                    containerFlutuante.classList.add("hidden");
                }
            });
        }, { root: null, threshold: 0.05 });

        observer.observe(document.getElementById("bloco-fechamento-original"));

        function selecionarPagamento(tipo) {
            formaPagamento = tipo;
            const btnPix = document.getElementById("btn-pix");
            const btnDinheiro = document.getElementById("btn-dinheiro");

            const ativoClasse = "py-2 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-700 font-bold text-sm text-center shadow-sm";
            const inativoClasse = "py-2 rounded-lg border border-slate-200 font-semibold text-sm text-center transition-all bg-white hover:bg-slate-50 text-slate-700";

            if (tipo === 'PIX') {
                btnPix.className = ativoClasse;
                btnDinheiro.className = inativoClasse;
            } else {
                btnDinheiro.className = ativoClasse;
                btnPix.className = inativoClasse;
            }
            verificarStatusBotao();
        }

        function verificarStatusBotao() {
            const btn = document.getElementById("btn-finalizar");
            const temItens = Object.keys(carrinho).length > 0;

            if (temItens && formaPagamento) {
                btn.disabled = false;
                btn.className = "w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg text-center text-sm shadow transition-all transform active:scale-[0.99]";
                btn.innerText = `Finalizar em ${formaPagamento}`;
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-slate-200 text-slate-400 font-bold py-3 rounded-lg text-center text-sm cursor-not-allowed";
                btn.innerText = temItens ? "Selecione o Pagamento" : "Adicione Itens";
            }
        }

        function finalizarVenda() {
            const dadosVenda = {
                data: new Date().toLocaleString('pt-BR'),
                origem: formaPagamento,
                itens: Object.keys(carrinho).map(id => {
                    const p = produtos.find(item => item.id == id);
                    return { nome: p.nome, quantidade: carrinho[id], subtotal: p.preco * carrinho[id] };
                })
            };

            console.log("Auditoria de Venda:", dadosVenda);
            alert(`🎉 Venda Registrada com Sucesso!\nForma de Pagamento: ${formaPagamento}`);
            
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                p.estoque -= carrinho[id];
            });

            carrinho = {};
            formaPagamento = null;
            document.getElementById("btn-pix").className = "py-2 rounded-lg border border-slate-200 font-semibold text-sm text-center bg-white text-slate-700";
            document.getElementById("btn-dinheiro").className = "py-2 rounded-lg border border-slate-200 font-semibold text-sm text-center bg-white text-slate-700";
            
            renderizarProdutos();
            atualizarCarrinho();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderizarProdutos();
    </script>
</body>
</html>
