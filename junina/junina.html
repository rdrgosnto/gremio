<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.cdnfonts.com/css/aptos');
        .font-aptos { font-family: 'Aptos', 'Segoe UI', Tahoma, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 font-aptos min-h-screen flex flex-col antialiased text-slate-800">

    <header class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <!-- Grid de Produtos -->
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2></div>
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div>
        </section>

        <!-- Painel de Fechamento -->
        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full">
            <div id="card-checkout" class="bg-white w-full max-w-lg lg:max-w-none rounded-md shadow-2xl lg:shadow-md border border-slate-200 p-5 flex flex-col justify-between h-[85vh] lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <h3 class="text-base font-bold text-slate-700 text-center uppercase tracking-wider border-b pb-2">Pagamento</h3>
                    
                    <!-- 1. Resumo do Pedido -->
                    <div class="flex-1 flex flex-col min-h-0">
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Resumo do Pedido:</h4>
                        <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1">
                            <p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>
                        </div>
                    </div>

                    <!-- BLOCO INFERIOR DE FECHAMENTO -->
                    <div class="space-y-3 pt-2 border-t">
                        <!-- 2. Formas de Pagamento -->
                        <div class="space-y-1.5">
                            <label class="text-[11px] font-bold text-slate-400 block uppercase tracking-wider text-center">Forma de Pagamento:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2.5 rounded-md border border-slate-200 font-semibold text-sm text-center bg-white text-slate-700 transition-all">DINHEIRO</button>
                                <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-2.5 rounded-md border border-slate-200 font-semibold text-sm text-center bg-white text-slate-700 transition-all">PIX</button>
                            </div>
                        </div>

                        <!-- 3. Carrossel Horizontal com Altura Calibrada -->
                        <div class="w-full overflow-hidden border-t border-dashed pt-3 h-[110px] pb-1 relative">
                            <div id="carrossel-pagamento" class="w-[200%] h-full flex transition-transform duration-300 transform translate-x-0">
                                <!-- BLOCO A: Valores Dinheiro -->
                                <div id="secao-valores-dinheiro" class="w-1/2 h-full space-y-2 opacity-25 pointer-events-none transition-all duration-200">
                                    <div class="flex justify-between items-center text-sm"><span class="text-slate-500 font-medium">Pedido</span><span id="valor-pedido-txt" class="font-bold text-slate-700">R$ 0,00</span></div>
                                    <div class="flex justify-between items-center text-sm"><span class="text-slate-500 font-medium">Recebido</span><div class="relative w-36"><span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-xs">R$</span><input type="text" id="input-recebido" placeholder="0,00" disabled oninput="tratarMascaraDinheiro(this)" class="w-full pl-7 pr-2.5 py-0.5 border border-slate-300 rounded-md text-right font-bold text-slate-800 focus:outline-none focus:border-orange-500 text-sm disabled:bg-slate-50"></div></div>
                                    <div class="flex justify-between items-center text-sm border-t border-slate-100 pt-1"><span class="text-slate-500 font-medium">Troco</span><span id="valor-troco-txt" class="font-bold text-slate-400">R$ 0,00</span></div>
                                </div>
                                <!-- BLOCO B: Área do PIX (Borda 100% Reta e Sem Margens para Máximo Tamanho) -->
                                <div id="secao-valores-pix" class="w-1/2 h-full flex items-center justify-center">
                                    <div id="box-qrcode" onclick="requisitarQrCodeReal()" class="w-[100px] h-[100px] bg-slate-50 rounded-none flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 active:scale-95 transition-all select-none relative overflow-hidden group">
                                        
                                        <!-- QR Code Fake Totalmente Expandido -->
                                        <div class="absolute inset-0 opacity-[0.08] group-hover:opacity-[0.12] transition-opacity grid grid-cols-2 pointer-events-none">
                                            <div class="border-[4px] border-slate-900 rounded-none flex p-0.5"><div class="bg-slate-900 w-full h-full rounded-none"></div></div>
                                            <div class="border-[4px] border-slate-900 rounded-none flex p-0.5"><div class="bg-slate-900 w-full h-full rounded-none"></div></div>
                                            <div class="border-[4px] border-slate-900 rounded-none flex p-0.5"><div class="bg-slate-900 w-full h-full rounded-none"></div></div>
                                            <div class="flex flex-wrap gap-1 p-1 justify-center items-center"><div class="bg-slate-900 w-2 h-2"></div><div class="bg-slate-900 w-2 h-2"></div><div class="bg-slate-900 w-2 h-2"></div><div class="bg-slate-900 w-2 h-2"></div></div>
                                        </div>

                                        <!-- Conteúdo de texto centralizado à frente -->
                                        <div class="relative z-10 flex flex-col items-center justify-center text-center p-1">
                                            <svg class="w-5 h-5 text-slate-400 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h.01M5.94 18.06l.01-.01M19.06 18.06l-.01-.01M5.94 5.94l.01-.01M12 12h.01M12 7a5 5 0 110 10 5 5 0 010-10z"></path></svg>
                                            <span id="txt-qrcode-box" class="text-[9px] font-bold text-slate-500 uppercase tracking-tight leading-none">Gerar<br>QRCODE</span>
                                        </div>
                                        
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col items-center gap-1.5 mt-2 pt-2 border-t w-full">
                    <button onclick="processarCliqueFinalizar()" id="btn-finalizar" disabled class="w-full bg-slate-200 text-slate-400 font-bold py-3 rounded-md text-center text-sm cursor-not-allowed transition-all">Finalizar</button>
                    <button onclick="fecharOverlay()" class="lg:hidden text-xs text-slate-400 hover:text-slate-600 underline font-medium py-1">Voltar ao pedido</button>
                </div>
            </div>
        </section>
    </main>

    <div id="container-botao-flutuante" class="fixed bottom-4 left-0 right-0 px-4 z-40 hidden lg:hidden flex justify-center pointer-events-none">
        <button onclick="abrirOverlayCelular()" class="pointer-events-auto bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform active:scale-95 transition-all text-sm tracking-wide"><span id="texto-botao-flutuante">Pedido: R$ 0,00 - Revisar e Pagar</span></button>
    </div>

    <script>
        const URL_LEITURA = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/161fb6d3f71245f187e74df0ae0616b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dxOAva-wcRMsB3WRw8zfGu6XMtuQsOZGgRGdQ5Waxh4";
        const URL_GRAVACAO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/842eb1386d994855bf6aab1e7a648280/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=2K4QnR3G67WP2hxS4v3yPJfK53LGIUdvr8-p2cWs-Zc";
        const URL_VALIDA_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fc8e0c1a405b4430b0f6390521bada48/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=1yfg6o-AMAAavobkG-AE22s_StAGlL_lkw0GqSfWk4g";

        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, pixChaveIdentificadora = "";
        const formatarMoeda = (v) => v.toFixed(2).replace('.', ',');

        // Inteligência de calendário para decidir entre ONLINE/PENDENTE e CAIXA/RETIRADO
        function obterConfiguracaoVenda() {
            const hoje = new Date();
            const dia = hoje.getDate();
            const mes = hoje.getMonth() + 1; // Junho é 6
            const ano = hoje.getFullYear();

            // Se for antes de 25/06/2026, assume pré-venda online
            if (ano < 2026 || (ano === 2026 && mes < 6) || (ano === 2026 && mes === 6 && dia < 25)) {
                return { tipo: "ONLINE", status: "PENDENTE" };
            } else {
                // Na data da festa ou posterior, assume o caixa físico
                return { tipo: "CAIXA", status: "RETIRADO" };
            }
        }

        async function carregarEstoqueReal() {
            try {
                const r = await fetch(URL_LEITURA); if (!r.ok) throw new Error();
                const d = await r.json();
                produtos = d.map(l => ({ id: parseInt(l.ID), sigla: l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : "??", nome: l.PRODUTO, preco: parseFloat(l.PRECO), estoque: parseInt(l.ATUAL), critico: 5 }));
                renderizarProdutos();
            } catch (e) { alert("⚠️ Erro ao carregar o cardápio real do Excel."); }
        }

        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos"); grid.innerHTML = "";
            produtos.sort((a, b) => a.nome.localeCompare(b.nome));
            produtos.forEach(p => {
                const qtd = carrinho[p.id] || 0; let status = `<span class="text-emerald-600 font-semibold">${p.estoque}</span>`;
                let cEstilo = "bg-white border-slate-200 hover:border-slate-300", boxEstilo = "bg-slate-100 text-slate-600", bloq = "", esg = false;
                if (p.estoque === 0) {
                    status = `<span class="text-rose-500 font-semibold text-[11px]">0</span>`; cEstilo = "bg-slate-100 border-slate-200 text-slate-400 select-none pointer-events-none opacity-60"; boxEstilo = "bg-slate-200 text-slate-400"; bloq = "disabled"; esg = true;
                } else if (p.estoque <= p.critico) { status = `<span class="text-rose-500 font-bold">${p.estoque}</span>`; }
                if (qtd > 0 && !esg) boxEstilo = "bg-orange-50 border border-orange-200 text-orange-700";
                grid.innerHTML += `
                    <div class="border rounded-md p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 ${cEstilo}">
                        <div class="w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 ${boxEstilo}">
                            <div class="text-center font-bold text-xl tracking-wide mt-2.5 flex items-center justify-center w-full flex-1 select-none">${p.sigla}</div>
                            <div class="flex items-center justify-between w-full mt-auto">
                                <button onclick="alterarQuantidade(${p.id}, -1)" ${bloq} class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm flex items-center justify-center ${qtd === 0 ? 'opacity-20 pointer-events-none' : ''}">-</button>
                                <span class="text-xs font-bold select-none text-center flex-1">${qtd > 0 ? `<span class="text-orange-600 font-bold text-base">${qtd}</span>` : '<span class="text-slate-300 font-normal">-</span>'}</span>
                                <button onclick="alterarQuantidade(${p.id}, 1)" ${bloq} class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm flex items-center justify-center ${esg ? 'opacity-20' : ''}">+</button>
                            </div>
                        </div>
                        <div class="min-w-0 flex flex-col justify-between flex-1">
                            <h3 class="font-semibold text-slate-700 text-[13px] truncate leading-tight mb-0.5" title="${p.nome}">${p.nome}</h3>
                            <div class="flex items-center justify-between text-[12px] font-medium w-full"><span class="text-orange-600 font-bold">R$ ${formatarMoeda(p.preco)}</span><div class="text-slate-500 font-semibold"><span class="text-slate-300 font-normal">E:</span> ${status}</div></div>
                        </div>
                    </div>`;
            });
        }

        function alterarQuantidade(id, d) {
            const p = produtos.find(item => item.id === id); const nQtd = (carrinho[id] || 0) + d;
            if (nQtd < 0) return; if (nQtd > p.estoque) { alert(`Ops! Só temos ${p.estoque} un. de ${p.nome}.`); return; }
            if (nQtd === 0) delete carrinho[id]; else carrinho[id] = nQtd;
            renderizarProdutos(); atualizarCarrinhoDOM();
        }

        function atualizarCarrinhoDOM() {
            const lista = document.getElementById("lista-carrinho"); totalAtual = 0; let tItens = 0; lista.innerHTML = "";
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id); const qtd = carrinho[id]; const sub = p.preco * qtd; totalAtual += sub; tItens += qtd;
                lista.innerHTML += `<div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded-md border border-slate-100"><div class="max-w-[75%]"><p class="font-semibold text-slate-700 truncate">${p.nome}</p><p class="text-[10px] text-slate-400">${qtd}x R$ ${formatarMoeda(p.preco)}</p></div><span class="font-bold text-slate-700">R$ ${formatarMoeda(sub)}</span></div>`;
            });
            if (tItens === 0) { lista.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>`; fecharOverlay(); }
            const flut = document.getElementById("container-botao-flutuante");
            if (tItens > 0) { flut.classList.remove("hidden"); document.getElementById("texto-botao-flutuante").innerText = `Pedido: R$ ${formatarMoeda(totalAtual)} - Revisar e Pagar`; } else flut.classList.add("hidden");
            document.getElementById("valor-pedido-txt").innerText = `R$ ${formatarMoeda(totalAtual)}`; validarEstadoFinalizar();
        }

        function abrirOverlayCelular() {
            document.getElementById("painel-fechamento").className = "fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm"; resetarEstadoPagamento();
            setTimeout(() => { document.getElementById("card-checkout").scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 100);
        }

        function fecharOverlay() { document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full"; }

        function resetarEstadoPagamento() {
            formaPagamento = null; pixChaveIdentificadora = "";
            document.getElementById("btn-pix").className = document.getElementById("btn-dinheiro").className = "py-2.5 rounded-md border border-slate-200 font-semibold text-sm text-center bg-white text-slate-700 transition-all";
            document.getElementById("carrossel-pagamento").className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0";
            document.getElementById("secao-valores-dinheiro").className = "w-1/2 h-full space-y-2.5 opacity-25 pointer-events-none transition-all duration-200";
            document.getElementById("input-recebido").disabled = true; document.getElementById("input-recebido").value = ""; document.getElementById("valor-troco-txt").innerText = "R$ 0,00";
            
            const box = document.getElementById("box-qrcode"); box.className = "w-[100px] h-[100px] bg-slate-50 rounded-none flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 active:scale-95 transition-all select-none relative overflow-hidden group";
            box.innerHTML = `
                <div class="absolute inset-0 opacity-[0.07] group-hover:opacity-[0.11] transition-opacity grid grid-cols-2 pointer-events-none">
                    <div class="border-[4px] border-slate-900 rounded-none flex p-0.5"><div class="bg-slate-900 w-full h-full rounded-none"></div></div>
                    <div class="border-[4px] border-slate-900 rounded-none flex p-0.5"><div class="bg-slate-900 w-full h-full rounded-none"></div></div>
                    <div class="border-[4px] border-slate-900 rounded-none flex p-0.5"><div class="bg-slate-900 w-full h-full rounded-none"></div></div>
                    <div class="flex flex-wrap gap-1 p-1 justify-center items-center"><div class="bg-slate-900 w-2 h-2"></div><div class="bg-slate-900 w-2 h-2"></div><div class="bg-slate-900 w-2 h-2"></div><div class="bg-slate-900 w-2 h-2"></div></div>
                </div>
                <div class="relative z-10 flex flex-col items-center justify-center text-center p-1">
                    <svg class="w-5 h-5 text-slate-400 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h.01M5.94 18.06l.01-.01M19.06 18.06l-.01-.01M5.94 5.94l.01-.01M12 12h.01M12 7a5 5 0 110 10 5 5 0 010-10z"></path></svg>
                    <span id="txt-qrcode-box" class="text-[9px] font-bold text-slate-500 uppercase tracking-tight leading-none">Gerar<br>QRCODE</span>
                </div>`;
            validarEstadoFinalizar();
        }

        function selecionarPagamento(tipo) {
            formaPagamento = tipo; const btnPix = document.getElementById("btn-pix"), btnDin = document.getElementById("btn-dinheiro");
            const secaoDin = document.getElementById("secao-valores-dinheiro"), carr = document.getElementById("carrossel-pagamento"), inp = document.getElementById("input-recebido");
            const ativo = "py-2.5 rounded-md border border-emerald-500 bg-emerald-50 text-emerald-700 font-bold text-sm text-center shadow-sm transition-all";
            const inativo = "py-2.5 rounded-md border border-slate-200 font-semibold text-sm text-center bg-white text-slate-700 transition-all";

            if (tipo === 'DINHEIRO') {
                btnDin.className = ativo; btnPix.className = inativo; carr.className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0";
                secaoDin.className = "w-1/2 h-full space-y-2.5 opacity-100 pointer-events-auto transition-all duration-200";
                inp.disabled = false; inp.value = ""; document.getElementById("valor-troco-txt").innerText = "R$ 0,00"; inp.focus();
            } else {
                btnPix.className = ativo; btnDin.className = inativo; carr.className = "w-[200%] h-full flex transition-transform duration-300 transform -translate-x-1/2";
                secaoDin.className = "w-1/2 h-full space-y-2.5 opacity-25 pointer-events-none transition-all duration-200"; inp.disabled = true;
            }
            validarEstadoFinalizar();
        }

        async function requisitarQrCodeReal() {
            if (!formaPagamento || formaPagamento !== 'PIX') return;
            const box = document.getElementById("box-qrcode");
            
            box.className = "w-[100px] h-[100px] bg-slate-50 border border-slate-200 rounded-none flex flex-col items-center justify-center p-2 select-none pointer-events-none";
            box.innerHTML = `<span class="text-[9px] font-bold text-slate-400 uppercase tracking-tight text-center leading-none">Carregando...</span>`;

            pixChaveIdentificadora = "mp_" + Date.now(); 

            const configVenda = obterConfiguracaoVenda();

            const payload = {
                id_pagamento: pixChaveIdentificadora,
                pagamento: "PIX",
                total_pedido_consolidado: parseFloat(totalAtual),
                tipo_venda: configVenda.tipo,
                status_retirada: configVenda.status,
                itens: Object.keys(carrinho).map(id => {
                    const p = produtos.find(item => item.id == id);
                    return { sigla: p.sigla, produto: p.nome, quantidade: parseInt(carrinho[id]), preco: parseFloat(p.preco), total: parseFloat(p.preco * carrinho[id]) };
                })
            };

            try {
                const r = await fetch(URL_GRAVACAO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                if (!r.ok) throw new Error();
                const dados = await r.json();

                if (dados.qrcode_imagem) {
                    pixChaveIdentificadora = dados.id_mercado_pago;

                    box.className = "w-[100px] h-[100px] bg-white rounded-none flex items-center justify-center p-0 opacity-100 select-none pointer-events-none transition-all";
                    box.innerHTML = `<img src="data:image/jpeg;base64,${dados.qrcode_imagem}" class="w-full h-full rounded-none shadow-none" alt="QR Code">`;
                    validarEstadoFinalizar();
                } else { throw new Error(); }
            } catch (e) {
                alert("⚠️ Falha ao gerar QR Code na API do Mercado Pago.");
                resetarEstadoPagamento();
            }
        }

        function tratarMascaraDinheiro(inp) {
            let val = inp.value.replace(/\D/g, ""); if (val === "") { inp.value = ""; validarEstadoFinalizar(); return; }
            let num = parseFloat(val) / 100; inp.value = num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const txtT = document.getElementById("valor-troco-txt");
            if (num < totalAtual) { txtT.innerText = "Valor Insuficiente"; txtT.className = "font-bold text-rose-500 text-xs"; } 
            else { txtT.innerText = `R$ ${formatarMoeda(num - totalAtual)}`; txtT.className = "font-bold text-emerald-600 text-base"; }
            validarEstadoFinalizar();
        }

        function validarEstadoFinalizar() {
            const btn = document.getElementById("btn-finalizar"); const rec = parseFloat(document.getElementById("input-recebido").value.replace(/\D/g, "")) / 100 || 0;
            if (Object.keys(carrinho).length > 0 && formaPagamento && (formaPagamento === 'PIX' && pixChaveIdentificadora !== "" || formaPagamento === 'DINHEIRO' && rec >= totalAtual)) {
                btn.disabled = false; btn.className = "w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-md text-center text-sm shadow cursor-pointer transition-all transform active:scale-95";
            } else { btn.disabled = true; btn.className = "w-full bg-slate-200 text-slate-400 font-bold py-3 rounded-md text-center text-sm cursor-not-allowed"; }
        }

        function processarCliqueFinalizar() { if (formaPagamento === 'DINHEIRO') executarGravacaoDinheiroDirecto(); else checarSegurancaMercadoPago(); }

        async function checarSegurancaMercadoPago() {
            const btn = document.getElementById("btn-finalizar"); btn.disabled = true; btn.innerText = "Processando...";
            
            const configVenda = obterConfiguracaoVenda();

            const payloadValidacao = {
                id_pagamento: pixChaveIdentificadora,
                pagamento: "PIX",
                total_pedido_consolidado: parseFloat(totalAtual),
                tipo_venda: configVenda.tipo,
                status_retirada: configVenda.status,
                itens: Object.keys(carrinho).map(id => { 
                    const p = produtos.find(item => item.id == id); 
                    return { sigla: p.sigla, produto: p.nome, quantidade: parseInt(carrinho[id]), preco: parseFloat(p.preco), total: parseFloat(p.preco * carrinho[id]) }; 
                })
            };

            try {
                const r = await fetch(URL_VALIDA_PIX, { 
                    method: "POST", 
                    headers: { "Content-Type": "application/json" }, 
                    body: JSON.stringify(payloadValidacao) 
                });
                if (!r.ok) throw new Error(); const res = await r.json();
                
                if (res.pago === true) {
                    alert("🎉 Venda Finalizada com Sucesso!"); 
                    fecharOverlay(); 
                    carrinho = {}; 
                    resetarEstadoPagamento(); 
                    atualizarCarrinhoDOM(); 
                    carregarEstoqueReal();
                } else { 
                    alert("⚠️ Pagamento pendente ⚠️"); 
                    btn.innerText = "Finalizar"; 
                    validarEstadoFinalizar(); 
                }
            } catch (e) { 
                alert("⚠️ Erro ao verificar pagamento. Tente novamente."); 
                btn.innerText = "Finalizar"; 
                validarEstadoFinalizar(); 
            }
        }

        async function executarGravacaoDinheiroDirecto() {
            const btn = document.getElementById("btn-finalizar"); btn.disabled = true; btn.innerText = "Processando...";
            let idF = `DINHEIRO-${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}${String(new Date().getSeconds()).padStart(2,'0')}`;
            
            const configVenda = obterConfiguracaoVenda();

            const payload = {
                id_pagamento: idF,
                pagamento: "DINHEIRO",
                total_pedido_consolidado: parseFloat(totalAtual),
                tipo_venda: configVenda.tipo,
                status_retirada: configVenda.status,
                itens: Object.keys(carrinho).map(id => { const p = produtos.find(item => item.id == id); return { sigla: p.sigla, produto: p.nome, quantidade: parseInt(carrinho[id]), preco: parseFloat(p.preco), total: parseFloat(p.preco * carrinho[id]) }; })
            };
            try {
                const r = await fetch(URL_GRAVACAO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); if (!r.ok) throw new Error();
                alert("Venda Finalizada!"); fecharOverlay(); carrinho = {}; resetarEstadoPagamento(); atualizarCarrinhoDOM(); carregarEstoqueReal();
            } catch (e) { alert("⚠️ Erro de rede ao tentar gravar na planilha."); btn.innerText = "Finalizar"; validarEstadoFinalizar(); }
        }

        carregarEstoqueReal();
    </script>
