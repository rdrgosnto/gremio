<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .transicao-tema { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body id="corpo-pagina" class="bg-amber-50 text-gray-800 font-sans min-h-screen flex flex-col transicao-tema">

    <!-- Cabeçalho com o Seletor Suspenso de 22 Layouts -->
    <header id="cabecalho" class="bg-orange-600 text-white py-4 px-6 shadow-md border-b-4 border-yellow-400 flex flex-col md:flex-row justify-between items-center gap-4 transicao-tema">
        <div class="text-center md:text-left">
            <h1 class="text-2xl font-bold tracking-wide">Arraiá do Grêmio - Sistema de Caixa</h1>
            <p class="text-xs opacity-90 mt-0.5">Controle de Vendas e Auditoria de Estoque</p>
        </div>
        
        <!-- Caixa Suspensa (Select) com os 22 Modelos -->
        <div class="flex items-center gap-2 bg-black/20 p-2 rounded-xl border border-white/10 w-full md:w-auto">
            <label for="seletor-layout" class="text-xs font-bold uppercase tracking-wider text-white whitespace-nowrap">Layout:</label>
            <select id="seletor-layout" onchange="aplicarLayoutDoSeletor()" class="bg-white text-gray-800 text-sm font-semibold rounded-lg p-2 w-full md:w-72 focus:outline-none cursor-pointer">
                <!-- Os 22 modelos injetados de forma organizada -->
                <optgroup label="Layout: Grade Clássica (Blocos)">
                    <option value="grade-festa" selected>01. Grade - Festa Junina (Padrão)</option>
                    <option value="grade-gremio">02. Grade - Grêmio Oficial</option>
                    <option value="grade-floresta">03. Grade - Floresta Junina</option>
                    <option value="grade-noite">04. Grade - Noite de São João</option>
                    <option value="grade-clean">05. Grade - Minimalista Clean</option>
                    <option value="grade-doce">06. Grade - Barraca do Doce</option>
                    <option value="grade-vinho">07. Grade - Vinho Caipira</option>
                </optgroup>
                <optgroup label="Layout: Lista Compacta (Linhas horizontais)">
                    <option value="lista-festa">08. Lista - Festa Junina</option>
                    <option value="lista-gremio">09. Lista - Grêmio Oficial</option>
                    <option value="lista-floresta">10. Lista - Floresta Junina</option>
                    <option value="lista-noite">11. Lista - Noite de São João</option>
                    <option value="lista-clean">12. Lista - Minimalista Clean</option>
                    <option value="lista-doce">13. Lista - Barraca do Doce</option>
                    <option value="lista-vinho">14. Lista - Vinho Caipira</option>
                </optgroup>
                <optgroup label="Layout: Botões Gigantes (Touch Máximo)">
                    <option value="gigante-festa">15. Touch - Festa Junina</option>
                    <option value="gigante-gremio">16. Touch - Grêmio Oficial</option>
                    <option value="gigante-floresta">17. Touch - Floresta Junina</option>
                    <option value="gigante-noite">18. Touch - Noite de São João</option>
                    <option value="gigante-clean">19. Touch - Minimalista Clean</option>
                    <option value="gigante-doce">20. Touch - Barraca do Doce</option>
                    <option value="gigante-vinho">21. Touch - Vinho Caipira</option>
                </optgroup>
                <optgroup label="Layout: Acessibilidade">
                    <option value="acessibilidade-alto">22. Máximo Contraste (Preto e Branco)</option>
                </optgroup>
            </select>
        </div>
    </header>

    <!-- Corpo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Lado Esquerdo: Área de Exibição dos Itens -->
        <section class="lg:col-span-2 space-y-4">
            <h2 id="titulo-menu" class="text-xl font-bold border-b-2 pb-2 transicao-tema">Menu de Produtos</h2>
            <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Injeção via JavaScript -->
            </div>
        </section>

        <!-- Lado Direito: Carrinho e Fechamento -->
        <section id="painel-carrinho" class="bg-white rounded-2xl shadow-xl border p-6 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-4 transicao-tema">
            <div>
                <h2 id="titulo-pedido" class="text-xl font-bold border-b pb-3 mb-4 flex justify-between items-center transicao-tema">
                    <span>Pedido Atual</span>
                    <span id="contador-itens" class="text-xs px-2.5 py-1 rounded-full font-semibold">0 itens</span>
                </h2>
                <div id="lista-carrinho" class="space-y-3 overflow-y-auto max-h-[35vh] pr-1">
                    <p class="text-gray-400 text-center py-8 text-sm italic">Nenhum produto selecionado...</p>
                </div>
            </div>

            <!-- Resumo e Formas de Pagamento -->
            <div id="area-fechamento" class="border-t pt-4 mt-4 space-y-4">
                <div class="flex justify-between items-center">
                    <span id="txt-total" class="text-lg font-medium">Valor Total:</span>
                    <span id="valor-total" class="text-3xl font-black text-orange-600">R$ 0,00</span>
                </div>

                <div class="space-y-2">
                    <label id="txt-pagamento" class="text-sm font-semibold text-gray-600 block">Forma de Pagamento:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-3 rounded-xl border-2 font-bold text-center transition-all">PIX</button>
                        <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-3 rounded-xl border-2 font-bold text-center transition-all">DINHEIRO</button>
                    </div>
                </div>

                <button onclick="finalizarVenda()" id="btn-finalizar" disabled class="w-full bg-gray-300 text-gray-500 font-bold py-4 rounded-xl text-center text-lg shadow transition-all cursor-not-allowed">
                    Selecione o Pagamento
                </button>
            </div>
        </section>
    </main>

    <script>
        // Banco de Dados com os 10 Produtos (Sempre em Ordem Alfabética Automática)
        const produtos = [
            { id: 1, nome: "Cachorro Quente", preco: 12.00, estoque: 50, critico: 5 },
            { id: 2, nome: "Pipoca Doce/Salgada", preco: 6.00, estoque: 4, critico: 5 },
            { id: 3, nome: "Refrigerante (Lata)", preco: 6.00, estoque: 80, critico: 10 },
            { id: 4, nome: "Água Mineral", preco: 4.00, estoque: 30, critico: 5 },
            { id: 5, nome: "Quentão", preco: 10.00, estoque: 30, critico: 5 },
            { id: 6, nome: "Canjica", preco: 8.00, estoque: 25, critico: 5 },
            { id: 7, nome: "Espetinho de Carne", preco: 14.00, estoque: 40, critico: 8 },
            { id: 8, nome: "Milho Cozido", preco: 7.00, estoque: 20, critico: 5 },
            { id: 9, nome: "Bolo de Fubá", preco: 5.00, estoque: 15, critico: 3 },
            { id: 10, nome: "Pastel", preco: 9.00, estoque: 60, critico: 10 }
        ];

        let carrinho = {};
        let formaPagamento = null;
        
        // Variáveis de controle de estilo ativo
        let estruturaVisual = 'grade'; 
        let temaCores = 'festa';      

        // Definição dos 7 temas de cores aplicáveis
        const dicionarioTemas = {
            festa: { bg: "bg-amber-50", text: "text-gray-800", header: "bg-orange-600 border-yellow-400 text-white", card: "bg-white border-amber-100 text-gray-800", painel: "bg-white border-amber-100 text-gray-800", destaque: "text-orange-600", badge: "bg-orange-100 text-orange-700", botoes: "bg-gray-100" },
            gremio: { bg: "bg-slate-100", text: "text-blue-950", header: "bg-blue-600 border-sky-400 text-white", card: "bg-white border-blue-100 text-gray-800", painel: "bg-white border-blue-100 text-gray-800", destaque: "text-blue-600", badge: "bg-blue-100 text-blue-700", botoes: "bg-blue-50" },
            floresta: { bg: "bg-stone-100", text: "text-emerald-950", header: "bg-emerald-700 border-lime-400 text-white", card: "bg-white border-stone-200 text-gray-800", painel: "bg-white border-stone-200 text-gray-800", destaque: "text-emerald-600", badge: "bg-emerald-100 text-emerald-800", botoes: "bg-stone-100" },
            noite: { bg: "bg-slate-900", text: "text-slate-100", header: "bg-slate-950 border-purple-500 text-white", card: "bg-slate-800 border-slate-700 text-white", painel: "bg-slate-800 border-slate-700 text-white", destaque: "text-purple-400", badge: "bg-purple-950 text-purple-300", botoes: "bg-slate-700" },
            clean: { bg: "bg-white", text: "text-gray-900", header: "bg-gray-800 border-gray-600 text-white", card: "bg-white border-gray-200 text-gray-800", painel: "bg-white border-gray-200 text-gray-800", destaque: "text-gray-900", badge: "bg-gray-200 text-gray-800", botoes: "bg-gray-100" },
            doce: { bg: "bg-pink-50/60", text: "text-pink-950", header: "bg-pink-500 border-amber-300 text-white", card: "bg-white border-pink-100 text-gray-800", painel: "bg-white border-pink-100 text-gray-800", destaque: "text-pink-600", badge: "bg-pink-100 text-pink-700", botoes: "bg-pink-50/50" },
            vinho: { bg: "bg-stone-50", text: "text-red-950", header: "bg-red-900 border-amber-500 text-white", card: "bg-white border-stone-200 text-gray-800", painel: "bg-white border-stone-200 text-gray-800", destaque: "text-red-700", badge: "bg-red-100 text-red-800", botoes: "bg-stone-100" },
            acessibilidade: { bg: "bg-white", text: "text-black", header: "bg-black border-black text-white", card: "bg-white border-2 border-black text-black rounded-none", painel: "bg-white border-2 border-black text-black rounded-none", destaque: "text-black underline font-black", badge: "border border-black text-black", botoes: "bg-white border border-black" }
        };

        // Função do Seletor que quebra o valor em Estrutura + Tema
        function aplicarLayoutDoSeletor() {
            const val = document.getElementById("seletor-layout").value;
            
            if (val === 'acessibilidade-alto') {
                estruturaVisual = 'grade';
                temaCores = 'acessibilidade';
            } else {
                const partes = val.split('-');
                estruturaVisual = partes[0]; // grade, lista, gigante
                temaCores = partes[1];       // festa, gremio, etc.
            }

            atualizarCoresDoLayout();
            renderizarProdutos();
            atualizarCarrinho();
        }

        // Atualiza as classes do DOM com base no tema escolhido
        function atualizarCoresDoLayout() {
            const t = dicionarioTemas[temaCores];
            
            document.getElementById("corpo-pagina").className = `${t.bg} ${t.text} font-sans min-h-screen flex flex-col transicao-tema`;
            document.getElementById("cabecalho").className = `${t.header} py-4 px-6 shadow-md border-b-4 flex flex-col md:flex-row justify-between items-center gap-4 transicao-tema`;
            document.getElementById("painel-carrinho").className = `${t.painel} rounded-2xl shadow-xl p-6 flex flex-col justify-between h-[calc(100vh-140px)] sticky top-4 transicao-tema`;
            document.getElementById("titulo-menu").className = `text-xl font-bold border-b-2 pb-2 transicao-tema ${temaCores==='noite'?'border-slate-700':'border-gray-200'}`;
            document.getElementById("titulo-pedido").className = `text-xl font-bold border-b pb-3 mb-4 flex justify-between items-center transicao-tema ${temaCores==='noite'?'border-slate-700':'border-gray-200'}`;
            document.getElementById("valor-total").className = `text-3xl font-black ${t.destaque}`;
            document.getElementById("contador-itens").className = `text-xs px-2.5 py-1 rounded-full font-semibold ${t.badge}`;
        }

        // Desenha a tela aplicando Ordem Alfabética e o Formato Visual escolhido
        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos");
            const t = dicionarioTemas[temaCores];
            grid.innerHTML = "";

            // Ordem Alfabética de A a Z garantida
            produtos.sort((a, b) => a.nome.localeCompare(b.nome));

            // Configura a distribuição espacial dos cards
            if (estruturaVisual === 'lista') {
                grid.className = "flex flex-col gap-2";
            } else if (estruturaVisual === 'gigante') {
                grid.className = "grid grid-cols-1 gap-4"; // 1 coluna gigante
            } else {
                grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-4"; // Grade padrão
            }

            produtos.forEach(p => {
                const qtdNoCarrinho = carrinho[p.id] || 0;
                let disabledBtn = p.estoque === 0 ? "disabled" : "";
                
                let statusEstoqueHtml = `<span class="text-xs ${temaCores==='noite'?'text-green-400':'text-green-600'} font-medium">Estoque: ${p.estoque}</span>`;
                let cardBg = t.card;
                let btnBox = t.botoes;

                if (p.estoque === 0) {
                    statusEstoqueHtml = `<span class="text-xs text-red-500 font-bold bg-red-500/10 px-2 py-0.5 rounded">ESGOTADO</span>`;
                    cardBg = temaCores === 'noite' ? "bg-slate-950 text-gray-600 border-slate-900 opacity-40" : "bg-gray-100 text-gray-400 border-gray-200 opacity-60";
                } else if (p.estoque <= p.critico) {
                    statusEstoqueHtml = `<span class="text-xs text-amber-500 font-bold bg-amber-500/10 px-2 py-0.5 rounded">CRÍTICO: ${p.estoque}</span>`;
                }

                // Renderização 1: Lista Compacta
                if (estruturaVisual === 'lista') {
                    grid.innerHTML += `
                        <div class="border rounded-xl p-3 shadow-sm flex items-center justify-between gap-4 transicao-tema ${cardBg}">
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-base truncate">${p.nome}</h3>
                                <div class="flex items-center gap-3 mt-0.5">
                                    <span class="font-extrabold text-sm ${t.destaque}">R$ ${p.preco.toFixed(2)}</span>
                                    ${statusEstoqueHtml}
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-sm font-bold">Qtd: ${qtdNoCarrinho}</span>
                                <div class="flex items-center gap-1 ${btnBox} rounded-lg p-0.5 border">
                                    <button onclick="alterarQuantidade(${p.id}, -1)" class="w-8 h-8 rounded bg-white text-gray-800 border font-bold flex items-center justify-center hover:bg-orange-50">-</button>
                                    <button onclick="alterarQuantidade(${p.id}, 1)" ${disabledBtn} class="w-8 h-8 rounded bg-white text-gray-800 border font-bold flex items-center justify-center hover:bg-orange-50">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // Renderização 2 & 3: Grade Clássica ou Botões Gigantes
                    let paddingCard = estruturaVisual === 'gigante' ? 'p-6' : 'p-4';
                    let textTamanho = estruturaVisual === 'gigante' ? 'text-2xl' : 'text-lg';
                    let hBtn = estruturaVisual === 'gigante' ? 'w-14 h-14 text-xl' : 'w-10 h-10';

                    grid.innerHTML += `
                        <div class="border rounded-2xl shadow-sm flex flex-col justify-between transicao-tema ${cardBg} ${paddingCard}">
                            <div>
                                <div class="flex justify-between items-start gap-2">
                                    <h3 class="font-bold leading-tight ${textTamanho}">${p.nome}</h3>
                                    <span class="font-black whitespace-nowrap ${t.destaque} ${estruturaVisual==='gigante'?'text-2xl':'text-lg'}">R$ ${p.preco.toFixed(2)}</span>
                                </div>
                                <div class="mt-1">${statusEstoqueHtml}</div>
                            </div>
                            <div class="flex items-center justify-between mt-4 border-t pt-3 border-dashed ${temaCores==='noite'?'border-slate-700':'border-gray-100'}">
                                <span class="text-sm font-medium opacity-70">Selecionado: <b class="text-base font-bold">${qtdNoCarrinho}</b></span>
                                <div class="flex items-center gap-1 ${btnBox} rounded-xl p-1 border">
                                    <button onclick="alterarQuantidade(${p.id}, -1)" class="rounded-lg bg-white text-gray-800 border font-bold flex items-center justify-center hover:bg-orange-50 ${hBtn}">-</button>
                                    <button onclick="alterarQuantidade(${p.id}, 1)" ${disabledBtn} class="rounded-lg bg-white text-gray-800 border font-bold flex items-center justify-center hover:bg-orange-50 ${hBtn}">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        // Altera quantidades respeitando os estoques
        function alterarQuantidade(id, delta) {
            const produto = produtos.find(p => p.id === id);
            const qtdAtual = carrinho[id] || 0;
            const novaQtd = qtdAtual + delta;

            if (novaQtd < 0) return;
            if (novaQtd > produto.estoque) {
                alert(`Ops! Limite de estoque atingido para ${produto.nome}.`);
                return;
            }

            if (novaQtd === 0) delete carrinho[id];
            else carrinho[id] = novaQtd;

            renderizarProdutos();
            atualizarCarrinho();
        }

        // Atualiza painel do carrinho de compras
        function atualizarCarrinho() {
            const lista = document.getElementById("lista-carrinho");
            const totalTxt = document.getElementById("valor-total");
            const contador = document.getElementById("contador-itens");
            
            let total = 0;
            let totalItens = 0;
            lista.innerHTML = "";

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                const qtd = carrinho[id];
                const subtotal = p.preco * qtd;
                total += subtotal;
                totalItens += qtd;

                let itemBg = temaCores === 'noite' ? "bg-slate-900/50 border-slate-700" : "bg-amber-50/50 border-gray-100";
                if (temaCores === 'acessibilidade') itemBg = "border-black border";

                lista.innerHTML += `
                    <div class="flex justify-between items-center text-sm p-2.5 rounded-xl border ${itemBg}">
                        <div class="max-w-[65%]">
                            <p class="font-semibold">${p.nome}</p>
                            <p class="text-xs opacity-60">${qtd}x R$ ${p.preco.toFixed(2)}</p>
                        </div>
                        <span class="font-bold">R$ ${subtotal.toFixed(2)}</span>
                    </div>
                `;
            });

            if (totalItens === 0) {
                lista.innerHTML = `<p class="text-gray-400 text-center py-8 text-sm italic">Nenhum produto selecionado...</p>`;
            }

            contador.innerText = `${totalItens} ${totalItens === 1 ? 'item' : 'itens'}`;
            totalTxt.innerText = `R$ ${total.toFixed(2)}`;
            verificarStatusBotao();
        }

        // Controla e destaca botões de pagamento ativo
        function selecionarPagamento(tipo) {
            formaPagamento = tipo;
            const btnPix = document.getElementById("btn-pix");
            const btnDinheiro = document.getElementById("btn-dinheiro");

            let ativo = "border-emerald-500 bg-emerald-50 text-emerald-700 shadow-inner";
            let inativo = "border-gray-200 text-gray-700 bg-white hover:bg-gray-50";

            if (temaCores === 'noite') {
                ativo = "border-emerald-400 bg-emerald-950/50 text-emerald-400 shadow-md";
                inativo = "border-slate-700 text-slate-300 bg-slate-800 hover:bg-slate-700";
            } else if (temaCores === 'acessibilidade') {
                ativo = "border-4 border-black bg-black text-white rounded-none";
                inativo = "border-2 border-black text-black bg-white rounded-none";
            }

            if (tipo === 'PIX') {
                btnPix.className = `py-3 rounded-xl border-2 font-bold text-center transition-all ${ativo}`;
                btnDinheiro.className = `py-3 rounded-xl border-2 font-bold text-center transition-all ${inativo}`;
            } else {
                btnDinheiro.className = `py-3 rounded-xl border-2 font-bold text-center transition-all ${ativo}`;
                btnPix.className = `py-3 rounded-xl border-2 font-bold text-center transition-all ${inativo}`;
            }
            verificarStatusBotao();
        }

        // Valida ativação do botão concluir
        function verificarStatusBotao() {
            const btn = document.getElementById("btn-finalizar");
            const temItens = Object.keys(carrinho).length > 0;
            const t = dicionarioTemas[temaCores];

            if (temItens && formaPagamento) {
                btn.disabled = false;
                let classeBtn = (temaCores === 'noite' || temaCores==='acessibilidade') ? "bg-emerald-500 text-slate-950 hover:bg-emerald-400" : "bg-orange-600 text-white hover:bg-orange-700";
                if (temaCores === 'acessibilidade') { btn.className = `w-full bg-black text-white font-bold py-4 text-center text-lg border-4 border-black rounded-none`; }
                else { btn.className = `w-full ${classeBtn} font-bold py-4 rounded-xl text-center text-lg shadow-lg transition-all transform active:scale-95`; }
                btn.innerText = `Finalizar em ${formaPagamento}`;
            } else {
                btn.disabled = true;
                let desativado = temaCores === 'noite' ? "bg-slate-700 text-slate-500 border-slate-800" : "bg-gray-300 text-gray-500 border-gray-200";
                btn.className = `w-full ${desativado} font-bold py-4 rounded-xl text-center text-lg border cursor-not-allowed`;
                btn.innerText = temItens ? "Selecione o Pagamento" : "Adicione Itens ao Pedido";
            }
        }

        // Executa a limpeza e simula o disparo
        function finalizarVenda() {
            alert(`Venda concluída com sucesso via ${formaPagamento}!\nFichas liberadas para a entrega.`);
            
            // Simula baixa no estoque
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                p.estoque -= carrinho[id];
            });

            carrinho = {};
            formaPagamento = null;
            
            // Reseta botões de pagamento
            const r = temaCores === 'noite' ? "border-slate-700 text-slate-300 bg-slate-800" : (temaCores==='acessibilidade' ? "border-2 border-black text-black bg-white rounded-none":"border-gray-200 text-gray-700 bg-white");
            document.getElementById("btn-pix").className = `py-3 rounded-xl border-2 font-bold text-center ${r}`;
            document.getElementById("btn-dinheiro").className = `py-3 rounded-xl border-2 font-bold text-center ${r}`;
            
            renderizarProdutos();
            atualizarCarrinho();
        }

        // Carga Inicial do Sistema
        atualizarCoresDoLayout();
        renderizarProdutos();
    </script>
</body>
</html>
