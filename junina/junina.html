<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grêmio | Festa Junina</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-sistema { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #container-botao-flutuante { touch-action: none; user-select: none; }
    </style>
</head>
<body class="bg-slate-50 font-sistema min-h-screen flex flex-col antialiased text-slate-800 select-none">

    <header class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <!-- Configurado para 4 colunas no LG (75% produtos / 25% checkout) para dar a largura perfeita ao carrinho -->
    <main class="flex-1 max-w-[1800px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <!-- Produtos ocupam 3 das 4 colunas (75% da tela) -->
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2></div>
            <!-- Retornado para xl:grid-cols-7 (7 cards no computador com visual simétrico e espaçado) -->
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2">
                <p id="loading-txt" class="col-span-full text-center text-slate-400 italic py-8 text-sm">Carregando cardápio...</p>
            </div>
        </section>

        <!-- Carrinho ocupa 1 das 4 colunas (25% da tela), eliminando quebras de linha indesejadas -->
        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full">
            <div id="card-checkout" class="bg-white w-full max-w-lg lg:max-w-none rounded-md shadow-2xl lg:shadow-md border border-slate-300 p-4 flex flex-col justify-between h-[85vh] lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <h3 id="titulo-checkout" class="text-base font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2">PAGAMENTO</h3>
                    <div class="flex-1 flex flex-col min-h-0">
                        <div class="flex justify-between items-center mb-1.5 w-full px-0.5 h-4">
                            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resumo:</h4>
                            <button id="btn-limpar-carrinho" onclick="limparCarrinhoCompleto()" class="text-xs font-semibold text-slate-400 uppercase tracking-wider pr-1 hover:text-slate-600">Limpar</button>
                            <span id="id-pedido-cabecalho" class="text-xs font-medium text-slate-400 tracking-wide ml-auto hidden"></span>
                        </div>
                        <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1 relative scroll-celular-perfeito">
                            <p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>
                        </div>
                    </div>

                    <div id="bloco-inferior-pagamento" class="space-y-4 pt-1 border-t opacity-40 pointer-events-none transition-opacity duration-200">
                        <div class="space-y-1.5">
                            <label class="text-xs font-semibold text-slate-400 block uppercase tracking-wider text-center">Forma de Pagamento:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-slate-100 text-slate-700 opacity-40 transition-all disabled:cursor-not-allowed">DINHEIRO</button>
                                <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 transition-all disabled:cursor-not-allowed">PIX</button>
                            </div>
                        </div>

                        <div class="w-full overflow-hidden border-t border-dashed pt-3 h-[130px] pb-1 relative">
                            <div id="carrossel-pagamento" class="w-[200%] h-full flex transition-transform duration-300 transform translate-x-0">
                                <div id="secao-valores-dinheiro" class="w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200">
                                    <div class="flex justify-between items-center text-base"><span class="text-slate-500 font-medium">Pedido</span><span id="valor-pedido-txt" class="font-bold text-slate-700">R$ 0,00</span></div>
                                    <div class="flex justify-between items-center text-base"><span class="text-slate-500 font-medium">Recebido</span><div class="relative w-36"><span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">R$</span><input type="text" id="input-recebido" placeholder="0,00" disabled oninput="tratarMascaraDinheiro(this)" class="w-full pl-7 pr-2.5 py-0.5 border border-slate-300 rounded-md text-right font-bold text-slate-800 focus:outline-none focus:border-orange-500 text-base disabled:bg-slate-50 select-text"></div></div>
                                    <div class="flex justify-between items-center text-base border-t border-slate-100 pt-1.5"><span class="text-slate-500 font-medium">Troco</span><span id="valor-troco-txt" class="font-bold text-orange-600">R$ 0,00</span></div>
                                </div>
                                <div id="secao-valores-pix" class="w-1/2 h-full flex items-center justify-center">
                                    <div id="box-qrcode" onclick="requisitarQrCodeReal()" class="w-28 h-28 bg-slate-100 border border-slate-300 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 active:scale-95 text-center p-2">
                                        <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider leading-tight">Gerar<br>QR Code</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-1.5 mt-2 pt-2 border-t w-full">
                    <button onclick="processarCliqueFinalizar()" id="btn-finalizar" disabled class="w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed transition-all">Finalizar</button>
                    <button onclick="fecharOverlay()" class="text-xs text-slate-400 hover:text-slate-600 underline font-medium py-1">Voltar ao pedido</button>
                </div>
            </div>
        </section>
    </main>

    <div id="container-botao-flutuante" class="fixed z-40 flex justify-center pointer-events-none transition-none" style="bottom: 16px; left: 0; right: 0; margin: 0 auto; width: max-content;">
        <div id="caixa-flutuante-base" class="pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center justify-center min-w-[240px] max-w-xs cursor-move select-none text-sm">
            <div id="conteudo-flutuante-unico" class="text-base tracking-wide text-center py-1">Pedido R$ 0,00 - Revisar e Pagar</div>
        </div>
    </div>

    <script>
        const URL_LEITURA = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/161fb6d3f71245f187e74df0ae0616b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dxOAva-wcRMsB3WRw8zfGu6XMtuQsOZGgRGdQ5Waxh4";
        const URL_MÃE = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/98221223b0c5414085d99db3124350bb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sXkYuHLSdt1s6aiLFFkMc0fJKd27HDthp4nNRM2Qz20";
        
        const CSS_BTN_ATIVO = "py-2.5 rounded-md border border-orange-500 bg-orange-50 text-orange-700 font-bold text-sm text-center shadow-sm transition-all", CSS_BTN_INATIVO = "py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 shadow-sm transition-all", CSS_FINALIZAR_HABILITADO = "w-full bg-orange-500 hover:bg-orange-600 text-white font-normal py-3.5 rounded-md text-center text-base shadow cursor-pointer transition-all transform active:scale-95", CSS_FINALIZAR_DESABILITADO = "w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed", CSS_BASE_FLUTUANTE = "pointer-events-auto text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center justify-between min-w-[240px] max-w-xs text-sm";

        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, pixChaveIdentificadora = "", stringQrCodeBase64Salva = "", modoBuscaAtivo = false, modoResgateManual = false, cachePedidoOnlineOriginal = [], intervaloPix = null, loopEmExecucao = false, timestampCriacaoPix = 0, carrinhoBloqueado = false;

        const formatarMoeda = (v) => v.toFixed(2).replace('.', ',');
        const exibirFalhaProcessamento = () => { alert("Falha no processamento"); reabrirVisualBotaoFinalizar(); };
        const liberarExibicaoSegura = () => { document.documentElement.style.visibility = document.body.style.visibility = "visible"; document.documentElement.style.opacity = document.body.style.opacity = "1"; };
        
        const renderBotaoFlutuante = (estilo, html, limpar = false) => { 
            const bf = document.getElementById("caixa-flutuante-base"); 
            bf.className = estilo + " cursor-move"; 
            bf.innerHTML = html; 
            bf.onclick = limpar ? null : executarCliqueOuArrasto; 
        };

        window.addEventListener('DOMContentLoaded', () => {
            inicializarMecanicaBotaoArrastavel();
            const cache = localStorage.getItem("festa_junina_cardapio");
            if (cache) { 
                try {
                    produtos = JSON.parse(cache); 
                    renderizarProdutos(); 
                } catch(e) { console.error("Erro ao ler cache", e); }
            }
            carregarEstoqueReal(); 
            iniciarMotorSincronizacaoOculto();
            setTimeout(liberarExibicaoSegura, 2500);
        });

        let estaArrastando = false, xInicial = 0, yInicial = 0, distMovidaX = 0, distMovidaY = 0;
        const containerBotao = document.getElementById("container-botao-flutuante");
        const caixaFlutuante = document.getElementById("caixa-flutuante-base");

        function inicializarMecanicaBotaoArrastavel() {
            const obterCoordenadas = (e) => e.type.startsWith("touch") ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
            
            const noInicio = (e) => {
                estaArrastando = true;
                const coord = obterCoordenadas(e);
                const rect = containerBotao.getBoundingClientRect();
                xInicial = coord.x - rect.left;
                yInicial = coord.y - rect.top;
                distMovidaX = 0; distMovidaY = 0;
            };

            const emMovimento = (e) => {
                if (!estaArrastando) return;
                if (e.cancelable) e.preventDefault();
                const coord = obterCoordenadas(e);
                let x = coord.x - xInicial;
                let y = coord.y - yInicial;

                distMovidaX += Math.abs(x - parseInt(containerBotao.style.left || 0));
                distMovidaY += Math.abs(y - parseInt(containerBotao.style.top || 0));

                Object.assign(containerBotao.style, { bottom: "auto", right: "auto", margin: "0", left: x + "px", top: y + "px" });
            };

            const noFim = () => {
                if (!estaArrastando) return;
                estaArrastando = false;
                const rect = containerBotao.getBoundingClientRect();
                let nx = rect.left, ny = rect.top;
                if (nx < (40 - rect.width)) nx = 40 - rect.width;
                if (nx > (window.innerWidth - 40)) nx = window.innerWidth - 40;
                if (ny < 0) ny = 0;
                if (ny > (window.innerHeight - 40)) ny = window.innerHeight - 40;
                Object.assign(containerBotao.style, { left: nx + "px", top: ny + "px" });
            };

            caixaFlutuante.addEventListener("mousedown", noInicio);
            caixaFlutuante.addEventListener("touchstart", noInicio, { passive: true });
            document.addEventListener("mousemove", emMovimento, { passive: false });
            document.addEventListener("touchmove", emMovimento, { passive: false });
            document.addEventListener("mouseup", noFim);
            document.addEventListener("touchend", noFim);
            caixaFlutuante.onclick = executarCliqueOuArrasto;
        }

        function executarCliqueOuArrasto(e) {
            if (distMovidaX > 6 || distMovidaY > 6) {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                return false;
            }
            abrirOverlayCelular();
        }

        async function diagnosticarInternetEstavel() {
            if (!navigator.onLine) return false;
            try {
                const c = new AbortController(); setTimeout(() => c.abort(), 2500);
                await fetch("https://www.google.com", { mode: "no-cors", signal: c.signal }); return true;
            } catch (e) { return false; }
        }

        async function carregarEstoqueReal(id = "") {
            try {
                const r = await fetch(URL_LEITURA, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(id).trim() }) });
                const combo = await r.json();
                if (combo && combo.produto) { 
                    produtos = combo.produto.map(l => ({ id: parseInt(l.ID || l.id), sigla: l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : (l.sigla ? String(l.sigla).trim().toUpperCase() : "??"), nome: l.PRODUTO || l.produto, preco: parseFloat(l.PRECO || l.preco), estoque: parseInt(l.ATUAL || l.estoque_atual) }));
                    localStorage.setItem("festa_junina_cardapio", JSON.stringify(produtos)); 
                    renderizarProdutos();
                }
                if (id !== "" && combo && combo.pedido) processarResultadoBuscaPedido(combo.pedido, id);
            } catch (e) { 
                console.error(e); 
                if (id !== "") forçarFechamentoSistemico();
                if (produtos.length === 0) document.getElementById("grid-produtos").innerHTML = `<p class="col-span-full text-center text-rose-500 py-8 text-sm">Falha ao carregar produtos. Verifique a rede.</p>`;
            } finally { liberarExibicaoSegura(); }
        }

        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos"); grid.innerHTML = "";
            if(produtos.length === 0) return;
            
            produtos.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(p => {
                const qtd = carrinho[p.id] || 0, esg = p.estoque === 0;
                let cEstilo = (esg || carrinhoBloqueado) ? "bg-slate-100 text-slate-400 pointer-events-none opacity-60" : `bg-white hover:border-slate-400 cursor-pointer ${qtd > 0 ? "border-orange-400/70 shadow-md" : "border-slate-300 shadow-sm"}`;
                if (modoBuscaAtivo || modoResgateManual) cEstilo = "bg-slate-50 border-slate-300 text-slate-300 pointer-events-none opacity-40";

                grid.innerHTML += `
                    <div onclick="alterarQuantidade(${p.id}, 1)" class="border rounded-lg p-2 flex flex-col justify-between transition-all min-w-0 ${cEstilo}">
                        <div class="w-full aspect-square rounded-lg flex flex-col justify-between p-1 relative mb-2 ${qtd > 0 && !esg ? "bg-orange-50 border border-orange-200 text-orange-700" : "bg-slate-200 text-slate-600"}">
                            <div class="text-center font-bold text-[13px] sm:text-[15px] md:text-base lg:text-lg xl:text-base mt-1 px-1 flex items-center justify-center flex-1 leading-none w-full">${p.sigla}</div>
                            <div class="flex items-center justify-between w-full mt-auto">
                                <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, -1)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm ${qtd === 0 || carrinhoBloqueado ? 'opacity-20 pointer-events-none' : ''}">-</button>
                                <span class="text-xs font-bold text-center flex-1">${qtd > 0 ? `<span class="text-orange-600 text-base font-semibold">${qtd}</span>` : '-'}</span>
                                <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, 1)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm ${esg || carrinhoBloqueado ? 'opacity-20 pointer-events-none' : ''}">+</button>
                            </div>
                        </div>
                        <div class="min-w-0 flex flex-col justify-between flex-1">
                            <h3 class="font-semibold text-slate-700 text-[14px] truncate leading-tight mb-0.5 text-left">${p.nome}</h3>
                            <div class="flex items-center justify-between text-[13px] font-medium w-full"><span class="text-orange-600 font-semibold">R$ ${formatarMoeda(p.preco)}</span><div>E: <span class="${esg || p.estoque <= 10 ? 'text-rose-500 font-semibold' : 'text-orange-600 font-semibold'}">${p.estoque}</span></div></div>
                        </div>
                    </div>`;
            });
            let pre = modoBuscaAtivo || modoResgateManual;
            grid.innerHTML += `
                <div class="border rounded-lg p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 bg-white border-slate-300">
                    <div class="w-full aspect-square rounded-lg flex flex-col justify-between p-1 relative mb-2 ${pre ? 'bg-slate-800 text-white' : 'bg-slate-200 text-slate-600'}">
                        <div class="text-center font-bold text-[13px] sm:text-[15px] md:text-base lg:text-lg xl:text-base mt-1 px-1 flex items-center justify-center flex-1 leading-none w-full">ON</div>
                        <div class="flex items-center justify-between w-full mt-auto">
                            <button onclick="forçarFechamentoSistemico(event)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/20 font-bold text-sm ${!pre ? 'opacity-20 pointer-events-none' : ''}">-</button>
                            <span class="text-[13px] font-semibold text-center flex-1">${pre ? 'ativo' : '-'}</span>
                            <button onclick="activarModoBuscaPre(event)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/20 font-bold text-sm ${pre || carrinhoBloqueado ? 'opacity-20 pointer-events-none' : ''}">+</button>
                        </div>
                    </div>
                    <div class="min-w-0 flex flex-col justify-between flex-1"><h3 class="font-semibold text-slate-700 text-[14px] truncate leading-tight mb-0.5 text-left">Online</h3><div class="text-[13px] font-semibold text-orange-600">R$ 0,00</div></div>
            </div>`;
        }

        function alterarQuantidade(id, d) {
            if (carrinhoBloqueado) return;
            const p = produtos.find(i => i.id == id); if (!p) return;
            const n = (carrinho[id] || 0) + d;
            if (d > 0 && (carrinho[id] || 0) >= p.estoque) return;
            if (n <= 0) delete carrinho[id]; else carrinho[id] = n;
            renderizarProdutos(); atualizarCarrinhoDOM();
        }

        function removerItemDoCarrinhoCompleto(id) { if (!carrinhoBloqueado && carrinho[id]) { delete carrinho[id]; renderizarProdutos(); atualizarCarrinhoDOM(); } }
         
        function limparCarrinhoCompleto() { 
            carrinho = {}; 
            if (intervaloPix) clearInterval(intervaloPix);
            intervaloPix = null; pixChaveIdentificadora = stringQrCodeBase64Salva = ""; timestampCriacaoPix = 0;
            carrinhoBloqueado = false; renderizarProdutos(); resetarEstadoPagamento();
            document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full";
            atualizarCarrinhoDOM(); 
        }

        function construirMensagemFichas(arr) {
            let copia = [...arr]; copia.sort((a, b) => a.produto.localeCompare(b.produto));
            let txt = "Venda Finalizada!\n\n";
            copia.forEach(i => txt += `- ${i.quantidade}x ${i.produto}\n`);
            return txt;
        }

        function atualizarCarrinhoDOM() {
            if (modoResgateManual) return;
            const lista = document.getElementById("lista-carrinho"), bloco = document.getElementById("bloco-inferior-pagamento");
            const btnDin = document.getElementById("btn-dinheiro"), btnPix = document.getElementById("btn-pix"), cabId = document.getElementById("id-pedido-cabecalho");
            totalAtual = 0; let tItens = 0; lista.innerHTML = "";

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(i => i.id == id), qtd = carrinho[id], sub = p.preco * qtd; totalAtual += sub; tItens += qtd;
                lista.innerHTML += `
                    <div data-id="${id}" class="flex justify-between items-center bg-slate-50 p-[6px] rounded-md border border-slate-100 relative ${carrinhoBloqueado ? 'opacity-60 pointer-events-none' : ''}">
                        <div class="max-w-[75%] min-w-0 w-full">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <p class="font-semibold text-slate-700 truncate text-[13px]">${p.nome}</p>
                                <button type="button" onclick="removerItemDoCarrinhoCompleto(${id})" class="text-[11px] text-slate-400 hover:text-rose-500 p-1 -m-1 ${carrinhoBloqueado ? 'hidden' : ''}">Remover</button>
                            </div>
                            <p class="text-[12px] text-slate-400 mt-0.5">${qtd}x R$ ${formatarMoeda(p.preco)}</p>
                        </div>
                        <span class="font-semibold text-slate-700 text-[15px] flex-shrink-0 pl-2">R$ ${formatarMoeda(sub)}</span>
                    </div>`;
            });

            if (tItens === 0) {
                lista.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>`;
                bloco.className = "space-y-4 pt-1 border-t opacity-40 pointer-events-none";
                btnDin.disabled = btnPix.disabled = true; btnDin.classList.remove("opacity-100", "bg-white"); btnDin.classList.add("opacity-40", "bg-slate-100");
                cabId.classList.add("hidden"); resetarEstadoPagamento();
            } else {
                bloco.className = "space-y-4 pt-1 border-t opacity-100 pointer-events-auto";
                btnPix.disabled = btnDin.disabled = false;
                btnDin.className = btnPix.className = CSS_BTN_INATIVO;
                cabId.classList.add("hidden");
            }
            if (!modoBuscaAtivo) document.getElementById("conteudo-flutuante-unico").innerText = `Pedido R$ ${formatarMoeda(totalAtual)} - Revisar e Pagar`;
            document.getElementById("valor-pedido-txt").innerText = `R$ ${formatarMoeda(totalAtual)}`; validarEstadoFinalizar();
        }

        function aplicarDescontoEstoqueLocal() {
            Object.keys(carrinho).forEach(id => { const p = produtos.find(i => i.id == id); if (p) p.estoque = Math.max(0, p.estoque - carrinho[id]); });
            renderizarProdutos();
        }

        const extrairItensParaEnvio = (pronto = null) => {
            if (pronto) return pronto.map(i => ({ sigla: String(i.sigla || i.SIGLA || "??").trim().toUpperCase(), produto: String(i.produto || i.PRODUTO).trim(), grandmother_id: parseInt(i.grandmother_id || i.GRANDMOTHER_ID || i.ID || i.id || 0), quantidade: parseInt(i.quantidade || i.QUANTIDADE || 1), preco: parseFloat(i.preco || i.PRECO || 0), total: parseFloat(i.total || i.TOTAL || 0) }));
            return Object.keys(carrinho).map(id => { const p = produtos.find(i => i.id == id); return { sigla: p.sigla, produto: p.nome, grandmother_id: parseInt(p.id), grandmother_id: parseInt(p.id), quantidade: parseInt(carrinho[id]), preco: parseFloat(p.preco), total: parseFloat(p.preco * carrinho[id]) }; });
        };

        const gerarPayloadVenda = (id, forma, tipo = "CAIXA", pronto = null, cont = false) => {
            const obj = { id_pagamento: String(id).trim(), pagamento: forma, tipo_venda: tipo, status_retirada: "retirado", total_pedido_consolidado: parseFloat(totalAtual), transaction_amount: parseFloat(totalAtual), itens: extrairItensParaEnvio(pronto) };
            if (cont) obj.contingencia = true; return JSON.stringify(obj);
        };

        function tratarContingenciaOffline(id, forma, tipo, itens, msg) {
            if (confirm(msg)) {
                if (tipo === "CAIXA") aplicarDescontoEstoqueLocal();
                const proc = extrairItensParaEnvio(itens); salvarNoCacheContingencia(id, forma, tipo, proc);
                alert(construirMensagemFichas(proc)); resetSistemicoTotal(false); return true;
            }
            reabrirVisualBotaoFinalizar(); return false;
        }

        async function enviarVendaNuvem(id, forma, tipo = "CAIXA", pronto = null) {
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(id, forma, tipo, pronto) });
                if (!r.ok) throw new Error();
                setTimeout(async () => { await carregarEstoqueReal(); alert(construirMensagemFichas(extrairItensParaEnvio(pronto))); resetSistemicoTotal(true); }, 1500);
            } catch (e) { exibirFalhaProcessamento(); }
        }

        async function processarCliqueFinalizar() {
            const btn = document.getElementById("btn-finalizar"); btn.disabled = true; btn.innerText = "Processando..."; btn.className = CSS_FINALIZAR_DESABILITADO;
            const net = await diagnosticarInternetEstavel();
            if (modoResgateManual) {
                if (!net) tratarContingenciaOffline(pixChaveIdentificadora, "PIX", "ONLINE", cachePedidoOnlineOriginal, "Sistema Offline\nConfirmar entrega?");
                else executingBaixaPedidoEntregue(); return;
            }
            if (formaPagamento === 'DINHEIRO') {
                let idDin = `DINHEIRO-${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}-${Date.now().toString().slice(-4)}`;
                if (!net) tratarContingenciaOffline(idDin, "DINHEIRO", "CAIXA", null, "Sistema offline\nFinalizar venda?");
                else { aplicarDescontoEstoqueLocal(); enviarVendaNuvem(idDin, "DINHEIRO"); }
            } else if (formaPagamento === 'PIX') {
                if (!pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) { alert("QR Code não foi gerado.\nNão é possível finalizar em contingência."); reabrirVisualBotaoFinalizar(); return; }
                if (!net) tratarContingenciaOffline(pixChaveIdentificadora, "PIX", "CAIXA", extrairItensParaEnvio(), "Sistema offline\nFinalizar venda?");
                else if ((Date.now() - timestampCriacaoPix) >= 59000) { if (intervaloPix) clearInterval(intervaloPix); intervaloPix = null; tratarContingenciaOffline(pixChaveIdentificadora, "PIX", "CAIXA", extrairItensParaEnvio(), "Sistema lento\nFinalizar venda?"); }
                else { if (await consultarStatusMercadoPagoDireto()) { if (intervaloPix) clearInterval(intervaloPix); intervaloPix = null; aplicarDescontoEstoqueLocal(); enviarVendaNuvem(pixChaveIdentificadora, 'PIX'); } else { alert("Pagamento Pendente"); reabrirVisualBotaoFinalizar(); } }
            }
        }

        function selecionarPagamento(tipo) {
            if (Object.keys(carrinho).length === 0) return;
            formaPagamento = tipo;
            if (intervaloPix) clearInterval(intervaloPix);
            intervaloPix = null; carrinhoBloqueado = true;
            renderizarProdutos(); atualizarCarrinhoDOM();
            document.getElementById("btn-dinheiro").className = tipo === 'DINHEIRO' ? CSS_BTN_ATIVO : CSS_BTN_INATIVO;
            document.getElementById("btn-pix").className = tipo === 'PIX' ? CSS_BTN_ATIVO : CSS_BTN_INATIVO;
            document.getElementById("carrossel-pagamento").className = `w-[200%] h-full flex transition-transform duration-300 transform ${tipo === 'DINHEIRO' ? 'translate-x-0' : '-translate-x-1/2'}`;
            document.getElementById("secao-valores-dinheiro").className = `w-1/2 h-full space-y-3.5 transition-all duration-200 ${tipo === 'DINHEIRO' ? 'opacity-100' : 'opacity-25 pointer-events-none'}`;
            const inp = document.getElementById("input-recebido"); inp.disabled = tipo !== 'DINHEIRO';
            if (tipo === 'DINHEIRO') { inp.value = ""; setTimeout(() => inp.focus(), 50); }
            validarEstadoFinalizar();
        }

        function validarEstadoFinalizar() {
            if (modoResgateManual) return;
            const btn = document.getElementById("btn-finalizar"), rec = parseFloat(document.getElementById("input-recebido").value.replace(/\D/g, "")) / 100 || 0;
            btn.disabled = formaPagamento === 'PIX' ? !(pixChaveIdentificadora !== "" && !pixChaveIdentificadora.startsWith("mp_")) : !(Object.keys(carrinho).length > 0 && formaPagamento === 'DINHEIRO' && rec >= totalAtual);
            btn.className = btn.disabled ? CSS_FINALIZAR_DESABILITADO : CSS_FINALIZAR_HABILITADO;
        }

        function tratarMascaraDinheiro(inp) {
            let val = inp.value.replace(/\D/g, ""); if (val === "") return;
            let num = parseFloat(val) / 100; inp.value = num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const txtT = document.getElementById("valor-troco-txt");
            txtT.innerText = num < totalAtual ? "Dinheiro Insuficiente" : `R$ ${formatarMoeda(num - totalAtual)}`;
            txtT.className = num < totalAtual ? "font-bold text-rose-500 text-xs" : "font-bold text-orange-600 text-base";
            validarEstadoFinalizar();
        }

        async function requisitarQrCodeReal() {
            if (!formaPagamento || formaPagamento !== 'PIX') return;
            const box = document.getElementById("box-qrcode"), btn = document.getElementById("btn-finalizar");
            box.className = "w-28 h-28 bg-white border border-slate-300 text-[10px] font-bold text-slate-400 uppercase text-center flex flex-col items-center justify-center p-2 pointer-events-none";
            box.innerHTML = `<span>Carregando...</span>`; pixChaveIdentificadora = "mp_" + Date.now(); timestampCriacaoPix = Date.now();
            btn.disabled = true; btn.className = CSS_FINALIZAR_DESABILITADO;
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(pixChaveIdentificadora, 'PIX') }); const d = await r.json();
                if (d.id_mercado_pago === "BLOQUEADO" || d.mensagem && d.mensagem !== "novo") {
                    box.className = "w-28 h-28 bg-slate-300 border border-slate-400 flex items-center justify-center text-center p-1 pointer-events-none";
                    box.innerHTML = `<span class="text-[10px] font-bold text-slate-600 uppercase tracking-tight leading-tight">Pedido<br>Bloqueado</span>`;
                    resetarEstadoPagamento(); alert(d.mensagem || "Pedido online indisponível."); return;
                }
                if (d.id_mercado_pago) {
                    pixChaveIdentificadora = String(d.id_mercado_pago).trim(); stringQrCodeBase64Salva = d.qrcode_imagem;
                    box.className = "w-28 h-28 bg-white flex items-center justify-center border border-slate-300";
                    box.innerHTML = `<img src="data:image/jpeg;base64,${stringQrCodeBase64Salva}" class="w-full h-full object-contain">`; btn.innerText = "Finalizar";
                    setTimeout(() => { if (formaPagamento === 'PIX' && pixChaveIdentificadora !== "" && !pixChaveIdentificadora.startsWith("mp_")) { btn.disabled = false; btn.className = CSS_FINALIZAR_HABILITADO; } }, 12000);
                    iniciarMonitoramentoPixAutomatico();
                } else throw new Error();
            } catch (e) { alert("Falha ao gerar QR Code"); resetarEstadoPagamento(); }
        }

        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix); loopEmExecucao = false;
            intervaloPix = setInterval(async () => {
                if (loopEmExecucao || !pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) return;
                if (Date.now() - timestampCriacaoPix > 600000) { clearInterval(intervaloPix); alert("Tempo limite esgotado"); forçarFechamentoSistemico(); return; }
                loopEmExecucao = true;
                if (await consultarStatusMercadoPagoDireto()) { clearInterval(intervaloPix); aplicarDescontoEstoqueLocal(); enviarVendaNuvem(pixChaveIdentificadora, 'PIX'); }
                loopEmExecucao = false;
            }, 6000);
        }

        async function consultarStatusMercadoPagoDireto() {
            if (!pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) return false;
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(pixChaveIdentificadora).trim(), pagamento: "PIX", tipo_venda: "CAIXA", total_pedido_consolidado: parseFloat(totalAtual), transaction_amount: parseFloat(totalAtual) }) });
                return r.ok && (await r.json()).pago === true;
            } catch (erro) { return false; }
        }

        function abrirOverlayCelular() { 
            if (window.innerWidth < 1024 || modoResgateManual) { 
                document.getElementById("painel-fechamento").className = "fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm"; 
            } 
        }

        function fecharOverlay() { if (modoResgateManual) forçarFechamentoSistemico(); else { carrinhoBloqueado = false; renderizarProdutos(); document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full"; resetarEstadoPagamento(); } }
        function forçarFechamentoSistemico(e) { if(e) { e.stopPropagation(); e.preventDefault(); } if (intervaloPix) clearInterval(intervaloPix); intervaloPix = null; pixChaveIdentificadora = ""; document.getElementById("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full"; document.getElementById("painel-fechamento").classList.add("hidden"); resetSistemicoTotal(true); }
        function resetSistemicoTotal(http = true) { carrinhoBloqueado = modoResgateManual = modoBuscaAtivo = false; carrinho = {}; totalAtual = 0; cachePedidoOnlineOriginal = []; document.getElementById("titulo-checkout").innerText = "PAGAMENTO"; document.getElementById("titulo-checkout").className = "text-base font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2"; renderBotaoFlutuante("pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center justify-center min-w-[240px] max-w-xs cursor-pointer text-sm", `<div id="conteudo-flutuante-unico" class="text-base tracking-wide text-center py-1">Pedido R$ 0,00 - Revisar e Pagar</div>`); resetarEstadoPagamento(); atualizarCarrinhoDOM(); document.getElementById("painel-fechamento").classList.add("hidden"); if (http) carregarEstoqueReal(); else renderizarProdutos(); }
        function resetarEstadoPagamento() { if (intervaloPix) clearInterval(intervaloPix); intervaloPix = null; formaPagamento = null; pixChaveIdentificadora = stringQrCodeBase64Salva = ""; timestampCriacaoPix = 0; reabrirVisualBotaoFinalizar(); document.getElementById("btn-pix").className = CSS_BTN_INATIVO; const btnDin = document.getElementById("btn-dinheiro"); btnDin.className = CSS_BTN_INATIVO; btnDin.disabled = document.getElementById("btn-pix").disabled = (Object.keys(carrinho).length === 0); document.getElementById("carrossel-pagamento").className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0"; document.getElementById("secao-valores-dinheiro").className = "w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none"; const inp = document.getElementById("input-recebido"); inp.disabled = true; inp.value = ""; document.getElementById("valor-troco-txt").innerText = "R$ 0,00"; const box = document.getElementById("box-qrcode"); box.className = "w-28 h-28 bg-slate-100 border border-slate-300 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 active:scale-95 text-center p-2"; box.innerHTML = `<span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider leading-tight">Gerar<br>QR Code</span>`; validarEstadoFinalizar(); }
        function reabrirVisualBotaoFinalizar() { document.getElementById("btn-finalizar").innerText = "Finalizar"; validarEstadoFinalizar(); }
        function activarModoBuscaPre(e) { if(e) { e.stopPropagation(); e.preventDefault(); } modoBuscaAtivo = true; carrinho = {}; atualizarCarrinhoDOM(); renderizarProdutos(); renderBotaoFlutuante(`bg-slate-800 ${CSS_BASE_FLUTUANTE} cursor-default`, `<div class="text-left font-medium text-sm">ID do Pagamento:</div><input type="text" id="input-id-busca" placeholder="000000000000" class="bg-transparent text-white font-medium text-sm focus:outline-none flex-1 h-full px-2 text-center placeholder-white/30 min-w-0 select-text" maxlength="12" oninput="tratarDigitacaoIdBusca(this)"><div onclick="forçarFechamentoSistemico(event)" class="text-sm font-medium text-white/60 hover:text-white cursor-pointer transition-colors text-right">Sair</div>`, true); setTimeout(() => { const ib = document.getElementById("input-id-busca"); if(ib) ib.focus(); }, 100); }
        function tratarDigitacaoIdBusca(input) { input.value = input.value.replace(/\D/g, ""); if (input.value.length === 12) { input.disabled = true; carregarEstoqueReal(input.value); } }
        function processarResultadoBuscaPedido(linhas, id) { const lines = linhas.filter(l => String(l.ID_PAGAMENTO).trim() === String(id).trim()); if (lines.length === 0) { renderBotaoFlutuante("pointer-events-auto bg-rose-600 text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center justify-center min-w-[240px] max-w-xs cursor-pointer text-sm", `<span>Não encontrado</span>`); setTimeout(() => forçarFechamentoSistemico(), 2000); return; } modoResgateManual = true; modoBuscaAtivo = false; pixChaveIdentificadora = String(id).trim(); cachePedidoOnlineOriginal = lines.map(l => ({ sigla: l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : "PRE", produto: l.PRODUTO ? String(l.PRODUTO).trim() : "Produto Online", grandmother_id: parseInt(l.ID || l.id || l.GRANDMOTHER_ID || 0), quantidade: parseInt(l.QUANTIDADE) || 1, preco: parseFloat(l.PRECO) || 0, total: parseFloat(l.TOTAL) || 0 })); carrinhoBloqueado = true; renderizarProdutos(); document.getElementById("titulo-checkout").innerText = "PAGAMENTO"; document.getElementById("titulo-checkout").className = "text-sm font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2"; document.getElementById("bloco-inferior-pagamento").className = "hidden pointer-events-none"; const cabId = document.getElementById("id-pedido-cabecalho"); cabId.innerText = `ID: ${id}`; cabId.classList.remove("hidden"); const btn = document.getElementById("btn-finalizar"); btn.disabled = false; btn.innerText = "Finalizar"; btn.className = CSS_FINALIZAR_HABILITADO; const lista = document.getElementById("lista-carrinho"); lista.innerHTML = ""; let valCons = 0; lines.forEach(linha => { const tot = parseFloat(linha.TOTAL) || 0; valCons += tot; let ent = (linha.RETIRADA ? String(linha.RETIRADA).trim().toLowerCase() : "pendente") === "retirado"; if (ent) { btn.disabled = true; btn.innerText = "Produto Entregue!"; btn.className = "w-full bg-slate-300 text-slate-500 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed"; } lista.innerHTML += `<div class="flex justify-between items-center bg-white p-[6px] rounded-md border border-slate-200 shadow-sm font-sistema"><div class="max-w-[70%] min-w-0"><p class="font-semibold text-slate-700 truncate text-[13px]">${linha.PRODUTO || linha.produto}</p><p class="text-[12px] text-slate-400 mt-0.5">${parseInt(linha.QUANTIDADE) || 1}x R$ ${formatarMoeda(parseFloat(linha.PRECO) || 0)}</p></div><div class="text-right flex-shrink-0 pl-2"><p class="font-semibold text-slate-700 text-[15px]">R$ ${formatarMoeda(tot)}</p>${ent ? '<span class="text-rose-500 font-bold text-[12px] block mt-0.5">[ENTREGUE]</span>' : '<span class="text-amber-600 font-bold text-[12px] block mt-0.5">[PENDENTE]</span>'}</div></div>`; }); document.getElementById("valor-pedido-txt").innerText = `R$ ${formatarMoeda(valCons)}`; totalAtual = valCons; if (window.innerWidth >= 1024) renderBotaoFlutuante(`bg-slate-800 ${CSS_BASE_FLUTUANTE} cursor-default`, `<div class="text-left font-medium text-sm">ID do Pagamento:</div><div class="font-medium text-sm truncate px-2 text-center flex-1">${id}</div><div onclick="forçarFechamentoSistemico(event)" class="text-sm font-medium text-white/60 hover:text-white cursor-pointer transition-colors text-right">Sair</div>`, true); else abrirOverlayCelular(); }
        async function executingBaixaPedidoEntregue() { try { await enviarVendaNuvem(pixChaveIdentificadora, "PIX", "ONLINE", cachePedidoOnlineOriginal, "Produto Entregue!"); } catch (e) { exibirFalhaProcessamento(); } }
        function salvarNoCacheContingencia(id, forma, tipo, pronto) { let fila = JSON.parse(localStorage.getItem("festa_junina_contingencia")) || []; fila.push({ id_pagamento: id, pagamento: forma, tipo_venda: tipo, status_retirada: "retirado", total_pedido_consolidado: parseFloat(totalAtual), transaction_amount: parseFloat(totalAtual), contingencia: true, itens: pronto }); localStorage.setItem("festa_junina_contingencia", JSON.stringify(fila)); }
        function iniciarMotorSincronizacaoOculto() { setInterval(async () => { let fila = JSON.parse(localStorage.getItem("festa_junina_contingencia")) || []; if (fila.length === 0 || !(await diagnosticarInternetEstavel())) return; try { const pacote = { id_pagamento: String(fila[0].id_pagamento), pagamento: String(fila[0].pagamento), tipo_venda: String(fila[0].tipo_venda), status_retirada: "retirado", total_pedido_consolidado: parseFloat(fila[0].total_pedido_consolidado), transaction_amount: parseFloat(fila[0].transaction_amount), contingencia: true, itens: extrairItensParaEnvio(fila[0].itens) }; const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pacote) }); if (r.ok) { fila.shift(); localStorage.setItem("festa_junina_contingencia", JSON.stringify(fila)); } } catch (err) { console.error("Erro na sincronização.", err); } }, 30000); }
    </script>
