<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .smooth-scroll { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-amber-50 font-sans min-h-screen flex flex-col smooth-scroll antialiased text-slate-900">

    <!-- Cabeçalho com Altura Igualada ao Botão Flutuante (h-16) -->
    <header class="bg-orange-600 text-white flex items-center justify-center h-16 shadow-md border-b-4 border-yellow-400 sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-widest">Festa Junina</h1>
    </header>

    <!-- Corpo Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Lado Esquerdo: Menu em Lista Alinhada -->
        <section class="lg:col-span-2 space-y-3">
            <h2 class="text-base font-bold text-amber-900 border-b border-orange-200 pb-1">Produtos A - Z</h2>
            
            <!-- Container em formato de lista vertical flexível -->
            <div id="grid-produtos" class="flex flex-col gap-2">
                <!-- Os produtos serão injetados dinamicamente via JavaScript aqui embaixo -->
            </div>
        </section>

        <!-- Lado Direito: Carrinho e Fechamento -->
        <section class="bg-white rounded-2xl shadow-xl border border-amber-100 p-5 flex flex-col justify-between lg:h-[calc(100vh-120px)] lg:sticky lg:top-20">
            <div>
                <!-- Alinhamento e tamanho igualados entre os títulos do topo do carrinho -->
                <h2 class="text-lg font-black text-amber-950 border-b pb-2 mb-3 flex justify-between items-center">
                    <span>Pedido Atual</span>
                    <span id="contador-itens" class="text-lg bg-orange-100 text-orange-700 px-3 py-0.5 rounded-full font-black">0 itens</span>
                </h2>

                <!-- Lista de itens no carrinho -->
                <div id="lista-carrinho" class="space-y-2 overflow-y-auto max-h-[30vh] pr-1">
                    <p class="text-gray-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>
                </div>
            </div>

            <!-- Área de Fechamento Original -->
            <div id="bloco-fechamento-original" class="border-t pt-4 mt-4 space-y-4">
                <!-- Totalizador Principal Avançado -->
                <div class="flex justify-between items-center text-amber-950">
                    <span class="text-base font-bold uppercase tracking-wider text-slate-700">Valor Total:</span>
                    <span id="valor-total" class="text-3xl font-black text-orange-600 tracking-tight">R$ 0,00</span>
                </div>

                <!-- Método de Pagamento -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-gray-500 block uppercase tracking-wider">Forma de Pagamento:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-gray-200 text-gray-700 bg-white hover:bg-gray-50">
                            DINHEIRO
                        </button>
                        <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-gray-200 text-gray-700 bg-white hover:bg-gray-50">
                            PIX
                        </button>
                    </div>
                </div>

                <!-- Botão Concluir Grande -->
                <button onclick="finalizarVenda()" id="btn-finalizar" disabled class="w-full bg-gray-300 text-gray-500 font-black py-4 rounded-xl text-center text-base shadow transition-all cursor-not-allowed">
                    Selecione o Pagamento
                </button>
            </div>
        </section>
    </main>

    <!-- Botão Laranja Flutuante com Largura Fixa Robusta (w-80 md:w-[450px]) e h-16 (Igual ao Topo) -->
    <div id="container-botao-flutuante" class="fixed bottom-5 left-0 right-0 px-4 z-40 hidden flex justify-center pointer-events-none">
        <button onclick="irParaFechamento()" class="pointer-events-auto bg-orange-600 hover:bg-orange-700 text-white font-black h-16 w-full max-w-md rounded-full shadow-2xl border-2 border-yellow-400 flex items-center justify-center gap-4 transform active:scale-95 transition-all text-lg">
            <span>Valor Total:</span>
            <span id="valor-total-flutuante" class="text-yellow-300">R$ 0,00</span>
            <span class="text-base font-bold opacity-90 lowercase">(pagar)</span>
        </button>
    </div>

    <script>
        // Banco de dados com simulações de estoque critico e esgotado
        const produtos = [
            { id: 1, nome: "Cachorro Quente", preco: 12.00, estoque: 50, critico: 5 },
            { id: 2, nome: "Pipoca Doce/Salgada", preco: 6.00, estoque: 4, critico: 5 }, 
            { id: 3, nome: "Refrigerante (Lata)", preco: 6.00, estoque: 80, critico: 10 },
            { id: 4, nome: "Água Mineral", preco: 4.00, estoque: 0, critico: 5 },         
            { id: 5, nome: "Quentão", preco: 10.00, estoque: 30, critico: 5 },
            { id: 6, nome: "Canjica", preco: 8.00, estoque: 25, critico: 5 },
            { id: 7, nome: "Espetinho de Carne", preco: 14.00, estoque: 40, critico: 8 },
            { id: 8, nome: "Milho Cozido", preco: 7.00, estoque: 20, critico: 5 },
            { id: 9, nome: "Bolo de Fubá", preco: 5.00, estoque: 15, critico: 3 },
            { id: 10, nome: "Pastel", preco: 9.00, estoque: 60, critico: 10 }
        ];

        let carrinho = {};
        let formaPagamento = null;
        let totalAtual = 0;

        function formatarMoeda(valor) {
            return valor.toFixed(2).replace('.', ',');
        }

        // Renderiza a interface com alinhamentos travados por colunas flexíveis
        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos");
            grid.innerHTML = "";

            produtos.sort((a, b) => a.nome.localeCompare(b.nome));

            produtos.forEach(p => {
                const qtdNoCarrinho = carrinho[p.id] || 0;
                
                let statusEstoqueHtml = `<span class="text-green-600 font-black">${p.estoque}</span>`;
                let cardBg = "bg-white border-amber-100";
                
                // Variável que vai guardar os botões ou o bloco "ESGOTADO"
                let controleDireitoHtml = "";

                if (p.estoque === 0) {
                    // Exibe textualmente Estoque 0
                    statusEstoqueHtml = `<span class="text-red-600 font-black">0</span>`;
                    cardBg = "bg-gray-100 border-gray-300 text-gray-400 select-none opacity-60";
                    
                    // Substitui a área de quantidade inteira pelo bloco ESGOTADO estático
                    controleDireitoHtml = `
                        <div class="bg-red-600 text-white font-black text-sm px-4 py-2 rounded-xl tracking-wider text-center w-36 shadow-sm select-none pointer-events-none">
                            ESGOTADO
                        </div>`;
                } else {
                    if (p.estoque <= p.critico) {
                        statusEstoqueHtml = `<span class="text-red-600 font-black">${p.estoque}</span>`;
                    }
                    
                    // Mantém os controles normais se houver estoque
                    controleDireitoHtml = `
                        <div class="flex items-center gap-3 shrink-0">
                            <span class="text-sm sm:text-base text-gray-400 font-bold whitespace-nowrap">Qtd: <b class="text-slate-900 font-black">${qtdNoCarrinho}</b></span>
                            <div class="flex items-center gap-1 bg-gray-100 rounded-xl p-0.5 border border-gray-200">
                                <button onclick="alterarQuantidade(${p.id}, -1)" class="w-10 h-10 rounded-lg bg-white font-black text-xl text-gray-700 hover:bg-orange-50 hover:text-orange-600 active:scale-95 transition-all flex items-center justify-center border shadow-sm">-</button>
                                <button onclick="alterarQuantidade(${p.id}, 1)" class="w-10 h-10 rounded-lg bg-white font-black text-xl text-gray-700 hover:bg-orange-50 hover:text-orange-600 active:scale-95 transition-all flex items-center justify-center border shadow-sm">+</button>
                            </div>
                        </div>`;
                }

                // Cards com ganho sutil de altura interna (py-4), grid de dados travado para alinhamento vertical perfeito
                grid.innerHTML += `
                    <div class="border rounded-2xl p-4 shadow-sm flex items-center justify-between gap-4 transition-all ${cardBg}">
                        
                        <!-- TABELA INVISÍVEL DE DADOS (Travando o alinhamento da palavra Estoque e Preço) -->
                        <div class="flex-1 grid grid-cols-2 sm:grid-cols-3 items-center gap-2 min-w-0">
                            <!-- Coluna 1: Nome do produto ocupando espaço principal -->
                            <h3 class="font-black text-slate-800 text-lg truncate text-left leading-tight tracking-tight sm:col-span-1">${p.nome}</h3>
                            
                            <!-- Coluna 2 e 3 unificadas no mobile: Preço e Estoque perfeitamente cravados na mesma posição -->
                            <div class="flex items-center gap-6 text-base sm:text-lg font-black col-span-1 sm:col-span-2">
                                <span class="text-orange-600 whitespace-nowrap">R$ ${formatarMoeda(p.preco)}</span>
                                <div class="text-slate-800 whitespace-nowrap">
                                    <span class="opacity-60 font-medium text-gray-400">Estoque</span> ${statusEstoqueHtml}
                                </div>
                            </div>
                        </div>
                        
                        <!-- LADO DIREITO: ÁREA DINÂMICA (Controles ou Bloco de Esgotado) -->
                        <div class="shrink-0">
                            ${controleDireitoHtml}
                        </div>

                    </div>
                `;
            });
        }

        // Altera quantidades limitando ao teto do estoque
        function alterarQuantidade(id, delta) {
            const produto = produtos.find(p => p.id === id);
            const qtdAtual = carrinho[id] || 0;
            const novaQtd = qtdAtual + delta;

            if (novaQtd < 0) return;
            if (novaQtd > produto.estoque) {
                alert(`Ops! Só temos ${produto.estoque} unidades de ${produto.nome} no estoque.`);
                return;
            }

            if (novaQtd === 0) delete carrinho[id];
            else carrinho[id] = novaQtd;

            renderizarProdutos();
            atualizarCarrinho();
        }

        // Atualiza o carrinho e os totais
        function atualizarCarrinho() {
            const lista = document.getElementById("lista-carrinho");
            const contador = document.getElementById("contador-itens");
            const totalTxt = document.getElementById("valor-total");
            const totalFlutuanteTxt = document.getElementById("valor-total-flutuante");
            
            totalAtual = 0;
            let totalItens = 0;
            lista.innerHTML = "";

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                const qtd = carrinho[id];
                const subtotal = p.preco * qtd;
                totalAtual += subtotal;
                totalItens += qtd;

                lista.innerHTML += `
                    <div class="flex justify-between items-center text-sm bg-amber-50/50 p-2.5 rounded-xl border border-amber-100/60">
                        <div class="max-w-[65%]">
                            <p class="font-bold text-amber-950">${p.nome}</p>
                            <p class="text-xs text-gray-400">${qtd}x R$ ${formatarMoeda(p.preco)}</p>
                        </div>
                        <span class="font-extrabold text-amber-950">R$ ${formatarMoeda(subtotal)}</span>
                    </div>
                `;
            });

            if (totalItens === 0) {
                lista.innerHTML = `<p class="text-gray-400 text-center py-6 text-xs italic">Nenhum produto selecionado...</p>`;
            }

            contador.innerText = `${totalItens} ${totalItens === 1 ? 'item' : 'itens'}`;
            totalTxt.innerText = `R$ ${formatarMoeda(totalAtual)}`;
            totalFlutuanteTxt.innerText = `R$ ${formatarMoeda(totalAtual)}`;
            verificarStatusBotao();
        }

        function irParaFechamento() {
            const blocoOriginal = document.getElementById("bloco-fechamento-original");
            blocoOriginal.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        const observer = new IntersectionObserver((entries) => {
            const containerFlutuante = document.getElementById("container-botao-flutuante");
            entries.forEach(entry => {
                if (!entry.isIntersecting) {
                    containerFlutuante.classList.remove("hidden");
                } else {
                    containerFlutuante.classList.add("hidden");
                }
            });
        }, { root: null, threshold: 0.05 });

        observer.observe(document.getElementById("bloco-fechamento-original"));

        function selecionarPagamento(tipo) {
            formaPagamento = tipo;
            const btnPix = document.getElementById("btn-pix");
            const btnDinheiro = document.getElementById("btn-dinheiro");

            if (tipo === 'PIX') {
                btnPix.className = "py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-emerald-500 bg-emerald-50 text-emerald-700 shadow-inner";
                btnDinheiro.className = "py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-gray-200 text-gray-700 bg-white hover:bg-gray-50";
            } else {
                btnDinheiro.className = "py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-emerald-500 bg-emerald-50 text-emerald-700 shadow-inner";
                btnPix.className = "py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-gray-200 text-gray-700 bg-white hover:bg-gray-50";
            }
            verificarStatusBotao();
        }

        function verificarStatusBotao() {
            const btn = document.getElementById("btn-finalizar");
            const temItens = Object.keys(carrinho).length > 0;

            if (temItens && formaPagamento) {
                btn.disabled = false;
                btn.className = "w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-4 rounded-xl text-center text-base shadow-lg shadow-orange-200 transition-all transform active:scale-[0.98]";
                btn.innerText = `Finalizar em ${formaPagamento}`;
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-gray-300 text-gray-500 font-black py-4 rounded-xl text-center text-base border cursor-not-allowed";
                btn.innerText = temItens ? "Selecione o Pagamento" : "Adicione Itens ao Pedido";
            }
        }

        function finalizarVenda() {
            const dadosVenda = {
                data: new Date().toLocaleString('pt-BR'),
                origem: formaPagamento,
                itens: Object.keys(carrinho).map(id => {
                    const p = produtos.find(item => item.id == id);
                    return { nome: p.nome, quantidade: carrinho[id], subtotal: p.preco * carrinho[id] };
                })
            };

            console.log("Venda Registrada:", dadosVenda);
            alert(`🎉 Venda Registrada!\nForma de Pagamento: ${formaPagamento}\n\nRetire as fichas físicas para o comprador.`);
            
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(item => item.id == id);
                p.estoque -= carrinho[id];
            });

            carrinho = {};
            formaPagamento = null;
            document.getElementById("btn-pix").className = "py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-gray-200 text-gray-700 bg-white hover:bg-gray-50";
            document.getElementById("btn-dinheiro").className = "py-3 rounded-xl border-2 font-black text-base text-center transition-all flex items-center justify-center border-gray-200 text-gray-700 bg-white hover:bg-gray-50";
            
            renderizarProdutos();
            atualizarCarrinho();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderizarProdutos();
    </script>
</body>
</html>
