<!DOCTYPE html>

    <script>
        const URL_LEITURA = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/161fb6d3f71245f187e74df0ae0616b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dxOAva-wcRMsB3WRw8zfGu6XMtuQsOZGgRGdQ5Waxh4";
        const URL_MÃE = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/06f981a846ca45bc8bfe51c97c480d96/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=n-3ys5toEStLZNzQS6q0bETlCP8-NuAjwWn-fAOqjOs";
        const TEMPO_CHECK_PIX = 12000, LIMITE_EXPIRACAO_PIX = 600000;
        const CSS_BTN_ATIVO = "py-2.5 rounded-md border border-orange-500 bg-orange-50 text-orange-600 font-bold text-sm text-center shadow-sm transition-all";
        const CSS_BTN_INATIVO = "py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white text-slate-700 transition-all";
        const CSS_FINALIZAR_HABILITADO = "w-full bg-orange-500 hover:bg-orange-600 text-white font-normal py-3.5 rounded-md text-center text-base shadow cursor-pointer transition-all transform active:scale-95";
        const CSS_FINALIZAR_DESABILITADO = "w-full bg-slate-200 text-slate-400 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed";
        const CSS_BASE_FLUTUANTE = "pointer-events-auto text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-between min-w-[240px] max-w-xs w-full text-sm";
        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, pixChaveIdentificadora = "", stringQrCodeBase64Salva = "", modoBuscaAtivo = false, modoResgateManual = false, cachePedidoOnlineOriginal = [], intervaloPix = null, loopEmExecucao = false, timestampCriacaoPix = 0;
        const $ = id => document.getElementById(id), formatarMoeda = v => v.toFixed(2).replace('.', ',');
        function liberarExibicaoSegura() { document.documentElement.style.visibility = document.body.style.visibility = "visible"; document.documentElement.style.opacity = document.body.style.opacity = "1"; }
        window.addEventListener('DOMContentLoaded', () => { const c = localStorage.getItem("festa_junina_cardapio"); if (c) { produtos = JSON.parse(c); renderizarProdutos(); } carregarEstoqueReal(); });
        async function carregarEstoqueReal(id = "") {
            try {
                const r = await fetch(URL_LEITURA, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(id).trim() }) }), cb = await r.json();
                if (cb && cb.estoque) { produtos = cb.estoque.map(l => ({ id: parseInt(l.ID), sigla: l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : "??", nome: l.PRODUTO, preco: parseFloat(l.PRECO), estoque: parseInt(l.ATUAL) })); localStorage.setItem("festa_junina_cardapio", JSON.stringify(produtos)); renderizarProdutos(); }
                if (id !== "" && cb && cb.pedido) processarResultadoBuscaPedido(cb.pedido, id);
            } catch (e) { if (id !== "") forçarFechamentoSistemico(); } finally { liberarExibicaoSegura(); }
        }
        function renderizarProdutos() {
            const g = $("grid-produtos"); g.innerHTML = "";
            produtos.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(p => {
                const q = carrinho[p.id] || 0, esg = p.estoque === 0; let c = "bg-white border-slate-300 hover:border-slate-400", b = "bg-slate-100 text-slate-600", bl = "", st = `<span class="${esg || p.estoque <= 5 ? 'text-rose-500' : 'text-emerald-600'} font-semibold">${p.estoque}</span>`;
                if (esg) c = "bg-slate-100 text-slate-400 select-none pointer-events-none opacity-60";
                if (q > 0 && !esg) b = "bg-orange-50 border border-orange-200 text-orange-700";
                if (modoBuscaAtivo || modoResgateManual) { c = "bg-slate-50 border-slate-300 text-slate-300 select-none pointer-events-none opacity-40"; bl = "disabled"; }
                g.innerHTML += `<div class="border rounded-md p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 ${c}"><div class="w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 ${b}"><div class="text-center font-bold text-xl mt-2.5 flex items-center justify-center flex-1 select-none">${p.sigla}</div><div class="flex items-center justify-between w-full mt-auto"><button onclick="alterarQuantidade(${p.id}, -1)" ${bl} class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm ${q === 0 ? 'opacity-20 pointer-events-none' : ''}">-</button><span class="text-xs font-bold text-center flex-1">${q > 0 ? `<span class="text-orange-600 text-base font-semibold">${q}</span>` : '-'}</span><button onclick="alterarQuantidade(${p.id}, 1)" ${bl} class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/10 font-bold text-sm ${esg ? 'opacity-20' : ''}">+</button></div></div><div class="min-w-0 flex flex-col justify-between flex-1"><h3 class="font-semibold text-slate-700 text-[14px] truncate leading-tight mb-0.5">${p.nome}</h3><div class="flex items-center justify-between text-[13px] font-medium w-full"><span class="text-orange-600 font-semibold">R$ ${formatarMoeda(p.preco)}</span><div>E: ${st}</div></div></div></div>`;
            });
            let pa = modoBuscaAtivo || modoResgateManual;
            g.innerHTML += `<div class="border rounded-md p-2 shadow-sm flex flex-col justify-between transition-all min-w-0 bg-white border-slate-300"><div id="box-card-on" class="w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 ${pa ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600'}"><div class="text-center font-bold text-xl mt-2.5 flex items-center justify-center flex-1 select-none">ON</div><div class="flex items-center justify-between w-full mt-auto"><button onclick="forçarFechamentoSistemico(event)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/20 text-current font-bold text-sm">-</button><span id="txt-status-on" class="text-[13px] font-semibold text-center flex-1">${pa ? 'ativo' : '-'}</span><button onclick="ativarModoBuscaPre(event)" class="w-7 h-7 rounded-md bg-black/5 hover:bg-black/20 text-current font-bold text-sm">+</button></div></div><div class="min-w-0 flex flex-col justify-between flex-1"><h3 class="font-semibold text-slate-700 text-[14px] truncate leading-tight mb-0.5">Online</h3><div class="text-[13px] font-semibold text-orange-600">R$ 0,00</div></div></div>`;
        }
        function alterarQuantidade(id, d) { 
            const p = produtos.find(item => item.id == id); if (!p) return;
            const n = (carrinho[id] || 0) + d; 
            if (d > 0 && n > p.estoque) return; 
            n <= 0 ? delete carrinho[id] : carrinho[id] = n; 
            renderizarProdutos(); atualizarCarrinhoDOM(); 
        }
        function atualizarCarrinhoDOM() {
            if (modoResgateManual) return;
            const l = $("lista-carrinho"); totalAtual = 0; let ti = 0; l.innerHTML = "";
            Object.keys(carrinho).forEach(id => { const p = produtos.find(i => i.id == id), q = carrinho[id], s = p.preco * q; totalAtual += s; ti += q; l.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-[6px] rounded-md border border-slate-100"><div class="max-w-[75%] min-w-0"><p class="font-semibold text-slate-700 truncate text-[14px]">${p.nome}</p><p class="text-[12px] text-slate-400 mt-0.5">${q}x R$ ${formatarMoeda(p.preco)}</p></div><span class="font-semibold text-slate-700 text-[16px] flex-shrink-0 pl-2">R$ ${formatarMoeda(s)}</span></div>`; });
            const bd = $("btn-dinheiro"), bp = $("btn-pix");
            if (ti === 0) { l.innerHTML = `<p class="text-slate-400 text-center py-4 text-xs italic">Nenhum produto selecionado...</p>`; bd.disabled = bp.disabled = true; resetarEstadoPagamento(); } else { bd.disabled = bp.disabled = false; }
            if (!modoBuscaAtivo) $("conteudo-flutuante-unico").innerText = `Pedido R$ ${formatarMoeda(totalAtual)} - Revisar e Pagar`;
            $("valor-pedido-txt").innerText = `R$ ${formatarMoeda(totalAtual)}`; validarEstadoFinalizar();
        }
        const processarCliqueFinalizar = () => modoResgateManual ? executingBaixaPedidoEntregue() : (formaPagamento === 'DINHEIRO' ? executarGravacaoDinheiroDirecto() : executarCliqueContingenciaManualPix());
        function selecionarPagamento(t) {
            if (Object.keys(carrinho).length === 0) return;
            formaPagamento = t; const bp = $("btn-pix"), bd = $("btn-dinheiro"), sd = $("secao-valores-dinheiro"), c = $("carrossel-pagamento"), ip = $("input-recebido");
            if (t === 'DINHEIRO') { if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } bd.className = CSS_BTN_ATIVO; bp.className = CSS_BTN_INATIVO; c.className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0"; sd.className = "w-1/2 h-full space-y-3.5 opacity-100 pointer-events-auto transition-all duration-200"; ip.disabled = false; ip.value = ""; ip.focus(); } 
            else { bp.className = CSS_BTN_ATIVO; bd.className = CSS_BTN_INATIVO; c.className = "w-[200%] h-full flex transition-transform duration-300 transform -translate-x-1/2"; sd.className = "w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200"; ip.disabled = true; }
            validarEstadoFinalizar();
        }
        function validarEstadoFinalizar() {
            if (modoResgateManual) return;
            const b = $("btn-finalizar"), r = parseFloat($("input-recebido").value.replace(/\D/g, "")) / 100 || 0;
            b.disabled = formaPagamento === 'PIX' ? (b.getAttribute("data-trava-tempo") === "true" || pixChaveIdentificadora === "" || pixChaveIdentificadora.startsWith("mp_")) : !(Object.keys(carrinho).length > 0 && formaPagamento === 'DINHEIRO' && r >= totalAtual);
            b.className = b.disabled ? CSS_FINALIZAR_DESABILITADO : CSS_FINALIZAR_HABILITADO;
        }
        const gerarPayloadVenda = (id, f) => JSON.stringify({ id_pagamento: String(id).trim(), pagamento: f, tipo_venda: "CAIXA", status_retirada: "retirado", total_pedido_consolidado: totalAtual, transaction_amount: totalAtual, itens: Object.keys(carrinho).map(i => { const p = produtos.find(x => x.id == i); return { sigla: p.sigla, produto: p.nome, grandmother_id: p.id, quantidade: carrinho[i], preco: p.preco, total: (p.preco * carrinho[i]) }; }) });
        function tratarMascaraDinheiro(ip) {
            let v = ip.value.replace(/\D/g, ""); if (v === "") return;
            let n = parseFloat(v) / 100; ip.value = n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const tx = $("valor-troco-txt");
            if (n < totalAtual) { tx.innerText = "Dinheiro Insuficiente"; tx.className = "font-bold text-rose-500 text-xs"; } 
            else { tx.innerText = `R$ ${formatarMoeda(n - totalAtual)}`; tx.className = "font-bold text-orange-500 text-base"; }
            validarEstadoFinalizar();
        }
        async function executarGravacaoDinheiroDirecto() {
            const b = $("btn-finalizar"); b.innerText = "Processando..."; b.disabled = true;
            try { await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(`DINHEIRO-${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}`, "DINHEIRO") }); alert("Venda Finalizada!"); forçarFechamentoSistemico(); } 
            catch (e) { alert("Erro ao processar venda"); b.innerText = "Finalizar"; b.disabled = false; b.className = CSS_FINALIZAR_HABILITADO; }
        }
        async function requisitarQrCodeReal() {
            if (formaPagamento !== 'PIX') return;
            const bx = $("box-qrcode"); bx.className = "w-28 h-28 bg-white border border-slate-300 text-[10px] font-bold text-slate-400 uppercase text-center flex flex-col items-center justify-center p-2 pointer-events-none"; bx.innerHTML = `<span>Carregando...</span>`;
            pixChaveIdentificadora = "mp_" + Date.now(); timestampCriacaoPix = Date.now();
            const b = $("btn-finalizar"); b.disabled = true; b.className = CSS_FINALIZAR_DESABILITADO; b.setAttribute("data-trava-tempo", "true");
            try {
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(pixChaveIdentificadora, 'PIX') }), d = await r.json();
                if (d.id_mercado_pago) {
                    pixChaveIdentificadora = String(d.id_mercado_pago).trim(); stringQrCodeBase64Salva = d.qrcode_imagem;
                    bx.className = "w-28 h-28 bg-white flex items-center justify-center p-0 pointer-events-none border border-slate-300"; bx.innerHTML = `<img src="data:image/jpeg;base64,${stringQrCodeBase64Salva}" class="w-full h-full object-contain">`;
                    setTimeout(() => { b.removeAttribute("data-trava-tempo"); if (formaPagamento === 'PIX' && pixChaveIdentificadora !== "" && !pixChaveIdentificadora.startsWith("mp_") && !bx.className.includes("bg-emerald-700")) { b.disabled = false; b.className = CSS_FINALIZAR_HABILITADO; } }, 12000);
                    iniciarMonitoramentoPixAutomatico();
                } else throw new Error();
            } catch (e) { alert("Falha ao gerar QR Code."); resetarEstadoPagamento(); }
        }
        function aplicarLayoutSucessoPix() { $("box-qrcode").className = "w-28 h-28 bg-white border border-slate-300 flex items-center justify-center p-1 select-none pointer-events-none"; $("box-qrcode").innerHTML = `<div class="w-full h-full bg-orange-500 text-white font-medium text-[11px] text-center flex items-center justify-center tracking-wider uppercase">Pagamento<br>Confirmado</div>`; $("btn-finalizar").disabled = true; $("btn-finalizar").className = CSS_FINALIZAR_DESABILITADO; }
        function aplicarLayoutFalhaPix() {
            const bx = $("box-qrcode"); bx.className = "w-28 h-28 bg-white border border-slate-300 flex items-center justify-center p-1 select-none pointer-events-none animate-shake"; bx.innerHTML = `<div class="w-full h-full bg-rose-700 text-white font-medium text-[11px] text-center flex items-center justify-center tracking-wider uppercase">Pagamento<br>Pendente</div>`;
            setTimeout(() => { if (formaPagamento === 'PIX' && pixChaveIdentificadora && !pixChaveIdentificadora.startsWith("mp_") && stringQrCodeBase64Salva !== "" && bx.innerHTML.includes("Pendente")) { bx.className = "w-28 h-28 bg-white flex items-center justify-center p-0 pointer-events-none border border-slate-300"; bx.innerHTML = `<img src="data:image/jpeg;base64,${stringQrCodeBase64Salva}" class="w-full h-full object-contain">`; } }, 3000);
        }
        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix); loopEmExecucao = false;
            intervaloPix = setInterval(async () => {
                if (loopEmExecucao || !pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) return;
                if (Date.now() - timestampCriacaoPix > LIMITE_EXPIRACAO_PIX) { clearInterval(intervaloPix); intervaloPix = null; alert("Tempo limite esgotado"); forçarFechamentoSistemico(); return; }
                loopEmExecucao = true; if (await consultarStatusMercadoPagoDireto()) { clearInterval(intervaloPix); intervaloPix = null; aplicarLayoutSucessoPix(); await executarGravacaoPixAprovadoNasNuvens(); }
                loopEmExecucao = false;
            }, TEMPO_CHECK_PIX);
        }
        async function consultarStatusMercadoPagoDireto() { if (!pixChaveIdentificadora || pixChaveIdentificadora.startsWith("mp_")) return false; try { const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(pixChaveIdentificadora).trim(), pagamento: "PIX", tipo_venda: "CAIXA", total_pedido_consolidado: totalAtual }) }); return r.ok && (await r.json()).pago === true; } catch (e) { return false; } }
        async function executarGravacaoPixAprovadoNasNuvens() { try { const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: gerarPayloadVenda(pixChaveIdentificadora, 'PIX') }); if ((await r.json()).pago === true) { alert("Venda Finalizada!"); forçarFechamentoSistemico(); } else { alert("Aviso: Pagamento recebido, mas não registrado no Excel."); } } catch (e) { alert("Erro"); } }
        async function executarCliqueContingenciaManualPix() { if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } const b = $("btn-finalizar"); b.innerText = "Processando..."; b.disabled = true; if (await consultarStatusMercadoPagoDireto()) { b.innerText = "Finalizar"; aplicarLayoutSucessoPix(); await executarGravacaoPixAprovadoNasNuvens(); } else { alert("Pagamento Pendente"); b.innerText = "Finalizar"; b.disabled = false; b.className = CSS_FINALIZAR_HABILITADO; aplicarLayoutFalhaPix(); iniciarMonitoramentoPixAutomatico(); } }
        function abrirOverlayCelular() { if (window.innerWidth < 1024 || modoResgateManual) { $("painel-fechamento").className = "fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 backdrop-blur-sm"; if (!modoResgateManual) resetarEstadoPagamento(); } }
        function fecharOverlay() { modoResgateManual ? forçarFechamentoSistemico() : ($("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full", resetarEstadoPagamento()); }
        function forçarFechamentoSistemico(e) { if(e) { e.stopPropagation(); e.preventDefault(); } if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } pixChaveIdentificadora = ""; $("painel-fechamento").className = "hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full"; resetSistemicoTotal(false); }
        function resetSistemicoTotal(f = true) { if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; } modoResgateManual = modoBuscaAtivo = false; carrinho = {}; totalAtual = 0; formaPagamento = null; pixChaveIdentificadora = ""; stringQrCodeBase64Salva = ""; cachePedidoOnlineOriginal = []; timestampCriacaoPix = 0; $("id-pedido-cabecalho").innerText = ""; $("bloco-inferior-pagamento").className = "space-y-4 pt-1 border-t"; const bf = $("caixa-flutuante-base"); bf.onclick = abrirOverlayCelular; bf.className = "pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-center min-w-[240px] max-w-xs w-full cursor-pointer select-none text-sm"; bf.innerHTML = `<div id="conteudo-flutuante-unico" class="text-sm tracking-wide text-center">Pedido R$ 0,00 - Revisar e Pagar</div>`; resetarEstadoPagamento(); const cardOn = $("box-card-on"), txtOn = $("txt-status-on"); if(cardOn && txtOn) { cardOn.className = "w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 bg-slate-100 text-slate-600"; txtOn.innerText = "-"; } atualizarCarrinhoDOM(); if (f) carregarEstoqueReal(); else renderizarProdutos(); }
        function resetarEstadoPagamento() {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            formaPagamento = null; pixChaveIdentificadora = ""; stringQrCodeBase64Salva = ""; timestampCriacaoPix = 0; const b = $("btn-finalizar"); b.removeAttribute("data-trava-tempo"); b.innerText = "Finalizar"; b.disabled = true; b.className = CSS_FINALIZAR_DESABILITADO;
            $("btn-pix").className = $("btn-dinheiro").className = CSS_BTN_INATIVO; $("carrossel-pagamento").className = "w-[200%] h-full flex transition-transform duration-300 transform translate-x-0"; $("secao-valores-dinheiro").className = "w-1/2 h-full space-y-3.5 opacity-25 pointer-events-none transition-all duration-200"; $("input-recebido").disabled = true; $("input-recebido").value = ""; $("valor-troco-txt").innerText = "R$ 0,00";
            $("box-qrcode").className = "w-28 h-28 bg-slate-100 border border-slate-300 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-200 active:scale-95 transition-none select-none text-center p-2"; $("box-qrcode").innerHTML = `<span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider leading-tight">Gerar<br>QR Code</span>`;
        }
        function activarModoBuscaPre(e) { if(e) { e.stopPropagation(); e.preventDefault(); } modoBuscaAtivo = true; carrinho = {}; atualizarCarrinhoDOM(); const bf = $("caixa-flutuante-base"); bf.onclick = null; bf.className = "bg-slate-800 " + CSS_BASE_FLUTUANTE + " cursor-default"; bf.innerHTML = `<div class="text-left font-medium text-sm select-none whitespace-nowrap">ID do Pagamento:</div><input type="text" id="input-id-busca" placeholder="000000000000" class="bg-transparent text-white font-medium text-sm focus:outline-none flex-1 h-full px-2 text-center placeholder-white/30 min-w-0" maxlength="12" oninput="tratarDigitacaoIdBusca(this)"><div onclick="forçarFechamentoSistemico(event)" class="text-sm font-medium text-white/60 hover:text-white cursor-pointer select-none whitespace-nowrap transition-colors text-right">Sair</div>`; const cardOn = $("box-card-on"), txtOn = $("txt-status-on"); if(cardOn && txtOn) { cardOn.className = "w-full aspect-square rounded-md flex flex-col justify-between p-1 relative mb-2 bg-slate-800 text-white"; txtOn.innerText = "ativo"; } setTimeout(() => { const ib = $("input-id-busca"); if(ib) ib.focus(); }, 100); }
        function tratarDigitacaoIdBusca(i) { i.value = i.value.replace(/\D/g, ""); if (i.value.length === 12) { i.disabled = true; carregarEstoqueReal(i.value); } }
        function processarResultadoBuscaPedido(le, id) {
            const bf = $("caixa-flutuante-base"), lines = le.filter(l => String(l.ID_PAGAMENTO).trim() === String(id).trim());
            if (lines.length === 0) { bf.className = "pointer-events-auto bg-rose-600 text-white font-semibold h-10 px-4 rounded-full shadow-lg transition-all duration-300 flex items-center justify-center min-w-[240px] max-w-xs w-full animate-shake text-sm"; bf.innerHTML = `<span>Não encontrado</span>`; setTimeout(() => { forçarFechamentoSistemico(); }, 2000); return; }
            modoResgateManual = true; modoBuscaAtivo = false; pixChaveIdentificadora = String(id).trim(); cachePedidoOnlineOriginal = [...lines]; renderizarProdutos();
            $("titulo-checkout").innerText = "Resumo do Pedido"; $("bloco-inferior-pagamento").className = "hidden pointer-events-none"; $("id-pedido-cabecalho").innerText = `ID: ${id}`;
            const b = $("btn-finalizar"); b.disabled = false; b.innerText = "Finalizar"; b.className = CSS_FINALIZAR_HABILITADO; const l = $("lista-carrinho"); l.innerHTML = ""; let vc = 0;
            lines.forEach(ln => {
                const tl = parseFloat(ln.TOTAL) || 0; vc += tl; let en = (ln.RETIRADA ? String(ln.RETIRADA).trim().toLowerCase() : "pendente") === "retirado";
                if (en) { b.disabled = true; b.innerText = "Pedido Já Entregue Anteriormente"; b.className = "w-full bg-slate-300 text-slate-500 font-normal py-3.5 rounded-md text-center text-base cursor-not-allowed"; }
                l.innerHTML += `<div class="flex justify-between items-center bg-white p-[6px] rounded-md border border-slate-200 shadow-sm font-sistema"><div class="max-w-[70%] min-w-0"><p class="font-semibold text-slate-700 truncate text-[14px]">${ln.PRODUTO}</p><p class="text-[12px] text-slate-400 mt-0.5">${parseInt(ln.QUANTIDADE) || 1}x R$ ${formatarMoeda(parseFloat(ln.PRECO) || 0)}</p></div><div class="text-right flex-shrink-0 pl-2"><p class="font-semibold text-slate-700 text-[16px]">R$ ${formatarMoeda(tl)}</p>${en ? '<span class="text-rose-500 font-bold text-[12px] block mt-0.5">[ENTREGUE]</span>' : '<span class="text-amber-600 font-bold text-[12px] block mt-0.5">[PENDENTE]</span>'}</div></div>`;
            });
            $("valor-pedido-txt").innerText = `R$ ${formatarMoeda(vc)}`;
            if (window.innerWidth >= 1024) { bf.className = "bg-slate-800 " + CSS_BASE_FLUTUANTE + " cursor-default"; bf.innerHTML = `<div class="text-left font-medium text-sm select-none whitespace-nowrap">ID do Pagamento:</div><div class="font-medium text-sm select-none truncate px-2 text-center flex-1">${id}</div><div onclick="forçarFechamentoSistemico(event)" class="text-sm font-medium text-white/60 hover:text-white cursor-pointer select-none whitespace-nowrap transition-colors text-right">Sair</div>`; } else { abrirOverlayCelular(); }
        }
        async function executingBaixaPedidoEntregue() {
            const b = $("btn-finalizar"); b.innerText = "Processando..."; b.disabled = true;
            try {
                const vc = parseFloat($("valor-pedido-txt").innerText.replace("R$", "").replace(".", "").replace(",", ".").trim()) || 0;
                const r = await fetch(URL_MÃE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id_pagamento: String(pixChaveIdentificadora).trim(), pagamento: "PIX", tipo_venda: "ONLINE", status_retirada: "retirado", total_pedido_consolidado: vc, transaction_amount: vc, itens: cachePedidoOnlineOriginal.map(l => ({ "ID_PAGAMENTO": String(pixChaveIdentificadora).trim(), "SIGLA": l.SIGLA ? String(l.SIGLA).trim().toUpperCase() : "PRE", "PRODUTO": String(l.PRODUTO).trim(), "QUANTIDADE": String(l.QUANTIDADE).trim(), "PRECO": String(l.PRECO).trim(), "TOTAL": String(l.TOTAL).trim() })) }) });
                if (!r.ok) throw new Error(); alert("Pedido Entregue"); forçarFechamentoSistemico();
            } catch (e) { alert("Erro"); b.innerText = "Finalizar"; b.disabled = false; b.className = CSS_FINALIZAR_HABILITADO; }
        }
