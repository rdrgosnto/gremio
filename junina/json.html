<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grêmio | Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-sistema { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Removi o hidden aqui para garantir carregamento */
        body { background-color: #f8fafc; }
        .scroll-celular-perfeito { touch-action: pan-y !important; }
    </style>
</head>
<body class="bg-slate-50 font-sistema min-h-screen flex flex-col antialiased text-slate-800 select-none">

    <header class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2></div>
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div>
        </section>

        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full">
            <div id="card-checkout" class="bg-white w-full max-w-lg lg:max-w-none rounded-md shadow-2xl lg:shadow-md border border-slate-300 p-5 flex flex-col justify-between h-[85vh] lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <h3 id="titulo-checkout" class="text-base font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2">PAGAMENTO</h3>
                    <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1"></div>
                    
                    <div id="bloco-inferior-pagamento" class="space-y-4 pt-1 border-t transition-opacity duration-200 opacity-100">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white">DINHEIRO</button>
                            <button onclick="selecionarPagamento('PIX')" id="btn-pix" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white">PIX</button>
                        </div>
                        <div id="carrossel-pagamento" class="w-full h-[100px] border-t pt-2">
                            <div id="secao-valores-dinheiro" class="space-y-2">
                                <div class="flex justify-between"><span>Pedido</span><span id="valor-pedido-txt" class="font-bold">R$ 0,00</span></div>
                                <div class="flex justify-between"><span>Recebido</span><input type="text" id="input-recebido" oninput="tratarMascaraDinheiro(this)" class="w-24 border rounded text-right px-1"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <button onclick="processarCliqueFinalizar()" id="btn-finalizar" class="w-full bg-orange-500 text-white py-3.5 rounded font-bold mt-2">Finalizar</button>
            </div>
        </section>
    </main>

    <script>
        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, carrinhoBloqueado = false;

        // Funções essenciais restauradas
        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos"); grid.innerHTML = "";
            produtos.forEach(p => {
                grid.innerHTML += `<div class="border p-2 bg-white rounded cursor-pointer" onclick="alterarQuantidade(${p.id}, 1)">
                    <div class="font-bold text-center">${p.sigla}</div>
                    <div class="flex justify-between mt-2">
                        <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, -1)" class="px-2 bg-slate-200">-</button>
                        <span>${carrinho[p.id] || 0}</span>
                        <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, 1)" class="px-2 bg-orange-200">+</button>
                    </div>
                </div>`;
            });
        }

        function alterarQuantidade(id, d) {
            const n = (carrinho[id] || 0) + d;
            if (n <= 0) delete carrinho[id]; else carrinho[id] = n;
            renderizarProdutos();
            atualizarCarrinhoDOM();
        }

        function atualizarCarrinhoDOM() {
            const lista = document.getElementById("lista-carrinho");
            lista.innerHTML = "";
            totalAtual = 0;
            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(i => i.id == id);
                totalAtual += (p.preco * carrinho[id]);
                lista.innerHTML += `<div class="flex justify-between p-2 bg-slate-50 border rounded text-sm">
                    ${p.nome} (${carrinho[id]}x)
                    <button onclick="removerItem(${id})" class="text-rose-500 font-bold">X</button>
                </div>`;
            });
            document.getElementById("valor-pedido-txt").innerText = `R$ ${totalAtual.toFixed(2)}`;
        }

        function removerItem(id) { delete carrinho[id]; atualizarCarrinhoDOM(); renderizarProdutos(); }
        function selecionarPagamento(tipo) { formaPagamento = tipo; }
        function processarCliqueFinalizar() { alert("Processando..."); }
        function tratarMascaraDinheiro(e) { /* Lógica original */ }

        // Carregamento garantido
        window.onload = () => {
            console.log("App carregado");
            // Se tiver cache, renderiza
            const cache = localStorage.getItem("festa_junina_cardapio");
            if (cache) { produtos = JSON.parse(cache); renderizarProdutos(); }
        };
    </script>
</body>
</html>
