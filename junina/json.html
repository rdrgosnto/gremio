<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Grêmio | Festa Junina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .font-sistema { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* A página começa invisível */
        html, body { visibility: hidden; opacity: 0; background-color: #f8fafc; transition: opacity 0.3s; }
        .scroll-celular-perfeito { touch-action: pan-y !important; }
    </style>
</head>
<body class="bg-slate-50 font-sistema min-h-screen flex flex-col antialiased text-slate-800 select-none">

    <header class="bg-orange-500 text-white text-center py-2 shadow-sm sticky top-0 z-50">
        <h1 class="text-xl font-semibold tracking-wide">Festa Junina</h1>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 grid grid-cols-1 lg:grid-cols-4 gap-4 items-start">
        <section class="lg:col-span-3 space-y-2">
            <div class="border-b border-slate-200 pb-1"><h2 class="text-sm font-bold text-slate-600 uppercase tracking-wider">Produtos A - Z</h2></div>
            <div id="grid-produtos" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-7 gap-2"></div>
        </section>

        <!-- Painel Checkout -->
        <section id="painel-fechamento" class="hidden lg:flex fixed inset-0 lg:relative bg-black/75 lg:bg-transparent z-50 lg:z-0 items-center justify-center p-4 lg:p-0 backdrop-blur-sm lg:backdrop-blur-none w-full h-full">
            <div id="card-checkout" class="bg-white w-full max-w-lg lg:max-w-none rounded-md shadow-2xl lg:shadow-md border border-slate-300 p-5 flex flex-col justify-between h-[85vh] lg:h-[calc(100vh-65px)] lg:sticky lg:top-14">
                <div class="space-y-4 flex-1 flex flex-col min-h-0">
                    <h3 id="titulo-checkout" class="text-base font-semibold text-slate-700 text-center uppercase tracking-wider border-b pb-2">PAGAMENTO</h3>
                    <div class="flex-1 flex flex-col min-h-0">
                        <div class="flex justify-between items-center mb-1.5 w-full px-0.5 h-4">
                            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resumo:</h4>
                            <button onclick="limparCarrinhoCompleto()" class="text-xs font-semibold text-slate-400 uppercase tracking-wider pr-1 hover:text-slate-600 transition-colors">Limpar</button>
                        </div>
                        <div id="lista-carrinho" class="space-y-1.5 overflow-y-auto pr-1 no-scrollbar flex-1 relative scroll-celular-perfeito"></div>
                    </div>

                    <div id="bloco-inferior-pagamento" class="space-y-4 pt-1 border-t opacity-40 pointer-events-none">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="selecionarPagamento('DINHEIRO')" id="btn-dinheiro" class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-slate-100">DINHEIRO</button>
                            <button onclick="selecionarPagamento('PIX')" id="btn-pix" disabled class="py-2.5 rounded-md border border-slate-300 font-semibold text-sm text-center bg-white">PIX</button>
                        </div>
                        <div class="h-[130px] overflow-hidden border-t border-dashed pt-3">
                            <div id="carrossel-pagamento" class="flex transition-transform duration-300 w-[200%]">
                                <div id="secao-valores-dinheiro" class="w-1/2 space-y-2">
                                    <div class="flex justify-between text-sm"><span>Pedido</span><span id="valor-pedido-txt" class="font-bold">R$ 0,00</span></div>
                                    <div class="flex justify-between items-center text-sm"><span>Recebido</span><input type="text" id="input-recebido" placeholder="0,00" oninput="tratarMascaraDinheiro(this)" class="w-24 border rounded text-right px-1" disabled></div>
                                    <div class="flex justify-between border-t pt-1 text-sm font-bold text-orange-600"><span>Troco</span><span id="valor-troco-txt">R$ 0,00</span></div>
                                </div>
                                <div id="secao-valores-pix" class="w-1/2 flex justify-center items-center">
                                    <div id="box-qrcode" onclick="requisitarQrCodeReal()" class="w-28 h-28 bg-slate-100 border flex items-center justify-center cursor-pointer text-center text-xs p-1">Gerar QR Code</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-2 pt-2 border-t"><button onclick="processarCliqueFinalizar()" id="btn-finalizar" disabled class="w-full bg-slate-200 text-slate-400 py-3.5 rounded font-bold">Finalizar</button></div>
            </div>
        </section>
    </main>

    <div class="fixed bottom-4 left-0 right-0 px-4 z-40 flex justify-center pointer-events-none">
        <div id="caixa-flutuante-base" onclick="abrirOverlayCelular()" class="pointer-events-auto bg-orange-500 text-white font-semibold h-10 px-6 rounded-full shadow-lg flex items-center justify-center cursor-pointer text-sm">
            Pedido R$ 0,00 - Revisar e Pagar
        </div>
    </div>

    <script>
        let produtos = [], carrinho = {}, formaPagamento = null, totalAtual = 0, pixChaveIdentificadora = "", carrinhoBloqueado = false;
        const CSS_BTN_ATIVO = "py-2.5 rounded-md border-2 border-orange-500 bg-orange-50 font-bold text-sm", CSS_BTN_INATIVO = "py-2.5 rounded-md border border-slate-300 font-semibold text-sm bg-white";

        const formatarMoeda = (v) => v.toFixed(2).replace('.', ',');
        const liberarExibicaoSegura = () => { document.documentElement.style.visibility = "visible"; document.documentElement.style.opacity = "1"; };

        window.addEventListener('DOMContentLoaded', () => {
            const cache = localStorage.getItem("festa_junina_cardapio");
            if (cache) { produtos = JSON.parse(cache); renderizarProdutos(); }
            // Simulação de carregamento
            setTimeout(liberarExibicaoSegura, 500);
        });

        function renderizarProdutos() {
            const grid = document.getElementById("grid-produtos"); grid.innerHTML = "";
            produtos.forEach(p => {
                const qtd = carrinho[p.id] || 0;
                grid.innerHTML += `
                    <div class="border rounded-md p-2 bg-white cursor-pointer hover:border-orange-300" onclick="alterarQuantidade(${p.id}, 1)">
                        <div class="font-bold text-center text-lg">${p.sigla}</div>
                        <div class="flex justify-between items-center mt-2">
                            <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, -1)" class="w-8 h-8 bg-slate-100 rounded text-lg font-bold">-</button>
                            <span class="font-bold text-orange-600">${qtd}</span>
                            <button onclick="event.stopPropagation(); alterarQuantidade(${p.id}, 1)" class="w-8 h-8 bg-slate-100 rounded text-lg font-bold">+</button>
                        </div>
                    </div>`;
            });
        }

        function alterarQuantidade(id, d) {
            if (carrinhoBloqueado) return;
            const n = (carrinho[id] || 0) + d;
            if (n <= 0) delete carrinho[id]; else carrinho[id] = n;
            renderizarProdutos();
            atualizarCarrinhoDOM();
        }

        function atualizarCarrinhoDOM() {
            const lista = document.getElementById("lista-carrinho");
            const btnDin = document.getElementById("btn-dinheiro");
            const bloco = document.getElementById("bloco-inferior-pagamento");
            lista.innerHTML = "";
            totalAtual = 0;

            Object.keys(carrinho).forEach(id => {
                const p = produtos.find(i => i.id == id);
                const sub = p.preco * carrinho[id];
                totalAtual += sub;
                lista.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
                        <div><p class="font-bold text-sm">${p.nome}</p><p class="text-xs text-slate-500">${carrinho[id]}x R$ ${formatarMoeda(p.preco)}</p></div>
                        <button onclick="removerItemDoCarrinhoCompleto(${id})" class="text-xs text-rose-500 font-bold bg-white px-2 py-1 rounded border">REMOVER</button>
                    </div>`;
            });

            const temItens = Object.keys(carrinho).length > 0;
            bloco.style.opacity = temItens ? "1" : "0.4";
            bloco.style.pointerEvents = temItens ? "auto" : "none";
            btnDin.disabled = !temItens;
            
            document.getElementById("valor-pedido-txt").innerText = `R$ ${formatarMoeda(totalAtual)}`;
            validarEstadoFinalizar();
        }

        function removerItemDoCarrinhoCompleto(id) {
            delete carrinho[id];
            renderizarProdutos();
            atualizarCarrinhoDOM();
        }

        function selecionarPagamento(tipo) {
            formaPagamento = tipo;
            carrinhoBloqueado = true;
            document.getElementById("btn-dinheiro").className = tipo === 'DINHEIRO' ? CSS_BTN_ATIVO : CSS_BTN_INATIVO;
            document.getElementById("btn-pix").className = tipo === 'PIX' ? CSS_BTN_ATIVO : CSS_BTN_INATIVO;
            document.getElementById("carrossel-pagamento").style.transform = tipo === 'DINHEIRO' ? 'translateX(0)' : 'translateX(-50%)';
            document.getElementById("input-recebido").disabled = tipo !== 'DINHEIRO';
            validarEstadoFinalizar();
        }

        function limparCarrinhoCompleto() {
            carrinho = {};
            carrinhoBloqueado = false;
            formaPagamento = null;
            renderizarProdutos();
            atualizarCarrinhoDOM();
            document.getElementById("btn-dinheiro").className = CSS_BTN_INATIVO;
            document.getElementById("btn-pix").className = CSS_BTN_INATIVO;
        }

        function validarEstadoFinalizar() {
            const btn = document.getElementById("btn-finalizar");
            const temItens = Object.keys(carrinho).length > 0;
            btn.disabled = !temItens;
            btn.className = temItens ? "w-full bg-orange-500 text-white py-3.5 rounded font-bold" : "w-full bg-slate-200 text-slate-400 py-3.5 rounded font-bold";
        }

        function abrirOverlayCelular() { document.getElementById("painel-fechamento").classList.remove("hidden"); }
        function fecharOverlay() { document.getElementById("painel-fechamento").classList.add("hidden"); }
        function processarCliqueFinalizar() { alert("Finalizado!"); }
        function tratarMascaraDinheiro(inp) { /* Lógica de máscara aqui */ }
        function requisitarQrCodeReal() { alert("Gerando Pix..."); }
    </script>
</body>
</html>
