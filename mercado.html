<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Festa Junina - R$ 0,01</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px; background-color: #f7f9fc; color: #333; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: inline-block; max-width: 400px; width: 100%; }
        h2 { color: #1e3a8a; margin-top: 0; }
        .price { font-size: 24px; color: #00a650; font-weight: bold; margin: 15px 0; }
        button { background-color: #00a650; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #008f45; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #qrcodeArea { margin-top: 25px; display: none; }
        #status { margin-top: 20px; font-weight: 600; color: #666; }
        .copia-cola-box { width: 100%; padding: 10px; text-align: center; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; box-sizing: border-box; font-size: 12px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Ingresso Festa Junina</h2>
    <p>Ambiente de Teste em Produção</p>
    <div class="price">R$ 0,01</div>
    
    <button id="btnComprar" onclick="solicitarPix()">Gerar QR Code Pix</button>
    
    <div id="qrcodeArea">
        <p><strong>Escaneie o QR Code abaixo:</strong></p>
        <img id="qrImage" src="" alt="QR Code Pix" width="220" height="220">
        
        <p><small>Clique abaixo para copiar o Pix Copia e Cola:</small></p>
        <input type="text" id="copiaCola" class="copia-cola-box" readonly onclick="copiarTexto()">
    </div>

    <div id="status"></div>
</div>

<script>
    // URL do fluxo atualizada
    const URL_FLUXO_DINAMICO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/dfaf6330f15e42008a25aac931c41405/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=fy37bcSwutYqptIZIa0XY8EeNKoOynCf83Q5ShydsYk";
    
    // ⚠️ COLE SEU TOKEN DE PRODUÇÃO AQUI PARA O HTML CONSULTAR O MERCADO PAGO
    const TOKEN_MERCADO_PAGO = "APP_USR-1411402861384213-052510-49927f3b7b3ad2f9000177e389a0a765-2391822607"; 

    let ID_PAGAMENTO = "";

    async function solicitarPix() {
        const btn = document.getElementById("btnComprar");
        const statusDiv = document.getElementById("status");
        
        statusDiv.innerText = "Conectando ao Power Automate...";
        btn.disabled = true;

        try {
            const resposta = await fetch(URL_FLUXO_DINAMICO, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ origem: "site_html" }) 
            });

            if (!resposta.ok) throw new Error("Erro na resposta do fluxo");

            const dadosMercadoPago = await resposta.json();
            
            // Guarda o ID globalmente para a função de checagem usar depois
            ID_PAGAMENTO = dadosMercadoPago.id;
            
            // Extrai o texto da chave Copia e Cola
            const textoPix = dadosMercadoPago.point_of_interaction.transaction_data.qr_code;
            
            // Gera a imagem do QR Code
            document.getElementById("qrImage").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(textoPix)}`;
            document.getElementById("copiaCola").value = textoPix;
            
            document.getElementById("qrcodeArea").style.display = "block";
            statusDiv.innerHTML = "<span style='color: #00a650;'>Aguardando pagamento...</span><br><small>Verificando status a cada 10 segundos automaticamente.</small>";

            // Inicia o monitoramento direto no Mercado Pago
            verificarStatusAutomatico();

        } catch (erro) {
            console.error(erro);
            statusDiv.innerHTML = "<span style='color: #cc0000;'>Erro ao gerar Pix. Verifique os logs do seu Power Automate.</span>";
            btn.disabled = false;
        }
    }

    function verificarStatusAutomatico() {
        // Roda em loop a cada 10000 milissegundos (10 segundos)
        const intervalo = setInterval(async () => {
            try {
                const resposta = await fetch(`https://api.mercadopago.com/v1/payments/${ID_PAGAMENTO}`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${TOKEN_MERCADO_PAGO}` }
                });

                const dadosPagamento = await resposta.json();

                // Se o status no Mercado Pago mudar para aprovado, atualiza a tela do cliente
                if (dadosPagamento.status === "approved") {
                    clearInterval(intervalo); // Para o loop de 10 segundos
                    document.getElementById("qrcodeArea").style.display = "none"; // Some com o QR Code da tela
                    document.getElementById("status").innerHTML = "<h3 style='color: #00a650;'>🎉 Pagamento Confirmado! Seu ingresso foi gerado.</h3>";
                }
            } catch (erro) {
                console.error("Erro ao verificar status no Mercado Pago:", erro);
            }
        }, 10000); 
    }

    function copiarTexto() {
        const inputCopiaCola = document.getElementById("copiaCola");
        inputCopiaCola.select();
        inputCopiaCola.setSelectionRange(0, 99999); // Suporte para dispositivos móveis

        navigator.clipboard.writeText(inputCopiaCola.value).then(() => {
            const valorOriginal = inputCopiaCola.value;
            inputCopiaCola.value = "Copiado com sucesso!";
            inputCopiaCola.style.color = "#00a650";
            
            setTimeout(() => {
                inputCopiaCola.value = valorOriginal;
                inputCopiaCola.style.color = "#333";
            }, 2000);
        }).catch(err => {
            console.error("Erro ao copiar o código Pix: ", err);
        });
    }
</script>

</body>
</html>
