<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           RESET & ESTRUTURA GLOBAL
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s; }
        body { 
            font-family: 'Poppins', sans-serif; min-height: 100vh; min-height: 100dvh; color: #4a3b32; display: flex; justify-content: center; align-items: center; padding: 25px 18px;
            background-color: #e65100; 
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%), linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%); 
            background-size: 40px 40px; background-position: 0 0, 20px 20px; 
        }
        
        .container { width: 100%; max-width: 360px; position: relative; background-color: #fffdf7; padding: 26px 20px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35); text-align: center; border: 3px dashed #d84315; margin: auto 0; }
        
        /* AJUSTE: Amatic SC blindada contra falhas e com distância corrigida para o primeiro campo (20px) */
        h1 { font-family: 'Amatic SC', cursive, sans-serif !important; font-weight: 700 !important; font-size: 52px; letter-spacing: 2px; color: #bf360c; margin-top: 2px; line-height: 1; margin-bottom: 6px; }
        
        /* AJUSTE: Nomes dos campos um pouco mais finos (500) e espaço entre campos sutilmente maior (14px) */
        label { font-weight: 500; margin-top: 14px; display: block; text-align: left; font-size: 13.5px; color: #4a3b32; }
        
        .form-group { position: relative; display: flex; flex-direction: column; }
        
        /* Ícone centralizado na caixa slim */
        .input-icon { position: absolute; left: 14px; bottom: 10px; color: #bcaaa4; font-size: 14px; z-index: 2; }
        .has-icon input, .has-icon select { padding-left: 38px !important; }
        
        /* Caixas slim mantidas */
        input, select { width: 100%; padding: 8px 11px; border-radius: 8px; border: 2px dashed #bcaaa4; font-size: 13px; box-sizing: border-box; background-color: #fff; outline: none; margin-top: 5px; font-family: 'Poppins', sans-serif; color: #4a3b32; }
        input:focus, select:focus { border-color: #e65100 !important; box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.15); }
        .input-erro { border: 2px solid #ff1744 !important; background-color: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background-color: #f1f8e9; }
        .msg-erro-cpf { color: #ff1744; font-size: 11px; display: block; text-align: left; margin-top: 2px; font-weight: 400; }
        
        /* Ajuste do bloco de convidados para manter a harmonia */
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 14px; border: 1px solid #ebba95; text-align: left; }
        .ingresso-extra label { margin-top: 10px; }
        .ingresso-extra label:first-child { margin-top: 0; }
        
        /* AJUSTE: Diminuída a distância para o último campo (16px) e peso de fonte em 600 */
        .btn-principal { margin-top: 12px; width: 100%; padding: 11px; border-radius: 8px; font-size: 15px; font-weight: 600; background-color: #e65100; color: white; cursor: pointer; border: none; box-shadow: 0 4px 0 #b33600; font-family: 'Poppins', sans-serif; }
        .btn-principal:active:not(:disabled) { box-shadow: 0 1px 0 #b33600; transform: translateY(3px); }
        .btn-principal:disabled { background-color: #bcaaa4 !important; box-shadow: 0 4px 0 #8d6e63 !important; cursor: not-allowed; }
        
        .btn-validar { position: relative; background-color: #1565c0 !important; box-shadow: 0 4px 0 #0d47a1 !important; margin-top: 14px; z-index: 1; font-weight: 600; }
        .btn-validar:active:not(:disabled) { box-shadow: 0 1px 0 #0d47a1 !important; transform: translateY(3px); }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font-size: 12px; font-weight: 600; background-color: #616161; color: white; border: none; border-radius: 6px; cursor: pointer; }
        
        /* Containers secundários */
        .qr-container { display: none; margin-top: 10px; padding: 14px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; }
        .qr-container img { width: 100%; max-width: 150px; display: inline-block; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 8px; font-size: 1.1em; }
        .pix-box { margin-top: 10px; padding: 8px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        .pix-codigo-input { font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 100%; text-align: center; border: 1px solid #ccc; background: #fff; padding: 6px; border-radius: 4px; color: #4a3b32; }
        .status-msg { margin-top: 10px; font-size: 13px; font-weight: bold; color: #bf360c; line-height: 1.4; }
        .texto-expiracao { display: none; color: #ff1744; font-size: 12px; font-weight: 600; margin-bottom: 5px; margin-top: 10px; }
        .msg-confirmacao { font-family: 'Amatic SC', cursive, sans-serif !important; color: #2e7d32; line-height: 1.1; }
        .msg-confirmacao h2 { font-size: 38px; margin: 8px 0; font-weight: 700; color: #2e7d32; }
        .msg-confirmacao p { font-size: 28px; margin: 4px 0; font-weight: 700; }
        .icon-grande { font-size: 60px; display: block; margin-bottom: 6px; color: #2e7d32; }
        
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-conteudo { position: relative; max-width: 75vw; max-height: 75vh; }
        .popup-imagem { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-fechar-popup { display: none; position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background-color: #616161; color: #ffffff; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-x-popup { display: none; position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background-color: #ff1744; color: #ffffff; border: 2px solid #ffffff; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; line-height: 26px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 10000; }
        .pagamento-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 5000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .pagamento-overlay-texto { color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; text-align: center; max-width: 320px; line-height: 1.5; }
        
        .sessao-bloqueada { opacity: 0.35 !important; filter: grayscale(100%) !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>

    <div class="pagamento-overlay" id="pagamentoOverlay">
        <div class="pagamento-overlay-texto" id="txtOverlay"></div>
    </div>

    <div class="container">
        <h1>Festa Junina</h1>
        <form id="sessao-formulario" onsubmit="processarEnvioFormulario(event)">
            <div class="form-group has-icon">
                <label>Nome do Comprador</label>
                <i class="fa-solid fa-user input-icon"></i>
                <input id="comprador" required placeholder="Escreva seu nome aqui...">
            </div>
            <div class="form-group has-icon">
                <label>CPF do Comprador</label>
                <i class="fa-solid fa-id-card input-icon"></i>
                <input id="cpf-comprador" required class="cpf-validar" placeholder="000.000.000-00">
            </div>
            <div class="form-group has-icon">
                <label>Telefone</label>
                <i class="fa-solid fa-phone input-icon"></i>
                <input id="telefone" required placeholder="(00) 00000-0000">
            </div>
            <div class="form-group has-icon">
                <label>Quantidade de ingressos</label>
                <i class="fa-solid fa-users input-icon"></i>
                <select id="quantidade">
                    <option value="1">1 ingresso</option>
                    <option value="2">2 ingressos</option>
                    <option value="3">3 ingressos</option>
                </select>
            </div>
            <div id="campos-extras"></div>
            <button type="submit" id="btn-gerar" class="btn-principal">
                <i class="fa-solid fa-qrcode"></i> Gerar QR Code
            </button>
        </form>

        <div class="texto-expiracao" id="timer-expiracao">O código a seguir expira em 10:00.</div>

        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr" class="status-msg">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Processando...
            </div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total">Total: Calculando...</div>
            <div class="pix-box">
                <input id="pix-codigo" class="pix-codigo-input" readonly onclick="this.select()">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()">
                    <i class="fa-solid fa-copy"></i> Copiar Código Pix
                </button>
            </div>
            <button id="btn-validar" class="btn-principal btn-validar">
                <i class="fa-solid fa-circle-check"></i> Verificar Pagamento
            </button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>

    <script>
        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/338235de46b04ea9b3674fca6e95360c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=JjqfJbr7Cf3Qq-KoNP1GQPPrMBkT9DIhSrIkvkFAGRk";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/484f77e462c548b58ec3628b695cb04a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hhue2aeqHlRV4ynfMUcFnY90J4b-wyDlvj-t8TfambE";
        const TEMPO_CHECK_PIX = 6000;
        const LIMITE_EXPIRACAO_PIX = 600000;
        const MSGS = {
            dados_invalidos: "Preencha os dados corretamente",
            cpf_comprador_duplicado: "Atenção: O CPF do Comprador só pode constar em 1 campo dos ingressos",
            cpf_convidado_duplicado: "Atenção: CPF duplicados na lista de convidados",
            overlay_texto: "Não se esqueça de clicar no botão abaixo ao finalizar o seu pagamento.",
            copiado: "Copiado!",
            timeout: "Tempo Limite"
        };

        let idPagamentoAtual = null, intervaloPix = null, loopEmExecucao = false, cronometroRegressivo = null;
        const selectQtde = document.getElementById("quantidade"), camposExtras = document.getElementById("campos-extras");

        setTimeout(() => {
            document.getElementById('btnFecharPopup').style.display = 'block';
            document.getElementById('btnXPopup').style.display = 'block';
        }, 3000);

        function fecharPopup() { document.getElementById('popupOverlay').style.display = 'none'; }

        function formatarNomeProprio(n) {
            const p = ["da", "das", "de", "do", "dos"];
            return n.toLowerCase().split(' ').map(w => p.includes(w) || w === "" ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        document.getElementById('comprador').addEventListener('blur', e => {
            if (e.target.value.trim() !== "") e.target.value = formatarNomeProprio(e.target.value);
        });

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-validar").forEach(el => {
                el.removeEventListener("input", maskCPF); el.addEventListener("input", maskCPF);
                el.removeEventListener("blur", validateCPFBlur); el.addEventListener("blur", validateCPFBlur);
            });
            const t = document.getElementById("telefone");
            if(t) {
                t.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
                    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
                    else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
                    else if (v.length > 0) v = v.replace(/^(\d{0,2})/, "($1");
                    e.target.value = v;
                });
            }
        }

        function maskCPF(e) {
            let v = e.target.value.replace(/\D/g, "").slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
            e.target.value = v;
        }

        function validarCPF(c) {
            c = c.replace(/[^\d]+/g, '');
            if (c == '' || c.length != 11 || /^(\d)\1{10}$/.test(c)) return false;
            let a = 0;
            for (let i = 0; i < 9; i++) a += parseInt(c.charAt(i)) * (10 - i);
            let r = 11 - (a % 11);
            if (r == 10 || r == 11) r = 0;
            if (r != parseInt(c.charAt(9))) return false;
            a = 0;
            for (let i = 0; i < 10; i++) a += parseInt(c.charAt(i)) * (11 - i);
            r = 11 - (a % 11);
            if (r == 10 || r == 11) r = 0;
            return r == parseInt(c.charAt(10));
        }

        function validateCPFBlur(e) {
            const v = e.target.value, ex = e.target.nextElementSibling;
            if (ex && ex.classList.contains('msg-erro-cpf')) ex.remove();
            if (v.length > 0) {
                if (validarCPF(v)) {
                    e.target.classList.remove("input-erro"); e.target.classList.add("input-sucesso");
                } else {
                    e.target.classList.remove("input-sucesso"); e.target.classList.add("input-erro");
                    const s = document.createElement("span"); s.className = "msg-erro-cpf"; s.innerText = "CPF Inválido";
                    e.target.after(s);
                }
            } else { e.target.classList.remove("input-erro", "input-sucesso"); }
        }

        selectQtde.addEventListener("change", () => {
            const q = parseInt(selectQtde.value); camposExtras.innerHTML = "";
            for(let i = 1; i <= q; i++) {
                const d = document.createElement("div"); d.className = "ingresso-extra";
                d.innerHTML = `<div style="font-weight:700; color:#bf360c; margin-bottom:5px; font-size:13px; text-transform:uppercase;"><i class="fa-solid fa-ticket"></i> Ingresso ${i}</div><label>Nome no Ingresso</label><input class="nome-ing" required placeholder="Nome do convidado"><label>CPF Convidado</label><input class="cpf-ing cpf-validar" required placeholder="000.000.000-00">`;
                camposExtras.appendChild(d);
            }
            aplicarMascaras();
            document.querySelectorAll(".nome-ing").forEach(el => {
                el.addEventListener('blur', e => {
                    if (e.target.value.trim() !== "") e.target.value = formatarNomeProprio(e.target.value);
                });
            });
        });
        selectQtde.dispatchEvent(new Event('change'));

        async function processarEnvioFormulario(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-gerar"), comp = document.getElementById("comprador").value.trim(), cpfC = document.getElementById("cpf-comprador").value.trim(), tel = document.getElementById("telefone").value.trim();
            if (!comp || !validarCPF(cpfC) || tel.length < 14) {
                alert(MSGS.dados_invalidos); document.getElementById("cpf-comprador").classList.add("input-erro"); return;
            }
            const inN = document.querySelectorAll(".nome-ing"), inC = document.querySelectorAll(".cpf-ing");
            let list = [], cpfsConv = [], contCpfC = 0, erroV = false;
            inC.forEach((input, i) => {
                const cVal = input.value.trim(), nVal = inN[i].value.trim();
                if (!nVal || !validarCPF(cVal)) { erroV = true; input.classList.add("input-erro"); } else { input.classList.remove("input-erro"); }
                if (cVal === cpfC) contCpfC++; else cpfsConv.push(cVal);
                list.push({ "NOME_INGRESSO": nVal, "CPF_INGRESSO": cVal });
            });
            if (erroV) { alert(MSGS.dados_invalidos); return; }
            if (contCpfC > 1) { alert(MSGS.cpf_comprador_duplicado); return; }
            if ((new Set(cpfsConv)).size !== cpfsConv.length) { alert(MSGS.cpf_convidado_duplicado); return; }
            
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...`;
            const payload = { "COMPRADOR": comp, "CPF_COMPRADOR": cpfC, "TELEFONE": tel, "QUANTIDADE": selectQtde.value, "INGRESSOS": list };

            try {
                const r = await fetch(URL_GERAR_PIX, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                if (r.ok) {
                    const d = await r.json();
                    if (d.status === "bloqueado") {
                        alert("⚠️ BLOQUEIO: " + d.mensagem); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; return;
                    }
                    idPagamentoAtual = d.pagamento_id || d.id || d.id_pagamento || "";
                    document.getElementById("img-qr").src = `data:image/png;base64,${d.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = d.pix_copia_e_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(d.variavel).toFixed(2).replace('.', ',')}`;
                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    document.getElementById("img-qr").style.display = "inline-block";

                    if (!((d.status === "pending" || d.status === "pendente") && d.mensagem === "recuperar")) {
                        const ov = document.getElementById("pagamentoOverlay"), bV = document.getElementById("btn-validar");
                        document.getElementById("txtOverlay").innerText = MSGS.overlay_texto;
                        ov.style.display = "flex"; bV.style.zIndex = "6000";
                        setTimeout(() => { ov.style.display = "none"; bV.style.zIndex = "1"; }, 5000);
                    }
                    iniciarCronometro(); iniciarMonitoramentoPixAutomatico();
                } else { alert("Erro ao processar. Tente novamente."); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; }
            } catch (err) { alert("Erro de conexão com o servidor."); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; }
        }

        function iniciarCronometro() {
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            let tRest = Math.floor(LIMITE_EXPIRACAO_PIX / 1000);
            const elT = document.getElementById('timer-expiracao');
            cronometroRegressivo = setInterval(() => {
                let m = Math.floor(tRest / 60), s = tRest % 60;
                elT.innerText = `O código a seguir expira em ${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}.`;
                if (tRest <= 0) { clearInterval(cronometroRegressivo); ejecutarFluxoTimeoutEstrito(); }
                tRest--;
            }, 1000);
        }

        function copiarPix() {
            const p = document.getElementById("pix-codigo"); p.select(); navigator.clipboard.writeText(p.value);
            document.getElementById("btn-copiar").innerText = MSGS.copiado;
            setTimeout(() => { document.getElementById("btn-copiar").innerHTML = `<i class="fa-solid fa-copy"></i> Copiar Código Pix`; }, 2000);
        }

        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix); loopEmExecucao = false;
            intervaloPix = setInterval(async () => {
                if (loopEmExecucao) return; loopEmExecucao = true;
                const conf = await efetuarChamadaValidacaoAPI();
                if (conf) { clearInterval(intervaloPix); intervaloPix = null; aplicarLayoutSucessoDefinitivo(); }
                loopEmExecucao = false;
            }, TEMPO_CHECK_PIX);
        }

        async function efetuarChamadaValidacaoAPI() {
            try {
                const r = await fetch(URL_VALIDAR_PAGAMENTO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "id": idPagamentoAtual ? String(idPagamentoAtual).trim() : "" }) });
                if (!r.ok) return false; const res = await r.text(); return res.includes("Sucesso");
            } catch (e) { return false; }
        }

        document.getElementById("btn-validar").addEventListener("click", async () => {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            const btn = document.getElementById("btn-validar"), msg = document.getElementById("status-verificacao");
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...`;
            if (await efetuarChamadaValidacaoAPI()) { aplicarLayoutSucessoDefinitivo(); } else {
                msg.innerHTML = `<span class="icon-grande" style="font-size:50px; color:#bf360c; margin-bottom:5px;">❌</span><br>Ainda não encontramos o seu Pix.<br>Espera um tiquinho e tenta de novo!`;
                btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Verificar Pagamento`;
                iniciarMonitoramentoPixAutomatico();
            }
        });

        function aplicarLayoutSucessoDefinitivo() {
            if (cronometroRegressivo) clearInterval(cronometroRegressivo); if (intervaloPix) clearInterval(intervaloPix);
            document.getElementById("timer-expiracao").style.display = "none";
            document.getElementById("sessao-qr").innerHTML = `<div class="msg-confirmacao"><span class="icon-grande">✅</span><h2>PAGAMENTO CONFIRMADO!</h2><p>ETA TREM BÃO!</p><p>NOS ENCONTRAMOS NA FESTA!</p></div>`;
        }

        function ejecutarFluxoTimeoutEstrito() {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            const elT = document.getElementById('timer-expiracao'), sQr = document.getElementById('sessao-qr'), ov = document.getElementById("pagamentoOverlay"), txtO = document.getElementById("txtOverlay");
            
            elT.innerText = MSGS.timeout; 
            document.getElementById('status-verificacao').innerHTML = ""; 
            
            sQr.classList.add("sessao-bloqueada"); 
            document.getElementById('btn-copiar').disabled = document.getElementById('btn-validar').disabled = true;
            
            let cRedir = 9; 
            txtO.innerHTML = `Tempo Limite Excedido!<br><span style='font-size:15px; font-weight:400; opacity:0.8;'>Redirecionando em ${cRedir}s...</span>`;
            
            ov.style.display = "flex";
            ov.style.zIndex = "20000"; 

            const loopRedir = setInterval(() => {
                cRedir--; 
                txtO.innerHTML = `Tempo Limite Excedido!<br><span style='font-size:15px; font-weight:400; opacity:0.8;'>Redirecionando em ${cRedir}s...</span>`;
                
                if (cRedir <= 0) { 
                    clearInterval(loopRedir); 
                    window.location.reload(); 
                }
            }, 1000);
        }
    </script>
</body>
</html>
