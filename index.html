<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e65100;
        }

        .container {
            background-color: #fffdf7;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border: 3px dashed #d84315;
        }

        h1 {
            font-family: 'Amatic SC', cursive;
            font-size: 52px;
            color: #bf360c;
            text-align: center;
        }

        label {
            font-weight: 600;
            margin-top: 20px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px dashed #bcaaa4;
            box-sizing: border-box;
        }

        .ingresso { margin-top: 12px; }

        img {
            display: block;
            margin: 30px auto 10px;
            max-width: 250px;
            width: 100%;
        }

        .valor {
            text-align: center;
            font-weight: bold;
            color: #bf360c;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            background-color: #2e7d32;
            color: white;
            cursor: pointer;
            border: 2px dashed #a5d6a7;
            box-shadow: 0 6px 0 #1b5e20;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Festa Junina</h1>

    <label>Nome do comprador</label>
    <input id="comprador">

    <label>Telefone</label>
    <input id="telefone">

    <label>Quantidade de ingressos</label>
    <select id="quantidade">
        <option value="1">1 ingresso</option>
    </select>

    <label>CPF</label>
    <input id="cpf">

    <div id="nomes"></div>

    <!-- QR CODE -->
    <img src="qr.png">
    <div class="valor">Valor: R$ 5,00</div>

    <!-- INPUT FILE -->
    <input type="file" id="comprovante" accept="image/*,application/pdf" style="display:none">

    <!-- BOTÃO -->
    <button id="btn-enviar">Enviar Comprovante</button>
</div>

<script>
    const inputFile = document.getElementById("comprovante");
    const botao = document.getElementById("btn-enviar");

    // cria campo ingresso
    function atualizarCampos() {
        const container = document.getElementById("nomes");
        container.innerHTML = "";

        let campo = document.createElement("input");
        campo.placeholder = "Nome do ingresso";
        campo.className = "ingresso";
        container.appendChild(campo);
    }

    atualizarCampos();

    // clique inicial
    botao.addEventListener("click", function () {
        if (botao.innerText === "Enviar Comprovante") {
            inputFile.click();
        }
    });

    // selecionou arquivo
    inputFile.addEventListener("change", function () {
        if (this.files.length > 0) {
            botao.innerText = "Enviar";
        }
    });

    // envio
    botao.addEventListener("click", async function () {

        if (botao.innerText !== "Enviar") return;

        const file = inputFile.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = async function () {
            const base64 = reader.result.split(",")[1];

            const dados = {
                nome: document.getElementById("comprador").value,
                telefone: document.getElementById("telefone").value,
                cpf: document.getElementById("cpf").value,
                ingresso: document.querySelector(".ingresso").value,
                arquivo: base64,
                nomeArquivo: file.name
            };

            await fetch("COLE_AQUI_SUA_URL_DO_POWER_AUTOMATE", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            });

            botao.innerText = "Enviado";
            botao.disabled = true;
        };

        reader.readAsDataURL(file);
    });

    // máscara telefone
    document.getElementById("telefone").addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 6)
            v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
        else if (v.length > 2)
            v = v.replace(/(\d{2})(\d{0,5})/, "($1) $2");
        this.value = v;
    });

    // máscara CPF
    document.getElementById("cpf").addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
    });
</script>

</body>
</html>
