<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    
    <!-- ======================================================================= -->
    <!-- 1. BLOCO DE CONFIGURAÇÃO E MANUTENÇÃO                                   -->
    <!-- ======================================================================= -->
    <script>
        const CONFIG = {
            encerrar_agora: false, 
            data_fim: "2026-10-30T23:59:59", // Formato: ANO-MES-DIA THORA:MIN:SEG
            img_abertas: "aviso.jpg",
            img_encerradas: "aviso2.jpg",
            
            // Configurações de Tempo e Segurança (em segundos)
            tempo_trava_botao: 59,          // Tempo que o botão gerar fica cinza após sucesso
            tempo_expiracao_pix: 600,       // Tempo de expiração do QR Code (10 minutos)
            intervalo_monitoramento: 6      // Intervalo de checagem automática do Pix
        };
    </script>
    <!-- ======================================================================= -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s; }
        body { font-family: 'Poppins', sans-serif; min-height: 100dvh; color: #4a3b32; display: flex; justify-content: center; align-items: center; padding: 60px 18px 25px; background: #e65100 linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%) 0 0/40px 40px; }
        body::before { content: ''; background: inherit; background-position: 20px 20px; position: absolute; inset: 0; z-index: -1; }
        
        #top-bar { position: fixed; top: 0; left: 0; width: 100%; background: #e65100; color: #fff; text-align: center; padding: 12px 0; font-weight: 600; font-size: 15px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .container { width: 100%; max-width: 360px; background: #fffdf7; padding: 26px 20px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.35); text-align: center; border: 3px dashed #d84315; }
        h1 { font: 700 52px 'Amatic SC', sans-serif; letter-spacing: 2px; color: #bf360c; margin: 2px 0 6px; line-height: 1; }
        label { font-weight: 500; margin-top: 14px; display: block; text-align: left; font-size: 13.5px; }
        .form-group { position: relative; display: flex; flex-direction: column; }
        .input-icon { position: absolute; left: 14px; bottom: 10px; color: #bcaaa4; font-size: 14px; z-index: 2; }
        input, select { width: 100%; padding: 8px 11px; border-radius: 8px; border: 2px dashed #bcaaa4; font: 13px 'Poppins', sans-serif; color: #4a3b32; outline: none; margin-top: 5px; }
        .has-icon input, .has-icon select { padding-left: 38px; }
        input:focus, select:focus { border-color: #e65100; box-shadow: 0 0 0 3px rgba(230,81,0,0.15); }
        .input-erro { border: 2px solid #ff1744 !important; background: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background: #f1f8e9; }
        .msg-erro-cpf { color: #ff1744; font-size: 11px; text-align: left; display: block; margin-top: 2px; }
        
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 14px; border: 1px solid #ebba95; text-align: left; }
        .ingresso-extra label { margin-top: 10px; } .ingresso-extra label:first-child { margin-top: 0; }
        
        .btn-principal { margin-top: 12px; width: 100%; padding: 11px; border-radius: 8px; font: 600 15px 'Poppins', sans-serif; background: #e65100; color: #fff; border: none; box-shadow: 0 4px 0 #b33600; cursor: pointer; }
        .btn-principal:active:not(:disabled) { box-shadow: 0 1px 0 #b33600; transform: translateY(3px); }
        .btn-principal:disabled { background: #bcaaa4; box-shadow: 0 4px 0 #8d6e63; cursor: not-allowed; opacity: 0.6; }
        .btn-validar { background: #1565c0; box-shadow: 0 4px 0 #0d47a1; margin-top: 14px; z-index: 1; }
        .btn-validar:active:not(:disabled) { box-shadow: 0 1px 0 #0d47a1; }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font: 600 12px 'Poppins', sans-serif; background: #616161; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        
        .qr-container { display: none; margin-top: 10px; padding: 14px; border: 1px solid #eee; border-radius: 10px; background: #fff; }
        .qr-container img { width: 100%; max-width: 150px; display: inline-block; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 8px; font-size: 1.1em; }
        .pix-box { margin-top: 10px; padding: 8px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; }
        .pix-codigo-input { font: 11px 'JetBrains Mono', monospace; width: 100%; text-align: center; border: 1px solid #ccc; padding: 6px; border-radius: 4px; background: #fff; }
        .status-msg { margin-top: 10px; font: bold 13px 'Poppins'; color: #bf360c; line-height: 1.4; }
        .texto-expiracao { display: none; color: #ff1744; font-weight: 600; font-size: 12px; margin: 10px 0 5px; }
        .msg-confirmacao { font: 700 28px 'Amatic SC', sans-serif; color: #2e7d32; line-height: 1.1; }
        .msg-confirmacao h2 { font-size: 38px; margin: 8px 0; }
        .icon-grande { font-size: 60px; display: block; margin-bottom: 6px; }
        
        .popup-overlay, .pagamento-overlay { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 9999; padding: 20px; }
        .pagamento-overlay { display: none; background: rgba(0,0,0,0.85); z-index: 5000; }
        .popup-conteudo { position: relative; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; align-items: center; }
        .btn-timer-popup, .btn-fechar-popup { background: rgba(97,97,97,0.9); color: #fff; border: none; border-radius: 6px; font: 600 14px 'Poppins', sans-serif; padding: 10px 20px; cursor: pointer; }
        .btn-timer-popup { margin-bottom: 12px; width: 100%; max-width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-fechar-popup { display: none; position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); font-size: 13px; white-space: nowrap; }
        .btn-timer-popup:hover, .btn-fechar-popup:hover { background: #616161; }
        .popup-imagem { max-width: 100%; max-height: 65vh; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-x-popup { display: none; position: absolute; top: 40px; right: -12px; width: 30px; height: 30px; background: #ff1744; color: #fff; border: 2px solid #fff; border-radius: 50%; font: bold 14px 'Poppins'; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 10000; }
        .pagamento-overlay-texto { color: #fff; font: 600 16px 'Poppins'; text-align: center; max-width: 320px; line-height: 1.5; }
        .sessao-bloqueada { opacity: 0.35 !important; filter: grayscale(100%) !important; pointer-events: none !important; }
        
        body.vendas-encerradas #top-bar { background: #616161; }
        body.vendas-encerradas .btn-timer-popup { background: #424242; pointer-events: none; }
        body.vendas-encerradas .container { opacity: 0.4; filter: grayscale(100%); pointer-events: none; }
    </style>
</head>
<body>
    
    <div id="top-bar">
        <span class="txt-urgencia">vendas encerram em</span> <span class="crono-urgencia">00:00:00</span>
    </div>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-timer-popup" id="btnTimerPopup" onclick="fecharPopup()">
                <span class="txt-urgencia">vendas encerram em</span> <span class="crono-urgencia">00:00:00</span>
            </button>
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" id="imagem-aviso" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>
    
    <div class="pagamento-overlay" id="pagamentoOverlay"><div class="pagamento-overlay-texto" id="txtOverlay"></div></div>
    
    <div class="container" id="container-principal">
        <h1>Festa Junina</h1>
        <form id="sessao-formulario" onsubmit="processarFormulario(event)">
            <div class="form-group has-icon"><label>Nome do Comprador</label><i class="fa-solid fa-user input-icon"></i><input id="comprador" required placeholder="Escreva seu nome aqui..."></div>
            <div class="form-group has-icon"><label>CPF do Comprador</label><i class="fa-solid fa-id-card input-icon"></i><input id="cpf-comprador" required class="cpf-validar" placeholder="000.000.000-00"></div>
            <div class="form-group has-icon"><label>Telefone</label><i class="fa-solid fa-phone input-icon"></i><input id="telefone" required placeholder="(00) 00000-0000"></div>
            <div class="form-group has-icon"><label>Quantidade de ingressos</label><i class="fa-solid fa-users input-icon"></i>
                <select id="quantidade"><option value="1">1 ingresso</option><option value="2">2 ingressos</option><option value="3">3 ingressos</option></select>
            </div>
            <div id="campos-extras"></div>
            <button type="submit" id="btn-gerar" class="btn-principal"><i class="fa-solid fa-qrcode"></i> Gerar QR Code</button>
        </form>
        
        <div class="texto-expiracao" id="timer-expiracao">O código a seguir expira em 10:00.</div>
        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr" class="status-msg"><i class="fa-solid fa-circle-notch fa-spin"></i> Processando...</div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total">Total: Calculando...</div>
            <div class="pix-box">
                <input id="pix-codigo" class="pix-codigo-input" readonly onclick="this.select()">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copyPix()"><i class="fa-solid fa-copy"></i> Copiar Código Pix</button>
            </div>
            <button id="btn-validar" class="btn-principal btn-validar"><i class="fa-solid fa-circle-check"></i> Verificar Pagamento</button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>
    
    <script>
        // =======================================================================
        <!-- 2. ESTRUTURA DE INICIALIZAÇÃO E RECONSTRUÇÃO DE ESTADOS (PERSISTÊNCIA) -->
        // =======================================================================
        const URL_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6b5aca8cd55f4f31a6144e6239ac468a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=moQdujZizJdIDTigwEytcDvtJR39uaQQy83riRWFZvQ", URL_VAL = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d9d6210c5c284e4f8508436dafdb9301/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=P4Y5Lv3OMh9b6yDftV1JosH1Fq3YXtpHxMUNviEZAuU";
        let idPag = null, intPix = null, cronoPix = null, selectQ = document.getElementById("quantidade");

        window.addEventListener('DOMContentLoaded', () => {
            verificarVendas();
            setTimeout(() => { document.getElementById('btnFecharPopup').style.display = document.getElementById('btnXPopup').style.display = 'block'; }, 3000);
            
            // Verificação de Estados Salvos (Cenário de recarregamento em background)
            const statusPagamento = localStorage.getItem('statusPagamentoFinal');
            const dadosPixSalvos = localStorage.getItem('dadosIdentificacaoPix');
            const travaBotaoAte = localStorage.getItem('travaTempoBotaoGerar');

            // 1. Se já tinha chegado no ETA TREM BÃO, força a permanência estática na tela de Sucesso
            if (statusPagamento === 'pago') {
                document.getElementById("sessao-formulario").style.display = "none";
                document.getElementById("timer-expiracao").style.display = "none";
                document.getElementById("sessao-qr").style.display = "block";
                sucessoDefinitivo();
                return; 
            }

            // 2. Se existia um QR Code ativo na sessão, reconstrói exatamente a tela do QR Code (sem atualizar)
            if (dadosPixSalvos) {
                const d = JSON.parse(dadosPixSalvos);
                idPag = d.pagamento_id || d.id;
                
                document.getElementById("img-qr").src = `data:image/png;base64,${d.pix_qr_code_base64}`;
                document.getElementById("pix-codigo").value = d.pix_copia_cola;
                document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(d.variavel).toFixed(2).replace('.',',')}`;
                
                document.getElementById("sessao-formulario").style.display = "none";
                document.getElementById("timer-expiracao").style.display = "block";
                document.getElementById("sessao-qr").style.display = "block";
                document.getElementById("carregando-qr").style.display = "none";
                document.getElementById("img-qr").style.display = "inline-block";
                
                // Retoma os contadores de tempo onde pararam
                const tempoRestante = Math.round((localStorage.getItem('tempoExpiracaoPixAbsoluto') - Date.now()) / 1000);
                if (tempoRestante > 0) {
                    startPixTimer(tempoRestante);
                    monitorarPagamento();
                } else {
                    timeoutEstrito();
                }
            }

            // 3. Controle dos 59 segundos do botão Gerar (Apenas se já clicou com sucesso uma vez)
            if (travaBotaoAte) {
                const segundosRestantes = Math.round((travaBotaoAte - Date.now()) / 1000);
                if (segundosRestantes > 0) {
                    const btnGerar = document.getElementById("btn-gerar");
                    btnGerar.disabled = true; // Botão fica cinza e desativado sem mudar nenhum texto
                    
                    setTimeout(() => {
                        btnGerar.disabled = false;
                        localStorage.removeItem('travaTempoBotaoGerar');
                    }, segundosRestantes * 1000);
                } else {
                    localStorage.removeItem('travaTempoBotaoGerar');
                }
            }
        });

        function fecharPopup() { document.getElementById('popupOverlay').style.display = 'none'; }

        function verificarVendas() {
            const dataFim = new Date(CONFIG.data_fim), agora = new Date();
            let dif = dataFim - agora;
            
            if (CONFIG.encerrar_agora || dif <= 0) {
                document.body.classList.add('vendas-encerradas');
                document.querySelectorAll('.txt-urgencia').forEach(el => el.textContent = "vendas encerradas");
                document.querySelectorAll('.crono-urgencia').forEach(el => el.style.display = "none");
                document.getElementById('imagem-aviso').src = CONFIG.img_encerradas;
                document.getElementById('popupOverlay').style.display = 'flex';
                document.getElementById('btnTimerPopup').removeAttribute('onclick');
                return;
            }
            
            const totalHoras = Math.floor(dif / 3600000);
            
            document.querySelectorAll('.crono-urgencia').forEach(el => {
                el.style.display = "inline";
                
                if (totalHoras > 96) {
                    const dias = Math.floor(dif / (1000 * 60 * 60 * 24));
                    el.textContent = `${dias} ${dias === 1 ? 'dia' : 'dias'}`;
                } else {
                    const h = String(totalHoras).padStart(2, '0');
                    const m = String(Math.floor((dif / 60000) % 60)).padStart(2, '0');
                    const s = String(Math.floor((dif / 1000) % 60)).padStart(2, '0');
                    el.textContent = `${h}:${m}:${s}`;
                }
            });
            
            setTimeout(verificarVendas, 1000);
        }

        // =======================================================================
        <!-- 3. PARTE 1: MECÂNICA DO FORMULÁRIO, MÁSCARAS E VALIDAÇÕES            -->
        // =======================================================================
        function formatarNome(n) { return n ? n.normalize('NFD').replace(/[\u0300-\u036f]/g,"").toLowerCase().split(/\s+/).map(p => ["da","das","de","do","dos","e"].includes(p) ? p : p.charAt(0).toUpperCase()+p.slice(1)).join(' ') : ""; }
        document.getElementById('comprador').addEventListener('blur', e => { if(e.target.value.trim()) e.target.value = formatarNome(e.target.value); });

        function maskCpf(e) { let v = e.target.value.replace(/\D/g,"").slice(0,11); e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4").replace(/(\d{3})(\d{3})(\d{1,3})$/, "$1.$2.$3").replace(/(\d{3})(\d{1,3})$/, "$1.$2"); }
        function maskTel(e) { let v = e.target.value.replace(/\D/g,"").slice(0,11); e.target.value = v.length > 10 ? v.replace(/^(\d{2})(\d{5})(\d{4})/, "($1) $2-$3") : v.length > 6 ? v.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3") : v.length > 2 ? v.replace(/^(\d{2})(\d{0,5})/, "($1) $2") : v.length > 0 ? v.replace(/^(\d{0,2})/, "($1") : ""; }
        
        function valCpf(c) {
            c = c.replace(/[^\d]+/g, '');
            if(!c || c.length!=11 || /^(\d)\1{10}$/.test(c)) return false;
            let calc = t => Array.from(c.slice(0,t)).reduce((a, b, i) => a + parseInt(b) * ((t+1)-i), 0) * 10 % 11 % 10;
            return calc(9) === parseInt(c.charAt(9)) && calc(10) === parseInt(c.charAt(10));
        }

        document.getElementById("telefone").oninput = maskTel;
        document.getElementById("cpf-comprador").oninput = maskCpf;
        document.getElementById("cpf-comprador").onblur = checkCpf;

        function checkCpf(e) {
            const v = e.target.value, ex = e.target.nextElementSibling;
            if(ex?.classList.contains('msg-erro-cpf')) ex.remove();
            e.target.classList.remove("input-erro", "input-sucesso");
            if(v.length > 0) {
                if(valCpf(v)) e.target.classList.add("input-sucesso");
                else { e.target.classList.add("input-erro"); e.target.insertAdjacentHTML('afterend', '<span class="msg-erro-cpf">CPF Inválido</span>'); }
            }
        }

        function bindMasks() {
            document.querySelectorAll(".cpf-validar").forEach(el => { el.oninput = maskCpf; el.onblur = checkCpf; });
        }

        selectQ.onchange = () => {
            document.getElementById("campos-extras").innerHTML = Array.from({length: selectQ.value}, (_, i) => `
                <div class="ingresso-extra"><div style="font-weight:700;color:#bf360c;margin-bottom:5px;font-size:13px;"><i class="fa-solid fa-ticket"></i> Ingresso ${i+1}</div>
                <label>Nome no Ingresso</label><input class="nome-ing" required placeholder="Nome do convidado" onblur="if(this.value.trim()) this.value=formatarNome(this.value)">
                <label>CPF Convidado</label><input class="cpf-ing cpf-validar" required placeholder="000.000.000-00"></div>
            `).join(''); bindMasks();
        }; selectQ.dispatchEvent(new Event('change'));

        // =======================================================================
        <!-- 4. PARTE 2: LÓGICA DO BOTÃO GERAR QR CODE E CONTROLE DOS 59 SEGUNDOS -->
        // =======================================================================
        async function processarFormulario(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-gerar");
            const comp = document.getElementById("comprador").value.trim();
            const cpfOriginal = document.getElementById("cpf-comprador").value;
            const cpfCompradorNum = cpfOriginal.replace(/\D/g, "");
            const tel = document.getElementById("telefone").value.trim();
            
            const inN = document.querySelectorAll(".nome-ing");
            const inC = document.querySelectorAll(".cpf-ing");
            
            if(!comp || !valCpf(cpfCompradorNum) || tel.length < 14) {
                return alert("Preencha os dados do comprador corretamente.");
            }
            
            for (let i = 0; i < inC.length; i++) {
                let cpfIngressoNum = inC[i].value.replace(/\D/g, "");
                if (!inN[i].value.trim() || !valCpf(cpfIngressoNum)) {
                    return alert(`Preencha os dados do Ingresso ${i+1} corretamente.`);
                }
            }
            
            const cpfsConvidados = Array.from(inC).map(input => input.value.replace(/\D/g, ""));
            const setConvidados = new Set(cpfsConvidados);
            
            if (setConvidados.size !== cpfsConvidados.length) {
                return alert("⚠️ Atenção: Você não pode colocar o MESMO CPF em mais de um ingresso. Cada convidado precisa ter um CPF único.");
            }

            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...`;
            try {
                const res = await fetch(URL_PIX, { 
                    method: "POST", headers: {"Content-Type": "application/json"}, 
                    body: JSON.stringify({
                        COMPRADOR: comp, CPF_COMPRADOR: cpfOriginal, TELEFONE: tel, QUANTIDADE: selectQ.value, 
                        INGRESSOS: Array.from(inC).map((el, i) => ({NOME_INGRESSO: inN[i].value.trim(), CPF_INGRESSO: el.value.trim()}))
                    }) 
                });
                if(res.ok) {
                    const d = await res.json();
                    if(d.status === "bloqueado") { alert("⚠️ " + d.mensagem); btn.disabled=false; btn.innerHTML=`<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; return; }
                    
                    // Ativa a Trava de Sessão de 59 segundos para o botão gerar ficar indisponível (Apenas no sucesso)
                    const momentoExpiracaoBotao = Date.now() + (CONFIG.tempo_trava_botao * 1000);
                    localStorage.setItem('travaTempoBotaoGerar', momentoExpiracaoBotao);
                    
                    // =======================================================================
                    <!-- 5. PARTE 3: CRIAÇÃO DO QR CODE PIX E SALVAMENTO DE DADOS (PERSISTÊNCIA) -->
                    // =======================================================================
                    idPag = d.pagamento_id || d.id;
                    
                    // Guarda o objeto completo do Pix e calcula o momento exato do timeout absoluto
                    localStorage.setItem('dadosIdentificacaoPix', JSON.stringify(d));
                    localStorage.setItem('tempoExpiracaoPixAbsoluto', Date.now() + (CONFIG.tempo_expiracao_pix * 1000));
                    
                    document.getElementById("img-qr").src = `data:image/png;base64,${d.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = d.pix_copia_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(d.variavel).toFixed(2).replace('.',',')}`;
                    
                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    document.getElementById("img-qr").style.display = "inline-block";
                    
                    startPixTimer(CONFIG.tempo_expiracao_pix); 
                    monitorarPagamento();
                } else throw new Error();
            } catch(e) { alert("Erro ao processar."); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; }
        }

        // =======================================================================
        <!-- 6. PARTE 4: TEMPORIZADORES E MONITORAMENTO AUTOMÁTICO DO PIX         -->
        // =======================================================================
        function startPixTimer(tempoInicial) {
            let t = tempoInicial; const el = document.getElementById('timer-expiracao');
            if(cronoPix) clearInterval(cronoPix);
            cronoPix = setInterval(() => {
                el.innerText = `O código a seguir expira em ${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}.`;
                if(--t < 0) { clearInterval(cronoPix); timeoutEstrito(); }
            }, 1000);
        }

        function copyPix() { document.getElementById("pix-codigo").select(); document.execCommand('copy'); document.getElementById("btn-copiar").innerText="Copiado!"; setTimeout(()=>document.getElementById("btn-copiar").innerHTML=`<i class="fa-solid fa-copy"></i> Copiar Código Pix`, 2000); }

        async function validarApi() { try { return (await(await fetch(URL_VAL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({id:String(idPag)})})).text()).includes("Sucesso"); } catch(e){return false;} }
        
        function monitorarPagamento() {
            if(intPix) clearInterval(intPix);
            intPix = setInterval(async () => { if(await validarApi()) sucessoDefinitivo(); }, CONFIG.intervalo_monitoramento * 1000);
        }

        document.getElementById("btn-validar").onclick = async () => {
            if(intPix) clearInterval(intPix);
            const btn = document.getElementById("btn-validar"); btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...`;
            if(await validarApi()) sucessoDefinitivo();
            else { document.getElementById("status-verificacao").innerHTML=`<span class="icon-grande" style="color:#bf360c">❌</span>Ainda não encontramos o seu Pix.`; btn.disabled=false; btn.innerHTML=`<i class="fa-solid fa-circle-check"></i> Verificar Pagamento`; monitorarPagamento(); }
        };

        // =======================================================================
        <!-- 7. PARTE 5: TELA ETA TREM BÃO (ESTADO FINAL SEGURO)                  -->
        // =======================================================================
        function sucessoDefinitivo() {
            clearInterval(cronoPix); clearInterval(intPix);
            
            // Registra que a transação está paga na memória para travar o recarregamento aqui
            localStorage.setItem('statusPagamentoFinal', 'pago');
            localStorage.removeItem('dadosIdentificacaoPix'); // Limpa o rascunho temporário do QR Code
            
            document.getElementById("timer-expiracao").style.display = "none";
            document.getElementById("sessao-qr").innerHTML = `<div class="msg-confirmacao"><span class="icon-grande">✅</span><h2>PAGAMENTO CONFIRMADO!</h2><p>ETA TREM BÃO!</p><p>NOS ENCONTRAMOS NA FESTA!</p></div>`;
        }

        function timeoutEstrito() {
            clearInterval(intPix); 
            localStorage.removeItem('dadosIdentificacaoPix');
            localStorage.removeItem('tempoExpiracaoPixAbsoluto');
            document.getElementById('timer-expiracao').innerText = "Tempo Limite";
            document.getElementById('sessao-qr').classList.add("sessao-bloqueada");
            const ov = document.getElementById("pagamentoOverlay"), txt = document.getElementById("txtOverlay");
            ov.style.display="flex"; ov.style.zIndex="20000"; let c=9;
            setInterval(() => { txt.innerHTML = `Tempo Limite Excedido!<br><span style='font-size:15px;opacity:0.8'>Redirecionando em ${c--}s...</span>`; if(c<0) { localStorage.clear(); location.reload(); } }, 1000);
        }
    </script>
</body>
</html>
