<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>

    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a3b32;
            background-color: #e65100;
        }

        .container {
            background-color: #fffdf7;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 3px dashed #d84315;
        }

        h1 {
            font-family: 'Amatic SC', cursive;
            font-size: 48px;
            color: #bf360c;
        }

        label {
            font-weight: 600;
            display: block;
            text-align: left;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px dashed #bcaaa4;
            margin-top: 5px;
        }

        .ingresso { margin-top: 10px; }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2e7d32;
            color: white;
            cursor: pointer;
            border: none;
        }

        img {
            margin-top: 20px;
            width: 100%;
            max-width: 250px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Festa Junina</h1>

    <label>CPF</label>
    <input id="cpf" placeholder="000.000.000-00">

    <label>Nome do comprador</label>
    <input id="comprador" placeholder="Digite seu nome">

    <label>Telefone</label>
    <input id="telefone" placeholder="(xx) xxxxx-xxxx">

    <label>Quantidade de ingressos</label>
    <select id="quantidade">
        <option value="1">1 ingresso</option>
    </select>

    <div id="nomes"></div>

    <!-- QR CODE -->
    <img src="qr.png" alt="QR Code Pix">
    <p><strong>Valor: R$ 5,00</strong></p>

    <button onclick="enviarComprovante()">Enviar Comprovante</button>
</div>

<script>
    const quantidadeSelect = document.getElementById("quantidade");
    const containerNomes = document.getElementById("nomes");

    // cria campo de nome do ingresso
    function atualizarCampos() {
        containerNomes.innerHTML = "";

        let campo = document.createElement("input");
        campo.placeholder = "Nome do ingresso";
        campo.className = "ingresso";

        containerNomes.appendChild(campo);
    }

    atualizarCampos();

    // botão enviar comprovante
    function enviarComprovante() {
        let cpf = document.getElementById("cpf").value.trim();
        let nome = document.getElementById("comprador").value.trim();
        let tel = document.getElementById("telefone").value.trim();
        let ingresso = document.querySelector(".ingresso").value.trim();

        if (!cpf || !nome || !tel || !ingresso) {
            alert("Preencha todos os campos!");
            return;
        }

        alert("Pagamento registrado! Agora envie o comprovante para validação.");
    }

    // máscara CPF
    document.getElementById("cpf").addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
    });

    // máscara telefone
    document.getElementById("telefone").addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 6)
            v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
        else if (v.length > 2)
            v = v.replace(/(\d{2})(\d{0,5})/, "($1) $2");
        this.value = v;
    });
</script>

</body>
</html>
