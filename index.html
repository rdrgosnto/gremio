<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #4a3b32; background-color: #e65100; background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.15) 75%), linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.15) 75%); background-size: 40px 40px; background-position: 0 0, 20px 20px; }
        .container { background-color: #fffdf7; padding: 30px 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); text-align: center; box-sizing: border-box; border: 3px dashed #d84315; }
        h1 { margin-top: 10px; font-family: 'Amatic SC', cursive; font-size: 44px; color: #bf360c; }
        label { font-weight: 600; margin-top: 15px; display: block; text-align: left; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 2px dashed #bcaaa4; font-size: 14px; box-sizing: border-box; }
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ebba95; }
        .qr { margin-top: 25px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; }
        .qr img { width: 100%; max-width: 180px; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 10px; font-size: 1.2em; }
        .pix-box { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        .btn-enviar { margin-top: 25px; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; background-color: #2e7d32; color: white; cursor: pointer; border: 2px dashed #a5d6a7; box-shadow: 0 6px 0 #1b5e20; }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font-size: 12px; background-color: #616161; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #9e9e9e !important; box-shadow: 0 6px 0 #616161 !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Festa Junina</h1>
        
        <label>Seu Nome (Comprador)</label>
        <input id="comprador" placeholder="Nome completo">
        
        <label>Seu Telefone</label>
        <input id="telefone" placeholder="(00) 00000-0000">

        <label>Quantidade de ingressos</label>
        <select id="quantidade">
            <option value="1">1 ingresso (R$ 5,00)</option>
            <option value="2">2 ingressos (R$ 10,00)</option>
            <option value="3">3 ingressos (R$ 15,00)</option>
        </select>

        <div id="campos-extras"></div>

        <div class="qr">
            <img src="qr.png" alt="QR Code">
            <div class="valor">Total: R$ 5,00</div>
            <div class="pix-box">
                <input id="pix-codigo" value="00020126580014BR.GOV.BCB.PIX0136701fcb2e-76c2-4b0c-9395-5041c19409365204000053039865802BR5923Raul Militao dos Santos6009SAO PAULO62140510wvlD1Qh7ri63046AC7" readonly style="font-size: 9px;">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()">Copiar Código Pix</button>
            </div>
        </div>

        <input type="file" id="comprovante" accept="image/*,application/pdf" style="display:none">
        <button id="btn-enviar" class="btn-enviar">Selecionar Comprovante</button>
    </div>

    <script>
        const URL_POWER_AUTOMATE = "SUA_URL_AQUI";
        const selectQtde = document.getElementById("quantidade");
        const camposExtras = document.getElementById("campos-extras");
        const divValor = document.querySelector(".valor");
        const botao = document.getElementById("btn-enviar");
        const inputFile = document.getElementById("comprovante");

        // Gerar campos extras quando mudar quantidade
        selectQtde.addEventListener("change", function() {
            const qtde = parseInt(this.value);
            divValor.innerText = `Total: R$ ${qtde * 5},00`;
            camposExtras.innerHTML = "";
            
            for(let i = 1; i <= qtde; i++) {
                const div = document.createElement("div");
                div.className = "ingresso-extra";
                div.innerHTML = `
                    <label>Nome do Ingresso ${i}</label>
                    <input class="nome-ing" placeholder="Nome no ingresso ${i}">
                    <label>CPF do Ingresso ${i}</label>
                    <input class="cpf-ing" placeholder="000.000.000-00">
                `;
                camposExtras.appendChild(div);
                aplicarMascaras();
            }
        });
        
        // Disparar o evento uma vez para criar o primeiro campo
        selectQtde.dispatchEvent(new Event('change'));

        function copiarPix() {
            const pix = document.getElementById("pix-codigo");
            pix.select();
            navigator.clipboard.writeText(pix.value);
            document.getElementById("btn-copiar").innerText = "✓ Copiado!";
            setTimeout(() => { document.getElementById("btn-copiar").innerText = "Copiar Código Pix"; }, 2000);
        }

        botao.addEventListener("click", () => {
            if (botao.innerText === "Selecionar Comprovante") inputFile.click();
            else enviarDados();
        });

        inputFile.addEventListener("change", function() {
            if (this.files.length > 0) {
                botao.innerText = "Enviar";
                botao.style.backgroundColor = "#1565c0";
            }
        });

        async function enviarDados() {
            const file = inputFile.files[0];
            const nomes = Array.from(document.querySelectorAll(".nome-ing")).map(i => i.value);
            const cpfs = Array.from(document.querySelectorAll(".cpf-ing")).map(i => i.value);
            
            if (!file || nomes.some(n => n==="") || document.getElementById("comprador").value === "") {
                alert("Preencha todos os nomes e anexe o comprovante.");
                return;
            }

            botao.innerText = "Enviando...";
            botao.disabled = true;

            const reader = new FileReader();
            reader.onload = async function() {
                const base64 = reader.result.split(",")[1];
                
                // Criar lista de ingressos para o Power Automate
                const listaIngressos = nomes.map((nome, index) => ({
                    "NOME_INGRESSO": nome,
                    "CPF_INGRESSO": cpfs[index]
                }));

                const payload = {
                    "COMPRADOR": document.getElementById("comprador").value,
                    "TELEFONE": document.getElementById("telefone").value,
                    "ARQUIVO_BASE64": base64,
                    "NOME_ARQUIVO": file.name,
                    "INGRESSOS": listaIngressos
                };

                try {
                    const response = await fetch(URL_POWER_AUTOMATE, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) { alert("Enviado com sucesso!"); location.reload(); }
                    else { alert("Erro no servidor."); resetBotao(); }
                } catch (e) { alert("Erro de conexão."); resetBotao(); }
            };
            reader.readAsDataURL(file);
        }

        function resetBotao() { botao.innerText = "Selecionar Comprovante"; botao.disabled = false; botao.style.backgroundColor = "#2e7d32"; }

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-ing").forEach(el => {
                el.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    v = v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
                    e.target.value = v;
                });
            });
        }
    </script>
</body>
</html>
