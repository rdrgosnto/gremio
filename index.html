<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a3b32;
            background-color: #e65100;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.15) 75%, rgba(255, 255, 255, 0.15)),
                linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.15) 75%, rgba(255, 255, 255, 0.15));
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .container {
            background-color: #fffdf7;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
            box-sizing: border-box;
            border: 3px dashed #d84315;
            position: relative;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            width: 60px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 25px;
            font-family: 'Amatic SC', cursive;
            font-size: 52px;
            color: #bf360c;
        }

        label {
            font-weight: 600;
            margin-top: 20px;
            display: block;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 2px dashed #bcaaa4;
            margin-top: 5px;
        }

        .ingresso { margin-top: 12px; }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            background-color: #2e7d32;
            color: white;
            cursor: pointer;
            border: 2px dashed #a5d6a7;
            box-shadow: 0 6px 0 #1b5e20;
        }

        img {
            margin-top: 25px;
            width: 100%;
            max-width: 250px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Festa Junina</h1>

    <label>Nome do comprador</label>
    <input id="comprador" placeholder="Digite seu nome completo">

    <label>Telefone</label>
    <input id="telefone" placeholder="(xx) xxxxx-xxxx">

    <label>Quantidade de ingressos</label>
    <select id="quantidade">
        <option value="1">1 ingresso</option>
    </select>

    <!-- CPF depois da quantidade -->
    <label>CPF</label>
    <input id="cpf" placeholder="000.000.000-00">

    <div id="nomes"></div>

    <!-- QR CODE -->
    <img src="qr.png" alt="QR Code Pix">
    <p style="font-weight:bold;">Valor: R$ 5,00</p>

    <!-- INPUT FILE escondido -->
    <input type="file" id="comprovante" accept="image/*,application/pdf" style="display:none">

    <!-- BOTÃO -->
    <button onclick="document.getElementById('comprovante').click()">
        Enviar Comprovante
    </button>
</div>

<script>
    const quantidadeSelect = document.getElementById("quantidade");
    const containerNomes = document.getElementById("nomes");

    function atualizarCampos() {
        containerNomes.innerHTML = "";
        let campo = document.createElement("input");
        campo.placeholder = "Nome do ingresso";
        campo.className = "ingresso";
        containerNomes.appendChild(campo);
    }

    atualizarCampos();

    // máscara telefone
    document.getElementById("telefone").addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 6)
            v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
        else if (v.length > 2)
            v = v.replace(/(\d{2})(\d{0,5})/, "($1) $2");
        this.value = v;
    });

    // máscara CPF
    document.getElementById("cpf").addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
    });
</script>

</body>
</html>
