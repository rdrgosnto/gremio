<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s; }
        body { font-family: 'Poppins', sans-serif; min-height: 100dvh; color: #4a3b32; display: flex; justify-content: center; align-items: center; padding: 25px 18px; background: #e65100 linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%) 0 0/40px 40px; }
        body::before { content: ''; background: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%) 20px 20px/40px 40px; position: absolute; top:0; left:0; right:0; bottom:0; z-index:-1; }
        .container { width: 100%; max-width: 360px; background-color: #fffdf7; padding: 26px 20px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35); text-align: center; border: 3px dashed #d84315; }
        h1 { font-family: 'Amatic SC', cursive, sans-serif !important; font-weight: 700 !important; font-size: 52px; letter-spacing: 2px; color: #bf360c; margin: 2px 0 6px 0; line-height: 1; }
        label { font-weight: 500; margin-top: 14px; display: block; text-align: left; font-size: 13.5px; color: #4a3b32; }
        .form-group { position: relative; display: flex; flex-direction: column; }
        .input-icon { position: absolute; left: 14px; bottom: 10px; color: #bcaaa4; font-size: 14px; z-index: 2; }
        .has-icon input, .has-icon select { padding-left: 38px !important; }
        input, select { width: 100%; padding: 8px 11px; border-radius: 8px; border: 2px dashed #bcaaa4; font-size: 13px; background-color: #fff; outline: none; margin-top: 5px; font-family: 'Poppins', sans-serif; color: #4a3b32; }
        input:focus, select:focus { border-color: #e65100 !important; box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.15); }
        .input-erro { border: 2px solid #ff1744 !important; background-color: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background-color: #f1f8e9; }
        .msg-erro-cpf { color: #ff1744; font-size: 11px; display: block; text-align: left; margin-top: 2px; }
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 14px; border: 1px solid #ebba95; text-align: left; }
        .ingresso-extra label { margin-top: 10px; }
        .ingresso-extra label:first-child { margin-top: 0; }
        .btn-principal { margin-top: 12px; width: 100%; padding: 11px; border-radius: 8px; font-size: 15px; font-weight: 600; background-color: #e65100; color: white; cursor: pointer; border: none; box-shadow: 0 4px 0 #b33600; font-family: 'Poppins', sans-serif; }
        .btn-principal:active:not(:disabled) { box-shadow: 0 1px 0 #b33600; transform: translateY(3px); }
        .btn-principal:disabled { background-color: #bcaaa4 !important; box-shadow: 0 4px 0 #8d6e63 !important; cursor: not-allowed; }
        .btn-validar { position: relative; background-color: #1565c0 !important; box-shadow: 0 4px 0 #0d47a1 !important; margin-top: 14px; z-index: 1; font-weight: 600; }
        .btn-validar:active:not(:disabled) { box-shadow: 0 1px 0 #0d47a1 !important; transform: translateY(3px); }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font-size: 12px; font-weight: 600; background-color: #616161; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .qr-container { display: none; margin-top: 10px; padding: 14px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; }
        .qr-container img { width: 100%; max-width: 150px; display: inline-block; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 8px; font-size: 1.1em; }
        .pix-box { margin-top: 10px; padding: 8px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        .pix-codigo-input { font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 100%; text-align: center; border: 1px solid #ccc; padding: 6px; border-radius: 4px; color: #4a3b32; background: #fff; }
        .status-msg { margin-top: 10px; font-size: 13px; font-weight: bold; color: #bf360c; line-height: 1.4; }
        .texto-expiracao { display: none; color: #ff1744; font-size: 12px; font-weight: 600; margin: 10px 0 5px 0; }
        .msg-confirmacao { font-family: 'Amatic SC', cursive, sans-serif !important; color: #2e7d32; line-height: 1.1; }
        .msg-confirmacao h2 { font-size: 38px; margin: 8px 0; font-weight: 700; }
        .msg-confirmacao p { font-size: 28px; margin: 4px 0; font-weight: 700; }
        .icon-grande { font-size: 60px; display: block; margin-bottom: 6px; color: #2e7d32; }
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-conteudo { position: relative; max-width: 75vw; max-height: 75vh; }
        .popup-imagem { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-fechar-popup { display: none; position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background-color: #616161; color: #ffffff; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .btn-x-popup { display: none; position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background-color: #ff1744; color: #ffffff; border: 2px solid #ffffff; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer; line-height: 26px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 10000; }
        .pagamento-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 5000; justify-content: center; align-items: center; padding: 20px; }
        .pagamento-overlay-texto { color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; text-align: center; max-width: 320px; line-height: 1.5; }
        .sessao-bloqueada { opacity: 0.35 !important; filter: grayscale(100%) !important; pointer-events: none !important; }
    </style>
</head>
<body>
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>
    <div class="pagamento-overlay" id="pagamentoOverlay"><div class="pagamento-overlay-texto" id="txtOverlay"></div></div>
    <div class="container">
        <h1>Festa Junina</h1>
        <form id="sessao-formulario" onsubmit="processarEnvioFormulario(event)">
            <div class="form-group has-icon"><label>Nome do Comprador</label><i class="fa-solid fa-user input-icon"></i><input id="comprador" required placeholder="Escreva seu nome aqui..."></div>
            <div class="form-group has-icon"><label>CPF do Comprador</label><i class="fa-solid fa-id-card input-icon"></i><input id="cpf-comprador" required class="cpf-validar" placeholder="000.000.000-00"></div>
            <div class="form-group has-icon"><label>Telefone</label><i class="fa-solid fa-phone input-icon"></i><input id="telefone" required placeholder="(00) 00000-0000"></div>
            <div class="form-group has-icon"><label>Quantidade de ingressos</label><i class="fa-solid fa-users input-icon"></i><select id="quantidade"><option value="1">1 ingresso</option><option value="2">2 ingressos</option><option value="3">3 ingressos</option></select></div>
            <div id="campos-extras"></div>
            <button type="submit" id="btn-gerar" class="btn-principal"><i class="fa-solid fa-qrcode"></i> Gerar QR Code</button>
        </form>
        <div class="texto-expiracao" id="timer-expiracao">O código a seguir expira em 10:00.</div>
        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr" class="status-msg"><i class="fa-solid fa-circle-notch fa-spin"></i> Processando...</div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total">Total: Calculando...</div>
            <div class="pix-box">
                <input id="pix-codigo" class="pix-codigo-input" readonly onclick="this.select()">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()"><i class="fa-solid fa-copy"></i> Copiar Código Pix</button>
            </div>
            <button id="btn-validar" class="btn-principal btn-validar"><i class="fa-solid fa-circle-check"></i> Verificar Pagamento</button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>
    <script>
        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/40a14e00ea6d43bfbdd13cdb6e832837/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NITqrM_QRoVsNvxqZYSSxDvnZsbVFLVPDTXqP2Q9tjo";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/484f77e462c548b58ec3628b695cb04a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hhue2aeqHlRV4ynfMUcFnY90J4b-wyDlvj-t8TfambE";
        let idPagamentoAtual = null, intervaloPix = null, loopEmExecucao = false, cronometroRegressivo = null;
        const selectQtde = document.getElementById("quantidade"), camposExtras = document.getElementById("campos-extras");

        setTimeout(() => { document.getElementById('btnFecharPopup').style.display = document.getElementById('btnXPopup').style.display = 'block'; }, 3000);
        function fecharPopup() { document.getElementById('popupOverlay').style.display = 'none'; }
        
        function formatarNomeProprio(n) {
            if (!n) return "";
            let nomeSemAcento = n.normalize('NFD').replace(/[\u0300-\u036f]/g, "");
            let palavras = nomeSemAcento.toLowerCase().split(/\s+/);
            const conectores = ["da", "das", "de", "do", "dos", "e"];
            let palavrasFormatadas = palavras.map(palavra => {
                if (conectores.includes(palavra)) return palavra;
                return palavra.charAt(0).toUpperCase() + palavra.slice(1);
            });
            return palavrasFormatadas.join(' ');
        }
        
        document.getElementById('comprador').addEventListener('blur', e => { if (e.target.value.trim()) e.target.value = formatarNomeProprio(e.target.value); });

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-validar").forEach(el => {
                el.oninput = e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    e.target.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4").replace(/(\d{3})(\d{3})(\d{1,3})$/, "$1.$2.$3").replace(/(\d{3})(\d{1,3})$/, "$1.$2");
                };
                el.onblur = validateCPFBlur;
            });
            if(document.getElementById("telefone")) {
                document.getElementById("telefone").oninput = e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    e.target.value = v.length > 10 ? v.replace(/^(\d{2})(\d{5})(\d{4})/, "($1) $2-$3") : v.length > 6 ? v.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3") : v.length > 2 ? v.replace(/^(\d{2})(\d{0,5})/, "($1) $2") : v.length > 0 ? v.replace(/^(\d{0,2})/, "($1") : "";
                };
            }
        }

        function validarCPF(c) {
            c = c.replace(/[^\d]+/g, '');
            if (!c || c.length != 11 || /^(\d)\1{10}$/.test(c)) return false;
            let calc = t => Array.from(c.slice(0, t)).reduce((acc, curr, idx) => acc + parseInt(curr) * ((t + 1) - idx), 0) * 10 % 11 % 10;
            return calc(9) === parseInt(c.charAt(9)) && calc(10) === parseInt(c.charAt(10));
        }

        function validateCPFBlur(e) {
            const v = e.target.value, ex = e.target.nextElementSibling;
            if (ex?.classList.contains('msg-erro-cpf')) ex.remove();
            e.target.classList.remove("input-erro", "input-sucesso");
            if (v.length > 0) {
                if (validarCPF(v)) e.target.classList.add("input-sucesso");
                else { e.target.classList.add("input-erro"); const s = document.createElement("span"); s.className = "msg-erro-cpf"; s.innerText = "CPF Inválido"; e.target.after(s); }
            }
        }

        selectQtde.onchange = () => {
            camposExtras.innerHTML = Array.from({length: parseInt(selectQtde.value)}, (_, i) => `
                <div class="ingresso-extra">
                    <div style="font-weight:700; color:#bf360c; margin-bottom:5px; font-size:13px; text-transform:uppercase;">
                        <i class="fa-solid fa-ticket"></i> Ingresso ${i+1}
                    </div>
                    <label>Nome no Ingresso</label>
                    <input class="nome-ing" required placeholder="Nome do convidado" onblur="if(this.value.trim()) this.value = formatarNomeProprio(this.value)">
                    <label>CPF Convidado</label>
                    <input class="cpf-ing cpf-validar" required placeholder="000.000.000-00">
                </div>
            `).join('');
            aplicarMascaras();
        };
        selectQtde.dispatchEvent(new Event('change'));

        async function processarEnvioFormulario(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-gerar"), comp = document.getElementById("comprador").value.trim(), cpfC = document.getElementById("cpf-comprador").value.trim(), tel = document.getElementById("telefone").value.trim();
            if (!comp || !validarCPF(cpfC) || tel.length < 14) { alert("Preencha os dados corretamente"); document.getElementById("cpf-comprador").classList.add("input-erro"); return; }
            
            const inN = document.querySelectorAll(".nome-ing"), inC = document.querySelectorAll(".cpf-ing");
            if (Array.from(inC).some((input, i) => !inN[i].value.trim() || !validarCPF(input.value.trim()))) { alert("Preencha os dados corretamente"); return; }
            
            const cpfsConvidados = Array.from(inC).map(i => i.value.trim());
            if (new Set(cpfsConvidados).size !== cpfsConvidados.length) { alert("Atenção: Existem CPFs duplicados nos campos de ingressos!"); return; }
            if (cpfsConvidados.filter(cpf => cpf === cpfC).length > 1) { alert("Atenção: O CPF do Comprador não pode ser repetido nos ingressos!"); return; }

            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processando...`;
            try {
                const r = await fetch(URL_GERAR_PIX, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "COMPRADOR": comp, "CPF_COMPRADOR": cpfC, "TELEFONE": tel, "QUANTIDADE": selectQtde.value, "INGRESSOS": Array.from(inC).map((input, i) => ({"NOME_INGRESSO": inN[i].value.trim(), "CPF_INGRESSO": input.value.trim()})) }) });
                if (r.ok) {
                    const d = await r.json();
                    if (d.status === "bloqueado") {
                        alert("⚠️ BLOQUEIO: " + d.mensagem);
                        const idxBloqueados = d.variavel.split(',').map(i => i.trim()).filter(Boolean);
                        
                        const compradorInput = document.getElementById("cpf-comprador");
                        if (compradorInput.nextElementSibling?.classList.contains('msg-erro-cpf')) compradorInput.nextElementSibling.remove();
                        
                        document.querySelectorAll(".cpf-ing").forEach((input, index) => {
                            if (input.nextElementSibling?.classList.contains('msg-erro-cpf')) input.nextElementSibling.remove();
                            if (idxBloqueados.includes(String(index))) {
                                input.classList.remove("input-sucesso"); input.classList.add("input-erro");
                                const s = document.createElement("span"); s.className = "msg-erro-cpf"; s.innerText = "Limite de compra atingido para o CPF informado"; input.after(s);
                            }
                        });
                        btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; return;
                    }
                    idPagamentoAtual = d.pagamento_id || d.id || d.id_pagamento || "";
                    document.getElementById("img-qr").src = `data:image/png;base64,${d.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = d.pix_copia_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(d.variavel).toFixed(2).replace('.', ',')}`;
                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    document.getElementById("img-qr").style.display = "inline-block";

                    if (!((d.status === "pending" || d.status === "pendente") && d.mensagem === "recuperado")) {
                        const ov = document.getElementById("pagamentoOverlay"), bV = document.getElementById("btn-validar");
                        document.getElementById("txtOverlay").innerText = "Não se esqueça de clicar no botão abaixo ao finalizar o seu pagamento.";
                        ov.style.display = "flex"; bV.style.zIndex = "6000"; setTimeout(() => { ov.style.display = "none"; bV.style.zIndex = "1"; }, 5000);
                    }
                    iniciarCronometro(); iniciarMonitoramentoPixAutomatico();
                } else { alert("Erro ao processar. Tente novamente."); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; }
            } catch (err) { alert("Erro de conexão com o servidor."); btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-qrcode"></i> Gerar QR Code`; }
        }

        function iniciarCronometro() {
            let tRest = 600; const elT = document.getElementById('timer-expiracao');
            cronometroRegressivo = setInterval(() => {
                let m = String(Math.floor(tRest / 60)).padStart(2, '0'), s = String(tRest % 60).padStart(2, '0');
                elT.innerText = `O código a seguir expira em ${m}:${s}.`;
                if (--tRest < 0) { clearInterval(cronometroRegressivo); ejecutarFluxoTimeoutEstrito(); }
            }, 1000);
        }

        function copiarPix() {
            const p = document.getElementById("pix-codigo"); p.select(); navigator.clipboard.writeText(p.value);
            document.getElementById("btn-copiar").innerText = "Copiado!";
            setTimeout(() => { document.getElementById("btn-copiar").innerHTML = `<i class="fa-solid fa-copy"></i> Copiar Código Pix`; }, 2000);
        }

        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix); loopEmExecucao = false;
            intervaloPix = setInterval(async () => {
                if (loopEmExecucao) return; loopEmExecucao = true;
                if (await efetuarChamadaValidacaoAPI()) { clearInterval(intervaloPix); aplicarLayoutSucessoDefinitivo(); }
                loopEmExecucao = false;
            }, 6000);
        }

        async function efetuarChamadaValidacaoAPI() {
            try { return (await (await fetch(URL_VALIDAR_PAGAMENTO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "id": String(idPagamentoAtual).trim() }) })).text()).includes("Sucesso"); } catch (e) { return false; }
        }

        document.getElementById("btn-validar").onclick = async () => {
            if (intervaloPix) clearInterval(intervaloPix);
            const btn = document.getElementById("btn-validar"), msg = document.getElementById("status-verificacao");
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...`;
            if (await efetuarChamadaValidacaoAPI()) aplicarLayoutSucessoDefinitivo();
            else { msg.innerHTML = `<span class="icon-grande" style="font-size:50px; color:#bf360c; margin-bottom:5px;">❌</span><br>Ainda não encontramos o seu Pix.<br>Espera um tiquinho e tenta de novo!`; btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> Verificar Pagamento`; iniciarMonitoramentoPixAutomatico(); }
        };

        function aplicarLayoutSucessoDefinitivo() {
            clearInterval(cronometroRegressivo); clearInterval(intervaloPix);
            document.getElementById("timer-expiracao").style.display = "none";
            document.getElementById("sessao-qr").innerHTML = `<div class="msg-confirmacao"><span class="icon-grande">✅</span><h2>PAGAMENTO CONFIRMADO!</h2><p>ETA TREM BÃO!</p><p>NOS ENCONTRAMOS NA FESTA!</p></div>`;
        }

        function ejecutarFluxoTimeoutEstrito() {
            if (intervaloPix) clearInterval(intervaloPix);
            const ov = document.getElementById("pagamentoOverlay"), txtO = document.getElementById("txtOverlay");
            document.getElementById('timer-expiracao').innerText = "Tempo Limite"; document.getElementById('status-verificacao').innerHTML = ""; 
            document.getElementById('sessao-qr').classList.add("sessao-bloqueada"); document.getElementById('btn-copiar').disabled = document.getElementById('btn-validar').disabled = true;
            let cRedir = 9; ov.style.display = "flex"; ov.style.zIndex = "20000"; 
            const loopRedir = setInterval(() => { txtO.innerHTML = `Tempo Limite Excedido!<br><span style='font-size:15px; font-weight:400; opacity:0.8;'>Redirecionando em ${cRedir--}s...</span>`; if (cRedir < 0) { clearInterval(loopRedir); window.location.reload(); } }, 1000);
        }
    </script>
</body>
</html>
