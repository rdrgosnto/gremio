<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #4a3b32; 
            background-color: #e65100; 
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%), linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%); 
            background-size: 40px 40px; 
            background-position: 0 0, 20px 20px; 
        }

        .container { 
            background-color: #fffdf7; 
            padding: 30px 25px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            text-align: center; 
            box-sizing: border-box; 
            border: 3px dashed #d84315; 
        }

        h1 { margin-top: 10px; font-family: 'Amatic SC', cursive; font-size: 48px; color: #bf360c; }
        label { font-weight: 600; margin-top: 15px; display: block; text-align: left; font-size: 14px; }
        
        input, select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 8px; 
            border: 2px dashed #bcaaa4; 
            font-size: 14px; 
            box-sizing: border-box; 
            text-transform: none;
            transition: all 0.3s;
        }

        /* Estilos de Validação */
        .input-erro { border: 2px solid #ff1744 !important; background-color: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background-color: #f1f8e9; }
        
        /* Mensagem de erro com negrito reduzido (400 é o normal) */
        .msg-erro-cpf { color: #ff1744; font-size: 11px; display: block; text-align: left; margin-top: 2px; font-weight: 400; }

        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ebba95; }
        .qr-container { display: none; margin-top: 25px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; }
        .qr-container img { width: 100%; max-width: 180px; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 10px; font-size: 1.2em; }
        
        .pix-box { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        
        .btn-principal { margin-top: 25px; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; background-color: #2e7d32; color: white; cursor: pointer; border: none; box-shadow: 0 6px 0 #1b5e20; transition: 0.2s; }
        .btn-principal:active { box-shadow: 0 2px 0 #1b5e20; transform: translateY(4px); }
        .btn-validar { background-color: #1565c0; box-shadow: 0 6px 0 #0d47a1; margin-top: 15px; }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font-size: 12px; background-color: #616161; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .status-msg { margin-top: 15px; font-size: 15px; font-weight: bold; color: #bf360c; }
        
        .msg-confirmacao { font-family: 'Amatic SC', cursive; color: #2e7d32; line-height: 1.1; }
        .msg-confirmacao h2 { font-size: 45px; margin: 10px 0; font-weight: 700; }
        .msg-confirmacao p { font-size: 34px; margin: 5px 0; font-weight: 700; }
        
        .icon-grande { font-size: 90px; display: block; margin-bottom: 15px; color: #2e7d32; }
        
        button:disabled { background-color: #9e9e9e !important; box-shadow: 0 6px 0 #616161 !important; cursor: not-allowed; }

        /* ==================== ESTILOS DO POP-UP RESPONSIVO ==================== */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .popup-conteudo {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 75vw; /* Ocupa no máximo 75% da largura da tela */
            max-height: 75vh; /* Ocupa no máximo 75% da altura da tela */
        }

        .popup-imagem {
            max-width: 100%;
            max-height: 70vh; /* Garante espaço para o botão de fechar embaixo */
            object-fit: contain; /* Mantém a proporção da imagem sem distorcer */
            border-radius: 8px;
            display: block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Botão Fechar Mensagem (Embaixo da imagem) */
        .btn-fechar-popup {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #616161;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-fechar-popup:hover {
            background-color: #424242;
        }

        /* Botão X (Canto superior direito da imagem) */
        .btn-x-popup {
            display: none;
            position: absolute;
            top: -12px;
            right: -12px;
            width: 30px;
            height: 30px;
            background-color: #ff1744;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            line-height: 26px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 10000;
        }
    </style>
</head>
<body>

    <!-- POP-UP CODE -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>

    <div class="container">
        <h1>Festa Junina</h1>
        
        <div id="sessao-formulario">
            <label>Nome do Comprador</label>
            <input id="comprador" placeholder="Escreva seu nome aqui...">
            
            <label>Telefone</label>
            <input id="telefone" placeholder="(00) 00000-0000">

            <label>Quantidade de ingressos</label>
            <select id="quantidade">
                <option value="1">1 ingresso</option>
                <option value="2">2 ingressos</option>
                <option value="3">3 ingressos</option>
            </select>

            <div id="campos-extras"></div>
            <button id="btn-gerar" class="btn-principal">Gerar QR Code</button>
        </div>

        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr">Processando pagamento e descontos...</div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total">Total: Calculando...</div>
            
            <div class="pix-box">
                <input id="pix-codigo" readonly style="font-size: 9px; width: 100%; text-align: center; border: 1px solid #ccc; background: #fff;">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()">Copiar Código Pix</button>
            </div>

            <button id="btn-validar" class="btn-principal btn-validar">Verificar Pagamento</button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>

    <script>
        // LÓGICA DO POP-UP (Aparece após 4 segundos)
        setTimeout(() => {
            document.getElementById('btnFecharPopup').style.display = 'block';
            document.getElementById('btnXPopup').style.display = 'block';
        }, 6000);

        function fecharPopup() {
            document.getElementById('popupOverlay').style.display = 'none';
        }

        // SEU CÓDIGO DO POWER AUTOMATE E VALIDAÇÕES (Mantido intacto)
        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2ad0529973d74605bffbb1f1dd89c063/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=9cFG_dFkGjSMngbCZU7Rj7MW02aldXs66m7z14mS89c";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d03cad4eca5840989b744d1e6b4c867c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UzdbeuNVzZn3kPiJkW7jr0Ebmm6Z-pyafYYUFlKuLOc";

        let idPagamentoAtual = null;

        const selectQtde = document.getElementById("quantidade");
        const camposExtras = document.getElementById("campos-extras");

        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf == '' || cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let add = 0;
            for (let i = 0; i < 9; i++) add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11);
            if (rev == 10 || rev == 11) rev = 0;
            if (rev != parseInt(cpf.charAt(9))) return false;
            add = 0;
            for (let i = 0; i < 10; i++) add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev == 10 || rev == 11) rev = 0;
            if (rev != parseInt(cpf.charAt(10))) return false;
            return true;
        }

        function formatarNomeProprio(nome) {
            const preposicoes = ["da", "das", "de", "do", "dos"];
            return nome.toLowerCase().split(' ').map(palavra => {
                if (preposicoes.includes(palavra)) return palavra;
                if (palavra === "") return "";
                return palavra.charAt(0).toUpperCase() + palavra.slice(1);
            }).join(' ');
        }

        document.addEventListener('blur', function (e) {
            if (e.target.id === 'comprador' || e.target.classList.contains('nome-ing')) {
                if (e.target.value.trim() !== "") {
                    e.target.value = formatarNomeProprio(e.target.value);
                }
            }
        }, true);

        selectQtde.addEventListener("change", () => {
            const qtde = parseInt(selectQtde.value);
            camposExtras.innerHTML = "";
            for(let i = 1; i <= qtde; i++) {
                const div = document.createElement("div");
                div.className = "ingresso-extra";
                div.innerHTML = `
                    <label>Nome no Ingresso ${i}</label>
                    <input class="nome-ing" placeholder="Nome do convidado">
                    <label>CPF ${i}</label>
                    <input class="cpf-ing" placeholder="000.000.000-00">
                `;
                camposExtras.appendChild(div);
            }
            aplicarMascaras();
        });
        selectQtde.dispatchEvent(new Event('change'));

        document.getElementById("btn-gerar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-gerar");
            const comprador = document.getElementById("comprador").value.trim();
            const telefone = document.getElementById("telefone").value.trim();
            
            if (!comprador || telefone.length < 14) { 
                alert("Por favor, preencha o nome do comprador e o telefone corretamente."); 
                return; 
            }

            const inputsNomes = document.querySelectorAll(".nome-ing");
            const inputsCpfs = document.querySelectorAll(".cpf-ing");
            let listaIngressos = [];
            let cpfsDigitados = [];
            let erroValidacao = false;

            inputsCpfs.forEach((input, i) => {
                const cpfVal = input.value.trim();
                const nomeVal = inputsNomes[i].value.trim();

                if (!nomeVal || !validarCPF(cpfVal)) {
                    erroValidacao = true;
                    input.classList.add("input-erro");
                } else {
                    input.classList.remove("input-erro");
                }
                
                listaIngressos.push({ "NOME_INGRESSO": nomeVal, "CPF_INGRESSO": cpfVal });
                cpfsDigitados.push(cpfVal);
            });

            if (erroValidacao) {
                alert("Existem nomes vazios ou CPFs inválidos. Por favor, verifique os campos em vermelho.");
                return;
            }

            const cpfsUnicos = new Set(cpfsDigitados);
            if (cpfsUnicos.size !== cpfsDigitados.length) {
                alert("Atenção: Existem CPFs duplicados nos ingressos.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Por favor, aguarde...";

            const payload = {
                "COMPRADOR": comprador,
                "TELEFONE": telefone,
                "QUANTIDADE": selectQtde.value,
                "INGRESSOS": listaIngressos
            };

            try {
                const response = await fetch(URL_GERAR_PIX, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.status === "bloqueado") {
                        alert("⚠️ BLOQUEIO: " + data.mensagem);
                        btn.disabled = false;
                        btn.innerText = "Gerar QR Code";
                        return;
                    }
                    idPagamentoAtual = data.pagamento_id; 
                    document.getElementById("img-qr").src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(data.variavel).toFixed(2).replace('.', ',')}`;

                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    document.getElementById("img-qr").style.display = "inline-block";
                } else {
                    alert("Erro ao processar. Tente novamente.");
                    btn.disabled = false;
                    btn.innerText = "Gerar QR Code";
                }
            } catch (e) {
                alert("Erro de conexão com o servidor.");
                btn.disabled = false;
                btn.innerText = "Gerar QR Code";
            }
        });

        document.getElementById("btn-validar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-validar");
            const msg = document.getElementById("status-verificacao");
            if (!idPagamentoAtual) return;

            btn.disabled = true;
            btn.innerText = "Verificando...";

            try {
                const response = await fetch(URL_VALIDAR_PAGAMENTO, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "id": String(idPagamentoAtual) })
                });
                const resultado = await response.text();

                if (resultado.includes("Sucesso")) {
                    document.getElementById("sessao-qr").innerHTML = `
                        <div class="msg-confirmacao">
                            <span class="icon-grande">✅</span>
                            <h2>PAGAMENTO CONFIRMADO!</h2>
                            <p>ETA TREM BÃO!</p>
                            <p>NOS ENCONTRAMOS NA FESTA!</p>
                        </div>
                    `;
                } else {
                    msg.innerHTML = `
                        <span class="icon-grande" style="font-size: 60px; color: #bf360c; margin-bottom: 5px;">❌</span>
                        Ainda não encontramos o seu Pix.<br>Espera um tiquinho e tenta de novo!
                    `;
                    btn.disabled = false;
                    btn.innerText = "Verificar Pagamento";
                }
            } catch (e) {
                msg.innerText = "Erro ao conectar. Tente de novo!";
                btn.disabled = false;
            }
        });

        function copiarPix() {
            const pix = document.getElementById("pix-codigo");
            pix.select();
            navigator.clipboard.writeText(pix.value);
            document.getElementById("btn-copiar").innerText = "✓ Copiado!";
            setTimeout(() => { document.getElementById("btn-copiar").innerText = "Copiar Código Pix"; }, 2000);
        }

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-ing").forEach(el => {
                el.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
                    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
                    else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
                    e.target.value = v;
                });

                el.addEventListener("blur", e => {
                    const val = e.target.value;
                    const erroExistente = e.target.nextElementSibling;
                    if (erroExistente && erroExistente.classList.contains('msg-erro-cpf')) {
                        erroExistente.remove();
                    }

                    if (val.length > 0) {
                        if (validarCPF(val)) {
                            e.target.classList.remove("input-erro");
                            e.target.classList.add("input-sucesso");
                        } else {
                            e.target.classList.remove("input-sucesso");
                            e.target.classList.add("input-erro");
                            const span = document.createElement("span");
                            span.className = "msg-erro-cpf";
                            span.innerText = "CPF Inválido";
                            e.target.after(span);
                        }
                    } else {
                        e.target.classList.remove("input-erro", "input-sucesso");
                    }
                });
            });

            const telInput = document.getElementById("telefone");
            if(telInput) {
                telInput.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
                    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
                    else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
                    else if (v.length > 0) v = v.replace(/^(\d{0,2})/, "($1");
                    e.target.value = v;
                });
            }
        }
        aplicarMascaras();
    </script>
</body>
</html>
