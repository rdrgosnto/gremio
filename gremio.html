<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #4a3b32; background-color: #e65100; background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.15) 75%), linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.15) 75%); background-size: 40px 40px; background-position: 0 0, 20px 20px; }
        .container { background-color: #fffdf7; padding: 30px 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); text-align: center; box-sizing: border-box; border: 3px dashed #d84315; }
        h1 { margin-top: 10px; font-family: 'Amatic SC', cursive; font-size: 44px; color: #bf360c; }
        label { font-weight: 600; margin-top: 15px; display: block; text-align: left; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 2px dashed #bcaaa4; font-size: 14px; box-sizing: border-box; }
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ebba95; }
        .qr-container { display: none; margin-top: 25px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; }
        .qr-container img { width: 100%; max-width: 180px; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 10px; font-size: 1.2em; }
        .pix-box { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        .btn-principal { margin-top: 25px; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; background-color: #2e7d32; color: white; cursor: pointer; border: none; box-shadow: 0 6px 0 #1b5e20; transition: 0.2s; }
        .btn-principal:active { box-shadow: 0 2px 0 #1b5e20; transform: translateY(4px); }
        .btn-validar { background-color: #1565c0; box-shadow: 0 6px 0 #0d47a1; margin-top: 15px; }
        .btn-validar:active { box-shadow: 0 2px 0 #0d47a1; }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font-size: 12px; background-color: #616161; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .status-msg { margin-top: 15px; font-size: 14px; font-weight: bold; color: #bf360c; }
        button:disabled { background-color: #9e9e9e !important; box-shadow: 0 6px 0 #616161 !important; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Festa Junina</h1>
        
        <!-- SEÇÃO DE INPUTS -->
        <div id="sessao-formulario">
            <label>Nome do Comprador</label>
            <input id="comprador" placeholder="NOME COMPLETO">
            
            <label>Telefone</label>
            <input id="telefone" placeholder="(00) 00000-0000">

            <label>Quantidade de ingressos</label>
            <select id="quantidade">
                <option value="1">1 ingresso (R$ 5,00)</option>
                <option value="2">2 ingressos (R$ 10,00)</option>
                <option value="3">3 ingressos (R$ 15,00)</option>
            </select>

            <div id="campos-extras"></div>
            
            <button id="btn-gerar" class="btn-principal">Gerar QR Code Pix</button>
        </div>

        <!-- SEÇÃO DO QR CODE E VALIDAÇÃO -->
        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr">Gerando pagamento...</div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total">Total: R$ 0,00</div>
            
            <div class="pix-box">
                <input id="pix-codigo" value="" readonly style="font-size: 9px; width: 100%; text-align: center; border: 1px solid #ccc; background: #fff;">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()">Copiar Código Pix</button>
            </div>

            <button id="btn-validar" class="btn-principal btn-validar">Já fiz o pagamento!</button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>

    <script>
        // URLs do Power Automate
        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/8e1865f65f124dbdbca02b2638e70207/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=eNJyrOF_gmIW421bF4eCsTACCPO5pZ68q3o8OcZIO8s";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/1aec54bf6bbd497d95265677ea67e618/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ZaGwdJwCHl1ObU7im9Vrl688AtQ--_apOGeSJ6VT6_k";

        let idPagamentoAtual = null;

        // Lógica de campos extras
        const selectQtde = document.getElementById("quantidade");
        const camposExtras = document.getElementById("campos-extras");

        selectQtde.addEventListener("change", () => {
            const qtde = parseInt(selectQtde.value);
            camposExtras.innerHTML = "";
            for(let i = 1; i <= qtde; i++) {
                const div = document.createElement("div");
                div.className = "ingresso-extra";
                div.innerHTML = `<label>Nome do Ingresso ${i}</label><input class="nome-ing" placeholder="NOME NO INGRESSO"><label>CPF ${i}</label><input class="cpf-ing" placeholder="000.000.000-00">`;
                camposExtras.appendChild(div);
            }
            aplicarMascaras();
        });
        selectQtde.dispatchEvent(new Event('change'));

        // FUNÇÃO 1: GERAR O PIX
        document.getElementById("btn-gerar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-gerar");
            const comprador = document.getElementById("comprador").value;
            const nomes = Array.from(document.querySelectorAll(".nome-ing")).map(i => i.value);
            const cpfs = Array.from(document.querySelectorAll(".cpf-ing")).map(i => i.value);

            if (!comprador || nomes.some(n => n.trim() === "")) {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando...";

            const payload = {
                "COMPRADOR": comprador.toUpperCase(),
                "TELEFONE": document.getElementById("telefone").value,
                "QUANTIDADE": selectQtde.value,
                "INGRESSOS": nomes.map((n, index) => ({ "NOME_INGRESSO": n.toUpperCase(), "CPF_INGRESSO": cpfs[index] }))
            };

            try {
                const response = await fetch(URL_GERAR_PIX, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    idPagamentoAtual = data.pagamento_id;
                    
                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    
                    const imgQr = document.getElementById("img-qr");
                    imgQr.src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                    imgQr.style.display = "inline-block";
                    
                    document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${selectQtde.value * 5},00`;
                } else {
                    alert("Erro ao gerar Pix. Tente novamente.");
                    btn.disabled = false;
                    btn.innerText = "Gerar QR Code Pix";
                }
            } catch (e) {
                alert("Erro de conexão.");
                btn.disabled = false;
            }
        });

        // FUNÇÃO 2: VALIDAR O PAGAMENTO
        document.getElementById("btn-validar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-validar");
            const msg = document.getElementById("status-verificacao");
            
            btn.disabled = true;
            btn.innerText = "Verificando no banco...";
            msg.innerText = "";

            try {
                const response = await fetch(URL_VALIDAR_PAGAMENTO, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ "id": String(idPagamentoAtual) })
                });

                const resultado = await response.text();

                if (resultado.includes("Sucesso")) {
                    document.getElementById("sessao-qr").innerHTML = `<h2 style="color: #2e7d32;">✅ PAGAMENTO APROVADO!</h2><p>Seus ingressos foram registrados. Você já pode fechar esta página.</p>`;
                } else {
                    msg.innerText = "Pagamento ainda não identificado. Se você já pagou, aguarde 30 segundos e tente novamente.";
                    btn.disabled = false;
                    btn.innerText = "Já fiz o pagamento!";
                }
            } catch (e) {
                msg.innerText = "Erro ao conectar com o validador.";
                btn.disabled = false;
                btn.innerText = "Já fiz o pagamento!";
            }
        });

        function copiarPix() {
            const pix = document.getElementById("pix-codigo");
            pix.select();
            navigator.clipboard.writeText(pix.value);
            document.getElementById("btn-copiar").innerText = "✓ Copiado!";
            setTimeout(() => { document.getElementById("btn-copiar").innerText = "Copiar Código Pix"; }, 2000);
        }

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-ing").forEach(el => {
                el.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
                    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
                    else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
                    e.target.value = v;
                });
            });
            document.getElementById("telefone").addEventListener("input", e => {
                let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                if (v.length > 6) v = v.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3");
                else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, "($1) $2");
                e.target.value = v;
            });
        }
        
        document.getElementById("comprador").addEventListener("input", e => {
            e.target.value = e.target.value.toUpperCase();
        });
    </script>
</body>
</html>
