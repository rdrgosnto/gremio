<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            min-height: 100dvh; 
            box-sizing: border-box;
            color: #4a3b32; 
            background-color: #e65100; 
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%), linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%); 
            background-size: 40px 40px; 
            background-position: 0 0, 20px 20px; 
        }
        .container { 
            background-color: #fffdf7; 
            padding: 30px 25px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            text-align: center; 
            box-sizing: border-box; 
            border: 3px dashed #d84315; 
            margin: auto 0; 
        }
        h1 { margin-top: 10px; font-family: 'Amatic SC', cursive; font-size: 48px; color: #bf360c; }
        label { font-weight: 600; margin-top: 15px; display: block; text-align: left; font-size: 14px; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            border-radius: 8px; 
            border: 2px dashed #bcaaa4; 
            font-size: 14px; 
            box-sizing: border-box; 
            transition: all 0.3s;
        }
        .input-erro { border: 2px solid #ff1744 !important; background-color: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background-color: #f1f8e9; }
        .msg-erro-cpf { color: #ff1744; font-size: 11px; display: block; text-align: left; margin-top: 2px; font-weight: 400; }
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ebba95; }
        .qr-container { display: none; margin-top: 10px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; transition: all 0.3s ease; }
        .qr-container img { width: 100%; max-width: 180px; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 10px; font-size: 1.2em; }
        .pix-box { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        .btn-principal { margin-top: 25px; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; color: white; cursor: pointer; border: none; transition: 0.2s; }
        .btn-principal:active:not(:disabled) { transform: translateY(4px); }
        .status-msg { margin-top: 15px; font-size: 15px; font-weight: bold; color: #bf360c; }
        .msg-confirmacao { font-family: 'Poppins', sans-serif; color: #2e7d32; line-height: 1.3; }
        .msg-confirmacao h2 { font-size: 26px; margin: 10px 0; font-weight: 700; color: #2e7d32; }
        .msg-confirmacao p { font-size: 20px; margin: 5px 0; font-weight: 700; color: #4a3b32; }
        .msg-confirmacao .subtext { font-family: 'Amatic SC', cursive; font-size: 42px; color: #2e7d32; margin-top: 10px; }
        .icon-grande { font-size: 80px; display: block; margin-bottom: 15px; color: #2e7d32; }
        .texto-expiracao { display: none; color: #ff1744; font-size: 13px; font-weight: 600; margin-bottom: 5px; margin-top: 5px; white-space: nowrap; overflow: hidden; }
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-conteudo { position: relative; max-width: 75vw; max-height: 75vh; }
        .popup-imagem { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-fechar-popup { display: none; position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background-color: #616161; color: #ffffff; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .btn-fechar-popup:hover { background-color: #424242; }
        .btn-x-popup { display: none; position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background-color: #ff1744; color: #ffffff; border: 2px solid #ffffff; border-radius: 50%; font-size: 15px; font-weight: bold; cursor: pointer; line-height: 26px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 10000; }
        .pagamento-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.82); z-index: 5000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; transition: opacity 0.4s ease; }
        .pagamento-overlay-texto { color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; text-align: center; max-width: 340px; line-height: 1.5; }
        .sessao-bloqueada { opacity: 0.35 !important; filter: grayscale(100%); pointer-events: none !important; }
    </style>
</head>
<body>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>

    <div class="pagamento-overlay" id="pagamentoOverlay">
        <div class="pagamento-overlay-texto" id="txtOverlay"></div>
    </div>

    <div class="container">
        <h1>Festa Junina</h1>
        
        <form id="sessao-formulario" onsubmit="processarEnvioFormulario(event)">
            <label>Nome do Comprador</label>
            <input id="comprador" required placeholder="Escreva seu nome aqui...">
            
            <label>CPF do Comprador</label>
            <input id="cpf-comprador" required class="cpf-validar" placeholder="000.000.000-00">
            
            <label>Telefone</label>
            <input id="telefone" required placeholder="(00) 00000-0000">

            <label>Quantidade de ingressos</label>
            <select id="quantidade">
                <option value="1">1 ingresso</option>
                <option value="2">2 ingressos</option>
                <option value="3">3 ingressos</option>
            </select>

            <div id="campos-extras"></div>
            <button type="submit" id="btn-gerar" class="btn-principal bg-[#2e7d32] shadow-[0_6px_0_#1b5e20]">Gerar QR Code</button>
        </form>

        <div class="texto-expiracao" id="timer-expiracao"></div>

        <div class="qr-container" id="sessao-qr">
            <div id="carregando-qr"></div>
            <img src="" id="img-qr" alt="QR Code Pix" style="display:none;">
            <div class="valor" id="exibir-total"></div>
            
            <div class="pix-box">
                <input id="pix-codigo" readonly style="font-size: 9px; width: 100%; text-align: center; border: 1px solid #ccc; background: #fff;">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()"></button>
            </div>

            <button id="btn-validar" type="button" class="btn-principal bg-[#9e9e9e] shadow-[0_6px_0_#616161] pointer-events-none" disabled>Verificar Pagamento</button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>

    <script>
        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2ad0529973d74605bffbb1f1dd89c063/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=9cFG_dFkGjSMngbCZU7Rj7MW02aldXs66m7z14mS89c";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d03cad4eca5840989b744d1e6b4c867c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UzdbeuNVzZn3kPiJkW7jr0Ebmm6Z-pyafYYUFlKuLOc";
        
        const TEMPO_CHECK_PIX = 6000;          
        const TRAVA_MANUAL_PIX = 12000;        
        const LIMITE_EXPIRACAO_PIX = 29000;    
        const TEMPO_TRAVA_TIMEOUT = 9000;      

        const CSS_BLUE = "btn-principal bg-[#1565c0] shadow-[0_6px_0_#0d47a1] pointer-events-auto";
        const CSS_GRAY = "btn-principal bg-[#9e9e9e] shadow-[0_6px_0_#616161] pointer-events-none";

        const MSGS = {
            dados_invalidos: "Preencha os dados corretamente",
            cpf_comprador_duplicado: "Atenção: O CPF do Comprador só pode constar em 1 campo dos ingressos",
            cpf_convidado_duplicado: "Atenção: CPF duplicados na lista de convidados",
            cpf_invalido_tag: "CPF Inválido",
            erro_processamento: "Erro ao processar. Tente novamente.",
            erro_conexao: "Erro de conexão com o servidor.",
            aguarde: "Por favor, aguarde...",
            processando: "Processando",
            verificando: "Verificando...",
            copiado: "Copiado!",
            copiar_padrao: "Copiar Código Pix",
            overlay_texto: "Não se esqueça de clicar no botão abaixo ao finalizar o seu pagamento.",
            sucesso_h2: "PAGAMENTO CONFIRMADO!",
            sucesso_p1: "NOS ENCONTRAMOS NA FESTA!",
            sucesso_sub: "ETA TREM BÃO!",
            negativo_status: "<span class='icon-grande' style='font-size: 60px; color: #bf360c; margin-bottom: 5px; display: inline-block;'>❌</span><br>Ainda não encontramos o seu Pix.<br>Espera um tiquinho e tenta de novo!",
            timeout: "Tempo Limite"
        };

        let idPagamentoAtual = null, intervaloPix = null, loopEmExecucao = false, timestampCriacaoPix = 0, cronometroRegressivo = null;

        setTimeout(() => {
            document.getElementById('btnFecharPopup').style.display = 'block';
            document.getElementById('btnXPopup').style.display = 'block';
        }, 3000);

        function fecharPopup() { document.getElementById('popupOverlay').style.display = 'none'; }

        function iniciarCronometro() {
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            let tempoRestante = Math.floor(LIMITE_EXPIRACAO_PIX / 1000);
            const elementoTimer = document.getElementById('timer-expiracao');
            cronometroRegressivo = setInterval(() => {
                let min = Math.floor(tempoRestante / 60), seg = tempoRestante % 60;
                elementoTimer.innerText = `O código a seguir expira em ${min < 10 ? '0'+min : min}:${seg < 10 ? '0'+seg : seg}.`;
                if (tempoRestante <= 0) { clearInterval(cronometroRegressivo); executarFluxoTimeoutEstrito(); }
                tempoRestante--;
            }, 1000);
        }

        function executarFluxoTimeoutEstrito() {
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            document.getElementById('timer-expiracao').innerText = MSGS.timeout;
            document.getElementById('status-verificacao').innerHTML = ""; 
            document.getElementById('sessao-qr').classList.add("sessao-bloqueada");
            
            const btn = document.getElementById('btn-validar');
            btn.disabled = true;
            btn.className = CSS_GRAY;
            document.getElementById('btn-copiar').disabled = true;
            setTimeout(() => { resetSistemicoTotal(); }, TEMPO_TRAVA_TIMEOUT);
        }

        function resetSistemicoTotal() {
            if (intervaloPix) clearInterval(intervaloPix);
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            intervaloPix = cronometroRegressivo = idPagamentoAtual = null;
            loopEmExecucao = timestampCriacaoPix = 0;

            const sessaoQr = document.getElementById('sessao-qr');
            sessaoQr.classList.remove("sessao-bloqueada");
            sessaoQr.style.display = "none";
            document.getElementById('status-verificacao').innerHTML = "";
            document.getElementById('img-qr').style.display = 'none';
            document.getElementById('img-qr').src = "";
            document.getElementById('timer-expiracao').style.display = "none";
            document.getElementById('btn-copiar').disabled = false;

            const btnGerar = document.getElementById("btn-gerar");
            btnGerar.disabled = false; btnGerar.innerText = "Gerar QR Code";

            const formulario = document.getElementById("sessao-formulario");
            formulario.reset();
            document.getElementById("comprador").className = document.getElementById("cpf-comprador").className = document.getElementById("telefone").className = "";
            document.querySelectorAll('.msg-erro-cpf').forEach(el => el.remove());
            document.getElementById("quantidade").value = "1";
            document.getElementById("campos-extras").innerHTML = "";
            document.getElementById("quantidade").dispatchEvent(new Event('change'));
            formulario.style.display = "block";
        }

        function iniciarMonitoramentoPixAutomatico() {
            if (intervaloPix) clearInterval(intervaloPix);
            loopEmExecucao = false;
            intervaloPix = setInterval(async () => {
                if (loopEmExecucao || !idPagamentoAtual) return;
                if (Date.now() - timestampCriacaoPix > LIMITE_EXPIRACAO_PIX) { clearInterval(intervaloPix); intervaloPix = null; return; }
                loopEmExecucao = true;
                if (await efetuarChamadaValidacaoAPI()) { clearInterval(intervaloPix); intervaloPix = null; aplicarLayoutSucessoDefinitivo(); }
                loopEmExecucao = false;
            }, TEMPO_CHECK_PIX);
        }

        async function efetuarChamadaValidacaoAPI() {
            try {
                const r = await fetch(URL_VALIDAR_PAGAMENTO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "id": String(idPagamentoAtual) }) });
                return r.ok && (await r.text()).includes("Sucesso");
            } catch (e) { return false; }
        }

        async function executarCliqueValidacaoManual() {
            if (!idPagamentoAtual) return;
            if (intervaloPix) { clearInterval(intervaloPix); intervaloPix = null; }
            const btn = document.getElementById("btn-validar"), msg = document.getElementById("status-verificacao");
            
            btn.disabled = true; btn.className = CSS_GRAY;
            if (await efetuarChamadaValidacaoAPI()) {
                aplicarLayoutSucessoDefinitivo();
            } else {
                msg.innerHTML = MSGS.negativo_status;
                btn.disabled = false; btn.className = CSS_BLUE;
                iniciarMonitoramentoPixAutomatico(); 
            }
        }

        function aplicarLayoutSucessoDefinitivo() {
            if (cronometroRegressivo) clearInterval(cronometroRegressivo);
            if (intervaloPix) clearInterval(intervaloPix);
            document.getElementById("timer-expiracao").style.display = "none";
            document.getElementById("sessao-qr").innerHTML = `<div class="msg-confirmacao"><span class="icon-grande">✅</span><h2>${MSGS.sucesso_h2}</h2><p>${MSGS.sucesso_p1}</p><p class="subtext">${MSGS.sucesso_sub}</p></div>`;
        }

        async function processarEnvioFormulario(e) {
            e.preventDefault(); 
            const btn = document.getElementById("btn-gerar"), comprador = document.getElementById("comprador").value.trim(), cpfComprador = document.getElementById("cpf-comprador").value.trim(), telefone = document.getElementById("telefone").value.trim();
            
            if (!comprador || !validarCPF(cpfComprador) || telefone.length < 14) { alert(MSGS.dados_invalidos); document.getElementById("cpf-comprador").classList.add("input-erro"); return; }

            const inputsNomes = document.querySelectorAll(".nome-ing"), inputsCpfs = document.querySelectorAll(".cpf-ing");
            let listaIngressos = [], cpfsConvidados = [], contadorCpfComprador = 0, erroValidacao = false;

            inputsCpfs.forEach((input, i) => {
                const cpfVal = input.value.trim(), nomeVal = inputsNomes[i].value.trim();
                if (!nomeVal || !validarCPF(cpfVal)) { erroValidacao = true; input.classList.add("input-erro"); } else { input.classList.remove("input-erro"); }
                if (cpfVal === cpfComprador) contadorCpfComprador++; else cpfsConvidados.push(cpfVal);
                listaIngressos.push({ "NOME_INGRESSO": nomeVal, "CPF_INGRESSO": cpfVal });
            });

            if (erroValidacao) { alert(MSGS.dados_invalidos); return; }
            if (contadorCpfComprador > 1) { alert(MSGS.cpf_comprador_duplicado); return; }
            if (new Set(cpfsConvidados).size !== cpfsConvidados.length) { alert(MSGS.cpf_convidado_duplicado); return; }

            btn.disabled = true; btn.innerText = MSGS.aguarde;

            try {
                const response = await fetch(URL_GERAR_PIX, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "COMPRADOR": comprador, "CPF_COMPRADOR": cpfComprador, "TELEFONE": telefone, "QUANTIDADE": document.getElementById("quantidade").value, "INGRESSOS": listaIngressos }) });
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === "bloqueado") { alert("⚠️ BLOQUEIO: " + data.mensagem); btn.disabled = false; btn.innerText = "Gerar QR Code"; return; }
                    
                    idPagamentoAtual = data.pagamento_id; timestampCriacaoPix = Date.now();
                    document.getElementById("img-qr").src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                    document.getElementById("btn-copiar").innerText = MSGS.copiar_padrao;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(data.variavel).toFixed(2).replace('.', ',')}`;

                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    document.getElementById("carregando-qr").style.display = "none";
                    document.getElementById("img-qr").style.display = "inline-block";

                    const btnValidar = document.getElementById("btn-validar");
                    
                    // MECÂNICA DO BOTÃO ENXUTA: Começa estritamente Cinza e desabilitado (Atrás do overlay)
                    btnValidar.disabled = true;
                    btnValidar.className = CSS_GRAY;

                    // Lançamento Limpo do Overlay (Sem carregar o botão junto)
                    document.getElementById("txtOverlay").innerText = MSGS.overlay_texto;
                    const overlayPagamento = document.getElementById("pagamentoOverlay");
                    overlayPagamento.style.display = "flex";

                    setTimeout(() => {
                        overlayPagamento.style.opacity = "0";
                        setTimeout(() => {
                            overlayPagamento.style.display = "none";

                            // O overlay saiu da tela. O botão continua cinza e travado na contagem regressiva
                            // (Garante consistência total)

                        }, 4000); 
                    }, 6000); 

                    // CRONÔMETRO DE IGNICAÇÃO DO BOTÃO: 12 segundos contados a partir de AGORA
                    setTimeout(() => {
                        if (idPagamentoAtual && !document.getElementById('sessao-qr').classList.contains('sessao-bloqueada')) {
                            // O botão "acende" em azul vibrante e fica disponível para clique!
                            btnValidar.disabled = false;
                            btnValidar.className = CSS_BLUE; 
                        }
                    }, TRAVA_MANUAL_PIX);

                    iniciarCronometro();
                    iniciarMonitoramentoPixAutomatico();
                } else { alert(MSGS.erro_processamento); btn.disabled = false; btn.innerText = "Gerar QR Code"; }
            } catch (e) { alert(MSGS.erro_conexao); btn.disabled = false; btn.innerText = "Gerar QR Code"; }
        }

        document.getElementById("btn-validar").addEventListener("click", executing => executarCliqueValidacaoManual());

        const selectQtde = document.getElementById("quantidade"), camposExtras = document.getElementById("campos-extras");

        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf == '' || cpf.length != 11 || /^(\d)\1{10}$/.test(cpf)) return false;
            let add = 0; for (let i = 0; i < 9; i++) add += parseInt(cpf.charAt(i)) * (10 - i);
            let rev = 11 - (add % 11); if (rev == 10 || rev == 11) rev = 0; if (rev != parseInt(cpf.charAt(9))) return false;
            add = 0; for (let i = 0; i < 10; i++) add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11); if (rev == 10 || rev == 11) rev = 0; return rev == parseInt(cpf.charAt(10));
        }

        function formatarNomeProprio(nome) {
            const prep = ["da", "das", "de", "do", "dos"];
            return nome.toLowerCase().split(' ').map(p => prep.includes(p) || p === "" ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        }

        function copiarPix() {
            const pix = document.getElementById("pix-codigo"); pix.select(); navigator.clipboard.writeText(pix.value);
            document.getElementById("btn-copiar").innerText = MSGS.copiado;
            setTimeout(() => { document.getElementById("btn-copiar").innerText = MSGS.copiar_padrao; }, 2000);
        }

        document.getElementById('comprador').addEventListener('blur', e => { if (e.target.value.trim() !== "") e.target.value = formatarNomeProprio(e.target.value); });

        selectQtde.addEventListener("change", () => {
            camposExtras.innerHTML = Array.from({ length: parseInt(selectQtde.value) }, (_, i) => `
                <div class="ingresso-extra">
                    <label>Nome no Ingresso ${i+1}</label>
                    <input class="nome-ing" required placeholder="Nome do convidado">
                    <label>CPF Convidado ${i+1}</label>
                    <input class="cpf-ing cpf-validar" required placeholder="000.000.000-00">
                </div>
            `).join('');
            
            document.querySelectorAll(".nome-ing").forEach(el => { el.addEventListener('blur', e => { if (e.target.value.trim() !== "") e.target.value = formatarNomeProprio(e.target.value); }); });
        });
        selectQtde.dispatchEvent(new Event('change'));

        camposExtras.addEventListener("input", e => { if (e.target.classList.contains("cpf-validar")) maskCPF(e); });
        camposExtras.addEventListener("blur", e => { if (e.target.classList.contains("cpf-validar")) validateCPFBlur(e); }, true);
        document.getElementById("cpf-comprador").addEventListener("input", maskCPF);
        document.getElementById("cpf-comprador").addEventListener("blur", validateCPFBlur);

        function maskCPF(e) {
            let v = e.target.value.replace(/\D/g, "").slice(0, 11);
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
            e.target.value = v;
        }

        function validateCPFBlur(e) {
            const val = e.target.value, err = e.target.nextElementSibling;
            if (err && err.classList.contains('msg-erro-cpf')) err.remove();
            if (val.length > 0) {
                if (validarCPF(val)) { e.target.className = "input-sucesso"; } 
                else { e.target.className = "input-erro"; const s = document.createElement("span"); s.className = "msg-erro-cpf"; s.innerText = MSGS.cpf_invalido_tag; e.target.after(s); }
            } else { e.target.className = ""; }
        }
    </script>
</body>
</html>
