<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grêmio | Ingressos Festa Junina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght=700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; min-height: 100dvh; box-sizing: border-box; color: #4a3b32; background-color: #e65100; 
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%), linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 255, 255, 0.1) 75%); background-size: 40px 40px; background-position: 0 0, 20px 20px; 
        }
        .container { background-color: #fffdf7; padding: 30px 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); text-align: center; box-sizing: border-box; border: 3px dashed #d84315; margin: auto 0; }
        h1 { margin-top: 10px; font-family: 'Amatic SC', cursive; font-size: 48px; color: #bf360c; }
        label { font-weight: 600; margin-top: 15px; display: block; text-align: left; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 2px dashed #bcaaa4; font-size: 14px; box-sizing: border-box; transition: all 0.3s; }
        .input-erro { border: 2px solid #ff1744 !important; background-color: #fff5f5; }
        .input-sucesso { border: 2px solid #2e7d32 !important; background-color: #f1f8e9; }
        .msg-erro-cpf { color: #ff1744; font-size: 11px; display: block; text-align: left; margin-top: 2px; }
        .ingresso-extra { background: #fdf2e9; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ebba95; }
        .qr-container { display: none; margin-top: 10px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background-color: #fff; }
        .qr-container img { width: 100%; max-width: 180px; display: inline-block; }
        .valor { font-weight: bold; color: #bf360c; margin-top: 10px; font-size: 1.2em; }
        .pix-box { margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 8px; border: 1px solid #ddd; }
        .btn-principal { margin-top: 25px; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; background-color: #2e7d32; color: white; cursor: pointer; border: none; box-shadow: 0 6px 0 #1b5e20; transition: 0.2s; }
        .btn-principal:active { box-shadow: 0 2px 0 #1b5e20; transform: translateY(4px); }
        .btn-validar { position: relative; background-color: #1565c0; box-shadow: 0 6px 0 #0d47a1; margin-top: 15px; z-index: 1; }
        .btn-copiar { margin-top: 8px; width: 100%; padding: 8px; font-size: 12px; background-color: #616161; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .status-msg { margin-top: 15px; font-size: 15px; font-weight: bold; color: #bf360c; }
        .msg-confirmacao { font-family: 'Amatic SC', cursive; color: #2e7d32; line-height: 1.1; }
        .msg-confirmacao h2 { font-size: 45px; margin: 10px 0; font-weight: 700; }
        .msg-confirmacao p { font-size: 34px; margin: 5px 0; font-weight: 700; }
        .icon-grande { font-size: 90px; display: block; margin-bottom: 15px; color: #2e7d32; }
        button:disabled { background-color: #9e9e9e !important; box-shadow: 0 6px 0 #616161 !important; cursor: not-allowed; }
        .texto-expiracao { display: none; color: #ff1744; font-size: 13px; font-weight: 600; margin: 5px 0; white-space: nowrap; overflow: hidden; }
        .popup-overlay, .pagamento-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .popup-conteudo { position: relative; max-width: 75vw; max-height: 75vh; }
        .popup-imagem { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 8px; display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-fechar-popup { display: none; position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background-color: #616161; color: white; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-x-popup { display: none; position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background-color: #ff1744; color: white; border: 2px solid white; border-radius: 50%; font-size: 15px; font-weight: bold; cursor: pointer; line-height: 26px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 10000; }
        .pagamento-overlay { display: none; background-color: rgba(0, 0, 0, 0.82); z-index: 5000; padding: 20px; box-sizing: border-box; transition: opacity 0.4s ease; }
        .pagamento-overlay-texto { color: white; font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600; text-align: center; max-width: 340px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-conteudo">
            <button class="btn-x-popup" id="btnXPopup" onclick="fecharPopup()">X</button>
            <img src="aviso.jpg" alt="Aviso Importante" class="popup-imagem">
            <button class="btn-fechar-popup" id="btnFecharPopup" onclick="fecharPopup()">Fechar mensagem</button>
        </div>
    </div>

    <div class="pagamento-overlay" id="pagamentoOverlay">
        <div class="pagamento-overlay-texto">Não se esqueça de clicar no botão abaixo ao finalizar o seu pagamento.</div>
    </div>

    <div class="container">
        <h1>Festa Junina</h1>
        
        <div id="sessao-formulario">
            <label>Nome do Comprador</label>
            <input id="comprador" placeholder="Escreva seu nome aqui...">
            
            <label>CPF do Comprador</label>
            <input id="cpf-comprador" class="cpf-validar" placeholder="000.000.000-00">
            
            <label>Telefone</label>
            <input id="telefone" placeholder="(00) 00000-0000">

            <label>Quantidade de ingressos</label>
            <select id="quantidade">
                <option value="1">1 ingresso</option>
                <option value="2">2 ingressos</option>
                <option value="3">3 ingressos</option>
            </select>

            <div id="campos-extras"></div>
            <button id="btn-gerar" class="btn-principal">Gerar QR Code</button>
        </div>

        <div class="texto-expiracao" id="timer-expiracao">O código a seguir expira em 10:00.</div>

        <div class="qr-container" id="sessao-qr">
            <img src="" id="img-qr" alt="QR Code Pix">
            <div class="valor" id="exibir-total">Total: Calculando...</div>
            
            <div class="pix-box">
                <input id="pix-codigo" readonly style="font-size: 9px; width: 100%; text-align: center; border: 1px solid #ccc; background: white;">
                <button type="button" class="btn-copiar" id="btn-copiar" onclick="copiarPix()">Copiar Código Pix</button>
            </div>

            <button id="btn-validar" class="btn-principal btn-validar">Verificar Pagamento</button>
            <div id="status-verificacao" class="status-msg"></div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById('btnFecharPopup').style.display = 'block';
            document.getElementById('btnXPopup').style.display = 'block';
        }, 6000);

        function fecharPopup() { document.getElementById('popupOverlay').style.display = 'none'; }

        function iniciarCronometro() {
            let tempoRestante = 10 * 60; 
            const elementoTimer = document.getElementById('timer-expiracao');
            const intervalo = setInterval(() => {
                let m = Math.floor(tempoRestante / 60);
                let s = tempoRestante % 60;
                elementoTimer.innerText = `O código a seguir expira em ${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}.`;
                if (tempoRestante <= 0) {
                    clearInterval(intervalo);
                    elementoTimer.innerText = "Este código Pix expirou! Atualize a página.";
                    document.getElementById('img-qr').style.display = 'none';
                    document.getElementById('btn-copiar').disabled = document.getElementById('btn-validar').disabled = true;
                }
                tempoRestante--;
            }, 1000);
        }

        const URL_GERAR_PIX = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/2ad0529973d74605bffbb1f1dd89c063/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=9cFG_dFkGjSMngbCZU7Rj7MW02aldXs66m7z14mS89c";
        const URL_VALIDAR_PAGAMENTO = "https://default264c851fa4e743cf86bcd7b10dca85.78.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d03cad4eca5840989b744d1e6b4c867c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=UzdbeuNVzZn3kPiJkW7jr0Ebmm6Z-pyafYYUFlKuLOc";
        let idPagamentoAtual = null;
        const selectQtde = document.getElementById("quantidade");
        const camposExtras = document.getElementById("campos-extras");

        function validarCPF(c) {
            c = c.replace(/[^\d]+/g, '');
            if (!c || c.length != 11 || /^(\d)\1{10}$/.test(c)) return false;
            let a = 0; for (let i = 0; i < 9; i++) a += parseInt(c.charAt(i)) * (10 - i);
            let r = 11 - (a % 11); if (r > 9) r = 0; if (r != parseInt(c.charAt(9))) return false;
            a = 0; for (let i = 0; i < 10; i++) a += parseInt(c.charAt(i)) * (11 - i);
            r = 11 - (a % 11); if (r > 9) r = 0; return r == parseInt(c.charAt(10));
        }

        function formatarNomeProprio(n) {
            const p = ["da", "das", "de", "do", "dos"];
            return n.toLowerCase().split(' ').map(w => p.includes(w) || !w ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        document.body.addEventListener('blur', e => {
            if (e.target.id === 'comprador' || e.target.classList.contains('nome-ing')) {
                if (e.target.value.trim()) e.target.value = formatarNomeProprio(e.target.value);
            }
        }, true);

        selectQtde.addEventListener("change", () => {
            camposExtras.innerHTML = "";
            for(let i = 1; i <= parseInt(selectQtde.value); i++) {
                const div = document.createElement("div"); div.className = "ingresso-extra";
                div.innerHTML = `<label>Nome no Ingresso ${i}</label><input class="nome-ing" placeholder="Nome do convidado"><label>CPF Convidado ${i}</label><input class="cpf-ing cpf-validar" placeholder="000.000.000-00">`;
                camposExtras.appendChild(div);
            }
            aplicarMascaras();
        });
        selectQtde.dispatchEvent(new Event('change'));

        document.getElementById("btn-gerar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-gerar"), comprador = document.getElementById("comprador").value.trim(), cpfComprador = document.getElementById("cpf-comprador").value.trim(), telefone = document.getElementById("telefone").value.trim();
            if (!comprador || !validarCPF(cpfComprador) || telefone.length < 14) { alert("Preencha o nome, CPF e telefone corretamente."); document.getElementById("cpf-comprador").classList.add("input-erro"); return; }

            const inputsNomes = document.querySelectorAll(".nome-ing"), inputsCpfs = document.querySelectorAll(".cpf-ing");
            let listaIngressos = [], cpfsConvidados = [], countCpfComp = 0, erro = false;

            inputsCpfs.forEach((input, i) => {
                const cp = input.value.trim(), nm = inputsNomes[i].value.trim();
                if (!nm || !validarCPF(cp)) { erro = true; input.classList.add("input-erro"); } else { input.classList.remove("input-erro"); }
                if (cp === cpfComprador) countCpfComp++; else cpfsConvidados.push(cp);
                listaIngressos.push({ "NOME_INGRESSO": nm, "CPF_INGRESSO": cp });
            });

            if (erro) { alert("Verifique os campos em vermelho nos convidados."); return; }
            if (countCpfComp > 1) { alert("O comprador só pode incluir seu CPF uma única vez."); return; }
            if (new Set(cpfsConvidados).size !== cpfsConvidados.length) { alert("Existem CPFs duplicados nos convidados."); return; }

            btn.disabled = true; btn.innerText = "Buscando informações... Aguarde.";

            try {
                const r = await fetch(URL_GERAR_PIX, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "COMPRADOR": comprador, "CPF_COMPRADOR": cpfComprador, "TELEFONE": telefone, "QUANTIDADE": selectQtde.value, "INGRESSOS": listaIngressos }) });
                if (!r.ok) throw new Error();
                const data = await r.json();
                if (data.status === "bloqueado") { alert("⚠️ BLOQUEIO: " + data.mensagem); btn.disabled = false; btn.innerText = "Gerar QR Code"; return; }

                idPagamentoAtual = data.pagamento_id;

                if (data.mensagem === "recuperar") {
                    document.getElementById("img-qr").src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(data.variavel).toFixed(2).replace('.', ',')}`;
                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    iniciarCronometro();
                } else {
                    document.getElementById("img-qr").src = `data:image/png;base64,${data.pix_qr_code_base64}`;
                    document.getElementById("pix-codigo").value = data.pix_copia_e_cola;
                    document.getElementById("exibir-total").innerText = `Total: R$ ${parseFloat(data.variavel).toFixed(2).replace('.', ',')}`;
                    document.getElementById("sessao-formulario").style.display = "none";
                    document.getElementById("timer-expiracao").style.display = "block";
                    document.getElementById("sessao-qr").style.display = "block";
                    const o = document.getElementById("pagamentoOverlay"), v = document.getElementById("btn-validar");
                    o.style.display = "flex"; v.style.zIndex = "6000";
                    setTimeout(() => { o.style.opacity = "0"; setTimeout(() => { o.style.display = "none"; v.style.zIndex = "1"; }, 4000); }, 6000);
                    iniciarCronometro();
                }
            } catch (e) { alert("Erro de conexão com o servidor."); } finally { btn.disabled = false; btn.innerText = "Gerar QR Code"; }
        });

        document.getElementById("btn-validar").addEventListener("click", async () => {
            const btn = document.getElementById("btn-validar"), msg = document.getElementById("status-verificacao");
            if (!idPagamentoAtual) return;
            btn.disabled = true; btn.innerText = "Verificando...";
            try {
                const r = await fetch(URL_VALIDAR_PAGAMENTO, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "id": String(idPagamentoAtual) }) });
                const res = await r.text();
                if (res.includes("Sucesso")) {
                    document.getElementById("timer-expiracao").style.display = "none";
                    document.getElementById("sessao-qr").innerHTML = `<div class="msg-confirmacao"><span class="icon-grande">✅</span><h2>PAGAMENTO CONFIRMADO!</h2><p>ETA TREM BÃO!</p><p>NOS ENCONTRAMOS NA FESTA!</p></div>`;
                } else {
                    msg.innerHTML = `<span class="icon-grande" style="font-size: 60px; color: #bf360c; margin-bottom: 5px;">❌</span>Ainda não encontramos o seu Pix.<br>Espera um tiquinho e tenta de novo!`;
                }
            } catch (e) { msg.innerText = "Erro ao conectar. Tente de novo!"; } finally { btn.disabled = false; btn.innerText = "Verificar Pagamento"; }
        });

        function copiarPix() {
            const p = document.getElementById("pix-codigo"); p.select(); navigator.clipboard.writeText(p.value);
            document.getElementById("btn-copiar").innerText = "✓ Copiado!";
            setTimeout(() => { document.getElementById("btn-copiar").innerText = "Copiar Código Pix"; }, 2000);
        }

        function aplicarMascaras() {
            document.querySelectorAll(".cpf-validar").forEach(el => {
                el.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
                    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, "$1.$2.$3");
                    else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, "$1.$2");
                    e.target.value = v;
                });
                el.addEventListener("blur", e => {
                    const val = e.target.value, err = e.target.nextElementSibling;
                    if (err && err.classList.contains('msg-erro-cpf')) err.remove();
                    if (val.length > 0) {
                        if (validarCPF(val)) { e.target.classList.remove("input-erro"); e.target.classList.add("input-sucesso"); } 
                        else { e.target.classList.remove("input-sucesso"); e.target.classList.add("input-erro"); const s = document.createElement("span"); s.className = "msg-erro-cpf"; s.innerText = "CPF Inválido"; e.target.after(s); }
                    } else { e.target.classList.remove("input-erro", "input-sucesso"); }
                });
            });
            const tel = document.getElementById("telefone");
            if(tel) {
                tel.addEventListener("input", e => {
                    let v = e.target.value.replace(/\D/g, "").slice(0, 11);
                    if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
                    else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
                    else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
                    else if (v.length > 0) v = v.replace(/^(\d{0,2})/, "($1");
                    e.target.value = v;
                });
            }
        }
    </script>
</body>
</html>
